# Misconceptions lesson 1.1 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-1.yaml.

- id: MC-distance-equals-displacement
  title: ההעתק הוא הדרך שהגוף עבר
  belief: >-
    ההעתק הוא כמה מטרים הגוף עבר. מי שהלך 6 מטרים קדימה ו-6 מטרים חזרה עשה העתק של 12 מטרים, וההעתק לא יכול
    להיות שלילי.
  truth: >-
    ההעתק משווה רק בין המקום הסופי למקום ההתחלתי, Δx = x₂ − x₁, ויש לו סימן. מי שחזר לנקודת ההתחלה עשה העתק אפס,
    גם אם הלך 12 מטרים. את כל הצעדים קדימה ואחורה סופרת הדרך, שהיא אף פעם לא שלילית.
  remedy: { lesson: '1.1', anchor: path, label: 'שיעור 1.1: דרך מול העתק, באיור 1.1א' }

- id: MC-position-equals-displacement
  title: המקום הסופי הוא ההעתק
  belief: >-
    אם הגוף נמצא בסוף ב-x = 30 m, ההעתק שלו הוא 30 מטרים. אין צורך לדעת איפה הוא התחיל.
  truth: >-
    המקום אומר איפה הגוף נמצא ביחס לראשית; ההעתק אומר כמה המקום השתנה. Δx = x₂ − x₁, ולכן צריך גם את המקום
    ההתחלתי. המקום וההעתק שווים רק כשהגוף התחיל בדיוק בראשית.
  remedy: { lesson: '1.1', anchor: displacement, label: 'שיעור 1.1: העתק, השינוי במקום' }

- id: MC-position-absolute
  title: לגוף יש מקום אחד אמיתי
  belief: >-
    המספר x הוא תכונה של הגוף, כמו המסה שלו. אם שני תלמידים כתבו מקומות שונים לאותו גוף באותו רגע, אחד מהם טעה.
  truth: >-
    המקום נמדד מהראשית ובכיוון החיובי שבחרנו, ולכן אותו גוף מקבל מספרים שונים במערכות ייחוס שונות, וכולם נכונים.
    מה שלא תלוי בבחירת הראשית הוא ההעתק, והדרך לא תלויה גם בכיוון החיובי.
  remedy: { lesson: '1.1', anchor: frame, label: 'שיעור 1.1: מערכת ייחוס, הזיזו את הראשית באיור 1.1א' }
