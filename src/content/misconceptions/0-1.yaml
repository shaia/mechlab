# Misconceptions lesson 0.1 detects and remedies. MC-predict-wastes-time is owned by 0.1 in .claude/specs/ch0-1.md;
# MC-sim-proves and MC-confidence-irrelevant are added by this lesson.

- id: MC-predict-wastes-time
  title: לנחש לפני שלומדים זה בזבוז זמן
  belief: >-
    אין טעם לחזות תשובה לפני שלמדתם את החומר, וחיזוי שגוי הוא כישלון. עדיף לקרוא את ההסבר שוב ושוב עד שהוא מוכר.
  truth: >-
    ניסיון לחזות או להיזכר, ואז לבדוק מיד, משאיר יותר בזיכרון לאורך זמן מקריאה חוזרת, גם כשהחיזוי שגוי. חיזוי שגוי
    מראה בדיוק איזה רעיון צריך לתקן, ואין עליו ציון. תחושת ההיכרות שקריאה חוזרת נותנת מטעה.
  remedy: { lesson: '0.1', anchor: why, label: 'שיעור 0.1: למה הספר מבקש לחזות לפני שהוא מסביר' }

- id: MC-sim-proves
  title: האיור החי מוכיח את החוק
  belief: >-
    מה שרואים באיור חי הוא הוכחה למה שקורה בעולם, כי מחשב לא טועה.
  truth: >-
    האיור מחשב לפי מודל שכבר הכניסו לתוכו, ולכן הוא מראה רק מה המודל צופה. הוא עוזר לראות ולשאול "מה יקרה אם…",
    אבל את המודל בודק ניסוי אמיתי, ואת החוק מוכיח פיתוח.
  remedy: { lesson: '0.1', anchor: model, label: 'שיעור 0.1: מה איור חי יכול להראות, ומה לא' }

- id: MC-confidence-irrelevant
  title: הסימון "בטוחים / לא בטוחים" לא משנה
  belief: >-
    אפשר לסמן תמיד "בטוחים" (או תמיד "לא בטוחים"); זה לא משפיע על כלום.
  truth: >-
    טעות בביטחון היא סימן לתפיסה שגויה, וטעות בלי ביטחון היא חור בידע. הן דורשות טיפול שונה, והקורס מבחין ביניהן רק
    אם הסימון כנה.
  remedy: { lesson: '0.1', anchor: confidence, label: 'שיעור 0.1: בטוחים, או לא בטוחים?' }
