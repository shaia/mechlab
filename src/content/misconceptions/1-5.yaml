# Misconceptions lesson 1.5 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-5.yaml.
# MC-instantaneous-is-average is fixed by .claude/specs/ch0-1.md; MC-instant-undefined and MC-x-over-t were added here.

- id: MC-instantaneous-is-average
  title: המהירות ברגע מסוים היא המהירות הממוצעת בקטע ארוך שמתחיל בו
  belief: >-
    כדי לדעת מה המהירות של גוף ברגע מסוים, מספיק לחשב Δx/Δt על קטע זמן שמתחיל ברגע הזה, גם אם הקטע ארוך. למשל:
    ההעתק בשתי השניות הבאות חלקי 2 הוא המהירות עכשיו.
  truth: >-
    כשהמהירות משתנה, המהירות הממוצעת תלויה בקטע שבוחרים, ובקטע ארוך היא יכולה להיות שונה מאוד מהמהירות ברגע אחד,
    אפילו בסימן. המהירות הרגעית היא הערך שאליו Δx/Δt מתקרב כשקטע הזמן קטן עוד ועוד: השיפוע של המשיק.
  remedy: { lesson: '1.5', anchor: fig-1-5a, label: 'שיעור 1.5: איור 1.5א, מקטינים את Δt' }

- id: MC-instant-undefined
  title: ברגע אחד אין מהירות, כי לא עובר זמן
  belief: >-
    ברגע אחד הגוף לא עובר שום דרך ולא עובר שום זמן, ולכן מהירות ברגע אחד היא אפס חלקי אפס: היא אפס, או שאין לה
    משמעות.
  truth: >-
    לא מחלקים אפס באפס. מחשבים Δx/Δt לקטעים קטנים יותר ויותר, שאף אחד מהם אינו אפס, ורואים שהתוצאה מתקרבת למספר
    מסוים. המספר הזה הוא המהירות הרגעית, ומד המהירות של מכונית מראה את גודלו.
  remedy: { lesson: '1.5', anchor: shrink, label: 'שיעור 1.5: טבלת המיתרים המתקצרים' }

- id: MC-x-over-t
  title: המהירות ברגע t היא המקום חלקי הזמן
  belief: >-
    כדי למצוא את המהירות בנקודה על גרף מקום-זמן, מחלקים את המקום בזמן: v = x/t, כלומר קוראים את שתי הקואורדינטות של
    הנקודה.
  truth: >-
    x/t הוא השיפוע של הקו מהראשית של הגרף אל הנקודה, כלומר המהירות הממוצעת מ-t = 0 (ורק אם הגוף התחיל ב-x = 0).
    המהירות ברגע t היא השיפוע של המשיק בנקודה: לוקחים שתי נקודות רחוקות על המשיק ומחשבים Δx/Δt.
  remedy: { lesson: '1.5', anchor: tangent-read, label: 'שיעור 1.5: קוראים שיפוע של משיק' }
