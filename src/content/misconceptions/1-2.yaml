# Misconceptions lesson 1.2 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-2.yaml.
# MC-graph-is-path is fixed by .claude/specs/ch0-1.md; the other three were added here.

- id: MC-graph-is-path
  title: גרף מקום-זמן הוא ציור של המסלול
  belief: >-
    גרף המקום-זמן מראה את הדרך שבה הגוף הלך: גרף בצורת גבעה פירושו שהגוף עלה על גבעה וירד ממנה, וקו משופע
    פירושו שהגוף נע על משטח משופע.
  truth: >-
    הציר האופקי של הגרף הוא הזמן, לא מקום. גוף שנע על קו ישר אחד, הלוך ושוב, נותן גרף של עליות וירידות. כל נקודה
    בגרף אומרת רק איפה הגוף היה ברגע מסוים. עגלה שנעה הלוך ושוב על מסילה אופקית נותנת קשת, אף שהמסילה שטוחה.
  remedy: { lesson: '1.2', anchor: not-path, label: 'שיעור 1.2: איור 1.2ב, מסילה אופקית וגרף בצורת קשת' }

- id: MC-flat-xt-is-moving
  title: קטע אופקי בגרף מקום-זמן הוא תנועה אחידה
  belief: >-
    קו אופקי בגרף מקום-זמן פירושו שהגוף נע כל הזמן באותו אופן, אותו מספר מטרים בכל שנייה.
  truth: >-
    קו אופקי בגרף מקום-זמן פירושו שהמקום לא משתנה: הגוף עומד. הזמן ממשיך לעבור, אבל x נשאר אותו מספר. גוף שעובר
    אותו מספר מטרים בכל שנייה נותן קו ישר משופע.
  remedy: { lesson: '1.2', anchor: read-graph, label: 'שיעור 1.2: קריאת גרף מקום-זמן, איור 1.2א' }

- id: MC-negative-position-backwards
  title: מקום שלילי פירושו תנועה בכיוון השלילי
  belief: >-
    גוף שנמצא ב-x שלילי נע בכיוון השלילי, וגוף ב-x חיובי נע בכיוון החיובי.
  truth: >-
    הסימן של x אומר רק באיזה צד של הראשית הגוף נמצא. כיוון התנועה נקבע מהשינוי של x: אם x גדל, הגוף נע בכיוון
    החיובי, גם כש-x שלילי. הזזת הראשית משנה את כל המקומות, ולא משנה את התנועה.
  remedy: { lesson: '1.2', anchor: origin-moved, label: 'שיעור 1.2: מזיזים את הראשית באיור 1.2א' }

- id: MC-crossing-same-speed
  title: היכן שהקווים נחתכים, הגופים נעים מהר באותה מידה
  belief: >-
    כששני קווים בגרף מקום-זמן נחתכים, שני הגופים עוברים באותו רגע אותו מספר מטרים בכל שנייה (או: שם הם מתנגשים
    ונעצרים).
  truth: >-
    נקודת חיתוך אומרת רק ששני הגופים נמצאים באותו מקום באותו רגע: הם נפגשים או עוקפים זה את זה. כמה מהר נע כל
    גוף קוראים מהתלילות של הקו שלו, לא מהחיתוך: קווים נחתכים גם כשאחד תלול בהרבה מהשני, וגם כשאחד עולה והשני
    יורד.
  remedy: { lesson: '1.2', anchor: crossing, label: 'שיעור 1.2: שני גופים על גרף אחד, איור 1.2ג' }
