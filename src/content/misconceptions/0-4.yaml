# Misconceptions lesson 0.4 detects and remedies. Ids fixed by .claude/specs/ch0-1.md.

- id: MC-curve-gives-constant
  title: את הקבוע קוראים ישר מהעקומה
  belief: גם כשהנקודות בגרף מתעקמות, אפשר למצוא את הקבוע של החוק מהשיפוע בין הנקודה הראשונה לאחרונה, ממנה y/x של נקודה אחת, או מקו ישר שמעבירים בכוח דרך העקומה.
  truth: על עקומה השיפוע משתנה ממקום למקום, ולכן אין לה "שיפוע אחד". קו ישר שמעבירים דרך נקודות מעוקלות לא מתאר את החוק, ואפילו לא עובר בראשית כשהחוק כן. קודם מיישרים את הגרף (ליניאריזציה), למשל d מול t², ורק אז קוראים קבוע מהשיפוע.
  remedy: { lesson: '0.4', anchor: fig-0-4b, label: 'שיעור 0.4, איור 0.4ב: הנפילה מול t ומול t²' }

- id: MC-line-through-every-point
  title: הקו חייב לעבור דרך נקודות המדידה
  belief: קו המגמה חייב לעבור דרך כל נקודות המדידה (מחברים אותן בקו שבור), או לפחות דרך הנקודה הראשונה והאחרונה, ואת השיפוע מחשבים משתי מדידות מהטבלה.
  truth: לכל מדידה יש אי-ודאות, ולכן הנקודות מתפזרות סביב החוק. קו המגמה הוא קו ישר אחד שעובר קרוב ככל האפשר לכולן, חלקן מעליו וחלקן מתחתיו, ולא חייב לעבור דרך אף אחת. את השיפוע מחשבים משתי נקודות רחוקות על הקו.
  remedy: { lesson: '0.4', anchor: fig-0-4a, label: 'שיעור 0.4, איור 0.4א: מניחים סרגל על נקודות הקפיץ' }
