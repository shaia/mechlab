# Misconceptions lesson 1.7 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-7.yaml.
# MC-zero-velocity-zero-accel and MC-heavier-falls-faster are fixed by .claude/specs/ch0-1.md; MC-free-fall-sign was
# added here (substituting a = +g whatever the axis is the most common sign error in vertical-throw answers).

- id: MC-zero-velocity-zero-accel
  title: בנקודה הגבוהה ביותר התאוצה היא אפס
  belief: >-
    כדור שנזרק כלפי מעלה נעצר לרגע בנקודה הגבוהה ביותר. מכיוון שהמהירות שם אפס, גם התאוצה שם אפס, ולרגע אחד הכדור
    "מרחף".
  truth: >-
    תאוצה היא קצב השינוי של המהירות, ולא המהירות עצמה. בנקודה הגבוהה ביותר המהירות היא אפס רק לרגע, והיא ממשיכה
    להשתנות באותו קצב: שנייה לפני כן הייתה ‎+10 m/s, ושנייה אחרי כן תהיה ‎−10 m/s (הכיוון החיובי
    כלפי מעלה). לכן גם בנקודה הגבוהה ביותר a = −g. אילו התאוצה הייתה אפס, הכדור היה נשאר תלוי באוויר.
  remedy: { lesson: '1.7', anchor: fig-1-7a, label: 'שיעור 1.7: איור 1.7א, עוצרים את הכדור בנקודה הגבוהה ביותר' }

- id: MC-heavier-falls-faster
  title: גוף כבד נופל מהר יותר
  belief: >-
    כשמפילים יחד כדור כבד וכדור קל מאותו גובה, הכבד מגיע לקרקע ראשון, כי הוא כבד יותר. כדור כבד פי עשרה נופל מהר פי
    עשרה.
  truth: >-
    כשהשפעת האוויר זניחה, לכל הגופים אותה תאוצה, g, והם נופלים יחד, בלי קשר למסה שלהם. נוצה ודף נייר נופלים לאט
    בגלל האוויר, ולא בגלל שהם קלים: בתא ריק מאוויר, ועל הירח, נוצה ופטיש נוחתים יחד.
  remedy: { lesson: '1.7', anchor: galileo, label: 'שיעור 1.7: מה מראים הניסויים, מהנייר המקומט ועד הפטיש והנוצה' }

- id: MC-free-fall-sign
  title: מציבים a = +g בלי לבדוק את כיוון הציר
  belief: >-
    תאוצת הנפילה החופשית היא תמיד ‎+10 m/s², ולכן מציבים a = 10 בכל משוואה, בלי קשר לכיוון החיובי שנבחר.
  truth: >-
    g הוא גודל ותמיד חיובי, אבל התאוצה היא מספר עם סימן, והסימן נקבע לפי הציר. כשהכיוון החיובי כלפי מעלה, a = −g;
    כשהוא כלפי מטה, a = +g. קודם כותבים את הכיוון החיובי, ורק אחר כך מציבים. מי שמציב a = +10 עם ציר כלפי מעלה
    מקבל כדור שמאיץ כלפי מעלה, וגובה מרבי שלילי.
  remedy: { lesson: '1.7', anchor: model, label: 'שיעור 1.7: המודל, ציר וסימן של התאוצה' }
