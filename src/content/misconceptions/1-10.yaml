# Misconceptions lesson 1.10 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-10.yaml.
# The vector-subtraction mistake (|Δv| = |v₂| − |v₁|) is tagged with 1.9's MC-difference-of-magnitudes.

- id: MC-constant-speed-no-accel
  title: גודל מהירות קבוע, ולכן אין תאוצה
  belief: >-
    אם מד המהירות מראה כל הזמן אותו מספר, הגוף לא מאיץ, גם כשהוא נוסע בסיבוב או במעגל.
  truth: >-
    תאוצה היא קצב השינוי של המהירות, והמהירות היא וקטור: יש לה גודל וכיוון. בסיבוב הכיוון משתנה, ולכן
    השינוי במהירות, Δv, אינו אפס, ויש תאוצה, גם כשגודל המהירות קבוע. במעגל בגודל מהירות קבוע התאוצה מצביעה אל המרכז.
  remedy: { lesson: '1.10', anchor: circle, label: 'שיעור 1.10, איור 1.10ב: התאוצה במעגל' }

- id: MC-accel-along-velocity
  title: התאוצה תמיד בכיוון התנועה
  belief: >-
    התאוצה מצביעה תמיד לאן שהגוף נע, כלומר בכיוון המהירות (או נגדה, כשהוא בולם).
  truth: >-
    התאוצה מצביעה בכיוון השינוי במהירות, Δv, ולא בכיוון המהירות עצמה. רק בתנועה בקו ישר היא על הקו של
    המהירות. בעיקול יש לה רכיב רדיאלי, מאונך למהירות, שמצביע אל הצד הפנימי של העיקול. בזריקה, למשל, המהירות
    נוטה למעלה ואחר כך למטה, והתאוצה כל הזמן אנכית למטה.
  remedy: { lesson: '1.10', anchor: split, label: 'שיעור 1.10, איור 1.10ב: פירוק התאוצה' }

