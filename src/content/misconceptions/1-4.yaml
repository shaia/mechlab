# Misconceptions lesson 1.4 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-4.yaml.
# MC-velocity-absolute and MC-relative-speeds-add are fixed by .claude/specs/ch0-1.md; MC-relative-order was added here.

- id: MC-velocity-absolute
  title: לגוף יש מהירות אחת "אמיתית"
  belief: >-
    לכל גוף יש מהירות אחת נכונה, זו שנמדדת ביחס לקרקע. מהירות שנמדדת מרכבת או ממכונית נוסעת היא רק "אשליה",
    ובחישובים חייבים לעבוד תמיד ביחס לקרקע.
  truth: >-
    מהירות נמדדת תמיד ביחס למערכת ייחוס, ואין מערכת ייחוס אחת "נכונה". נוסע שיושב ברכבת נמצא במנוחה ביחס לרכבת, ונע
    ביחס לרציף, ושני התיאורים נכונים. אפשר לפתור בעיה בכל מערכת ייחוס שנעה במהירות קבועה, ולבחור את הנוחה ביותר.
  remedy: { lesson: '1.4', anchor: fig-1-4a, label: 'שיעור 1.4: איור 1.4א, אותה תנועה משלוש נקודות מבט' }

- id: MC-relative-speeds-add
  title: מחסירים גדלים של מהירות בלי לבדוק כיוונים
  belief: >-
    כששתי מכוניות נוסעות זו לקראת זו, המרחק ביניהן קטן בקצב של ההפרש בין גודלי המהירויות (או: תמיד מחברים את גודלי
    המהירויות, בלי קשר לכיוון).
  truth: >-
    מחסירים את המהירויות עם הסימנים שלהן: v_AB = v_A − v_B. כשהגופים נעים זה לקראת זה הסימנים מנוגדים, ולכן
    גודלי המהירויות מתחברים. כשהם נעים לאותו כיוון, גודלי המהירויות מחסירים זה מזה.
  remedy: { lesson: '1.4', anchor: closing, label: 'שיעור 1.4: התקרבות ועקיפה' }

- id: MC-relative-order
  title: המהירות של A ביחס ל-B היא אותה מהירות כמו של B ביחס ל-A
  belief: >-
    v_AB ו-v_BA הם אותו מספר, כי "המהירות היחסית" ביניהם אחת.
  truth: >-
    לשני המספרים אותו גודל וסימנים מנוגדים: v_BA = −v_AB. אם A מתקרב ל-B משמאל, מ-B רואים את A נע ימינה, ומ-A
    רואים את B נע שמאלה.
  remedy: { lesson: '1.4', anchor: fig-1-4b, label: 'שיעור 1.4: איור 1.4ב, מי מסתכל על מי' }
