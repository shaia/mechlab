# Misconceptions lesson 0.3 detects and remedies. The first three ids are fixed by .claude/specs/ch0-1.md;
# MC-square-law-doubles was added by this lesson (the stopping-distance scaling of the Hook).

- id: MC-slope-is-angle
  title: השיפוע הוא הזווית שבציור
  belief: קו שנראה תלול יותר בגרף הוא בעל שיפוע גדול יותר, ואפשר לקרוא את השיפוע מהזווית שבין הקו לבין הציר.
  truth: השיפוע הוא Δy/Δx, מחושב לפי המספרים והיחידות שעל הצירים. אותו קו נראה תלול או שטוח לפי קנה המידה של הצירים, והשיפוע שלו לא משתנה. רק כששני הצירים מודדים אותו גודל באותו קנה מידה (גובה מול אורך, במטרים), השיפוע הוא tan של הזווית.
  remedy: { lesson: '0.3', anchor: line, label: 'שיעור 0.3, איור 0.3א: משנים את קנה המידה של הצירים' }

- id: MC-linear-means-proportional
  title: כל קו ישר הוא יחס ישר
  belief: אם הגרף הוא קו ישר, אז y ביחס ישר ל-x, ולכן x כפול נותן y כפול.
  truth: יחס ישר הוא רק קו ישר שעובר בראשית (b = 0). קו ישר שחותך את הציר האנכי במקום אחר הוא פונקציה קווית, ושם x כפול לא נותן y כפול. למשל, האורך של קפיץ אינו ביחס ישר למסה שתלויה עליו, אבל ההתארכות כן.
  remedy: { lesson: '0.3', anchor: line, label: 'שיעור 0.3, איור 0.3א: מעבירים את הקו דרך הראשית' }

- id: MC-sin-of-sum
  title: הסינוס גדל ביחס ישר לזווית
  belief: אם הזווית גדלה פי 2, גם הסינוס שלה גדל פי 2 (sin 60° = 2·sin 30° = 1), ובאופן כללי sin(a + b) = sin a + sin b.
  truth: הסינוס הוא יחס בין צלעות, והוא אינו ביחס ישר לזווית. sin 30° = 0.5 אבל sin 60° ≈ 0.87, ולא 1. הסינוס לעולם אינו עולה על 1, כי הניצב קצר מהיתר.
  remedy: { lesson: '0.3', anchor: trig, label: 'שיעור 0.3, איור 0.3ב: מכפילים את הזווית של המדרון' }

- id: MC-square-law-doubles
  title: כשהגודל מוכפל, גם הריבוע שלו מוכפל
  belief: אם גודל אחד ביחס ישר לריבוע של גודל אחר, הכפלה של השני פי 2 מכפילה את הראשון פי 2. למשל, מהירות כפולה נותנת מרחק בלימה כפול.
  truth: הכפלה פי 2 של x מכפילה את x² פי 4, ולכן גם כל מה שביחס ישר ל-x². מהירות כפולה נותנת מרחק בלימה גדול פי 4.
  remedy: { lesson: '0.3', anchor: square-law, label: 'שיעור 0.3: פי כמה? יחס ישר, יחס הפוך וריבוע' }
