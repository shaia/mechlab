# Misconceptions lesson 0.2 detects and remedies. Each is caught by a tagged distractor in questions/ch0/0-2.yaml.

- id: MC-area-units-scale-linearly
  title: ממירים יחידות שטח ונפח כמו יחידות אורך
  belief: 1 cm = 10⁻² m, ולכן גם 1 cm² = 10⁻² m², ו-1 cm³ = 10⁻² m³.
  truth: >-
    בשטח יש שני אורכים, ובנפח שלושה, וכל אחד מהם מומר. 1 cm² = (10⁻² m)² = 10⁻⁴ m², ו-1 cm³ = (10⁻² m)³ = 10⁻⁶ m³.
    במטר רבוע יש 10,000 סנטימטרים רבועים, לא 100.
  remedy: { lesson: '0.2', anchor: powers, label: 'שיעור 0.2: שטח ונפח ביחידות SI' }

- id: MC-calculator-digits
  title: מעתיקים את כל הספרות מהמחשבון
  belief: תשובה עם יותר ספרות מדויקת יותר, ולכן כדאי להעתיק את כל מה שהמחשבון מציג.
  truth: >-
    התוצאה לא יכולה להיות מדויקת יותר מהנתונים שממנה חושבה. כותבים בה בערך את מספר הספרות המשמעותיות של הנתון הכי
    פחות מדויק, בדרך כלל 2 או 3.
  remedy: { lesson: '0.2', anchor: sigfigs, label: 'שיעור 0.2: כמה ספרות לכתוב' }

- id: MC-kmh-to-ms-multiply
  title: מקמ״ש למטר לשנייה כופלים ב-3.6
  belief: כדי להמיר קמ״ש ל-m/s כופלים ב-3.6, למשל 72 km/h = 259 m/s.
  truth: >-
    1 km/h = 1000 m / 3600 s, כלומר 1 km/h הוא רק 1/3.6 של 1 m/s. לכן מקמ״ש ל-m/s מחלקים ב-3.6 (72 km/h = 20 m/s),
    ומ-m/s לקמ״ש כופלים ב-3.6. בדיקה מהירה: רץ מהיר, כ-10 m/s, רץ כ-36 km/h ולא כ-3 km/h.
  remedy: { lesson: '0.2', anchor: kmh, label: 'שיעור 0.2: מקמ״ש למטר לשנייה' }

- id: MC-power-direction
  title: חזקה שלילית בכיוון ההפוך
  belief: μ פירושו כפול מיליון, ולכן 250 μs הן 2.5·10⁸ s. באותו אופן, 10⁻⁴ נראה כמו מספר גדול.
  truth: >-
    חזקה שלילית פירושה מספר קטן מ-1. μ היא 10⁻⁶, מיליונית, ולכן 250 μs הן 2.5·10⁻⁴ s, חלק קטן מאוד של שנייה.
  remedy: { lesson: '0.2', anchor: fig-0-2a, label: 'איור 0.2: מצאו את 20 ms על הסרגל' }

- id: MC-units-decoration
  title: יחידות הן קישוט
  belief: >-
    אפשר להציב מספרים בכל יחידה (קמ״ש, סנטימטרים, גרמים) ולסדר את היחידות בסוף, או לא לכתוב אותן בכלל.
  truth: >-
    הקבועים בדף הנוסחאות כתובים ביחידות SI, ולכן ממירים ל-SI לפני ההצבה. היחידות של התוצאה הן גם בדיקה: יחידות
    שגויות מגלות טעות עוד לפני שבודקים את המספר.
  remedy: { lesson: '0.2', anchor: format, label: 'שיעור 0.2: מבנה של פתרון' }
