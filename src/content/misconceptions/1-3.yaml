# Misconceptions lesson 1.3 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-3.yaml.
# MC-average-of-speeds and MC-higher-graph-faster are fixed by .claude/specs/ch0-1.md;
# MC-negative-velocity-slower and MC-meet-halfway were added here.

- id: MC-average-of-speeds
  title: המהירות הממוצעת היא הממוצע של המהירויות
  belief: >-
    במסע של כמה קטעים, המהירות הממוצעת היא הממוצע של המהירויות בקטעים: 60 ו-100 קמ״ש נותנים 80 קמ״ש. זמן של
    עמידה במקום לא נחשב, כי בו הגוף "לא נסע".
  truth: >-
    המהירות הממוצעת היא ההעתק הכולל חלקי הזמן הכולל, כולל זמני העמידה. הממוצע של המהירויות יוצא נכון רק כשכל
    הקטעים נמשכים אותו זמן. כשהקטעים שווים באורכם, הגוף נמצא יותר זמן בקטע האיטי, ולכן הממוצע נמוך מהממוצע של
    המהירויות.
  remedy: { lesson: '1.3', anchor: averages, label: 'שיעור 1.3: מהירות ממוצעת במסע של כמה קטעים' }

- id: MC-higher-graph-faster
  title: הקו הגבוה יותר בגרף מקום-זמן הוא של הגוף המהיר יותר
  belief: >-
    בגרף מקום-זמן של שני גופים, הגוף שהקו שלו גבוה יותר נע מהר יותר.
  truth: >-
    הגובה של הקו הוא המקום של הגוף, לא המהירות שלו. המהירות היא השיפוע של הקו: כמה הוא עולה או יורד בכל שנייה.
    קו גבוה ושטוח שייך לגוף שנמצא רחוק מהראשית ונע לאט.
  remedy: { lesson: '1.3', anchor: higher-line, label: 'שיעור 1.3: איור 1.3ב, הקו הגבוה מול הקו התלול' }

- id: MC-negative-velocity-slower
  title: מהירות שלילית היא מהירות "קטנה מאפס"
  belief: >-
    גוף שמהירותו שלילית נע לאט יותר מגוף עומד, או לפחות לאט יותר מגוף שמהירותו חיובית: מינוס 5 מטרים לשנייה
    "פחות" מ-2 מטרים לשנייה.
  truth: >-
    הסימן של המהירות אומר רק לאיזה כיוון הגוף נע ביחס לציר שבחרנו. כמה מהר הוא נע אומר גודל המהירות: גוף שמהירותו
    5- מטרים לשנייה נע מהר יותר מגוף שמהירותו 2+ מטרים לשנייה. אם הופכים את כיוון הציר, הסימן מתהפך והתנועה לא
    משתנה.
  remedy: { lesson: '1.3', anchor: sign, label: 'שיעור 1.3: הסימן של המהירות' }

- id: MC-meet-halfway
  title: שני גופים שנעים זה לקראת זה נפגשים באמצע
  belief: >-
    כששני גופים יוצאים זה לקראת זה, הם נפגשים באמצע הדרך ביניהם.
  truth: >-
    הם נפגשים באמצע רק אם הם יוצאים באותו רגע ובאותו גודל מהירות. בכל מקרה אחר, מוצאים את רגע הפגישה מהשוואת
    ביטויי המקום של שני הגופים, ואת מקום הפגישה מהצבת הזמן באחד מהם. הגוף המהיר עובר יותר מחצי הדרך.
  remedy: { lesson: '1.3', anchor: meeting, label: 'שיעור 1.3: מתי ואיפה שני גופים נפגשים' }
