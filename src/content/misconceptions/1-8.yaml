# Misconceptions lesson 1.8 detects and remedies. Each is caught by a tagged distractor in questions/ch1/1-8.yaml.
# MC-height-not-slope and MC-area-is-position are fixed by .claude/specs/ch0-1.md; MC-graphs-same-shape was added here
# (the "graph copying" error: drawing the v–t graph with the shape of the x–t graph).

- id: MC-height-not-slope
  title: קוראים מהירות מהגובה של גרף המקום-זמן
  belief: >-
    ככל שגרף המקום-זמן גבוה יותר, הגוף מהיר יותר. בנקודה הגבוהה ביותר של הגרף המהירות הכי גדולה, ובמקום שבו שני
    גרפים נחתכים, לשני הגופים אותה מהירות.
  truth: >-
    הגובה של גרף המקום-זמן הוא המקום. המהירות היא השיפוע שלו. בנקודה הגבוהה ביותר הגרף אופקי לרגע, ולכן המהירות שם
    אפס. במקום שבו שני גרפים נחתכים, לשני הגופים אותו מקום, לא אותה מהירות. אותו דבר בגרף מהירות-זמן: התאוצה היא
    השיפוע שלו, לא הגובה.
  remedy: { lesson: '1.8', anchor: slope-down, label: 'שיעור 1.8: איור 1.8א, המשיק בראש גרף המקום-זמן' }

- id: MC-area-is-position
  title: השטח מתחת לגרף המהירות-זמן הוא המקום
  belief: >-
    השטח מתחת לגרף המהירות-זמן עד רגע מסוים הוא המקום של הגוף באותו רגע (ובאותו אופן: השטח מתחת לגרף התאוצה-זמן הוא
    המהירות).
  truth: >-
    השטח הוא שינוי: ההעתק Δx בפרק הזמן שנבחר. המקום הוא המקום ההתחלתי ועוד השטח, x = x₀ + Δx. השניים
    שווים רק כשהגוף מתחיל בראשית. באותו אופן, השטח מתחת לגרף תאוצה-זמן הוא Δv, ומהירות מקבלים רק כשמוסיפים את
    המהירות ההתחלתית.
  remedy: { lesson: '1.8', anchor: area-not-position, label: 'שיעור 1.8: השטח הוא העתק, לא מקום' }

- id: MC-graphs-same-shape
  title: גרף המהירות-זמן נראה כמו גרף המקום-זמן
  belief: >-
    כדי לשרטט גרף מהירות-זמן מגרף מקום-זמן, מעתיקים את הצורה: קו עולה נשאר קו עולה, קו אופקי נשאר אופקי, וקו יורד
    נשאר יורד.
  truth: >-
    כל גרף מתאר גודל אחר. מגרף המקום-זמן לוקחים בכל רגע את השיפוע: קו ישר עולה (מהירות קבועה וחיובית) הופך לקו
    אופקי מעל ציר הזמן, קו אופקי (מנוחה) הופך לקו על ציר הזמן, וקו ישר יורד הופך לקו אופקי מתחת לציר.
  remedy: { lesson: '1.8', anchor: sketch, label: 'שיעור 1.8: מגרף לגרף, שרטוט ובחירה' }
