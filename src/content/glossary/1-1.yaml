# Glossary terms introduced in lesson 1.1. One spelling per concept, course-wide.
# `reject` lists spellings that must not appear in course text (lint-content enforces it).

- id: point-body
  term: גוף נקודתי
  en: point body
  definition: >-
    גוף שמתייחסים אליו כאל נקודה: מתעלמים מהגודל ומהצורה שלו, ומתארים רק איפה הוא נמצא. זה מודל טוב כשהגוף קטן
    מאוד לעומת המרחקים בבעיה, למשל מכונית בנסיעה מתל אביב לחיפה, ומודל גרוע כשהשאלה תלויה בגודל הגוף, למשל
    מכונית שנכנסת לחניה.
  lesson: '1.1'

- id: position-axis
  term: ציר מקום
  en: position axis
  definition: >-
    קו ישר שעליו מתארים את המקום של גוף. כדי לבנות אותו בוחרים שני דברים: ראשית, הנקודה שבה x = 0, וכיוון חיובי,
    שמסמנים בחץ. כל נקודה על הציר מקבלת מספר עם סימן, ביחידות אורך, בדרך כלל מטרים.
  lesson: '1.1'

- id: reference-frame
  term: מערכת ייחוס
  en: frame of reference
  definition: >-
    נקודת המבט שממנה מתארים תנועה: ציר מקום (ראשית וכיוון חיובי) ושעון (הרגע שבו t = 0). את מערכת הייחוס בוחרים,
    והבחירה היא חלק מהפתרון. בכל פתרון כותבים אותה לפני הסימן הראשון.
  lesson: '1.1'

- id: position
  term: מקום
  en: position
  symbol: 'x'
  unit: m
  definition: >-
    המספר שמתאים לנקודה שבה הגוף נמצא על ציר המקום. הגודל של המספר אומר כמה מטרים הגוף רחוק מהראשית, והסימן
    אומר באיזה צד שלה הוא נמצא: + בצד שאליו מצביע הכיוון החיובי, − בצד השני. המקום תלוי בבחירת הראשית ובבחירת
    הכיוון החיובי.
  lesson: '1.1'

- id: displacement
  term: העתק
  en: displacement
  symbol: '\Delta x'
  unit: m
  definition: >-
    השינוי במקום בין שני רגעים: המקום הסופי פחות המקום ההתחלתי, Δx = x₂ − x₁. ההעתק הוא מספר עם סימן: חיובי אם
    המקום הסופי בכיוון החיובי מההתחלתי, שלילי אם בכיוון השלילי, ואפס אם הגוף חזר למקום שבו התחיל. הוא לא תלוי
    בבחירת הראשית, אבל מחליף סימן כשהופכים את הכיוון החיובי.
  lesson: '1.1'

- id: path-length
  term: דרך
  en: distance travelled (path length)
  unit: m
  definition: >-
    אורך המסלול שהגוף עבר בפועל, כל הצעדים קדימה ואחורה יחד. הדרך אף פעם לא שלילית, והיא תמיד גדולה מגודל ההעתק
    (ההעתק בלי הסימן, |Δx|) או שווה לו. הן שוות רק כשהגוף לא חזר לאחור בדרכו.
  reject: [מרחק שעבר]
  lesson: '1.1'

- id: time-interval
  term: פרק זמן
  en: time interval
  symbol: '\Delta t'
  unit: s
  definition: >-
    הזמן שעבר בין שני רגעים: Δt = t₂ − t₁. רגע הוא קריאה אחת של השעון, למשל t = 3 s; פרק זמן הוא ההפרש בין שתי
    קריאות, למשל מ-t = 3 s עד t = 5 s עברו Δt = 2 s.
  lesson: '1.1'
