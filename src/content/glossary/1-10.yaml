# Glossary terms introduced in lesson 1.10 (velocity and acceleration in the plane). Ids fixed by .claude/specs/ch0-1.md.

- id: trajectory
  term: מסלול
  en: trajectory (path)
  definition: >-
    הקו שגוף עובר עליו במרחב, כפי שהיה נראה אילו הגוף השאיר עקבות. המסלול מראה איפה הגוף היה, אבל לא מתי:
    אותו מסלול אפשר לעבור לאט או מהר. אין לבלבל אותו עם גרף מקום-זמן, שאחד הצירים שלו הוא הזמן.
  lesson: '1.10'

- id: position-vector
  term: וקטור מקום
  en: position vector
  definition: >-
    החץ מראשית מערכת הצירים אל הגוף. הרכיבים שלו הם שיעורי המקום של הגוף, x ו-y. ההעתק בין שני רגעים הוא
    ההפרש בין שני וקטורי המקום, והוא לא תלוי בבחירת הראשית.
  symbol: '\vec r'
  unit: m
  lesson: '1.10'

- id: tangential-component
  term: רכיב משיקי
  en: tangential component (of the acceleration)
  definition: >-
    החלק של התאוצה שמקביל למהירות, כלומר שמשיק למסלול. הוא משנה רק את גודל המהירות: כשהוא בכיוון המהירות הגוף
    מאיץ, וכשהוא נגד המהירות הגוף מאט. כשגודל המהירות קבוע, הרכיב המשיקי הוא אפס. הסימן שלו נבחר בקורס,
    ולא מופיע בדף הנוסחאות של הבגרות.
  symbol: 'a_T'
  unit: m/s²
  lesson: '1.10'

- id: radial-component
  term: רכיב רדיאלי
  en: radial (normal, centripetal) component (of the acceleration)
  definition: >-
    החלק של התאוצה שמאונך למהירות. הוא משנה רק את כיוון המהירות, ותמיד מצביע אל הצד הפנימי של העיקול. השם בא
    מרדיוס: בכל נקודה אפשר לצייר מעגל שמתעקל כמו המסלול שם, והרכיב הזה מצביע לאורך הרדיוס שלו, אל המרכז. בתנועה
    במעגל הוא מצביע אל מרכז המעגל. בתנועה בקו ישר הרכיב הרדיאלי הוא אפס. הסימן שלו מופיע גם בדף הנוסחאות של הבגרות.
  symbol: 'a_R'
  unit: m/s²
  lesson: '1.10'
