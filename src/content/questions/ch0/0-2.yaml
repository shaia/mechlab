  - id: Q-0.2-reaction
    type: numeric
    objectives: [OBJ-0.2-4, OBJ-0.2-2]
    level: bagrut
    prompt: >-
      נהגת נוסעת במהירות קבועה של 72 קמ״ש ורואה מכשול. עד שהיא לוחצת על הבלם עוברות $0.80\,\text{s}$,
      ובזמן הזה המכונית ממשיכה באותה מהירות. כמה מטרים עוברת המכונית עד הלחיצה על הבלם?
    answer: 16
    unit: m
    tolerance: 0.02
    correctFeedback: >-
      נכון. $v = 72/3.6 = 20\,\text{m/s}$, ולכן $d = vt = 20\,\dfrac{\text{m}}{\text{s}}\cdot0.80\,\text{s} = 16\,\text{m}$.
      השניות מצטמצמות, ונשארים מטרים.
    wrongFeedback: 'המירו את המהירות ל-m/s לפני ההצבה, והשתמשו ב-$d = vt$.'
    commonWrong:
      - value: 57.6
        feedback: 'הצבתם קמ״ש ישר בנוסחה: $72\cdot0.80$. בדיקת יחידות מגלה את זה: $\text{km/h}$ כפול $\text{s}$ אינו מטר. המירו קודם: $72/3.6 = 20\,\text{m/s}$.'
        misconception: MC-units-decoration
      - value: 207.36
        feedback: 'כפלתם ב-3.6 במקום לחלק: $72\cdot3.6 = 259\,\text{m/s}$, מהירות של מטוס. מקמ״ש ל-m/s מחלקים ב-3.6.'
        misconception: MC-kmh-to-ms-multiply
      - value: 0.016
        feedback: 'זה נכון, אבל בקילומטרים: $0.016\,\text{km}$. השאלה מבקשת מטרים, $16\,\text{m}$.'
    hints:
      - '$72\,\text{km/h} = 72\cdot\dfrac{1000\,\text{m}}{3600\,\text{s}}$.'
