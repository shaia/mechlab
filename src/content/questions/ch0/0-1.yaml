# Chapter 0 question bank, lesson 0.1 (how to learn in this course).
# Numbers are from src/physics/launch.ts: launch(20, 30) and launch(20, 60) both land at 34.64 m; launch(20, 20) at 25.71 m.

chapter: 0
questions:
  # ---------------------------------------------------------------- OBJ-0.1-1 the parts of a lesson
  - id: Q-0.1-parts
    type: multi
    objectives: [OBJ-0.1-1]
    qualitative: true
    prompt: >-
      אילו מהחלקים האלה יש בכל שיעור בקורס? סמנו את כל התשובות הנכונות.
    choices:
      - text: תופעה, ושאלה עליה
        correct: true
        feedback: נכון. כל שיעור פותח במשהו שקורה בעולם, לפני כל הגדרה.
      - text: חיזוי שמתחייבים אליו
        correct: true
        feedback: נכון. החיזוי בא לפני ההסבר, ובסוף השיעור חוזרים אליו.
      - text: משימות באיור חי
        correct: true
        feedback: נכון. בחלק "חקרו" האיור בודק בעצמו שביצעתם את המשימות.
      - text: מבחן עם ציון בסוף השיעור
        feedback: בסוף השיעור יש שאלות לבדיקה עצמית, עם משוב, אבל אין ציון. המטרה היא לגלות מה כבר הבנתם.
      - text: שאלות לבדיקה עצמית, עם משוב
        correct: true
        feedback: נכון. כל תשובה מקבלת הסבר, גם תשובה נכונה.

  - id: Q-0.1-flap
    type: mc
    objectives: [OBJ-0.1-1]
    qualitative: true
    prompt: >-
      בחלק "חזו" בוחרים תשובה ולוחצים על "זה החיזוי שלי". מה קורה אחר כך?
    choices:
      - text: הדש נפתח, והחיזוי נשמר. בסוף השיעור חוזרים אליו ומשווים אותו למה שגיליתם.
        correct: true
        feedback: נכון. החיזוי לא נמחק ולא משתנה, כדי שאפשר יהיה להשוות בכנות בין מה שחשבתם לבין מה שגיליתם.
      - text: אם החיזוי נכון מקבלים נקודות, ואם הוא שגוי יורדות נקודות.
        feedback: אין שום ציון על חיזוי. מתחייבים כדי לבדוק את האינטואיציה, וחיזוי שגוי הוא חלק רגיל מהלמידה.
        misconception: MC-predict-wastes-time
      - text: אפשר לחזור ולשנות את החיזוי בכל רגע, עד סוף השיעור.
        feedback: אחרי ההתחייבות אי אפשר לשנות את החיזוי. חיזוי שמתקנים בדיעבד כבר לא מראה לכם מה חשבתם באמת.

  - id: Q-0.1-example-first
    type: mc
    objectives: [OBJ-0.1-1]
    prompt: >-
      בחלק "דוגמה פתורה" הפתרון מוסתר מתחת לכפתור. מה כדאי לעשות לפני שפותחים אותו?
    choices:
      - text: לנסות לפתור לבד, על דף, ורק אחר כך להשוות כל שלב לפתרון.
        correct: true
        feedback: נכון. ניסיון לפתור לבד, גם כשהוא נתקע, מכין אתכם להבין את הפתרון ולזכור אותו.
      - text: לפתוח מיד ולקרוא את הפתרון פעמיים, כדי לזכור אותו טוב.
        feedback: קריאה חוזרת מרגישה כמו למידה, אבל משאירה פחות בזיכרון מניסיון לפתור. נסו קודם, ואז קראו.
        misconception: MC-predict-wastes-time
      - text: לדלג על הדוגמה, כי השאלות בסוף השיעור מספיקות.
        feedback: הדוגמה מראה צעד אחר צעד את מבנה הפתרון שמצופה מכם בבגרות. כדאי לעבור עליה, אחרי שניסיתם לבד.

  # ---------------------------------------------------------------- OBJ-0.1-2 operating a live figure; what a model can show
  - id: Q-0.1-step-mark
    type: mc
    objectives: [OBJ-0.1-2]
    qualitative: true
    prompt: >-
      ליד חלק מהפסקאות בשיעור מופיע הסימן ◂. מה הוא אומר?
    choices:
      - text: שהפסקה שולטת באיור. כשהיא מגיעה לאמצע המסך, או כשלוחצים עליה, האיור עובר למצב שהיא מתארת.
        correct: true
        feedback: נכון. כך הטקסט "מדבר" עם האיור שלידו, ואפשר לחזור לכל שלב בלחיצה. באיור 0.1, פסקה כזו הזיזה את המטרה.
      - text: שזו פסקה חשובה במיוחד, שכדאי ללמוד בעל-פה.
        feedback: הסימן לא מסמן חשיבות. הוא מסמן פסקה שמשנה את האיור החי שלידה.
      - text: שהפסקה מסמנת לכם משימה כבוצעה.
        feedback: פסקה אף פעם לא מסמנת משימה. רק מה שאתם עושים באיור מסמן ✓ ליד משימה. הסימן ◂ אומר שהפסקה משנה את האיור.

  - id: Q-0.1-same-landing
    type: numeric
    objectives: [OBJ-0.1-2]
    level: mid
    prompt: >-
      באיור 0.1 שיגרתם כדור במהירות $20\,\text{m/s}$ בזווית $30^\circ$, והוא נחת $34.6\,\text{m}$ מהמשגר.
      באיזה מרחק מהמשגר ינחת כדור שמשוגר באותה מהירות בזווית $60^\circ$? אם לא בדקתם, בדקו עכשיו באיור.
    answer: 34.6
    unit: m
    tolerance: 0.03
    correctFeedback: >-
      נכון. בזווית $60^\circ$ יותר מהמהירות הולך למעלה ופחות הולך קדימה: הכדור נשאר באוויר זמן רב יותר, אבל בכל
      שנייה מתקדם קדימה פחות. שני השינויים מאזנים זה את זה, והוא נוחת באותו מקום. את החשבון המלא תלמדו בשיעור 2.9.
    wrongFeedback: >-
      שגרו באיור בשתי הזוויות, במהירות $20\,\text{m/s}$, וקראו מתחת לאיור את מרחק הנחיתה של כל אחד.
    commonWrong:
      - value: 69.3
        feedback: >-
          זה פי 2 מ-$34.6\,\text{m}$: "זווית כפולה, מרחק כפול". אבל המרחק לא גדל כמו הזווית. בדקו באיור: הכדור
          נוחת באותו מקום.
      - value: 17.3
        feedback: >-
          זה חצי מ-$34.6\,\text{m}$: "גבוה יותר, ולכן קרוב יותר". הכדור אכן עולה גבוה יותר, אבל גם נשאר באוויר זמן
          רב יותר. בדקו באיור: הוא נוחת באותו מקום.

  - id: Q-0.1-read-miss
    type: numeric
    objectives: [OBJ-0.1-2]
    prompt: >-
      באיור 0.1 הזיזה פסקה את המטרה, והדגל עומד עכשיו $20\,\text{m}$ מהמשגר. שיגרתם בזווית $20^\circ$, ומתחת לאיור
      כתוב שהכדור נחת $25.7\,\text{m}$ מהמשגר. בכמה מטרים החטיא הכדור את הדגל?
    answer: 5.7
    unit: m
    tolerance: 0.03
    correctFeedback: >-
      נכון: $25.7\,\text{m} - 20\,\text{m} = 5.7\,\text{m}$, אחרי המטרה. מודדים מרחקים מאותה נקודה, המשגר, ומחסרים.
    wrongFeedback: >-
      שני המרחקים נמדדים מהמשגר. ההחטאה היא ההפרש ביניהם.
    commonWrong:
      - value: 45.7
        feedback: >-
          חיברתם את שני המרחקים. אבל שניהם נמדדים מהמשגר, באותו כיוון, ולכן המרחק בין הדגל לנקודת הנחיתה הוא ההפרש.
      - value: 4.5
        feedback: >-
          מדדתם עד הקצה הרחוק של המטרה ($21.2\,\text{m}$). השאלה שאלה על המרחק מהדגל, שעומד באמצע המטרה.

  - id: Q-0.1-sim-proves
    type: twotier
    objectives: [OBJ-0.1-2]
    qualitative: true
    prompt: >-
      באיור 0.1 ראיתם שכדור בזווית $30^\circ$ וכדור בזווית $60^\circ$ נוחתים באותו מקום.
      האם האיור **מוכיח** שכך יקרה גם לכדור שתזרקו בחצר?
    choices:
      - text: לא.
        correct: true
        feedback: נכון. האיור מראה מה המודל שלו צופה, ולא מה יקרה לכדור אמיתי.
      - text: כן.
        feedback: >-
          האיור מחשב לפי מודל שהוכנס לתוכו: בלי אוויר, ומשגר בגובה הקרקע. הוא מראה מה המודל צופה, אבל לא מוכיח שכך
          קורה בחצר. את זה בודק ניסוי אמיתי.
        misconception: MC-sim-proves
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: האיור מחשב לפי מודל שהזניח דברים, למשל את האוויר. הוא מראה מה המודל צופה, ואת המודל בודק ניסוי אמיתי.
        correct: true
        feedback: בדיוק. בכל שיעור נאמר באיזה מודל משתמשים ומתי הוא מפסיק להיות סביר.
      - text: מחשב לא טועה, ולכן מה שהוא מראה נכון בהכרח.
        feedback: >-
          המחשב לא טועה בחשבון, אבל הוא מחשב לפי המודל שנתנו לו. אילו הכנסנו לתוכו מודל שגוי, הוא היה מצייר אותו
          בדיוק באותו ביטחון.
        misconception: MC-sim-proves
      - text: ניסיתי רק שתי זוויות. אחרי מאה שיגורים באיור זה כבר היה מוכח.
        feedback: >-
          גם מאה שיגורים באיור מראים רק מה המודל צופה. הבעיה היא לא מספר השיגורים, אלא שהאיור מחשב לפי המודל עצמו.
        misconception: MC-sim-proves

  # ---------------------------------------------------------------- OBJ-0.1-3 why predicting and retrieving beat rereading
  - id: Q-0.1-testing-effect
    type: mc
    objectives: [OBJ-0.1-3]
    prompt: >-
      בעוד שבוע יש לכם בוחן על שיעור מהקורס, ויש לכם שעה אחת ללמוד. מה כנראה ישאיר אצלכם יותר בזיכרון?
    choices:
      - text: לקרוא את השיעור פעם אחת, ואז לענות על השאלות שלו בלי להציץ, ולבדוק את התשובות.
        correct: true
        feedback: >-
          נכון. זה מה שנמצא בניסויים, למשל בניסוי של רודיגר וקרפיקה. ניסיון להיזכר מחזק את מה שנשלף מהזיכרון.
      - text: לקרוא את השיעור שלוש פעמים, ולסמן במרקר את המשפטים החשובים.
        feedback: >-
          זו השיטה הנפוצה ביותר, והיא מרגישה טוב, כי הטקסט נעשה מוכר. אבל בניסויים היא משאירה פחות בזיכרון אחרי
          שבוע.
        misconception: MC-predict-wastes-time
      - text: לקרוא את הסיכום של השיעור עשר פעמים.
        feedback: >-
          גם זו קריאה חוזרת. הסיכום ייראה לכם מוכר מאוד, אבל לזהות טקסט מוכר זה לא אותו דבר כמו לשלוף אותו בבוחן.
        misconception: MC-predict-wastes-time

  - id: Q-0.1-wrong-prediction
    type: twotier
    objectives: [OBJ-0.1-3]
    qualitative: true
    prompt: >-
      חזיתם שכדור בזווית $60^\circ$ ינחת פי 2 רחוק יותר מכדור בזווית $30^\circ$, ובאיור ראיתם שהם נוחתים באותו מקום.
      מה כדאי לעשות?
    choices:
      - text: לבדוק מה בחשיבה שלכם הוביל ל"פי 2", ולהשוות את זה להסבר שבתחילת החלק "למה הספר בנוי כך".
        correct: true
        feedback: נכון. החיזוי השגוי מצביע בדיוק על הרעיון שצריך לתקן.
      - text: לשכוח מהחיזוי. הוא היה שגוי, ולכן הוא לא שווה כלום.
        feedback: דווקא החיזוי השגוי שווה הרבה. הוא מראה איזה רעיון שלכם לא מתאים למה שקרה.
        misconception: MC-predict-wastes-time
      - text: לחזור לחלק "חזו" ולתקן את החיזוי לתשובה הנכונה.
        feedback: >-
          אי אפשר לשנות חיזוי אחרי ההתחייבות, ובכוונה. מה שמלמד הוא ההשוואה בין מה שחשבתם לבין מה שקרה.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: חיזוי שגוי שנבדק מיד מראה איזה רעיון צריך לתקן, ולכן ממנו לומדים הרבה.
        correct: true
        feedback: בדיוק. זו הסיבה שהקורס מבקש לחזות לפני כל הסבר.
      - text: חיזוי שגוי מוריד את הציון בשיעור, ולכן כדאי לתקן אותו.
        feedback: אין ציון על חיזויים. המטרה היחידה שלהם היא לגלות מה האינטואיציה שלכם אומרת.
        misconception: MC-predict-wastes-time
      - text: כנראה שהאיור טעה, כי האינטואיציה שלנו לא טועה.
        feedback: >-
          האינטואיציה שווה בדיקה, ולפעמים היא באמת מגלה שמודל לא מתאים. אבל כאן האיור מחשב בדיוק את המודל שלו,
          ולכן הפער מראה שהאינטואיציה פספסה משהו. כאן: שבזווית תלולה הכדור מתקדם קדימה פחות בכל שנייה.

  - id: Q-0.1-feels-easy
    type: mc
    objectives: [OBJ-0.1-3]
    qualitative: true
    prompt: >-
      למה קריאה חוזרת **מרגישה** כמו למידה טובה, גם כשהיא לא?
    choices:
      - text: כי טקסט מוכר קל לזהות, ותחושת ההיכרות נראית כמו ידע.
        correct: true
        feedback: >-
          נכון. לזהות משהו כשהוא מולכם זה לא אותו דבר כמו לשלוף אותו מהזיכרון, וזה מה שבוחן דורש.
      - text: כי קריאה חוזרת היא באמת הדרך הטובה ביותר, והניסויים טעו.
        feedback: >-
          התוצאה חזרה בניסויים רבים, עם חומרים שונים ותלמידים בגילים שונים. מי שקראו שוב ושוב היו בטוחים יותר, וזכרו
          פחות.
        misconception: MC-predict-wastes-time
      - text: כי קריאה חוזרת לוקחת יותר זמן.
        feedback: >-
          לא הזמן יוצר את התחושה. בניסוי של רודיגר וקרפיקה, מי שקראו שוב ושוב קראו את הקטע כ-14 פעמים, ובכל זאת זכרו
          אחרי שבוע פחות ממי שקראו אותו כ-3 פעמים וניסו להיזכר.

  # ---------------------------------------------------------------- OBJ-0.1-4 sure-wrong vs unsure-wrong
  - id: Q-0.1-sure-wrong
    type: mc
    objectives: [OBJ-0.1-4]
    qualitative: true
    prompt: >-
      עניתם על שאלה, לחצתם "בדיקה · בטוחים", והתשובה הייתה שגויה. מה זה מרמז?
    choices:
      - text: שכנראה יש לכם רעיון שגוי שנשמע נכון, תפיסה שגויה, ששווה לבדוק מול האיור או הניסוי.
        correct: true
        feedback: נכון. טעות בביטחון היא הסימן החזק ביותר לתפיסה שגויה, ובדיוק אותה כדאי לבדוק מול ניסוי.
      - text: שסתם לא הייתם מרוכזים, ואין מה לעשות עם זה.
        feedback: >-
          אולי, אבל ביטחון בתשובה שגויה הוא בדרך כלל סימן לרעיון שנראה לכם נכון. קראו את המשוב: הוא מסביר את
          הרעיון הזה.
        misconception: MC-confidence-irrelevant
      - text: שעדיף מעכשיו לסמן תמיד "לא בטוחים", כדי שטעויות לא ייספרו.
        feedback: >-
          אין ציון שמשתנה לפי הסימון. סימון לא כנה רק מסתיר מכם, ומהקורס, איזה רעיון צריך לתקן.
        misconception: MC-confidence-irrelevant

  - id: Q-0.1-rank-review
    type: rank
    objectives: [OBJ-0.1-4]
    qualitative: true
    level: mid
    prompt: >-
      דרגו את ארבעת המצבים לפי כמה **דחוף** לחזור על הנושא. את הדחוף ביותר שימו למעלה.
    items:
      - id: right-unsure
        label: עניתם נכון, וסימנתם "לא בטוחים"
      - id: wrong-sure
        label: טעיתם, וסימנתם "בטוחים"
      - id: right-sure
        label: עניתם נכון, וסימנתם "בטוחים"
      - id: wrong-unsure
        label: טעיתם, וסימנתם "לא בטוחים"
    order: [wrong-sure, wrong-unsure, right-unsure, right-sure]
    correctFeedback: >-
      נכון. טעות בביטחון היא תפיסה שגויה: היא לא תיעלם מעצמה. טעות בלי ביטחון היא חור בידע, ואתם כבר יודעים עליו.
      תשובה נכונה בלי ביטחון אולי הייתה ניחוש, ורק תשובה נכונה בביטחון אומרת שהנושא כנראה בידיים שלכם.
    wrongFeedback: >-
