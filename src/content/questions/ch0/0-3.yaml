  - id: Q-0.3-same-angle
    type: mc
    objectives: [OBJ-0.3-3, OBJ-0.3-1]
    qualitative: true
    prompt: >-
      שני מדרונות נוטים באותה זווית מעל האופק. המדרון השני ארוך פי 2 מהראשון. מה נכון?
    choices:
      - text: 'הגובה של השני גדול פי 2, והסינוס של הזווית שווה בשניהם.'
        correct: true
        feedback: 'נכון. באותה זווית המשולשים דומים: כל הצלעות גדלות פי 2, והיחסים, ובהם הסינוס, לא משתנים.'
      - text: 'הגובה של השני גדול פי 2, ולכן גם הסינוס שלו גדול פי 2.'
        feedback: 'הסינוס הוא יחס: $h/L$. גם $h$ וגם $L$ גדלו פי 2, ולכן היחס לא השתנה. הסינוס תלוי רק בזווית.'
      - text: 'הגובה של השני גדול פי 4, כמו בריבוע.'
        feedback: 'באותה זווית הגובה ביחס ישר לאורך המדרון: $h = L\sin\theta$. אין כאן ריבוע.'
        misconception: MC-square-law-doubles
      - text: 'אי אפשר לדעת בלי לדעת את הזווית.'
        feedback: 'לא צריך את הזווית עצמה. מספיק לדעת שהיא שווה בשני המדרונות, ולכן $h/L$ שווה בשניהם.'
