    unit: m
    tolerance: 0.02
    correctFeedback: 'נכון. המדרון הוא היתר, ולכן לפי פיתגורס $w = \sqrt{50^2 - 30^2} = \sqrt{1600} = 40\,\text{m}$.'
    wrongFeedback: 'המדרון, הירידה בגובה והמרחק האופקי יוצרים משולש ישר-זווית. מי מהם היתר?'
    commonWrong:
      - value: 20
        feedback: 'חיסרתם את האורכים, $50 - 30$. בפיתגורס מחסירים את הריבועים: $w^2 = 50^2 - 30^2$.'
      - value: 58.31
