# Chapter 0 question bank, lesson 0.3 (the math toolbox: proportion, slope, right-triangle trig).
# Every number, and every commonWrong value, recomputed with src/physics/toolbox.ts (lineThrough, powerScale,
# legs, otherLeg, hypotenuse, angleFromLegs, sinDeg, tanDeg) and G from constants.ts.

chapter: 0
questions:
  # ---------------------------------------------------------------- OBJ-0.3-1 proportion
  - id: Q-0.3-braking-square
    type: numeric
    objectives: [OBJ-0.3-1]
    level: mid
    prompt: >-
      מרחק הבלימה של מכונית ביחס ישר לריבוע המהירות שלה. ב-$60\,\text{km/h}$ מרחק הבלימה הוא $20\,\text{m}$.
      מה מרחק הבלימה ב-$90\,\text{km/h}$?
    answer: 45
    unit: m
    tolerance: 0.02
    correctFeedback: 'נכון: המהירות גדלה פי $90/60 = 1.5$, ולכן מרחק הבלימה גדל פי $1.5^2 = 2.25$: $20\,\text{m}\cdot 2.25 = 45\,\text{m}$.'
    wrongFeedback: 'חשבו קודם פי כמה גדלה המהירות. מרחק הבלימה גדל פי הריבוע של המספר הזה.'
    commonWrong:
      - value: 30
        feedback: 'הכפלתם את מרחק הבלימה פי 1.5, כמו המהירות. אבל המרחק ביחס ישר לריבוע המהירות, ולכן הוא גדל פי $1.5^2 = 2.25$.'
        misconception: MC-square-law-doubles
      - value: 13.33
        feedback: 'חילקתם ב-1.5, כאילו זה יחס הפוך. מהירות גדולה יותר דורשת מרחק בלימה ארוך יותר, לא קצר יותר.'
    hints:
      - 'המהירות גדלה פי $90/60$. בכמה עליכם להכפיל את מרחק הבלימה, כשהוא ביחס ישר לריבוע המהירות?'

  - id: Q-0.3-trip-inverse
    type: mc
    objectives: [OBJ-0.3-1]
    qualitative: true
    prompt: >-
      נסיעה בין שתי ערים, במהירות קבועה, לוקחת 6 שעות. אם נוסעים את אותה דרך במהירות גדולה פי 3, כמה זמן תיקח הנסיעה?
    choices:
      - text: שעתיים
        correct: true
        feedback: 'נכון. הזמן ביחס הפוך למהירות: המכפלה של המהירות בזמן קבועה (היא אורך הדרך), ולכן מהירות פי 3 נותנת זמן קטן פי 3, $6/3 = 2$ שעות.'
      - text: 18 שעות
        feedback: 'זה היה נכון אילו הזמן היה ביחס ישר למהירות. אבל כשנוסעים מהר יותר, מגיעים מוקדם יותר: הזמן ביחס הפוך למהירות.'
      - text: 3 שעות
        feedback: 'חיסרתם 3 מ-6. ביחס הפוך לא מחסירים, אלא מחלקים: הזמן קטן פי 3.'
      - text: 6 שעות, כי הדרך לא השתנתה
        feedback: 'הדרך אכן לא השתנתה, אבל במהירות גדולה יותר עוברים אותה בפחות זמן. מה שקבוע הוא המכפלה של המהירות בזמן.'

  - id: Q-0.3-which-table
    type: multi
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    qualitative: true
    prompt: >-
      בכל טבלה, שלוש מדידות של $y$ לשלושה ערכים של $x$. באילו טבלאות $y$ ביחס ישר ל-$x$? סמנו את כל התשובות הנכונות.
    choices:
      - text: 'עבור $x = 1, 2, 3$ מתקבל $y = 4, 8, 12$'
        correct: true
        feedback: 'נכון. המנה $y/x = 4$ בכל השורות: $x$ פי 2, $y$ פי 2.'
      - text: 'עבור $x = 1, 2, 3$ מתקבל $y = 5, 7, 9$'
        feedback: 'זו פונקציה קווית ($y$ עולה ב-2 בכל צעד, $y = 2x + 3$), אבל לא יחס ישר: $x$ פי 2 לא נותן $y$ פי 2 (מ-5 ל-7). הקו שלה לא עובר בראשית.'
        misconception: MC-linear-means-proportional
      - text: 'עבור $x = 2, 4, 6$ מתקבל $y = 3, 6, 9$'
        correct: true
        feedback: 'נכון. המנה $y/x = 1.5$ בכל השורות.'
      - text: 'עבור $x = 1, 2, 4$ מתקבל $y = 8, 4, 2$'
        feedback: 'כאן $x$ פי 2 נותן $y$ קטן פי 2: המכפלה $x\cdot y = 8$ קבועה. זה יחס הפוך.'
      - text: 'עבור $x = 1, 2, 3$ מתקבל $y = 2, 8, 18$'
        feedback: 'כאן $x$ פי 2 נותן $y$ פי 4: המנה $y/x^2 = 2$ קבועה. $y$ ביחס ישר לריבוע של $x$, לא ל-$x$.'
        misconception: MC-square-law-doubles

  - id: Q-0.3-fall-square
    type: twotier
    objectives: [OBJ-0.3-1]
    qualitative: true
    level: mid
    prompt: >-
      כדור משוחרר ממנוחה ונופל. נתון שהמרחק שהוא נפל ביחס ישר לריבוע הזמן שעבר מאז שחרורו.
      בשנייה הראשונה הוא נפל $5\,\text{m}$. כמה מטרים הוא נפל בסך הכול אחרי 3 שניות?
    choices:
      - text: '$45\,\text{m}$'
        correct: true
        feedback: 'נכון. הזמן גדל פי 3, ולכן המרחק גדל פי $3^2 = 9$: $5\,\text{m}\cdot 9 = 45\,\text{m}$.'
      - text: '$15\,\text{m}$'
        feedback: 'זה היה נכון אילו המרחק היה ביחס ישר לזמן. כאן הוא ביחס ישר לריבוע הזמן.'
        misconception: MC-square-law-doubles
      - text: '$25\,\text{m}$'
        feedback: 'זה $5^2$: העליתם בריבוע את המרחק במקום את היחס בין הזמנים.'
    reasons:
      - text: 'הזמן גדל פי 3, ולכן הריבוע שלו, וגם המרחק, גדלים פי 9.'
        correct: true
        feedback: 'נכון. בשאלת "פי כמה" לא צריך את הקבוע: מספיק היחס בין הזמנים, בריבוע.'
      - text: 'הזמן גדל פי 3, ולכן המרחק גדל פי 3.'
        feedback: 'כך עובד יחס ישר. בריבוע, $x$ פי 3 נותן $x^2$ פי 9.'
        misconception: MC-square-law-doubles
      - text: 'בכל שנייה הכדור נופל עוד 5 מטרים.'
        feedback: 'זה היה נכון אילו המרחק היה פונקציה קווית של הזמן. בריבוע הזמן, בכל שנייה הכדור נופל יותר מבקודמתה.'
        misconception: MC-linear-means-proportional

  # ---------------------------------------------------------------- OBJ-0.3-2 slope and intercept
  - id: Q-0.3-slope-units
    type: numeric
    objectives: [OBJ-0.3-2]
    prompt: >-
      הגרף של המרחק $d$ של עגלה מחיישן, מול הזמן $t$, הוא קו ישר שעובר בנקודות $(2\,\text{s},\ 6\,\text{m})$ ו-$(8\,\text{s},\ 30\,\text{m})$.
      מה השיפוע של הקו?
    answer: 4
    unit: m/s
    tolerance: 0.02
    correctFeedback: 'נכון: $\dfrac{30\,\text{m} - 6\,\text{m}}{8\,\text{s} - 2\,\text{s}} = \dfrac{24\,\text{m}}{6\,\text{s}} = 4\,\text{m/s}$. בכל שנייה העגלה מתרחקת עוד 4 מטרים.'
    wrongFeedback: 'השיפוע הוא ההפרש בגובה חלקי ההפרש האופקי: $\Delta d / \Delta t$, משתי הנקודות.'
    commonWrong:
      - value: 0.25
        feedback: 'הפכתם את השבר: חילקתם את ההפרש בזמן בהפרש במרחק. השיפוע הוא הציר האנכי חלקי הציר האופקי, $\Delta d/\Delta t$.'
      - value: 3
        feedback: 'זה $6/2$, המנה בנקודה אחת. היא שווה לשיפוע רק כשהקו עובר בראשית, וכאן הוא לא עובר בה. חשבו מהפרשים.'
        misconception: MC-linear-means-proportional
      - value: 3.75
        feedback: 'זה $30/8$, המנה בנקודה אחת. היא שווה לשיפוע רק כשהקו עובר בראשית. חשבו מהפרשים בין שתי הנקודות.'
        misconception: MC-linear-means-proportional

  - id: Q-0.3-steeper-faster
    type: mc
    objectives: [OBJ-0.3-2]
    qualitative: true
    prompt: >-
      נועה ועומר שרטטו את אותה טבלת מדידות של רכבת: המרחק שלה מתחנה, מול הזמן. אצל נועה הקו יוצר בציור זווית של כ-$60^\circ$ עם הציר האופקי, ואצל עומר זווית של כ-$20^\circ$.
      מה אפשר לומר על השיפועים שהם יחשבו מהגרפים?
    choices:
      - text: 'הם יקבלו אותו שיפוע, כי אלה אותן מדידות; הזוויות שונות רק כי הם בחרו קנה מידה אחר לצירים.'
        correct: true
        feedback: 'נכון. השיפוע מחושב ממספרים ויחידות: $\Delta d/\Delta t$. קנה המידה משנה רק איך הקו נראה.'
      - text: 'השיפוע של נועה גדול פי 3, כי הזווית שלה גדולה פי 3.'
        feedback: 'השיפוע אינו הזווית שבציור, וגם לא ביחס ישר לה. אותן מדידות נותנות אותו שיפוע בכל קנה מידה.'
        misconception: MC-slope-is-angle
      - text: 'השיפוע של נועה הוא $\tan 60^\circ$, ושל עומר $\tan 20^\circ$.'
        feedback: 'השיפוע הוא $\tan$ של הזווית רק כששני הצירים באותן יחידות ובאותו קנה מידה. כאן ציר אחד במטרים והשני בשניות, ולשיפוע יש יחידות של $\text{m/s}$.'
        misconception: MC-slope-is-angle
      - text: 'אחד מהם טעה בשרטוט, כי לאותן מדידות יש רק גרף נכון אחד.'
        feedback: 'שני הגרפים יכולים להיות נכונים. כל אחד רשאי לבחור כמה מטרים שווה משבצת, ובלבד שהוא כותב את זה על הציר.'

  - id: Q-0.3-intercept
    type: numeric
    objectives: [OBJ-0.3-2]
    level: mid
    prompt: >-
      הגרף של המרחק $d$ של אופנוע מצומת, מול הזמן $t$, הוא קו ישר שעובר בנקודות $(2\,\text{s},\ 50\,\text{m})$ ו-$(6\,\text{s},\ 110\,\text{m})$.
      באיזה מרחק מהצומת היה האופנוע ברגע $t = 0$ (נקודת החיתוך של הקו עם הציר האנכי)?
    answer: 20
    unit: m
    tolerance: 0.02
    correctFeedback: 'נכון. השיפוע $\dfrac{60\,\text{m}}{4\,\text{s}} = 15\,\text{m/s}$, ולכן $b = 50\,\text{m} - 15\,\text{m/s}\cdot 2\,\text{s} = 20\,\text{m}$.'
    wrongFeedback: 'מצאו קודם את השיפוע משתי הנקודות. אחר כך "חזרו" מהנקודה הראשונה לרגע $t = 0$: כמה מטרים האופנוע עובר ב-2 שניות?'
    commonWrong:
      - value: 50
        feedback: 'זה המרחק ברגע $t = 2\,\text{s}$, לא ברגע $t = 0$. נקודת החיתוך היא המקום שבו הקו פוגש את הציר האנכי.'
      - value: 80
        feedback: 'הוספתם $15\,\text{m/s}\cdot 2\,\text{s}$ במקום להחסיר. ברגע $t = 0$, שתי שניות לפני הנקודה הראשונה, האופנוע היה קרוב יותר לצומת.'

  - id: Q-0.3-spring-line
    type: twotier
    objectives: [OBJ-0.3-2, OBJ-0.3-1]
    qualitative: true
    prompt: >-
      הגרף של האורך $\ell$ של קפיץ מול המסה $M$ שתלויה עליו הוא קו ישר, שחותך את הציר האנכי ב-$12\,\text{cm}$. האם האורך של הקפיץ ביחס ישר למסה?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. האורך הוא פונקציה קווית של המסה, אבל לא יחס ישר.'
      - text: כן
        feedback: 'בדקו: בלי משקולת האורך $12\,\text{cm}$, לא אפס. ומסה כפולה לא נותנת אורך כפול.'
        misconception: MC-linear-means-proportional
    reasons:
      - text: 'הקו לא עובר בראשית: ב-$M = 0$ האורך $12\,\text{cm}$.'
        correct: true
        feedback: 'נכון. יחס ישר הוא קו ישר שעובר בראשית. מה שכן ביחס ישר למסה הוא ההתארכות, $\ell - 12\,\text{cm}$.'
      - text: 'הגרף הוא קו ישר, ולכן זה יחס ישר.'
        feedback: 'כל יחס ישר הוא קו ישר, אבל לא כל קו ישר הוא יחס ישר. צריך גם שהקו יעבור בראשית.'
        misconception: MC-linear-means-proportional
      - text: 'השיפוע של הקו גדול מ-1.'
        feedback: 'גודל השיפוע לא קובע אם זה יחס ישר. מה שקובע הוא אם הקו עובר בראשית.'

  - id: Q-0.3-rank-slopes
    type: rank
    objectives: [OBJ-0.3-2]
    level: mid
    prompt: >-
      שלוש מכוניות נוסעות במהירות קבועה. לכל אחת משרטטים גרף של המרחק מול הזמן, במטרים ובשניות.
      דרגו את השיפועים של שלושת הגרפים, מהגדול לקטן:
    items:
      - id: a
        label: 'מכונית א מתרחקת 30 מטרים ב-3 שניות'
      - id: b
        label: 'מכונית ב מתרחקת קילומטר אחד ב-2 דקות'
      - id: c
        label: 'מכונית ג נוסעת ב-$54\,\text{km/h}$'
    order: [c, a, b]
    correctFeedback: 'נכון. בשיפוע במטרים לשנייה: ג $54/3.6 = 15\,\text{m/s}$, א $30/3 = 10\,\text{m/s}$, ב $1000/120 \approx 8.3\,\text{m/s}$.'
    wrongFeedback: 'כדי להשוות שיפועים צריך אותן יחידות. המירו כל אחד למטרים לשנייה: קילומטר הוא 1000 מטרים, ודקה היא 60 שניות.'

  # ---------------------------------------------------------------- OBJ-0.3-3 right-triangle trig
  - id: Q-0.3-ladder-height
    type: numeric
    objectives: [OBJ-0.3-3]
    prompt: >-
      סולם באורך $5\,\text{m}$ נשען על קיר אנכי, בזווית של $60^\circ$ עם הרצפה. לאיזה גובה על הקיר מגיע הקצה העליון של הסולם?
    answer: 4.33
    unit: m
    tolerance: 0.02
    correctFeedback: 'נכון: הגובה הוא הניצב שמול הזווית, ולכן $h = 5\,\text{m}\cdot\sin 60^\circ \approx 5 \cdot 0.866 \approx 4.33\,\text{m}$.'
    wrongFeedback: 'הסולם הוא היתר. הגובה על הקיר הוא הניצב שמול הזווית שליד הרצפה: איזה יחס קושר ניצב שמול עם היתר?'
    commonWrong:
      - value: 2.5
        feedback: 'זה $5\cos 60^\circ$: המרחק של רגלי הסולם מהקיר, הניצב שליד הזווית. הגובה הוא הניצב שמולה, ולכן $\sin$.'
      - value: -1.52
        feedback: 'המחשבון שלכם במצב רדיאנים (RAD): הוא חישב את הסינוס של 60 רדיאנים. העבירו אותו למעלות (DEG). גובה שלילי הוא סימן אזהרה.'
      - value: 8.66
        feedback: 'זה $5\tan 60^\circ$. הטנגנס הוא מול חלקי ליד, ולא קושר את הגובה עם הסולם, שהוא היתר. ובדקו: גובה גדול מאורך הסולם בלתי אפשרי.'
      - value: 5.77
        feedback: 'חילקתם ב-$\sin 60^\circ$ במקום להכפיל. ניצב לא יכול להיות ארוך מהיתר, כלומר מהסולם.'

  - id: Q-0.3-ramp-angle
    type: numeric
    objectives: [OBJ-0.3-3]
    level: mid
    prompt: >-
      רמפה עולה לגובה $1.5\,\text{m}$ לאורך מרחק אופקי של $4\,\text{m}$. מה הזווית שלה עם הקרקע, במעלות?
    answer: 20.56
    unit: °
    tolerance: 0.02
    correctFeedback: 'נכון: $\tan\theta = 1.5/4 = 0.375$, ולכן $\theta = \tan^{-1}(0.375) \approx 20.6^\circ$.'
    wrongFeedback: 'הגובה הוא הניצב שמול הזווית, והמרחק האופקי הוא הניצב שלידה. איזה יחס קושר את שני הניצבים?'
    commonWrong:
      - value: 22.02
        feedback: 'השתמשתם ב-$\sin^{-1}(1.5/4)$. אבל $4\,\text{m}$ הוא הניצב האופקי, לא היתר. מול חלקי ליד הוא טנגנס.'
      - value: 69.44
        feedback: 'זה $\tan^{-1}(4/1.5)$: הזווית שבראש הרמפה, ליד הקטע האנכי. הזווית עם הקרקע היא מול חלקי ליד שלה: $\tan^{-1}(1.5/4)$.'
      - value: 0.359
        feedback: 'זו התשובה ברדיאנים: המחשבון במצב RAD. העבירו אותו למעלות (DEG).'

  - id: Q-0.3-sin-double
    type: mc
    objectives: [OBJ-0.3-3]
    qualitative: true
    prompt: >-
      נתון ש-$\sin 30^\circ = 0.5$. מה אפשר לומר על $\sin 60^\circ$?
    choices:
      - text: 'הוא בערך 0.87: גדול מ-0.5, אבל לא פי 2.'
        correct: true
        feedback: 'נכון. הסינוס הוא יחס בין צלעות, והוא לא ביחס ישר לזווית. במשולש עם זווית של $60^\circ$ הניצב שמול הזווית הוא כ-87% מהיתר.'
      - text: 'הוא 1, כי הזווית גדלה פי 2.'
        feedback: 'אם $\sin 60^\circ = 1$, הניצב שמול הזווית היה שווה ליתר, ואין משולש כזה. הסינוס לא גדל ביחס ישר לזווית. בדקו באיור 0.3ב.'
        misconception: MC-sin-of-sum
      - text: 'הוא $0.5 + 0.5 = 1$, כי $60^\circ = 30^\circ + 30^\circ$.'
