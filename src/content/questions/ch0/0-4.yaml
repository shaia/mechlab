    wrongFeedback: 'העלו את החוק בריבוע, והשוו ל-$y = (\ldots)\cdot x$ עם $y = T^2$ ו-$x = \ell$. השיפוע הוא מה שמכפיל את $\ell$.'
    commonWrong:
