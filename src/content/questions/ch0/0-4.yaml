# Chapter 0 question bank, lesson 0.4 (graphs and linearization).
# Numbers recomputed with src/physics/lab.ts (DATASETS.spring/fall, fitLine) and constants.ts (G).
# The spring line of figure 0.4א: L = 0.119 m + 0.0202 m/N · F (fitLine on DATASETS.spring).

chapter: 0
questions:
  # ---------------------------------------------------------------- OBJ-0.4-1: plot and read a graph
  - id: Q-0.4-axis-choice
    type: mc
    objectives: [OBJ-0.4-1]
    qualitative: true
    prompt: >-
      בניסוי משחררים כדור ממנוחה בראש מדרון. התלמידים קבעו מראש כמה מרחקים $d$ במורד המדרון, ומדדו בכל פעם את הזמן $t$ שהכדור עובר אותם.
      בשאלה כתוב: "שרטטו גרף של $d$ כפונקציה של $t^2$". מה שמים על כל ציר?
    choices:
      - text: 'את $d$ על הציר האנכי, ואת $t^2$ על הציר האופקי.'
        correct: true
        feedback: 'נכון. "גרף של $d$ כפונקציה של $t^2$" (או "$d$ מול $t^2$"): הגודל הראשון על הציר האנכי, והשני על האופקי. כשהשאלה קובעת את הגרף, עושים מה שהיא מבקשת.'
      - text: 'את $d$ על הציר האופקי, כי את המרחקים התלמידים קבעו מראש.'
        feedback: 'זה כלל ברירת המחדל, כשאף אחד לא קבע את הגרף. כאן השאלה קובעת: $d$ כפונקציה של $t^2$, כלומר $d$ על הציר האנכי.'
      - text: 'את $t^2$ על הציר האנכי, כי את הזמנים מדדו.'
        feedback: 'גם זה כלל ברירת המחדל, שמתאים רק כשהשאלה לא קובעת את הגרף. "$d$ כפונקציה של $t^2$" שם את $d$ על הציר האנכי.'
      - text: לא משנה, כי בשני הסידורים הגרף יוצא קו ישר.
        feedback: 'נכון ששני הגרפים ישרים, אבל השיפועים שלהם שונים: השיפוע של הגרף ההפוך הוא 1 חלקי השיפוע של $d$ מול $t^2$. מי שמשרטט גרף אחר מזה שהשאלה ביקשה, ומשתמש בשיפוע שלו בנוסחה של הגרף המבוקש, מקבל תוצאה שגויה.'

  - id: Q-0.4-scale
    type: mc
    objectives: [OBJ-0.4-1]
    qualitative: true
    prompt: >-
      על דף משבצות שרוחבו $10\,\text{cm}$ צריך לשרטט ציר אופקי של כוח, מ-$0$ עד $4.6\,\text{N}$. איזה קנה מידה הכי מתאים?
    choices:
      - text: '$1\,\text{cm} = 0.5\,\text{N}$'
        correct: true
        feedback: 'נכון. הציר מגיע ל-$5\,\text{N}$ ב-$10\,\text{cm}$: הנקודות ממלאות כמעט את כל הדף, ו-0.5 (כלומר 5 כפול חזקה של 10) נוח לקריאה בין הקווים.'
      - text: '$1\,\text{cm} = 0.46\,\text{N}$'
        feedback: 'זה ממלא את הדף בדיוק, אבל קשה מאוד לקרוא ערכים: איפה נמצא $1\,\text{N}$? בוחרים משבצת של 1, 2 או 5 כפול חזקה של 10.'
      - text: '$1\,\text{cm} = 2\,\text{N}$'
        feedback: 'זה קל לקריאה, אבל כל המדידות נדחסות לפחות משלושה סנטימטרים, וקשה להעביר בהן קו ולקרוא ממנו.'
      - text: '$1\,\text{cm} = 0.3\,\text{N}$'
        feedback: 'בקנה המידה הזה הציר צריך כ-$15\,\text{cm}$, והדף רוחבו רק $10\,\text{cm}$. וגם 0.3 לא נוח לקריאה.'

  - id: Q-0.4-read-value
    type: numeric
    objectives: [OBJ-0.4-1]
    prompt: >-
      קו המגמה של הקפיץ באיור 0.4א הוא $L = 0.119\,\text{m} + 0.0202\,\text{m/N}\cdot F$. איזה כוח $F$ ימתח את הקפיץ לאורך $L = 0.170\,\text{m}$?
    answer: 2.5
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $F = \dfrac{0.170 - 0.119}{0.0202} = \dfrac{0.051\,\text{m}}{0.0202\,\text{m/N}} \approx 2.5\,\text{N}$. באיור: קו אופקי מ-$0.170\,\text{m}$ עד קו המגמה, ומשם למטה לציר.'
    wrongFeedback: 'מבודדים את $F$: קודם מורידים את האורך בלי משקולות, $0.119\,\text{m}$, ואז מחלקים בשיפוע.'
    commonWrong:
      - value: 8.4
        feedback: 'חילקתם את כל האורך בשיפוע, $0.170/0.0202$, כאילו הקו עובר בראשית. אבל ב-$F = 0$ האורך הוא $0.119\,\text{m}$: רק ההתארכות, $0.051\,\text{m}$, ביחס ישר לכוח.'
        misconception: MC-linear-means-proportional
      - value: 0.00103
        feedback: 'הכפלתם את ההתארכות בשיפוע במקום לחלק בו. בדקו ביחידות: $\text{m}$ חלקי $\text{m/N}$ נותן $\text{N}$.'

  # ---------------------------------------------------------------- OBJ-0.4-2: best-fit line and slope
  - id: Q-0.4-best-line
    type: mc
    objectives: [OBJ-0.4-2]
    qualitative: true
    prompt: >-
      בגרף יש שש נקודות מדידה, שמתפזרות מעט סביב קו ישר. איזה קו הוא קו המגמה?
    choices:
      - text: קו ישר אחד שעובר קרוב ככל האפשר לכל הנקודות, חלקן מעליו וחלקן מתחתיו.
        correct: true
        feedback: נכון. הוא משתמש בכל המדידות יחד, והסטיות המקריות למעלה ולמטה מקזזות זו את זו.
      - text: קו שבור שמחבר את כל הנקודות לפי הסדר.
        feedback: 'קו שבור עוקב אחרי כל סטייה מקרית, כלומר אחרי אי-הוודאות של המדידות ולא אחרי החוק. החוק כאן הוא קו ישר אחד.'
        misconception: MC-line-through-every-point
      - text: קו ישר שעובר דרך הנקודה הראשונה ודרך האחרונה.
        feedback: 'גם לנקודה הראשונה ולאחרונה יש אי-ודאות. קו דרכן מתעלם מארבע המדידות האחרות, וכל סטייה של אחת משתיהן עוברת לשיפוע.'
        misconception: MC-line-through-every-point
      - text: קו ישר שחייב לעבור בראשית, גם אם הנקודות לא מצביעות עליה.
        feedback: 'קו עובר בראשית רק כשהחוק אומר ש-$y = 0$ כאשר $x = 0$. הקפיץ באיור 0.4א, למשל, ארוך $0.119\,\text{m}$ גם בלי כוח.'
        misconception: MC-linear-means-proportional

  - id: Q-0.4-slope-points
    type: twotier
    objectives: [OBJ-0.4-2]
    qualitative: true
    prompt: >-
      העברתם קו מגמה בין נקודות המדידה. מאילו נקודות כדאי לחשב את השיפוע שלו?
    choices:
      - text: משתי נקודות על הקו, רחוקות זו מזו.
        correct: true
        feedback: נכון. נקודות על הקו, ולא נקודות מדידה, ורחוקות זו מזו.
      - text: משתי מדידות מהטבלה, הראשונה והאחרונה.
        feedback: 'כך מתעלמים מכל שאר המדידות, וכל סטייה בשתי האלה עוברת לשיפוע. קו המגמה כבר שקלל את כולן.'
        misconception: MC-line-through-every-point
      - text: משתי נקודות על הקו, קרובות זו לזו.
        feedback: 'בנקודות קרובות $\Delta x$ קטן, ושגיאה קטנה בקריאת הגרף משנה את השיפוע הרבה. בחרו נקודות רחוקות.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: הקו שקלל את כל המדידות, ובנקודות רחוקות שגיאה קטנה בקריאת הגרף כמעט לא משנה את השיפוע.
        correct: true
        feedback: בדיוק. ובבגרות מסמנים על הגרף את שתי הנקודות שבחרתם, כדי שאפשר יהיה לבדוק את החישוב.
      - text: המדידות הן הנתונים האמיתיים, והקו הוא רק קישוט.
        feedback: 'לכל מדידה יש אי-ודאות. הקו הוא הדרך לשקלל את כולן, ולכן השיפוע שלו טוב יותר מזה של כל זוג מדידות.'
        misconception: MC-line-through-every-point
      - text: כך החישוב קצר יותר.
        feedback: החישוב באותו אורך בכל מקרה. הסיבה היא הדיוק.

  - id: Q-0.4-slope-units
    type: mc
    objectives: [OBJ-0.4-2]
    qualitative: true
    prompt: >-
      בגרף של האורך $L$ של קפיץ (ב-$\text{m}$) מול הכוח $F$ שמותח אותו (ב-$\text{N}$), מה היחידות של השיפוע?
    choices:
      - text: '$\text{m/N}$'
        correct: true
        feedback: 'נכון. יחידות $y$ חלקי יחידות $x$: מטרים לכל ניוטון, כמה הקפיץ מתארך על כל ניוטון נוסף.'
      - text: לשיפוע אין יחידות. הוא הזווית בין הקו לציר.
        feedback: 'הזווית שבציור תלויה בקנה המידה שבחרתם לצירים, והשיפוע לא. השיפוע הוא $\Delta y/\Delta x$, עם היחידות של שני הצירים.'
        misconception: MC-slope-is-angle
      - text: '$\text{m}$'
        feedback: 'אלה היחידות של הציר האנכי בלבד. השיפוע הוא $\Delta y/\Delta x$, ולכן מחלקים גם ביחידות של $x$.'
      - text: '$\text{N/m}$'
        feedback: 'הפכתם את השבר. השיפוע הוא יחידות $y$ חלקי יחידות $x$.'

  - id: Q-0.4-slope-calc
    type: numeric
    objectives: [OBJ-0.4-2]
    prompt: >-
      קו המגמה בגרף של מקום (ב-$\text{m}$) מול זמן (ב-$\text{s}$) עובר בנקודות $(2\,\text{s},\ 3\,\text{m})$ ו-$(6\,\text{s},\ 11\,\text{m})$. מה השיפוע שלו?
    answer: 2
    unit: m/s
    tolerance: 0.02
    correctFeedback: 'נכון: $\dfrac{\Delta y}{\Delta x} = \dfrac{11\,\text{m} - 3\,\text{m}}{6\,\text{s} - 2\,\text{s}} = \dfrac{8\,\text{m}}{4\,\text{s}} = 2\,\text{m/s}$.'
    wrongFeedback: 'השיפוע הוא השינוי בציר האנכי חלקי השינוי בציר האופקי, בין שתי הנקודות.'
    commonWrong:
      - value: 0.5
        feedback: 'הפכתם את השבר, $\Delta x/\Delta y$. השיפוע הוא $\Delta y/\Delta x$.'
      - value: 1.83
        feedback: 'חילקתם $y$ ב-$x$ של נקודה אחת ($11/6$). זה שווה לשיפוע רק כשהקו עובר בראשית, וכאן הוא לא: ב-$t = 0$ הקו נמצא ב-$-1\,\text{m}$.'
        misconception: MC-linear-means-proportional
      - value: 1.5
        feedback: 'חילקתם $y$ ב-$x$ של נקודה אחת ($3/2$). זה שווה לשיפוע רק כשהקו עובר בראשית, וכאן הוא לא.'
        misconception: MC-linear-means-proportional

  - id: Q-0.4-outlier
    type: twotier
    objectives: [OBJ-0.4-2]
    qualitative: true
    level: mid
    prompt: >-
      בגרף של מקום מול זמן, חמש מדידות סוטות מקו ישר בסנטימטר לכל היותר, ומדידה אחת רחוקה ממנו $20\,\text{cm}$. אי-הוודאות בקריאת המקום כסנטימטר. מה עושים?
    choices:
      - text: 'חוזרים על המדידה החשודה. אם אי אפשר, מסמנים אותה, משאירים אותה מחוץ לקו המגמה, וכותבים שעשינו זאת.'
        correct: true
        feedback: נכון. סטייה פי 20 מאי-הוודאות היא כנראה טעות בקריאה או ברישום, ולא פיזור רגיל.
      - text: מעבירים קו שבור, כך שגם היא תהיה על הקו.
        feedback: 'הקו מתאר את החוק, לא כל מדידה. קו שבור דרך מדידה שגויה מכניס את הטעות לתוך הגרף.'
        misconception: MC-line-through-every-point
      - text: מוחקים כל מדידה שלא יושבת בדיוק על הקו.
        feedback: 'סטייה בגודל אי-הוודאות היא חלק רגיל מהמדידה, והיא נשארת. מוציאים רק מדידה שרחוקה הרבה יותר מאי-הוודאות.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: הפיזור הרגיל של המדידות הוא בגודל אי-הוודאות. סטייה גדולה ממנו בהרבה לא נובעת מפיזור.
        correct: true
        feedback: 'בדיוק. משווים את הסטייה לאי-הוודאות: סנטימטר הוא פיזור, עשרים סנטימטרים הם טעות.'
      - text: מדידה שמקלקלת את הגרף תמיד שגויה.
        feedback: 'לא תמיד: לפעמים מדידה חריגה מגלה שהחוק שונה ממה שחשבנו. לכן חוזרים עליה, ולא רק מוחקים, ותמיד מדווחים.'
      - text: קו המגמה חייב לעבור דרך כל המדידות.
        feedback: 'קו המגמה עובר בין המדידות, לא דרכן. לכל מדידה יש אי-ודאות.'
        misconception: MC-line-through-every-point

  # ---------------------------------------------------------------- OBJ-0.4-3: linearization
  - id: Q-0.4-choose-sqrt
    type: mc
    objectives: [OBJ-0.4-3]
    prompt: >-
      מפילים כדור ממנוחה מגבהים שונים $h$, ומודדים בכל פעם את זמן הנפילה $t$. לפי המכניקה $t = \sqrt{2h/g}$.
      על הציר האנכי שמים את $t$ עצמו. מה לשים על הציר האופקי, כדי שהנקודות יסתדרו על קו ישר?
    choices:
      - text: '$\sqrt{h}$'
        correct: true
        feedback: 'נכון. מפרידים את השורש: $t = \sqrt{2/g}\cdot\sqrt{h}$. זו הצורה $y = (\ldots)\cdot x$ עם $y = t$ ו-$x = \sqrt h$: קו ישר דרך הראשית, עם שיפוע $\sqrt{2/g}$.'
      - text: '$h^2$'
        feedback: 'בשיעור הריבוע הופיע כי שם $d$ גדל כמו הריבוע של $t$. כאן ההפך: $t$ גדל כמו השורש של $h$ (גובה פי 4, זמן פי 2). מול $h^2$ הנקודות מתעקמות ומשתטחות עוד יותר. שמים על הציר את מה שמופיע בחוק.'
        misconception: MC-square-law-doubles
      - text: '$h$'
        feedback: 'מול $h$ הנקודות על עקומה שעולה ומשתטחת, כי $t$ תלוי בשורש של $h$. ועל עקומה אין שיפוע אחד שאפשר לקרוא ממנו את $g$.'
        misconception: MC-curve-gives-constant
      - text: '$1/h$'
        feedback: 'מול $1/h$ הגרף יורד, אבל $t$ גדל עם הגובה. שמים על הציר את מה שמופיע בחוק: $\sqrt h$.'

  - id: Q-0.4-curve-constant
    type: twotier
    objectives: [OBJ-0.4-3]
    qualitative: true
    prompt: >-
      בגרף של $d$ מול $t$ של כדור נופל, הנקודות מתעקמות. תלמיד מחשב את השיפוע בין הנקודה הראשונה לאחרונה, ואומר שזה "הקבוע של הנפילה". האם זו דרך טובה?
    choices:
      - text: לא. קודם מיישרים את הגרף, ורק אז קוראים קבוע מהשיפוע.
        correct: true
        feedback: 'נכון. מול $t^2$ הנקודות על קו ישר, והשיפוע שלו, $\tfrac12 g$, אותו שיפוע בכל מקום.'
      - text: כן. השיפוע בין הקצוות הוא הממוצע, ולכן הוא הקבוע.
        feedback: 'בעקומה, השיפוע בין שתי נקודות תלוי באילו נקודות בחרתם. עם עוד מדידה בהתחלה או בסוף הוא היה יוצא אחר, ולכן הוא לא קבוע של החוק.'
        misconception: MC-curve-gives-constant
      - text: כן, אם מעבירים קו ישר דרך כל הנקודות ולוקחים את השיפוע שלו.
        feedback: 'קו ישר דרך נקודות מעוקלות מחטיא אותן, ובאיור 0.4ב הוא אפילו חותך את הציר ב-$-0.51\,\text{m}$, אף שבזמן אפס הכדור לא נפל. גם השיפוע שלו לא קבוע של החוק.'
        misconception: MC-curve-gives-constant
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: על עקומה השיפוע משתנה ממקום למקום, ולכן אין לה שיפוע אחד.
        correct: true
        feedback: 'בדיוק. רק לקו ישר יש שיפוע אחד. לכן ליניאריזציה באה לפני קריאת השיפוע.'
      - text: לעקומה אין שיפוע בכלל, ולכן אין בה מידע.
        feedback: 'בעקומה יש מידע רב: היא אומרת שהקשר אינו יחס ישר. אחרי ליניאריזציה אותן מדידות נותנות קבוע.'
      - text: השיפוע בין הקצוות שגוי רק בגלל אי-הוודאות במדידה.
        feedback: 'גם מדידות מושלמות על עקומה היו נותנות שיפועים שונים בין זוגות שונים. הבעיה היא הצורה של הגרף, לא הפיזור.'
        misconception: MC-curve-gives-constant

  - id: Q-0.4-pendulum-axis
    type: mc
    objectives: [OBJ-0.4-3]
    qualitative: true
    prompt: >-
      זמן המחזור של מטוטלת הוא $T = 2\pi\sqrt{\ell/g}$, כאשר $\ell$ האורך שלה. מודדים את $T$ באורכים שונים. איזה גרף יהיה קו ישר דרך הראשית, שהכי פשוט למצוא ממנו את $g$?
    choices:
      - text: '$T^2$ מול $\ell$'
        correct: true
        feedback: 'נכון. $T^2 = \dfrac{4\pi^2}{g}\cdot\ell$: קו ישר דרך הראשית עם שיפוע $4\pi^2/g$, ולכן $g$ הוא $4\pi^2$ חלקי השיפוע.'
      - text: '$T$ מול $\ell$'
        feedback: '$T$ גדל כמו השורש של $\ell$, ולכן מול $\ell$ מתקבלת עקומה שמשתטחת, בלי שיפוע אחד.'
        misconception: MC-curve-gives-constant
      - text: '$T$ מול $\ell^2$'
        feedback: 'מול $\ell^2$ העקומה עוד חזקה יותר. כדי ש-$T$ לבדו יהיה קו ישר, צריך על הציר את $\sqrt{\ell}$, לא את $\ell^2$.'
      - text: '$T^2$ מול $\ell^2$'
        feedback: 'אחרי שמעלים בריבוע, $T^2$ ביחס ישר ל-$\ell$ עצמו, לא ל-$\ell^2$. מול $\ell^2$ מתקבלת עקומה.'
        misconception: MC-square-law-doubles

  - id: Q-0.4-g-reversed
    type: numeric
    objectives: [OBJ-0.4-3]
    prompt: >-
      בניסוי נפילה ממנוחה, $d = \tfrac12 g\,t^2$, הבגרות ביקשה גרף של $t^2$ (ב-$\text{s}^2$) כפונקציה של $d$ (ב-$\text{m}$), כלומר הצירים הפוכים מאשר באיור 0.4ב. השיפוע של קו המגמה הוא $0.204\,\text{s}^2/\text{m}$. מה ערך $g$ לפי הניסוי?
    answer: 9.8
    unit: m/s²
    tolerance: 0.02
    correctFeedback: 'נכון. מבודדים את $t^2$: $t^2 = \left(\tfrac{2}{g}\right)\cdot d$. השיפוע הוא $\tfrac{2}{g}$, ולכן $g = \dfrac{2}{0.204\,\text{s}^2/\text{m}} \approx 9.8\,\text{m/s}^2$.'
    wrongFeedback: 'כתבו את החוק בצורה $y = (\ldots)\cdot x$ עם $y = t^2$ ו-$x = d$: בודדו את $t^2$. השיפוע הוא מה שמכפיל את $d$, ומהשוויון שלו לשיפוע מבודדים את $g$.'
    commonWrong:
      - value: 0.408
        feedback: 'הכפלתם את השיפוע ב-2, כמו בגרף של $d$ מול $t^2$. אבל כאן הצירים הפוכים: השיפוע הוא $\tfrac{2}{g}$, לא $\tfrac12 g$. ובדקו את התוצאה: $g$ צריך לצאת קרוב ל-$10\,\text{m/s}^2$.'
      - value: 4.9
        feedback: 'חישבתם 1 חלקי השיפוע, ושכחתם את ה-2. השיפוע הוא $\tfrac{2}{g}$, ולכן $g$ הוא 2 חלקי השיפוע.'
      - value: 0.102
        feedback: 'חילקתם את השיפוע ב-2. בגרף הזה השיפוע הוא $\tfrac{2}{g}$, ו-$g$ הוא 2 חלקי השיפוע.'

  - id: Q-0.4-ramp-a
    type: numeric
    objectives: [OBJ-0.4-3]
    level: mid
    prompt: >-
      כדור משוחרר ממנוחה במורד מדרון, ועובר בזמן $t$ דרך $d = \tfrac12 a\,t^2$. בגרף של $d$ (ב-$\text{m}$) מול $t^2$ (ב-$\text{s}^2$), השיפוע של קו המגמה הוא $0.45\,\text{m/s}^2$. מה התאוצה $a$ של הכדור?
    answer: 0.9
    unit: m/s²
    tolerance: 0.03
    correctFeedback: 'נכון. השיפוע הוא $\tfrac12 a$, ולכן $a = 2\cdot 0.45 = 0.90\,\text{m/s}^2$.'
    wrongFeedback: 'מה מכפיל את $t^2$ בחוק? זה השיפוע. בודדו ממנו את $a$.'
    commonWrong:
      - value: 0.45
        feedback: 'זה השיפוע. אבל השיפוע הוא רק חצי מ-$a$.'
      - value: 0.225
        feedback: 'חילקתם ב-2 במקום להכפיל. $a$ גדול מהשיפוע, לא קטן ממנו.'

