# Question bank for lesson 1.4 (relative motion). Strings may hold $inline$ TeX; they are rendered at build time.
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with src/physics/relative.ts (velocityInFrame, meetingTime, closingSpeed, positionAt).

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.4-1: one motion, two frames
  - id: Q-1.4-train-seat
    type: twotier
    objectives: [OBJ-1.4-1]
    qualitative: true
    prompt: >-
      נוסעת יושבת במקומה ברכבת שנוסעת במהירות קבועה של 20 מטרים בשנייה ביחס לרציף. האם הנוסעת נמצאת בתנועה?
    choices:
      - text: לא. היא יושבת במקומה ולא זזה, ולכן היא במנוחה.
        feedback: >-
          ביחס לרכבת זה נכון, אבל רק ביחס לרכבת. מי שעומד על הרציף רואה אותה עוברת 20 מטרים בכל שנייה.
        misconception: MC-velocity-absolute
      - text: כן. ביחס לרציף היא נעה, והמנוחה ברכבת רק נדמית.
        feedback: >-
          המהירות שלה ביחס לרציף באמת 20 מטרים בשנייה, אבל גם המנוחה ביחס לרכבת אינה אשליה: המקום שלה ברכבת לא
          משתנה. לאף אחד משני התיאורים אין עדיפות.
        misconception: MC-velocity-absolute
      - text: תלויה במערכת הייחוס. ביחס לרכבת לא, וביחס לרציף כן.
        correct: true
        feedback: נכון. "בתנועה" הוא משפט שלם רק כשאומרים ביחס למה.
      - text: לא. כשהרכבת נוסעת במהירות קבועה, כל מי שבתוכה במנוחה.
        feedback: >-
          המהירות הקבועה של הרכבת לא הופכת את הנוסעת לעומדת ביחס לכל צופה. מי שעומד על הרציף רואה את המקום שלה משתנה
          ב-20 מטרים בכל שנייה. היא במנוחה רק ביחס לרכבת.
        misconception: MC-velocity-absolute
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          מהירות היא השינוי במקום בכל שנייה, ומקום נמדד תמיד ביחס לראשית של מערכת ייחוס מסוימת.
        correct: true
        feedback: >-
          בדיוק. ביחס לראשית ברכבת המקום שלה לא משתנה, וביחס לראשית על הרציף הוא גדל ב-20 מטרים בכל שנייה.
      - text: הקרקע היא מערכת הייחוס האמיתית, ולכן קובעת המהירות ביחס לקרקע.
        feedback: >-
          אין מערכת ייחוס "אמיתית". גם הקרקע נעה, למשל ביחס לשמש. בוחרים את מערכת הייחוס שנוחה לשאלה.
        misconception: MC-velocity-absolute
      - text: מי שיושב ולא מתאמץ נמצא במנוחה, בלי קשר למה שקורה סביבו.
        feedback: >-
          תנועה לא דורשת מאמץ: הנוסעת לא מתאמצת, ובכל זאת היא עוברת מאות מטרים ביחס לרציף. השאלה היא רק אם
          המקום שלה משתנה, וביחס למה.
    hints:
      - 'חשבו על שני צופים: נוסע שיושב מולה, ואדם שעומד על הרציף. מה כל אחד מהם רואה?'

  - id: Q-1.4-highway-neighbor
    type: mc
    objectives: [OBJ-1.4-1]
    qualitative: true
    prompt: >-
      אתם נוסעים בכביש מהיר במהירות 90 קמ״ש. בנתיב שלידכם נוסעת מכונית אחרת, באותו כיוון ובאותה מהירות ביחס
      לכביש. מה המהירות שלה ביחס אליכם?
    choices:
      - text: אפס. מהמכונית שלכם היא נראית עומדת.
        correct: true
        feedback: >-
          נכון. המהירות היחסית היא $90 - 90 = 0$, ולכן המרחק ביניכם לא משתנה.
      - text: 90 קמ״ש, כי זו המהירות שלה.
        feedback: >-
          90 קמ״ש היא המהירות שלה ביחס לכביש. השאלה היא מה אתם רואים מהמכונית שלכם, ושם היא לא מתרחקת ולא
          מתקרבת.
        misconception: MC-velocity-absolute
      - text: 180 קמ״ש.
        feedback: >-
          מחברים גדלים רק כשהגופים נעים בכיוונים מנוגדים. כאן הכיוונים זהים, ולכן מחסירים: $90 - 90 = 0$.
        misconception: MC-relative-speeds-add

  - id: Q-1.4-tree-backward
    type: vector
    objectives: [OBJ-1.4-1]
    qualitative: true
    prompt: >-
      מכונית נוסעת מזרחה במהירות קבועה. בצד הכביש עומד עץ. מה כיוון המהירות של העץ ביחס לנהג?
    answer: w
    correctFeedback: >-
      נכון. המהירות של העץ ביחס לנהג היא $0 - v$, כלומר באותו גודל כמו מהירות המכונית, אבל לכיוון ההפוך: מערבה.
    wrong:
      - dir: zero
        feedback: >-
          ביחס לקרקע העץ עומד. אבל השאלה היא מה רואה הנהג, ומהמכונית העצים חולפים אחורה.
        misconception: MC-velocity-absolute
      - dir: e
        feedback: >-
          מזרחה נוסעת המכונית. מהמכונית, כל מה שעומד על הקרקע נע לכיוון ההפוך לנסיעה.
        misconception: MC-relative-order
    wrongFeedback: חשבו מה רואים מחלון של מכונית נוסעת.

  - id: Q-1.4-same-time
    type: mc
    objectives: [OBJ-1.4-1, OBJ-1.4-3]
    qualitative: true
    prompt: >-
      שני רצים נמצאים 24 מטרים זה מזה ורצים זה לקראת זה, כל אחד 3 מטרים בשנייה ביחס לקרקע. דנה חישבה במערכת של
      הקרקע שהם נפגשים אחרי 4 שניות. יואב פותר את אותה בעיה במערכת הייחוס של אחד הרצים. מה יקבל יואב?
    choices:
      - text: גם הוא 4 שניות.
        correct: true
        feedback: >-
          נכון. במערכת של הרץ, הרץ השני מתקרב 6 מטרים בשנייה, והמרחק עדיין 24 מטרים: $24/6 = 4$. המרחק בין
          הגופים ורגע הפגישה זהים בכל מערכת ייחוס.
      - text: פחות מ-4 שניות, כי במערכת של הרץ השני מתקרב מהר יותר, 6 מטרים בשנייה במקום 3.
        feedback: >-
          המהירות באמת גדלה ל-6, אבל עכשיו רק רץ אחד זז ולא שניים. 24 מטרים ב-6 מטרים בשנייה הם עדיין 4 שניות.
          רגע הפגישה הוא אירוע אחד, וכל הצופים מסכימים עליו.
      - text: אי אפשר לפתור במערכת של רץ, כי הוא זז. אפשר לפתור רק במערכת של הקרקע.
        feedback: >-
          כל מערכת ייחוס שנעה במהירות קבועה מתאימה. במערכת של הרץ הבעיה אפילו פשוטה יותר: רק גוף אחד נע.
        misconception: MC-velocity-absolute

  # ---------------------------------------------------------------- OBJ-1.4-2: v_AB = v_A − v_B with signs
  - id: Q-1.4-vab-opposite
    type: numeric
    objectives: [OBJ-1.4-2]
    prompt: >-
      הכיוון החיובי הוא מזרחה. מכונית A נוסעת מזרחה במהירות $12\,\text{m/s}$, ומכונית B נוסעת מערבה במהירות
      $8\,\text{m/s}$. מה $v_{AB}$, המהירות של A ביחס ל-B? כתבו את המספר עם הסימן שלו.
    answer: 20
    unit: m/s
    correctFeedback: 'נכון: $v_{AB} = v_A - v_B = 12 - (-8) = +20\,\text{m/s}$, כלומר מזרחה.'
    wrongFeedback: 'כתבו קודם כל מהירות עם הסימן שלה: $v_A = +12$, $v_B = -8$. אחר כך $v_{AB} = v_A - v_B$.'
    commonWrong:
      - value: 4
        feedback: 'הצבתם גדלים בלי סימנים, $12 - 8$. B נוסעת מערבה, ולכן $v_B = -8$, ו-$12 - (-8) = 20$.'
        misconception: MC-relative-speeds-add
      - value: -20
        feedback: 'זו $v_{BA}$, המהירות של B ביחס ל-A. האות הראשונה היא הגוף שמסתכלים עליו: $v_{AB} = v_A - v_B$.'
        misconception: MC-relative-order
    hints:
      - 'מה הסימן של מהירות B, שנוסעת מערבה?'

  - id: Q-1.4-vab-same
    type: numeric
    objectives: [OBJ-1.4-2]
    level: mid
    prompt: >-
      הכיוון החיובי הוא צפונה. משאית A נוסעת צפונה במהירות $10\,\text{m/s}$, ואופנוע B נוסע צפונה במהירות
      $25\,\text{m/s}$. מה $v_{AB}$? כתבו את המספר עם הסימן שלו.
    answer: -15
    unit: m/s
    correctFeedback: >-
      נכון: $v_{AB} = 10 - 25 = -15\,\text{m/s}$. מהאופנוע רואים את המשאית נעה דרומה, אחורה, אף שביחס לכביש היא נוסעת
      צפונה.
    wrongFeedback: '$v_{AB} = v_A - v_B$, עם הסימנים של שתי המהירויות.'
    commonWrong:
      - value: 15
        feedback: 'חישבתם $25 - 10$, כלומר $v_{BA}$. המהירות של A ביחס ל-B היא $v_A - v_B$.'
        misconception: MC-relative-order
      - value: 35
        feedback: 'חיברתם את גודלי המהירויות. כששני הגופים נעים לאותו כיוון, הסימנים זהים, והגדלים מחסירים זה מזה.'
        misconception: MC-relative-speeds-add

  - id: Q-1.4-sign-meaning
    type: mc
    objectives: [OBJ-1.4-2]
    qualitative: true
    prompt: >-
      הכיוון החיובי הוא מזרחה. ברגע מסוים מתברר ש-$v_{AB} = -4\,\text{m/s}$. מה זה אומר?
    choices:
      - text: מ-B רואים את A נע מערבה, 4 מטרים בשנייה.
        correct: true
        feedback: >-
          נכון. $v_{AB}$ היא המהירות של A כפי שרואים אותה מ-B, והסימן השלילי אומר שהיא נגד הכיוון החיובי, כלומר
          מערבה.
      - text: A נע מערבה ביחס לקרקע.
        feedback: >-
          לא בהכרח. אם A נוסע מזרחה $6\,\text{m/s}$ ו-B נוסע מזרחה $10\,\text{m/s}$, אז $v_{AB} = -4$, ובכל זאת A
          נוסע מזרחה ביחס לקרקע. הסימן של $v_{AB}$ מספר רק מה רואים מ-B.
        misconception: MC-velocity-absolute
      - text: מ-A רואים את B נע מערבה, 4 מטרים בשנייה.
        feedback: >-
          מ-A רואים את B בכיוון ההפוך: $v_{BA} = -v_{AB} = +4\,\text{m/s}$, כלומר מזרחה.
        misconception: MC-relative-order
      - text: A מאט, ומהירותו קטנה ב-4 מטרים בשנייה.
        feedback: >-
          $v_{AB}$ משווה בין שני גופים באותו רגע. היא לא אומרת שום דבר על שינוי של מהירות A עם הזמן.

  - id: Q-1.4-escalator
    type: numeric
    objectives: [OBJ-1.4-2]
    level: mid
    prompt: >-
      מדרגות נעות באורך $12\,\text{m}$ עולות במהירות $0.5\,\text{m/s}$. ילד יורד עליהן, נגד כיוון התנועה שלהן,
      במהירות $1.3\,\text{m/s}$ ביחס למדרגות. כמה זמן לוקח לו לרדת מלמעלה עד למטה?
    answer: 15
    unit: s
    correctFeedback: >-
      נכון. עם כיוון חיובי למעלה: מהירות הילד ביחס לקרקע $-1.3 + 0.5 = -0.8\,\text{m/s}$, ולכן
      $t = 12/0.8 = 15\,\text{s}$.
    wrongFeedback: 'מהירות ביחס לקרקע = מהירות ביחס למדרגות + מהירות המדרגות, כל אחת עם הסימן שלה.'
    commonWrong:
      - value: 6.67
        feedback: 'חיברתם את גודלי המהירויות, $1.3 + 0.5$. המדרגות עולות והילד יורד, ולכן הן מאטות אותו: $-1.3 + 0.5 = -0.8$.'
        misconception: MC-relative-speeds-add
      - value: 9.23
        feedback: 'השתמשתם רק במהירות שלו ביחס למדרגות. אבל המדרגות זזות מתחתיו, וצריך את מהירותו ביחס לקרקע.'
        misconception: MC-velocity-absolute
    hints:
      - 'קבעו כיוון חיובי, ורשמו את שתי המהירויות עם סימנים.'

  - id: Q-1.4-rank
    type: rank
    objectives: [OBJ-1.4-2]
    level: mid
    prompt: >-
      בכל זוג, הכיוון החיובי הוא ימינה, והמהירויות נמדדות ביחס לקרקע. דרגו את הזוגות לפי גודל המהירות היחסית
      $|v_{AB}|$, מהגדול לקטן.
    items:
      - { id: P1, label: '$v_A = +5$, $v_B = +5$ (מטרים לשנייה)' }
      - { id: P2, label: '$v_A = +5$, $v_B = -3$' }
      - { id: P3, label: '$v_A = +5$, $v_B = +2$' }
      - { id: P4, label: '$v_A = -1$, $v_B = +6$' }
    order: [P2, P4, P3, P1]
    correctFeedback: >-
      נכון: $|v_{AB}|$ שווה 8, 7, 3 ו-0. בזוגות שנעים בכיוונים מנוגדים (2 ו-4) הגדלים מתחברים, ובזוגות שנעים לאותו
      כיוון (3 ו-1) הם מחסירים.
    wrongFeedback: 'חשבו $v_A - v_B$ עם הסימנים בכל זוג, ורק בסוף קחו את הגודל.'

  # ---------------------------------------------------------------- OBJ-1.4-3: closing and overtaking
  - id: Q-1.4-meet-time
    type: numeric
    objectives: [OBJ-1.4-3]
    prompt: >-
      שני רוכבי אופניים נמצאים $300\,\text{m}$ זה מזה ורוכבים זה לקראת זה על דרך ישרה. אחד רוכב $6\,\text{m/s}$
      והשני $4\,\text{m/s}$, ביחס לדרך. אחרי כמה שניות הם נפגשים?
    answer: 30
    unit: s
    correctFeedback: >-
      נכון. נקבע את הכיוון החיובי בכיוון של הרוכב המהיר: $v_1 = +6\,\text{m/s}$ ו-$v_2 = -4\,\text{m/s}$. במערכת של
      הרוכב האיטי, הרוכב המהיר מתקרב במהירות $v_1 - v_2 = 6 - (-4) = 10\,\text{m/s}$, ולכן $t = 300/10 = 30\,\text{s}$.
    wrongFeedback: 'עברו למערכת הייחוס של אחד הרוכבים. באיזו מהירות מתקרב אליו השני?'
    commonWrong:
      - value: 150
        feedback: 'חילקתם ב-$6 - 4 = 2$. הם נעים זה לקראת זה, ולכן המהירויות מסומנות $+6$ ו-$-4$, והמהירות היחסית $10\,\text{m/s}$.'
        misconception: MC-relative-speeds-add
      - value: 50
        feedback: 'חילקתם רק במהירות של הרוכב המהיר, כאילו השני עומד. גם השני מתקרב, ולכן המרחק קטן מהר יותר.'
        misconception: MC-velocity-absolute
      - value: 75
        feedback: 'חילקתם רק במהירות של הרוכב האיטי, כאילו המהיר עומד. המרחק קטן בשתי המהירויות יחד.'
        misconception: MC-velocity-absolute
    hints:
      - 'בכמה מטרים קטן המרחק ביניהם בכל שנייה?'

  - id: Q-1.4-overtake-time
    type: numeric
    objectives: [OBJ-1.4-3]
    prompt: >-
      רץ A רץ במהירות $4\,\text{m/s}$. רץ B נמצא $50\,\text{m}$ מאחוריו ורץ באותו כיוון במהירות $6\,\text{m/s}$. אחרי
      כמה שניות B משיג את A?
    answer: 25
    unit: s
    correctFeedback: >-
      נכון. במערכת של A, B מתקרב במהירות $6 - 4 = 2\,\text{m/s}$, ולכן $t = 50/2 = 25\,\text{s}$.
    wrongFeedback: 'במערכת הייחוס של A, A עומד. באיזו מהירות B מתקרב אליו?'
    commonWrong:
      - value: 5
        feedback: 'חיברתם את המהירויות, $6 + 4$. הם רצים לאותו כיוון, ולכן B מתקרב רק בהפרש: $2\,\text{m/s}$.'
        misconception: MC-relative-speeds-add
      - value: 8.33
        feedback: 'חילקתם במהירות של B ביחס לקרקע, כאילו A עומד. אבל A ממשיך לרוץ, ו-B סוגר רק 2 מטרים בכל שנייה.'
        misconception: MC-velocity-absolute

  - id: Q-1.4-where-meet
    type: numeric
    objectives: [OBJ-1.4-3]
    level: mid
    prompt: >-
      על ציר שהכיוון החיובי שלו ימינה, גוף A מתחיל ב-$x = 0$ ונע במהירות $+5\,\text{m/s}$, וגוף B מתחיל ב-$x =
      400\,\text{m}$ ונע במהירות $-3\,\text{m/s}$. באיזה מקום, $x$, הם נפגשים?
    answer: 250
    unit: m
    correctFeedback: >-
      נכון. המהירות היחסית $5 - (-3) = 8\,\text{m/s}$, ולכן הם נפגשים אחרי $400/8 = 50\,\text{s}$, ב-$x = 0 + 5\cdot50 =
      250\,\text{m}$.
    wrongFeedback: 'מצאו קודם מתי הם נפגשים, במערכת של אחד מהם, ואחר כך את המקום, במערכת של הקרקע.'
    commonWrong:
      - value: 200
        feedback: 'זו נקודת האמצע. הפגישה באמצע רק כשגודלי המהירויות שווים. A מהיר יותר, ולכן עובר יותר מהחצי.'
      - value: 150
        feedback: 'זה המרחק ש-B עבר עד הפגישה, $3\cdot50$. המקום שלו הוא $400 - 150 = 250\,\text{m}$.'
    hints:
      - 'הזמן עד הפגישה: המרחק ההתחלתי חלקי מהירות ההתקרבות.'

