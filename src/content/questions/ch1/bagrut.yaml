# Chapter 1 Bagrut-style questions: a scenario with lettered parts (א, ב, ג…), 33 points each, as in
# paper 036361. Parts are auto-graded (mc, numeric, vector, twotier) or `open`: the student writes a solution,
# reveals the model one in Bagrut format (formula → manipulation → substitution with units → result) and ticks
# the rubric. Each question has a "קבעו ונמקו" part and a "בטאו באמצעות" part.
#
# Every number was recomputed with src/physics (makeMotion, uniform, avgAcceleration, displacement, position,
# timesAtVelocity, stoppingDistance, apex, flight, timesAtPosition from kinematics.ts; closingSpeed from
# relative.ts; add, sub, len, angle from vec.ts; accelComponents from planar.ts; G from constants.ts).
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.

chapter: 1
questions:
  # ------------------------------------------------- 1: a car closing in on a motorcycle (reaction time, braking)
  - id: Q-1-bagrut-1
    type: bagrut
    title: מכונית מתקרבת לאופנוע
    prompt: >-
      מכונית (A) נוסעת בכביש ישר במהירות קבועה של $20\,\text{m/s}$. לפניה, באותו נתיב ובאותו כיוון, נוסע אופנוע (B)
      במהירות קבועה של $12\,\text{m/s}$. ברגע $t = 0$ נהג המכונית מבחין שהמרחק בינו לבין האופנוע הוא $30\,\text{m}$.
      זמן התגובה של הנהג $1.0\,\text{s}$, ואחריו הוא בולם בתאוצה קבועה עד שהמכונית נעצרת. האופנוע ממשיך במהירות
      קבועה. הגרף מתאר את המהירות של שני כלי הרכב כתלות בזמן. הכיוון החיובי הוא כיוון הנסיעה, והתייחסו לכלי
      הרכב כאל גופים נקודתיים.
    diagramAlt: >-
      גרף מהירות-זמן. ציר הזמן מאפס עד 8 שניות, ציר המהירות מאפס עד 20 מטרים לשנייה. הקו של המכונית A אופקי
      ב-20 מטרים לשנייה עד שנייה 1, ואז יורד בקו ישר עד אפס ב-6 שניות ונשאר באפס. הקו של האופנוע B אופקי
      ב-12 מטרים לשנייה לאורך כל הגרף. הקווים נחתכים ב-3 שניות.
    diagram: |
      <svg viewBox="0 0 420 250" width="420" height="250" font-size="13" aria-hidden="true">
        <g stroke="var(--rule)" stroke-width="1">
          <line x1="100" y1="50" x2="100" y2="210"/><line x1="140" y1="50" x2="140" y2="210"/>
          <line x1="180" y1="50" x2="180" y2="210"/><line x1="220" y1="50" x2="220" y2="210"/>
          <line x1="260" y1="50" x2="260" y2="210"/><line x1="300" y1="50" x2="300" y2="210"/>
          <line x1="340" y1="50" x2="340" y2="210"/><line x1="380" y1="50" x2="380" y2="210"/>
          <line x1="60" y1="178" x2="380" y2="178"/><line x1="60" y1="146" x2="380" y2="146"/>
          <line x1="60" y1="114" x2="380" y2="114"/><line x1="60" y1="82" x2="380" y2="82"/>
          <line x1="60" y1="50" x2="380" y2="50"/>
        </g>
        <line x1="60" y1="210" x2="400" y2="210" stroke="currentColor" stroke-width="1.5"/>
        <polygon points="400,205 410,210 400,215" fill="currentColor"/>
        <line x1="60" y1="210" x2="60" y2="28" stroke="currentColor" stroke-width="1.5"/>
