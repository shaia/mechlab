      - label: ה
        type: open
        points: 12
        level: bagrut
        objectives: [OBJ-1.9-2, OBJ-1.9-3]
        prompt: >-
          בזרם של $3\,\text{m/s}$, הסירה צריכה להגיע בדיוק ל-B. בטאו באמצעות רוחב הנהר $d$, גודל המהירות של הסירה ביחס
          למים $u$ וגודל המהירות של הזרם $w$ את זמן החצייה. מצאו לאיזה כיוון יש לכוון את הסירה (זווית מכיוון צפון) ואת זמן החצייה. מה
          התנאי על $u$ ו-$w$ כדי שזה יהיה אפשרי? כתבו את הפתרון בפורמט בגרות.
        hints:
          - 'כדי להגיע ל-B, מה צריך להיות רכיב ה-$x$ של המהירות ביחס לגדה?'
          - 'שרטטו משולש מהירויות: $\vec v_{SM}$ הוא היתר.'
        solution:
          - { kind: formula, text: 'ציר $x$ מזרחה וציר $y$ צפונה. $\vec v_S = \vec v_{SM} + \vec v_M$: המהירות ביחס לגדה היא המהירות ביחס למים ועוד מהירות המים, $\vec v_M = (w,\ 0)$.' }
          - { kind: manipulation, text: 'מכוונים את הסירה בזווית $\theta$ מצפון לכיוון מערב, ולכן $\vec v_{SM} = (-u\sin\theta,\ u\cos\theta)$. כדי להגיע ל-B, רכיב ה-$x$ של המהירות ביחס לגדה הוא אפס: $v_{S,x} = w - u\sin\theta = 0$, ולכן $\sin\theta = \dfrac{w}{u}$.' }
          - { kind: manipulation, text: 'במשולש המהירויות $u$ הוא היתר ו-$w$ ניצב, ולכן מפיתגורס $v_{S,y} = u\cos\theta = \sqrt{u^2 - w^2}$. על ציר $y$ התנועה קצובה: $t = \dfrac{d}{v_{S,y}} = \dfrac{d}{\sqrt{u^2 - w^2}}$. יש פתרון רק כש-$u > w$: רכיב אף פעם לא גדול מגודל הווקטור, וכש-$u = w$ הסירה לא מתקדמת צפונה בכלל.' }
          - { kind: substitution, text: '$\sin\theta = \dfrac{3\,\text{m/s}}{5\,\text{m/s}} = 0.6$, ולכן $\theta \approx 37^\circ$. $t = \dfrac{60\,\text{m}}{\sqrt{5^2 - 3^2}\,\text{m/s}} = \dfrac{60\,\text{m}}{4\,\text{m/s}} = 15\,\text{s}$' }
          - { kind: result, text: '$t = \dfrac{d}{\sqrt{u^2 - w^2}} = 15\,\text{s}$. מכוונים את הסירה $37^\circ$ מצפון לכיוון מערב, נגד הזרם, וזה אפשרי רק כש-$u > w$. החצייה ארוכה מ-$12\,\text{s}$ של סעיף ב, כי חלק מהמהירות של הסירה מבטל את הזרם.' }
        rubric:
          - text: כתבתי את חיבור המהירויות $\vec v_S = \vec v_{SM} + \vec v_M$, ושרטטתי משולש מהירויות.
          - text: הבנתי שכדי להגיע ל-B רכיב ה-$x$ של המהירות ביחס לגדה הוא אפס, וקיבלתי $\sin\theta = w/u$.
          - text: פיתחתי $t = d/\sqrt{u^2 - w^2}$ מהרכיב שמאונך לגדה.
          - text: הצבתי עם יחידות, וקיבלתי $\theta \approx 37^\circ$ מצפון לכיוון מערב ו-$t = 15\,\text{s}$.
          - text: ציינתי את התנאי $u > w$.
