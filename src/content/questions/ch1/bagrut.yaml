    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-1.9-3]
        prompt: >-
          הסירה מכוונת את החרטום ישר צפונה, כלומר המהירות שלה ביחס למים היא צפונה. מה גודל המהירות של הסירה ביחס
          לגדה?
        answer: 5.83
        unit: m/s
        correctFeedback: >-
          נכון. ביחס לגדה $\vec v_S = \vec v_{SM} + \vec v_M = (0,\ 5) + (3,\ 0) = (3,\ 5)\,\text{m/s}$, וגודלה
          $\sqrt{3^2 + 5^2} = \sqrt{34} = 5.8\,\text{m/s}$.
        wrongFeedback: >-
          המהירות ביחס לגדה היא הסכום הווקטורי של המהירות ביחס למים ושל מהירות המים. שני הווקטורים מאונכים: חברו
          רכיבים, ומצאו את הגודל בפיתגורס.
        commonWrong:
          - value: 8
            feedback: >-
              חיברתם גדלים. גודל הסכום שווה לסכום הגדלים רק כששני הווקטורים באותו כיוון. כאן הם מאונכים:
              $\sqrt{3^2 + 5^2}$.
            misconception: MC-magnitudes-add
          - value: 4
            feedback: >-
              חישבתם $\sqrt{5^2 - 3^2}$, כאילו $5\,\text{m/s}$ הוא היתר. כאן $5\,\text{m/s}$ ו-$3\,\text{m/s}$ הם שני
              הניצבים, והמהירות ביחס לגדה היא היתר, ולכן היא גדולה משניהם.
          - value: 2
            feedback: >-
              חיסרתם גדלים. $5 - 3$ נכון רק אם הסירה שטה נגד הזרם. כאן הזרם ניצב לחרטום, ומחברים וקטורים, רכיב לרכיב:
              $(0,\ 5) + (3,\ 0)$.
            misconception: MC-difference-of-magnitudes
        hints:
          - 'כתבו את שתי המהירויות כרכיבים, $(x,\ y)$, וחברו.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-1.9-3]
        prompt: כשהחרטום מכוון ישר צפונה, כמה מטרים מזרחה מ-B הסירה מגיעה לגדה הצפונית?
        answer: 36
        unit: m
        correctFeedback: >-
          נכון. הזמן נקבע ברכיב הצפוני: $t = \dfrac{60}{5} = 12\,\text{s}$. בזמן הזה הזרם מסיע את הסירה
          $3\cdot12 = 36\,\text{m}$ מזרחה.
        wrongFeedback: >-
          קודם מצאו את זמן החצייה מהרכיב שמאונך לגדה ($y$), ואז את ההתקדמות מזרחה מהרכיב שלאורך הגדה ($x$).
        commonWrong:
          - value: 30.9
            feedback: >-
              חילקתם את רוחב הנהר בגודל המהירות, $5.83\,\text{m/s}$. אבל רק הרכיב הצפוני, $5\,\text{m/s}$, מקרב את
              הסירה לגדה השנייה: $t = 60/5 = 12\,\text{s}$.
            misconception: MC-current-changes-crossing-time
          - value: 100
            feedback: >-
              הפכתם את היחס. ההתקדמות מזרחה חלקי הרוחב שווה ל-$v_x/v_y = 3/5$, ולכן היא $60\cdot\tfrac35 = 36\,\text{m}$.
          - value: 0
            feedback: >-
              החרטום מכוון ל-B, אבל הסירה נעה ביחס לגדה גם עם המים. ביחס לגדה יש לה רכיב מזרחי של $3\,\text{m/s}$.
            misconception: MC-velocity-absolute
        hints:
          - 'איזה רכיב של המהירות מקרב את הסירה לגדה הצפונית?'

