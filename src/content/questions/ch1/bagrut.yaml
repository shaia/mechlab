          <text x="60" y="226">0</text><text x="100" y="226">1</text><text x="140" y="226">2</text>
          <text x="180" y="226">3</text><text x="220" y="226">4</text><text x="260" y="226">5</text>
          <text x="300" y="226">6</text><text x="340" y="226">7</text><text x="380" y="226">8</text>
        </g>
        <g fill="currentColor" text-anchor="end">
          <text x="54" y="182">4</text><text x="54" y="150">8</text><text x="54" y="118">12</text>
          <text x="54" y="86">16</text><text x="54" y="54">20</text>
        </g>
        <polyline points="60,50 100,50 300,210 380,210" fill="none" stroke="var(--velocity)" stroke-width="3"/>
        <line x1="60" y1="114" x2="380" y2="114" stroke="var(--velocity)" stroke-width="3" stroke-dasharray="9 6"/>
        <text x="78" y="42" fill="var(--velocity)" font-weight="700" font-size="15">A</text>
        <text x="366" y="106" fill="var(--velocity)" font-weight="700" font-size="15">B</text>
