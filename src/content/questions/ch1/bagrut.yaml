      - label: ד
        type: vector
        points: 5
        level: mid
        qualitative: true
        objectives: [OBJ-1.10-2, OBJ-1.10-3]
        prompt: >-
          אחרי החצייה, במים השקטים של מעגן, הסירה שטה צפונה במהירות $4\,\text{m/s}$, פונה ימינה, ואחרי $2\,\text{s}$
          היא שטה מזרחה, שוב במהירות $4\,\text{m/s}$. מה כיוון התאוצה הממוצעת של הסירה בזמן הפנייה?
        answer: se
        correctFeedback: >-
          נכון. $\Delta\vec v = \vec v_2 - \vec v_1 = (4,\ 0) - (0,\ 4) = (4,\ -4)\,\text{m/s}$, כלומר דרום-מזרח, והתאוצה
          הממוצעת $\Delta\vec v/\Delta t$ באותו כיוון, בגודל $\dfrac{4\sqrt2}{2} = 2.8\,\text{m/s}^2$. גודל המהירות לא
          השתנה, ובכל זאת יש תאוצה: היא מצביעה אל הצד הפנימי של הפנייה.
        wrong:
          - dir: zero
            feedback: >-
              גודל המהירות לא השתנה, אבל הכיוון שלה השתנה, ולכן $\Delta\vec v$ אינו אפס. פנייה היא תאוצה.
            misconception: MC-constant-speed-no-accel
          - dir: ne
            feedback: >-
              חיברתם את שתי המהירויות. $\Delta\vec v$ הוא הפרש: $\vec v_2 - \vec v_1 = \vec v_2 + (-\vec v_1)$, כלומר מזרחה
              ועוד **דרומה**.
            misconception: MC-difference-of-magnitudes
          - dir: e
            feedback: >-
              מזרחה היא המהירות בסוף הפנייה. התאוצה מצביעה בכיוון השינוי במהירות, $\Delta\vec v$, ולא בכיוון המהירות.
            misconception: MC-accel-along-velocity
          - dir: nw
            feedback: >-
              חיסרתם בסדר הפוך. בהפרש הסדר קובע: $\vec v_1 - \vec v_2$ הוא בדיוק ההפך של $\vec v_2 - \vec v_1$, אותו גודל
              בכיוון הנגדי. השינוי הוא הסופי פחות ההתחלתי: $\vec v_2 - \vec v_1$.
