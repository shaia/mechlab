# Question bank for lesson 1.8 (slope and area between the motion graphs). Strings may hold $inline$ TeX; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with src/physics/kinematics.ts (stateAt, areaVT, areaAT, displacement, pathLength):
# script screens/check-1-8.ts, run with npx tsx.

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.8-1: slope down a level
  - id: Q-1.8-height-vs-slope
    type: twotier
    objectives: [OBJ-1.8-1]
    qualitative: true
    prompt: >-
      בגרף מקום-זמן משורטטים שני קווים ישרים. הקו של גוף A מתחיל ב-$x = 20\,\text{m}$ ועולה לאט. הקו של גוף B
      מתחיל בראשית ועולה בתלילות, ועד $t = 2\,\text{s}$ הוא עדיין מתחת לקו של A. איזה גוף מהיר יותר ב-$t = 1\,\text{s}$?
    choices:
      - text: A, כי הקו שלו גבוה יותר.
        feedback: >-
          הגובה של גרף מקום-זמן הוא המקום. A רחוק יותר מהראשית, אבל זה לא אומר שהוא מהיר יותר.
        misconception: MC-height-not-slope
      - text: B, כי הקו שלו תלול יותר.
        correct: true
        feedback: >-
          נכון. המהירות היא השיפוע של גרף המקום-זמן. B עובר יותר מטרים בכל שנייה, אף שהוא עדיין מאחור.
      - text: אי אפשר לדעת עד שהקווים ייחתכו.
        feedback: >-
          את המהירות קוראים מהשיפוע, ואפשר לקרוא אותו בכל רגע. נקודת החיתוך, אם תהיה, תגיד רק ששני הגופים
          נמצאים באותו מקום.
        misconception: MC-height-not-slope
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: המהירות היא השינוי במקום בכל שנייה, וזה השיפוע של הקו.
        correct: true
        feedback: >-
          בדיוק. $v = \Delta x / \Delta t$: כמה הגרף עולה בכל שנייה, לא כמה הוא גבוה.
      - text: גוף שנמצא רחוק יותר מהראשית עבר יותר, ולכן הוא מהיר יותר.
        feedback: >-
          A התחיל רחוק מהראשית, ב-$20\,\text{m}$. המקום ההתחלתי לא אומר כמה מהר הגוף נע עכשיו.
        misconception: MC-height-not-slope
      - text: בנקודה שבה הקווים נחתכים, לשני הגופים אותה מהירות.
        feedback: >-
          בנקודת חיתוך בגרף מקום-זמן לשני הגופים אותו **מקום**. המהירויות שם שונות: השיפועים שונים.
        misconception: MC-height-not-slope
    hints:
      - 'מה מודד הציר האנכי בגרף מקום-זמן? ומה מודד השיפוע?'

  - id: Q-1.8-slope-xt
    type: numeric
    objectives: [OBJ-1.8-1]
    prompt: >-
      הכיוון החיובי הוא ימינה. גרף המקום-זמן של גוף הוא קו ישר שעובר דרך הנקודות $(2\,\text{s},\ 14\,\text{m})$ ו-$(6\,\text{s},\ 2\,\text{m})$.
      מה המהירות של הגוף? כתבו את המספר עם הסימן שלו.
    answer: -3
    unit: m/s
    correctFeedback: >-
      נכון: $v = \dfrac{2 - 14}{6 - 2} = -3\,\text{m/s}$. הקו יורד, ולכן הגוף נע שמאלה, נגד הכיוון החיובי.
    wrongFeedback: 'המהירות היא השיפוע: $v = \Delta x / \Delta t$, השינוי במקום חלקי השינוי בזמן.'
    commonWrong:
      - value: 3
        feedback: >-
          הגודל נכון, אבל הסימן חסר. המקום ירד מ-14 ל-2 מטרים, ולכן $\Delta x$ שלילי והמהירות שלילית.
      - value: 0.333
        feedback: >-
          חילקתם את המקום בזמן בנקודה אחת, $2/6$. זה הגובה חלקי הזמן, לא השיפוע. צריך את **השינוי** במקום חלקי
          **השינוי** בזמן.
        misconception: MC-height-not-slope
      - value: 7
        feedback: >-
          חילקתם $14/2$, הגובה בנקודה הראשונה חלקי הזמן שלה. השיפוע הוא $\dfrac{2 - 14}{6 - 2}$.
        misconception: MC-height-not-slope
    hints:
      - 'כמה השתנה המקום, ובכמה זמן?'

  - id: Q-1.8-slope-vt
    type: numeric
    objectives: [OBJ-1.8-1]
    level: mid
    prompt: >-
      הכיוון החיובי הוא כיוון הנסיעה. גרף המהירות-זמן של רכב שבולם הוא קו ישר מ-$12\,\text{m/s}$ ב-$t = 0$ עד אפס
      ב-$t = 4\,\text{s}$. מה התאוצה של הרכב? כתבו את המספר עם הסימן שלו.
    answer: -3
    unit: m/s²
    correctFeedback: >-
      נכון: $a = \dfrac{0 - 12}{4} = -3\,\text{m/s}^2$, השיפוע של גרף המהירות-זמן.
    wrongFeedback: 'התאוצה היא השיפוע של גרף המהירות-זמן: $a = \Delta v / \Delta t$.'
    commonWrong:
      - value: 3
        feedback: >-
          הגודל נכון. אבל המהירות **ירדה**, ולכן $\Delta v$ שלילי והתאוצה שלילית.
      - value: 24
        feedback: >-
          חישבתם את השטח מתחת לגרף, $\tfrac12\cdot4\cdot12$. השטח הוא ההעתק, במטרים. התאוצה היא השיפוע.
      - value: 12
        feedback: >-
          זה הגובה של הגרף בהתחלה, כלומר המהירות ההתחלתית. התאוצה היא כמה המהירות משתנה בכל שנייה.
        misconception: MC-height-not-slope
    hints:
      - 'בכמה השתנתה המהירות, ובכמה זמן?'

  - id: Q-1.8-top-of-xt
    type: mc
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    qualitative: true
    prompt: >-
      גרף המקום-זמן של כדור שנזרק כלפי מעלה (הכיוון החיובי למעלה) עולה, מגיע לשיא ויורד. מה נכון לגבי הרגע של השיא?
    choices:
      - text: המהירות שם אפס, כי המשיק לגרף אופקי.
        correct: true
        feedback: >-
          נכון. בשיא הכדור מפסיק לעלות ומתחיל לרדת. השיפוע של גרף המקום-זמן, כלומר המהירות, עובר שם מחיובי לשלילי.
      - text: המהירות שם הכי גדולה, כי הגרף הכי גבוה.
        feedback: >-
          הגרף הכי גבוה כי הכדור הכי **גבוה**. המהירות היא השיפוע, ובשיא הגרף אופקי.
        misconception: MC-height-not-slope
      - text: גם המהירות וגם התאוצה אפס שם.
        feedback: >-
          המהירות אפס, אבל היא ממשיכה להשתנות: לפני השיא היא חיובית ואחריו שלילית. מהירות שמשתנה פירושה תאוצה שאינה
          אפס. התאוצה היא השיפוע של גרף המהירות-זמן, לא הגובה שלו.
        misconception: MC-zero-velocity-zero-accel
      - text: אי אפשר לדעת מגרף מקום-זמן בלבד.
        feedback: >-
          את המהירות קוראים מהשיפוע של גרף המקום-זמן. בשיא המשיק אופקי, ולכן המהירות אפס.

  # ---------------------------------------------------------------- OBJ-1.8-2: area up a level
  - id: Q-1.8-area-dx
    type: numeric
    objectives: [OBJ-1.8-2]
    prompt: >-
      הכיוון החיובי הוא כיוון התנועה. גוף יוצא ממנוחה. המהירות שלו עולה בקו ישר עד $6\,\text{m/s}$ ב-$3\,\text{s}$,
      ואחר כך נשארת $6\,\text{m/s}$ עוד $2\,\text{s}$. מה ההעתק של הגוף ב-$5$ השניות?
    answer: 21
    unit: m
    correctFeedback: >-
      נכון: משולש ועוד מלבן, $\tfrac12\cdot3\cdot6 + 2\cdot6 = 9 + 12 = 21\,\text{m}$.
    wrongFeedback: 'ההעתק הוא השטח מתחת לגרף המהירות-זמן. חלקו אותו למשולש ולמלבן.'
    commonWrong:
      - value: 12
        feedback: 'חישבתם רק את המלבן. גם בשלוש השניות הראשונות הגוף זז: שם השטח הוא משולש, $\tfrac12\cdot3\cdot6 = 9\,\text{m}$.'
      - value: 30
        feedback: >-
          כפלתם $6\cdot5$, כאילו המהירות הייתה $6\,\text{m/s}$ כל הזמן. בהתחלה היא קטנה יותר, והשטח שם הוא משולש,
          לא מלבן.
      - value: 15
        feedback: >-
          חישבתם את הממוצע של המהירות ההתחלתית והסופית, $3\,\text{m/s}$, כפול $5\,\text{s}$. זה נכון רק כשהתאוצה
          קבועה כל הזמן. כאן יש שני קטעים, ולכל אחד שטח משלו.
        misconception: MC-average-of-speeds
    hints:
      - 'שרטטו את גרף המהירות-זמן. מאילו צורות בנוי השטח מתחתיו?'

  - id: Q-1.8-area-position
    type: mc
    objectives: [OBJ-1.8-2]
    qualitative: true
    prompt: >-
      הכיוון החיובי הוא ימינה. ב-$t = 0$ עגלה נמצאת ב-$x = 5\,\text{m}$. השטח מתחת לגרף המהירות-זמן שלה מ-$0$ עד
      $4\,\text{s}$ הוא $12\,\text{m}$, כולו מעל ציר הזמן. איפה העגלה ב-$t = 4\,\text{s}$?
    choices:
      - text: ב-$x = 17\,\text{m}$.
        correct: true
        feedback: >-
          נכון. השטח הוא ההעתק, $\Delta x = +12\,\text{m}$, ולכן $x = x_0 + \Delta x = 5 + 12 = 17\,\text{m}$.
      - text: ב-$x = 12\,\text{m}$.
        feedback: >-
          השטח אומר בכמה המקום **השתנה**, לא איפה העגלה נמצאת. היא התחילה ב-$5\,\text{m}$ והתקדמה $12\,\text{m}$.
        misconception: MC-area-is-position
      - text: ב-$x = 7\,\text{m}$.
        feedback: >-
          חיסרתם $12 - 5$. השטח מעל הציר הוא העתק חיובי: העגלה התקדמה ימינה, והמקום **גדל** ב-12 מטרים.
      - text: אי אפשר לדעת בלי לדעת את המהירות בכל רגע.
        feedback: >-
          את כל מה שהמהירות עשתה בפרק הזמן כבר מסכם השטח. מספיק לדעת אותו ואת המקום ההתחלתי.

  - id: Q-1.8-path-vs-dx
    type: numeric
    objectives: [OBJ-1.8-2]
    level: mid
    prompt: >-
      הכיוון החיובי הוא ימינה. גוף נע $3\,\text{s}$ במהירות $+4\,\text{m/s}$, ואחר כך $4\,\text{s}$ במהירות
      $-2\,\text{m/s}$. מה **הדרך** שהגוף עבר בשבע השניות?
    answer: 20
    unit: m
    correctFeedback: >-
      נכון. הדרך היא סכום השטחים בלי סימנים: $4\cdot3 + 2\cdot4 = 12 + 8 = 20\,\text{m}$. ההעתק, לעומת זאת,
      $12 - 8 = +4\,\text{m}$.
    wrongFeedback: 'שרטטו את גרף המהירות-זמן: מלבן מעל הציר ומלבן מתחתיו. הדרך סופרת את שניהם בחיוב.'
    commonWrong:
      - value: 4
        feedback: >-
          זה ההעתק: $12 - 8$. הוא אומר איפה הגוף נגמר ביחס להתחלה. הדרך סופרת כל מטר שהגוף עבר, גם בדרך חזרה.
        misconception: MC-distance-equals-displacement
      - value: 12
        feedback: >-
          ספרתם רק את הקטע הראשון. גם בקטע השני הגוף זז, $8\,\text{m}$ שמאלה, וגם הם חלק מהדרך.
    hints:
      - 'מה ההבדל בין העתק לדרך כשהגוף חוזר על עקבותיו?'

  - id: Q-1.8-at-area
    type: numeric
    objectives: [OBJ-1.8-2]
    level: mid
    prompt: >-
      הכיוון החיובי הוא כיוון התנועה. ב-$t = 0$ המהירות של גוף $1\,\text{m/s}$. גרף התאוצה-זמן שלו: $+2\,\text{m/s}^2$
      מ-$0$ עד $3\,\text{s}$, ו-$-1\,\text{m/s}^2$ מ-$3$ עד $5\,\text{s}$. מה המהירות ב-$t = 5\,\text{s}$?
    answer: 5
    unit: m/s
    correctFeedback: >-
      נכון: השטח מתחת לגרף התאוצה-זמן הוא $\Delta v = 2\cdot3 + (-1)\cdot2 = +4\,\text{m/s}$, ולכן
      $v = 1 + 4 = 5\,\text{m/s}$.
    wrongFeedback: 'השטח מתחת לגרף התאוצה-זמן הוא שינוי המהירות. אל תשכחו את המהירות ההתחלתית.'
    commonWrong:
      - value: 4
        feedback: >-
          זה השטח, כלומר **שינוי** המהירות. המהירות ב-$5\,\text{s}$ היא המהירות ההתחלתית ועוד השינוי: $1 + 4$.
        misconception: MC-area-is-position
      - value: 9
        feedback: >-
          חיברתם את השטח של הקטע השני כאילו הוא חיובי. הוא מתחת לציר, ולכן נספר במינוס: $1 + 6 - 2 = 5$.
    hints:
      - 'השטח מתחת לגרף תאוצה-זמן: מה הוא אומר, ובאילו יחידות?'

  - id: Q-1.8-net-zero
    type: twotier
    objectives: [OBJ-1.8-2]
    qualitative: true
    level: mid
    prompt: >-
      גרף המהירות-זמן של גוף בנוי משני משולשים שווים: אחד מעל ציר הזמן מ-$0$ עד $2\,\text{s}$, ואחד מתחתיו מ-$2$ עד
      $4\,\text{s}$. מה נכון לגבי הגוף ב-$t = 4\,\text{s}$?
    choices:
      - text: הוא חזר למקום שבו התחיל, אבל הדרך שעבר אינה אפס.
        correct: true
        feedback: >-
          נכון. השטחים מתקזזים, ולכן ההעתק אפס. הדרך היא סכום השטחים בלי סימנים, פי שניים מהשטח של משולש אחד.
      - text: הוא לא זז בכלל, כי השטח הכולל אפס.
        feedback: >-
          השטח **עם הסימן** אפס, ולכן ההעתק אפס. אבל הגוף נע: קודם בכיוון החיובי, ואחר כך חזרה. הדרך אינה אפס.
        misconception: MC-distance-equals-displacement
      - text: הוא נמצא הכי רחוק מהמקום ההתחלתי, כי הוא נע ארבע שניות.
        feedback: >-
          הוא היה הכי רחוק ב-$t = 2\,\text{s}$, כשהמהירות התאפסה והוא התחיל לחזור. מ-$2$ עד $4\,\text{s}$ הוא
          חזר בדיוק למקום שבו התחיל.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: שטח מעל הציר הוא העתק בכיוון החיובי, ושטח מתחת לציר הוא העתק בכיוון השלילי.
        correct: true
        feedback: 'בדיוק. כאן שני ההעתקים שווים בגודלם ומנוגדים בסימנם.'
      - text: השטח מתחת לגרף הוא המקום של הגוף.
        feedback: >-
          השטח הוא **שינוי** במקום, לא המקום עצמו. הגוף חוזר למקום ההתחלתי, שלא חייב להיות הראשית.
        misconception: MC-area-is-position
      - text: בכל הגרפים השטח מתחת לציר לא נחשב.
        feedback: >-
          שטח מתחת לציר נחשב, במינוס: הוא תנועה נגד הכיוון החיובי. אילו התעלמנו ממנו, הגוף "לא היה חוזר" אף פעם.

  # ---------------------------------------------------------------- OBJ-1.8-3: sketch / choose the graphs
  - id: Q-1.8-match-vt
    type: mc
    objectives: [OBJ-1.8-3]
    qualitative: true
    prompt: >-
      הכיוון החיובי הוא ימינה. גרף המקום-זמן של הולך בנוי משלושה קטעים: קו ישר עולה, קו אופקי, וקו ישר יורד בחזרה
      לגובה ההתחלתי. איזה גרף מהירות-זמן מתאים לו?
    choices:
      - text: קטע אופקי מעל הציר, קטע על הציר, וקטע אופקי מתחת לציר.
        correct: true
        feedback: >-
          נכון. קו ישר בגרף המקום הוא מהירות קבועה: עולה פירושו חיובית, אופקי פירושו אפס, ויורד פירושו שלילית.
      - text: קו ישר עולה, קו אופקי, וקו ישר יורד.
        feedback: >-
          זה העתק של הצורה של גרף המקום. גרף המהירות מראה את **השיפוע** שלו, וכל קטע ישר הוא שיפוע קבוע: קטע אופקי.
        misconception: MC-graphs-same-shape
      - text: קטע אופקי מעל הציר, קטע על הציר, ושוב קטע אופקי מעל הציר.
        feedback: >-
          בקטע השלישי המקום יורד: ההולך חוזר שמאלה, נגד הכיוון החיובי. המהירות שם שלילית, והקטע מתחת לציר.
      - text: קו אופקי גבוה, ואחריו קו שיורד בהדרגה עד הציר.
        feedback: >-
          כאן קראתם את הקו היורד בגרף המקום כ"ההולך מאט". אבל ירידה בגרף מקום-זמן פירושה שהמקום קטן: ההולך חוזר
          שמאלה. הקו היורד ישר, ולכן הוא חוזר בקצב קבוע, במהירות קבועה ושלילית: קטע אופקי מתחת לציר. וגם העמידה
          באמצע חסרה כאן: בה המהירות אפס, קטע על הציר.
        misconception: MC-height-not-slope
    hints:
      - 'מה השיפוע של כל אחד משלושת הקטעים?'

  - id: Q-1.8-match-xt
    type: mc
    objectives: [OBJ-1.8-3]
    qualitative: true
    prompt: >-
      גרף המהירות-זמן של גוף הוא קו אופקי בגובה $v = -2\,\text{m/s}$, מ-$t = 0$ עד $t = 5\,\text{s}$. הגוף מתחיל
      ב-$x = 10\,\text{m}$. איך נראה גרף המקום-זמן?
    choices:
      - text: קו ישר יורד, מ-$10\,\text{m}$ ל-$0$.
        correct: true
        feedback: >-
          נכון. מהירות קבועה היא קו ישר, והמהירות שלילית ולכן הוא יורד. השטח מתחת לגרף המהירות,
          $(-2)\cdot5 = -10\,\text{m}$, מוריד את המקום מ-$10$ ל-$0$.
      - text: קו אופקי בגובה $-2\,\text{m}$.
        feedback: >-
          זה העתק של הצורה של גרף המהירות. גרף אופקי במקום-זמן פירושו מנוחה, אבל הגוף נע $2$ מטרים בכל שנייה.
        misconception: MC-graphs-same-shape
      - text: קו אופקי בגובה $10\,\text{m}$.
        feedback: >-
          קו אופקי הוא מנוחה. הגוף נע: המקום שלו קטן ב-$2$ מטרים בכל שנייה.
      - text: קו ישר יורד, מ-$0$ ל-$-10\,\text{m}$.
        feedback: >-
          השיפוע נכון, אבל השטח נותן רק את השינוי במקום. הגוף **מתחיל** ב-$10\,\text{m}$, ולכן מגיע ל-$0$.
        misconception: MC-area-is-position
    hints:
      - 'מהירות קבועה ושלילית: איזה שיפוע יש לגרף המקום?'

  - id: Q-1.8-throw-at
    type: mc
    objectives: [OBJ-1.8-3]
    qualitative: true
    level: mid
    prompt: >-
      כדור נזרק אנכית כלפי מעלה, עולה, נעצר לרגע בשיא ונופל בחזרה אל היד של הזורק. הכיוון החיובי למעלה, ומזניחים את התנגדות האוויר.
      איזה גרף תאוצה-זמן מתאר את כל המעוף?
    choices:
      - text: קו אופקי בגובה $-10\,\text{m/s}^2$ לכל אורך המעוף.
        correct: true
        feedback: >-
          נכון. גרף המהירות-זמן הוא קו ישר אחד שיורד, מחיובי דרך אפס לשלילי. השיפוע שלו קבוע, $-g$, גם בשיא.
      - text: קו בגובה $-10\,\text{m/s}^2$ שקופץ לאפס ברגע השיא, וחוזר ל-$-10\,\text{m/s}^2$.
        feedback: >-
          בשיא המהירות אפס, אבל השיפוע של גרף המהירות-זמן לא משתנה שם: המהירות ממשיכה לרדת בקצב קבוע. התאוצה היא
          השיפוע, לא הגובה.
        misconception: MC-zero-velocity-zero-accel
      - text: בעלייה $a = -10\,\text{m/s}^2$, ובירידה $a = +10\,\text{m/s}^2$, כי בירידה הכדור מאיץ.
        feedback: >-
          בירידה הכדור באמת מאיץ, אבל כלפי מטה: המהירות שלילית ונעשית שלילית יותר. מהירות שלילית ותאוצה שלילית
          פירושן הגברה של גודל המהירות.
        misconception: MC-negative-accel-slows
      - text: קו ישר שיורד מ-$+10$ ל-$-10\,\text{m/s}^2$.
        feedback: >-
          זו הצורה של גרף **המהירות**-זמן, לא של התאוצה. התאוצה היא השיפוע של גרף המהירות, והשיפוע של קו ישר קבוע.
        misconception: MC-graphs-same-shape

  - id: Q-1.8-describe-xt
    type: mc
    objectives: [OBJ-1.8-3, OBJ-1.8-1]
    prompt: >-
      הכיוון החיובי הוא ימינה. גרף המקום-זמן של עגלה מתחיל אופקי בראשית, ואחר כך עולה ונעשה תלול יותר ויותר. איזה
      תיאור מתאים?
    choices:
      - text: העגלה יוצאת ממנוחה ומאיצה ימינה.
        correct: true
        feedback: >-
          נכון. בהתחלה השיפוע אפס (מנוחה), והשיפוע גדל: המהירות חיובית וגדלה. בגרף המהירות-זמן: קו עולה מאפס.
      - text: העגלה נוסעת ימינה במהירות קבועה.
        feedback: >-
          במהירות קבועה גרף המקום-זמן הוא קו **ישר**. כאן הקו נעשה תלול יותר, כלומר המהירות גדלה.
      - text: העגלה מאטה, כי בהתחלה הגרף אופקי ואחר כך הוא עולה.
        feedback: >-
          גרף שנעשה תלול יותר מתאר מהירות שגדלה. האטה הייתה נראית כקו שמתמתן ונעשה אופקי.
      - text: העגלה נוסעת במישור ואחר כך מטפסת במעלה גבעה.
        feedback: >-
          גרף מקום-זמן אינו תמונה של המסלול. העגלה נעה על ציר ישר, והגרף מתאר איך המקום שלה משתנה עם הזמן.
        misconception: MC-graph-is-path
