# Question bank for lesson 1.2 (four representations of a motion). Strings may hold $inline$ TeX, rendered at build time.
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with legs / uniform / constantAcceleration / timesAtPosition from src/physics/kinematics.ts
# (script: screens/check-1-2.ts, run with npx tsx).

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.2-1: build a motion diagram / table
  - id: Q-1.2-dots-spacing
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    prompt: >-
      בתרשים העקבות של מכונית יש נקודה לכל שנייה. הכיוון החיובי הוא ימינה. הנקודה הראשונה מסומנת, והיא השמאלית
      ביותר. משמאל לימין, הנקודות הולכות ומתרחקות זו מזו. מה עשתה המכונית?
    choices:
      - text: נסעה ימינה, ובכל שנייה עברה יותר מטרים מבשנייה שלפניה.
        correct: true
        feedback: >-
          נכון. בין שתי נקודות סמוכות עוברת תמיד שנייה אחת. רווח גדול יותר פירושו יותר מטרים באותה שנייה, כלומר
          המכונית נעה מהר יותר ויותר.
      - text: נסעה ימינה ומאטה, כי הרווחים הגדלים אומרים שעובר יותר זמן בין הנקודות.
        feedback: >-
          בתרשים עקבות הזמן בין נקודות סמוכות **קבוע**, שנייה אחת. מה שגדל הוא המרחק שהמכונית עוברת בשנייה הזו, ולכן
          היא נוסעת מהר יותר, לא לאט יותר.
      - text: נסעה ימינה, ובכל שנייה עברה אותו מספר מטרים. הרווחים לא חשובים, רק הכיוון.
        feedback: >-
          מכונית שעוברת אותו מספר מטרים בכל שנייה נותנת רווחים שווים בתרשים. רווחים שגדלים מראים שבכל שנייה היא עוברת
          יותר מטרים מבשנייה שלפניה.
      - text: אי אפשר לדעת לאיזה כיוון נסעה, כי בתרשים עקבות אין זמן.
        feedback: >-
          יש זמן: הנקודות נוספות לפי הסדר, אחת בכל שנייה, והנקודה הראשונה מסומנת. כאן היא השמאלית ביותר, ולכן
          המכונית נסעה ימינה. (בלי הסימון הזה באמת אי אפשר היה לדעת: אותן נקודות מתאימות גם למכונית שנוסעת שמאלה
          ומאטה. וכשגוף חוזר על עקבותיו, כותבים את הרגע ליד כל נקודה.)
    hints:
      - כמה זמן עובר בין שתי נקודות סמוכות בתרשים עקבות? ומה משתנה כשהרווח גדל?

  - id: Q-1.2-swimmer-table
    type: numeric
    objectives: [OBJ-1.2-1]
    prompt: >-
      שחיין מתחיל ב-$x = 5\,\text{m}$ על ציר לאורך הבריכה. הוא שוחה בכיוון החיובי 2 מטרים בכל שנייה במשך 4 שניות,
      נח 3 שניות, ואז שוחה בחזרה, בכיוון השלילי, מטר אחד בכל שנייה. היכן הוא נמצא ב-$t = 9\,\text{s}$?
    answer: 11
    unit: m
    correctFeedback: >-
      נכון. אחרי 4 שניות $x = 5 + 2\cdot4 = 13\,\text{m}$; עד $t = 7\,\text{s}$ הוא נח שם; בשתי השניות האחרונות $x$
      קטן ב-2: $13 - 2 = 11\,\text{m}$.
    wrongFeedback: >-
      בנו טבלה שנייה אחר שנייה: מתחילים ב-5, מוסיפים 2 בכל שנייה עד $t = 4\,\text{s}$, משאירים את $x$ קבוע בזמן
      המנוחה, ומחסירים 1 בכל שנייה בדרך חזרה.
    commonWrong:
      - value: 13
        feedback: >-
          13 מטרים הוא המקום בזמן המנוחה, עד $t = 7\,\text{s}$. בין $t = 7\,\text{s}$ ל-$t = 9\,\text{s}$ השחיין כבר שוחה
          בחזרה, ו-$x$ קטן ב-2 מטרים.
      - value: 15
        feedback: >-
          בדרך חזרה השחיין נע בכיוון **השלילי**, ולכן $x$ **קטן**: $13 - 2 = 11$, לא $13 + 2$.
      - value: 6
        feedback: >-
          חישבתם את השינוי במקום מההתחלה, $8 - 2 = 6\,\text{m}$, ושכחתם שהשחיין התחיל ב-$x = 5\,\text{m}$. המקום הוא
          המקום ההתחלתי ועוד השינוי: $5 + 6 = 11\,\text{m}$.
        misconception: MC-position-equals-displacement
    hints:
      - כתבו את המקום ב-$t = 4\,\text{s}$, ב-$t = 7\,\text{s}$ וב-$t = 9\,\text{s}$.

  - id: Q-1.2-rest-in-diagram
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    prompt: >-
      ילדה הולכת לאורך מדרכה ישרה, עוצרת לקשור שרוך לכמה שניות, וממשיכה. בתרשים עקבות עם נקודה לכל שנייה, איך
      נראית העצירה?
    choices:
      - text: כמה נקודות באותו מקום, זו על זו.
        correct: true
        feedback: >-
          נכון. בכל שנייה מסמנים נקודה במקום שבו הילדה נמצאת. בזמן העצירה המקום לא משתנה, ולכן הנקודות נערמות באותו
          מקום.
      - text: רווח ריק, בלי נקודות, כי בזמן העצירה אין תנועה לצייר.
        feedback: >-
          נקודה מסמנים בכל שנייה, בין שהגוף זז ובין שלא. רווח ריק בין נקודות אומר דווקא את ההפך: שהילדה עברה מרחק
          גדול בשנייה אחת.
      - text: שתי נקודות רחוקות מאוד זו מזו.
        feedback: >-
          נקודות רחוקות זו מזו פירושן תנועה מהירה. בעצירה הילדה לא מתקדמת בכלל, ולכן אין רווח בין הנקודות.
      - text: נקודה אחת בלבד, כי היא הייתה רק במקום אחד.
        feedback: >-
          מקום אחד, אבל כמה רגעים. בתרשים עקבות כל רגע מקבל נקודה, ולכן במקום הזה יש כמה נקודות. מהן אפשר לדעת כמה
          זמן נמשכה העצירה: סופרים את הרווחים בין הרגעים, כלומר מספר הנקודות פחות אחת.

  - id: Q-1.2-strobe-count
    type: numeric
    objectives: [OBJ-1.2-1]
    prompt: >-
      בתמונה עם מבזקים רואים 11 תמונות של כדור מתגלגל. המבזק מאיר כל $0.2\,\text{s}$, והתמונה הראשונה צולמה
      במבזק הראשון. כמה זמן עבר בין התמונה הראשונה לאחרונה?
    answer: 2.0
    unit: s
    correctFeedback: >-
      נכון. בין 11 תמונות יש 10 רווחים, ובכל רווח עוברות $0.2\,\text{s}$: $10\cdot0.2 = 2.0\,\text{s}$.
    wrongFeedback: >-
      ספרו רווחים, לא תמונות: בין התמונה הראשונה לאחרונה יש רווח אחד פחות ממספר התמונות.
    commonWrong:
      - value: 2.2
        feedback: >-
          כפלתם את מספר התמונות ב-$0.2\,\text{s}$. אבל הזמן נמדד בין התמונות: ל-11 תמונות יש 10 רווחים, ולכן
          $10\cdot0.2 = 2.0\,\text{s}$. (בדקו עם 2 תמונות: ביניהן עובר רווח אחד, $0.2\,\text{s}$, לא $0.4$.)
    hints:
      - כמה זמן עובר בין שתי תמונות בלבד?

  # ---------------------------------------------------------------- OBJ-1.2-2: translate between representations
  - id: Q-1.2-formula-value
    type: numeric
    objectives: [OBJ-1.2-2]
    prompt: >-
      המקום של גוף נתון בביטוי $x(t) = 4 + 2t^2$, כש-$x$ במטרים ו-$t$ בשניות. היכן הגוף ב-$t = 3\,\text{s}$?
    answer: 22
    unit: m
    correctFeedback: >-
      נכון. מעלים בריבוע קודם, ואז כופלים: $x(3) = 4 + 2\cdot3^2 = 4 + 2\cdot9 = 22\,\text{m}$.
    wrongFeedback: >-
      הציבו $t = 3$ בביטוי. סדר הפעולות: חזקה, אחר כך כפל, ובסוף חיבור.
    commonWrong:
      - value: 40
        feedback: >-
          חישבתם $(2\cdot3)^2 + 4 = 40$. בביטוי רק $t$ מועלה בריבוע: $2t^2 = 2\cdot9 = 18$, ולכן $x = 22\,\text{m}$.
      - value: 10
        feedback: >-
          שכחתם את הריבוע: $4 + 2\cdot3 = 10$. צריך $4 + 2\cdot3^2 = 22\,\text{m}$.
      - value: 18
        feedback: >-
          זה רק $2t^2$. המספר 4 בביטוי הוא המקום ב-$t = 0$, וגם אותו מחברים: $4 + 18 = 22\,\text{m}$.
        misconception: MC-position-equals-displacement

  - id: Q-1.2-table-to-graph
    type: mc
    objectives: [OBJ-1.2-2]
    prompt: >-
      זו טבלת המקום של גוף:
      $$\begin{array}{c|ccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 \\ \hline x\ (\text{m}) & 6 & 4 & 2 & 2 & 2 \end{array}$$
      איזה תיאור מתאים לגרף המקום-זמן שלו?
    choices:
      - text: קו ישר שיורד מ-$6\,\text{m}$ ל-$2\,\text{m}$ בין $t = 0$ ל-$t = 2\,\text{s}$, ואחריו קו אופקי בגובה $2\,\text{m}$.
        correct: true
        feedback: >-
          נכון. בשתי השניות הראשונות $x$ קטן ב-2 בכל שנייה (קו יורד), ואחר כך $x$ לא משתנה (קו אופקי: הגוף עומד).
      - text: קו ישר שיורד כל הזמן, מ-$6\,\text{m}$ ב-$t = 0$ עד מתחת ל-$2\,\text{m}$ ב-$t = 4\,\text{s}$.
        feedback: >-
          מ-$t = 2\,\text{s}$ המקום נשאר $2\,\text{m}$, ולכן הקו מפסיק לרדת ונעשה אופקי. גוף שעומד לא "ממשיך לרדת" בגרף.
        misconception: MC-flat-xt-is-moving
      - text: קו ישר שעולה מ-$2\,\text{m}$ ל-$6\,\text{m}$.
        feedback: >-
          בגרף מקום-זמן הזמן מתקדם ימינה. ב-$t = 0$ הגוף ב-$6\,\text{m}$, ואחר כך $x$ קטן: הקו יורד, הוא לא עולה.
      - text: קטע אופקי מ-$x = 2\,\text{m}$ עד $x = 6\,\text{m}$, החלק של הציר שהגוף עבר בו.
        feedback: >-
          זה ציור של המקומות שהגוף עבר בהם, כלומר של המסלול. גרף מקום-זמן מראה את המקום מול הזמן: $t$ על הציר
          האופקי ו-$x$ על האנכי.
        misconception: MC-graph-is-path

  - id: Q-1.2-graph-to-diagram
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    prompt: >-
      גרף המקום-זמן של גוף בנוי משני קטעים ישרים, ושניהם עולים: עד $t = 3\,\text{s}$ הקו תלול, ומ-$t = 3\,\text{s}$ הקו
      פחות תלול. איזה תרשים עקבות, עם נקודה לכל שנייה, מתאים לו?
    choices:
      - text: נקודות במרווחים גדולים ושווים, ואחריהן נקודות במרווחים קטנים ושווים, כולן לאותו כיוון.
        correct: true
        feedback: >-
          נכון. קו ישר = אותו מספר מטרים בכל שנייה, כלומר מרווחים שווים. קו תלול = הרבה מטרים בכל שנייה, מרווחים
          גדולים. אחרי $t = 3\,\text{s}$ הקו פחות תלול, והמרווחים קטנים.
      - text: נקודות במרווחים קטנים ושווים, ואחריהן מרווחים גדולים ושווים.
        feedback: >-
          הפוך: הקטע הראשון הוא התלול, כלומר בו הגוף עובר יותר מטרים בכל שנייה. לכן המרווחים הגדולים באים קודם.
      - text: נקודות שהמרווחים ביניהן קטנים בהדרגה, מהראשונה עד האחרונה.
        feedback: >-
          מרווחים שקטנים בהדרגה מתאימים לגרף מעוקל. כאן כל קטע הוא קו **ישר**, ולכן בתוך כל קטע המרווחים שווים, והם
          משתנים בבת אחת ב-$t = 3\,\text{s}$.
      - text: נקודות במרווחים גדולים, ואחריהן נקודות שחוזרות לאחור.
        feedback: >-
          גוף שחוזר לאחור נותן קטע **יורד** בגרף. כאן שני הקטעים עולים, ולכן הגוף נע כל הזמן בכיוון החיובי.

  - id: Q-1.2-table-to-formula
    type: mc
    objectives: [OBJ-1.2-2]
    prompt: >-
      זו טבלת המקום של גוף:
      $$\begin{array}{c|cccc} t\ (\text{s}) & 0 & 1 & 2 & 3 \\ \hline x\ (\text{m}) & 3 & 5 & 7 & 9 \end{array}$$
      איזה ביטוי מקום-זמן מתאים לה (עם $x$ במטרים ו-$t$ בשניות)?
    choices:
      - text: $x(t) = 3 + 2t$
        correct: true
        feedback: >-
          נכון. ב-$t = 0$ מקבלים 3, ובכל שנייה $x$ גדל ב-2. בדיקה: $x(3) = 3 + 6 = 9$.
      - text: $x(t) = 2 + 3t$
        feedback: >-
          ב-$t = 0$ הביטוי הזה נותן 2, ובטבלה כתוב 3. מה שנוסף בכל שנייה הוא 2, לא 3: $5 - 3 = 2$.
      - text: $x(t) = 5t$
        feedback: >-
          ב-$t = 0$ הביטוי הזה נותן 0, אבל הגוף מתחיל ב-$3\,\text{m}$. ב-$t = 1\,\text{s}$ הוא אמנם נותן 5, אבל ב-$t = 2\,\text{s}$
          הוא נותן 10 ולא 7.
        misconception: MC-position-equals-displacement
      - text: $x(t) = 3 + 2t^2$
        feedback: >-
          ב-$t = 2\,\text{s}$ הביטוי הזה נותן $3 + 8 = 11$, ובטבלה כתוב 7. בטבלה $x$ גדל באותו מספר בכל שנייה, וזה מתאים
          לביטוי בלי ריבוע.
    hints:
      - בדקו כל ביטוי בשתי שורות לפחות, למשל $t = 0$ ו-$t = 2\,\text{s}$.

  # ---------------------------------------------------------------- OBJ-1.2-3: read an x–t graph
  - id: Q-1.2-flat-line
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      בגרף מקום-זמן של גוף יש קטע אופקי בגובה $x = 5\,\text{m}$, מ-$t = 2\,\text{s}$ עד $t = 6\,\text{s}$. מה עושה הגוף
      באותן ארבע שניות?
    choices:
      - text: עומד במקום, ב-$x = 5\,\text{m}$.
        correct: true
        feedback: >-
          נכון. הזמן עובר (הקו מתקדם ימינה), אבל $x$ נשאר 5: המקום לא משתנה, כלומר הגוף עומד.
      - text: נע כל הזמן באותו אופן, אותו מספר מטרים בכל שנייה.
        feedback: >-
          בגרף **מקום**-זמן הגובה הוא המקום. קו אופקי אומר שהמקום לא משתנה. גוף שעובר אותו מספר מטרים בכל שנייה נותן
          קו ישר **משופע**, לא אופקי.
        misconception: MC-flat-xt-is-moving
      - text: נע לאורך הציר, 5 מטרים בכל שנייה.
        feedback: >-
          5 מטרים הוא הגובה של הקו, כלומר המקום. בכל ארבע השניות המקום הוא 5 מטרים, ולכן הגוף לא עבר אף מטר.
        misconception: MC-flat-xt-is-moving
      - text: נע במישור אופקי, כמו שהקו מראה.
        feedback: >-
          הגרף אינו ציור של המסלול. הציר האופקי שלו הוא הזמן, וכל נקודה בו אומרת רק איפה הגוף היה באותו רגע.
        misconception: MC-graph-is-path

  - id: Q-1.2-negative-direction
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      בין $t = 0$ ל-$t = 3\,\text{s}$ גרף המקום-זמן של גוף עולה, מ-$x = -6\,\text{m}$ ל-$x = -3\,\text{m}$. לאיזה כיוון נע
      הגוף בפרק הזמן הזה?
    choices:
      - text: בכיוון החיובי.
        correct: true
        feedback: >-
          נכון. $x$ גדל, מ-$x = -6\,\text{m}$ ל-$x = -3\,\text{m}$, ולכן הגוף נע בכיוון החיובי, אל הראשית. הסימן השלילי אומר רק שהוא עדיין בצד
          השלילי של הראשית.
      - text: בכיוון השלילי, כי המקומות שלו שליליים.
        feedback: >-
          הסימן של $x$ אומר באיזה צד של הראשית הגוף נמצא, לא לאן הוא נע. כאן $x = -3\,\text{m}$ גדול מ-$x = -6\,\text{m}$, הגרף עולה, והגוף נע
          בכיוון החיובי.
        misconception: MC-negative-position-backwards
      - text: הוא עומד, כי הוא עדיין לא הגיע לראשית.
        feedback: >-
          גוף עומד נותן קו אופקי. כאן $x$ משתנה, מ-$x = -6\,\text{m}$ ל-$x = -3\,\text{m}$, ולכן הגוף נע.
        misconception: MC-flat-xt-is-moving
      - text: אי אפשר לדעת בלי לדעת איפה הראשית.
        feedback: >-
          הראשית כבר נקבעה, וכל המקומות נמדדים ממנה. לפי השינוי של $x$ יודעים את הכיוון: $x$ גדל, ולכן הגוף נע בכיוון
          החיובי.

  - id: Q-1.2-graph-is-path
    type: twotier
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      מכונית נוסעת בכביש ישר ושטוח. גרף המקום-זמן שלה נראה כמו גבעה: עולה, מגיע לפסגה ויורד. תלמיד אומר: "המכונית
      עלתה על גבעה וירדה ממנה." האם הוא צודק?
    choices:
      - text: לא. המכונית נסעה קדימה בכביש השטוח, הסתובבה, וחזרה.
        correct: true
        feedback: >-
          נכון. בעלייה $x$ גדל: נסיעה בכיוון החיובי. בפסגה המכונית מחליפה כיוון, ובירידה $x$ קטן: היא חוזרת. הכל על
          אותו כביש שטוח.
      - text: כן. צורת הגרף היא צורת הכביש.
        feedback: >-
          הכביש שטוח, כתוב בשאלה. הגרף לא מצייר את הכביש: הציר האופקי שלו הוא הזמן, והגובה הוא המקום לאורך הכביש.
        misconception: MC-graph-is-path
      - text: לא. המכונית נסעה קדימה כל הזמן, כי הגרף מתקדם ימינה כל הזמן.
        feedback: >-
          הגרף מתקדם ימינה כי הזמן מתקדם, תמיד. את כיוון הנסיעה קובעים מהגובה: אחרי הפסגה $x$ קטן, והמכונית חוזרת.
        misconception: MC-graph-is-path
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: בגרף מקום-זמן הציר האופקי הוא הזמן והגובה הוא המקום, ולכן ירידה בגרף היא תנועה בכיוון השלילי.
        correct: true
        feedback: >-
          בדיוק. בגרף מקום-זמן קוראים גובה כמקום, ושינוי בגובה ככיוון התנועה.
      - text: הגרף מראה את צורת הדרך שהמכונית נסעה בה.
        feedback: >-
          זה נכון למפה, לא לגרף מקום-זמן. בגרף מקום-זמן אין בכלל ציר של "רוחב" הדרך; יש זמן ויש מקום.
        misconception: MC-graph-is-path
      - text: ירידה בגרף פירושה שהמכונית מאטה.
        feedback: >-
          ירידה פירושה ש-$x$ קטן, כלומר תנועה בכיוון השלילי. מכונית שמאטה ועדיין נוסעת קדימה נותנת קו **עולה** שהולך
          ונעשה שטוח.

  - id: Q-1.2-crossing
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      בגרף מקום-זמן של שני גופים, הקו של A עולה והקו של B יורד, והם נחתכים בנקודה $t = 4\,\text{s}$, $x = 8\,\text{m}$.
      מה בטוח נכון?
    choices:
      - text: ב-$t = 4\,\text{s}$ שני הגופים נמצאים ב-$x = 8\,\text{m}$.
        correct: true
        feedback: >-
          נכון. נקודה בגרף היא רגע ומקום. כששני הקווים עוברים באותה נקודה, שני הגופים באותו מקום באותו רגע: הם
          נפגשים וחולפים זה על פני זה.
      - text: ב-$t = 4\,\text{s}$ שני הגופים נעים מהר באותה מידה.
        feedback: >-
          החיתוך אומר רק שהמקומות שווים. כמה מהר נע כל גוף קוראים מהתלילות של הקו שלו, והשאלה לא אומרת כמה תלול כל
          קו. לכן זה לא **בטוח**: הקווים יכולים להיחתך גם כשאחד תלול בהרבה מהשני.
        misconception: MC-crossing-same-speed
      - text: ב-$t = 4\,\text{s}$ הגופים מתנגשים ונעצרים.
        feedback: >-
          אחרי $t = 4\,\text{s}$ הקווים ממשיכים, A עולה ו-B יורד, ולכן אף גוף לא נעצר. בשני מסלולים מקבילים, למשל, הם
          פשוט חולפים זה על פני זה.
        misconception: MC-crossing-same-speed
      - text: לפני $t = 4\,\text{s}$, B מהיר יותר, כי הקו שלו גבוה יותר.
        feedback: >-
          קו גבוה פירושו מקום רחוק יותר מהראשית בכיוון החיובי, לא תנועה מהירה יותר. כמה מהר הגוף נע, רואים מהתלילות
          של הקו.
        misconception: MC-higher-graph-faster

  - id: Q-1.2-time-at-position
    type: numeric
    objectives: [OBJ-1.2-3]
    prompt: >-
      גרף המקום-זמן של גוף הוא קו ישר מהנקודה $(0,\ 12\,\text{m})$ עד הנקודה $(6\,\text{s},\ 0)$, ואחריו קו אופקי.
      באיזה רגע הגוף נמצא ב-$x = 4\,\text{m}$?
    answer: 4
    unit: s
    correctFeedback: >-
      נכון. הקו יורד 12 מטרים ב-6 שניות, כלומר 2 מטרים בכל שנייה. מ-12 עד 4 יש 8 מטרים: $8/2 = 4\,\text{s}$.
    wrongFeedback: >-
      הקו ישר, ולכן $x$ קטן באותו מספר מטרים בכל שנייה. מצאו כמה, ואז כמה שניות לוקח לרדת מ-12 ל-4.
    commonWrong:
      - value: 2
        feedback: >-
          חישבתם כמה זמן לוקח להגיע ל-4 מטרים **מהאפס**, $4/2 = 2$. אבל הגוף מתחיל ב-$12\,\text{m}$ ויורד: הוא צריך לרדת
          8 מטרים, וזה לוקח $4\,\text{s}$.
        misconception: MC-position-equals-displacement
      - value: 8
        feedback: >-
          8 הוא מספר המטרים שהגוף יורד (מ-12 ל-4), לא מספר השניות. הוא יורד 2 מטרים בכל שנייה, ולכן זה לוקח $4\,\text{s}$.

  - id: Q-1.2-rank-legs
    type: rank
    objectives: [OBJ-1.2-3]
    prompt: >-
      גרף המקום-זמן של גוף בנוי משלושה קטעים ישרים. קטע I: מ-$t = 0$ עד $t = 2\,\text{s}$, מ-$x = 0$ ל-$x = 6\,\text{m}$.
      קטע II: מ-$t = 2\,\text{s}$ עד $t = 5\,\text{s}$, מ-$6\,\text{m}$ ל-$9\,\text{m}$. קטע III: מ-$t = 5\,\text{s}$ עד
      $t = 6\,\text{s}$, מ-$9\,\text{m}$ ל-$5\,\text{m}$. סדרו את הקטעים לפי מספר המטרים שהגוף עובר בכל שנייה, מהגדול
      לקטן (בלי להתחשב בכיוון).
    items:
      - id: I
        label: קטע I
      - id: II
        label: קטע II
      - id: III
        label: קטע III
    order: [III, I, II]
    correctFeedback: >-
      נכון. קטע III: 4 מטרים בשנייה אחת (אחורה). קטע I: 6 מטרים ב-2 שניות, 3 בכל שנייה. קטע II: 3 מטרים ב-3 שניות, 1 בכל
      שנייה. בגרף, III הוא הקטע התלול ביותר, אף שהוא יורד.
    wrongFeedback: >-
      לכל קטע חלקו את מספר המטרים שהגוף עבר במספר השניות. שימו לב שבקטע III הגוף חוזר: $x$ קטן מ-9 ל-5, כלומר 4 מטרים
      בשנייה אחת. הכיוון לא משנה כאן, רק כמה מטרים בכל שנייה.
