# Chapter 1 question bank, lesson 1.1 (position, frame of reference, displacement, path length).
# Every number recomputed with npx tsx against src/physics/kinematics.ts (legs, displacement, pathLength).

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.1-1: choose an axis, write positions
  - id: Q-1.1-kiosk
    type: numeric
    objectives: [OBJ-1.1-1]
    level: basic
    prompt: >-
      בוחרים ציר מקום לאורך טיילת ישרה: הראשית במגדל המציל, והכיוון החיובי צפונה. קיוסק נמצא $40\,\text{m}$ דרומית
      למגדל. מה המקום $x$ של הקיוסק?
    answer: -40
    unit: m
    tolerance: 0.01
    correctFeedback: 'נכון: הקיוסק בצד הדרומי של הראשית, נגד הכיוון החיובי, ולכן $x = -40\,\text{m}$.'
    wrongFeedback: 'למקום יש גודל וסימן. הגודל אומר כמה מטרים הגוף רחוק מהראשית, והסימן באיזה צד שלה: + בצד החיובי, − בצד השני.'
    commonWrong:
      - value: 40
        feedback: 'הגודל נכון: הקיוסק רחוק 40 מטרים מהמגדל. אבל חסר הסימן. הכיוון החיובי הוא צפונה, והקיוסק דרומית למגדל, ולכן המקום שלו שלילי.'
    hints:
      - 'סמנו את הציר בציור: הראשית, החץ צפונה, והקיוסק. באיזה צד של הראשית הוא נמצא?'

  - id: Q-1.1-new-origin
    type: numeric
    objectives: [OBJ-1.1-1]
    level: mid
    prompt: >-
      על שביל ישר, בציר שהראשית שלו בספסל והכיוון החיובי מזרחה, הולכת נמצאת ב-$x = 7\,\text{m}$, ופנס נמצא
      ב-$x = 3\,\text{m}$. חבר בוחר ציר אחר: הראשית בפנס, והכיוון החיובי שוב מזרחה. מה המקום של ההולכת בציר של
      החבר?
    answer: 4
    unit: m
    tolerance: 0.01
    correctFeedback: 'נכון: ההולכת $7 - 3 = 4$ מטרים מזרחית לפנס, ולכן בציר של החבר $x = +4\,\text{m}$.'
    wrongFeedback: 'מקום נמדד מהראשית. כמה מטרים, ובאיזה כיוון, ההולכת רחוקה מהפנס?'
    commonWrong:
      - value: 7
        feedback: >-
          7 מטרים הוא המקום שלה ביחס לספסל. בציר של החבר הראשית היא הפנס, ולכן המספר שונה. שני המספרים נכונים, כל
          אחד בציר שלו.
        misconception: MC-position-absolute
      - value: 10
        feedback: 'חיברתם במקום לחסר. הפנס נמצא בין הספסל להולכת, ולכן ההולכת קרובה יותר לפנס מאשר לספסל.'
      - value: -4
        feedback: 'הסימן הפוך. ההולכת מזרחית לפנס, בכיוון החיובי, ולכן המקום שלה חיובי.'
    hints:
      - 'ציירו את הספסל, הפנס וההולכת על קו אחד, עם המספרים מהציר הראשון.'

  - id: Q-1.1-what-missing
    type: mc
    objectives: [OBJ-1.1-1]
    qualitative: true
    level: basic
    prompt: >-
      תלמיד כתב בפתרון: "המכונית נמצאת ב-$x = 25\,\text{m}$". מה עוד חייבים לדעת כדי שהמשפט יאמר איפה המכונית
      נמצאת?
    choices:
      - text: איפה הראשית של הציר, ומהו הכיוון החיובי.
        correct: true
        feedback: >-
          נכון. 25 מטרים ממה, ולאיזה צד? בלי ראשית וכיוון חיובי, המספר לא מצביע על נקודה. לכן כל פתרון מתחיל בבחירת
          מערכת הייחוס.
      - text: 'שום דבר. $x = 25\,\text{m}$ הוא המקום של המכונית, וזהו.'
        feedback: >-
          אותה מכונית יכולה להיות ב-$x = 25\,\text{m}$ בציר אחד וב-$x = -60\,\text{m}$ בציר אחר. המספר תלוי בראשית
          ובכיוון החיובי שבחרו.
        misconception: MC-position-absolute
      - text: מה המהירות של המכונית.
        feedback: המהירות אומרת איך המקום משתנה, לא איפה המכונית נמצאת עכשיו. גם מכונית שעומדת צריכה ראשית וכיוון.
      - text: מה האורך של המכונית.
        feedback: >-
          במודל של גוף נקודתי מתעלמים מהאורך. גם אם האורך חשוב, הוא לא אומר מאיפה מודדים את ה-25 מטרים.

  - id: Q-1.1-point-body
    type: mc
    objectives: [OBJ-1.1-1]
    qualitative: true
    level: basic
    prompt: >-
      באיזו מהשאלות הבאות **אי אפשר** לתאר רכבת באורך $150\,\text{m}$ כגוף נקודתי?
    choices:
      - text: כמה זמן לוקח לרכבת לעבור כולה על פני רציף שאורכו 200 מטרים.
        correct: true
        feedback: >-
          נכון. כאן האורך של הרכבת הוא חלק מהתשובה: הרכבת סיימה לעבור רק כשהקרון האחרון יצא מהרציף. 150 מטרים אינם
          קטנים לעומת 200 מטרים.
      - text: כמה זמן נמשכת הנסיעה מתל אביב לבאר שבע.
        feedback: >-
          כאן הרכבת היא נקודה טובה: 150 מטרים הם חלק זעיר מכ-100 קילומטרים של נסיעה.
      - text: באיזו עיר נמצאת הרכבת בשעה 12:00.
        feedback: על מפה של הארץ, הרכבת כולה היא נקודה. האורך שלה לא משנה את התשובה.
      - text: כמה קילומטרים עברה הרכבת בנסיעה של שעתיים.
        feedback: >-
          כל נקודה ברכבת עוברת אותם קילומטרים, ולכן מספיק לעקוב אחרי נקודה אחת. זה בדיוק המודל של גוף נקודתי.

  # ---------------------------------------------------------------- OBJ-1.1-2: signed displacement
  - id: Q-1.1-dx-back
    type: numeric
    objectives: [OBJ-1.1-2]
    level: basic
    prompt: >-
      על כביש ישר, הכיוון החיובי מזרחה. רוכבת אופניים נסעה מ-$x_1 = 120\,\text{m}$ ל-$x_2 = 30\,\text{m}$ בלי לחזור
      לאחור. מה ההעתק שלה, $\Delta x$?
    answer: -90
    unit: m
    tolerance: 0.01
    correctFeedback: 'נכון: $\Delta x = x_2 - x_1 = 30\,\text{m} - 120\,\text{m} = -90\,\text{m}$. הסימן אומר שהיא נסעה מערבה, נגד הכיוון החיובי.'
    wrongFeedback: 'ההעתק הוא המקום הסופי פחות המקום ההתחלתי: $\Delta x = x_2 - x_1$.'
    commonWrong:
      - value: 90
        feedback: 'הגודל נכון, אבל הסימן חלק מהתשובה. $x_2$ קטן מ-$x_1$, כלומר היא נסעה נגד הכיוון החיובי, ולכן $\Delta x$ שלילי.'
      - value: 30
        feedback: '30 מטרים הוא המקום הסופי, לא השינוי במקום. ההעתק משווה בין הסוף להתחלה: $30 - 120$.'
        misconception: MC-position-equals-displacement
      - value: 150
        feedback: 'חיברתם את שני המקומות. ההעתק הוא הפרש: מחסירים את המקום ההתחלתי מהסופי.'
    hints:
      - 'כתבו $\Delta x = x_2 - x_1$, והציבו עם הסימנים.'

  - id: Q-1.1-dx-cross
    type: numeric
    objectives: [OBJ-1.1-2]
    level: basic
    prompt: >-
      על ציר שהכיוון החיובי שלו ימינה, חתול עבר מ-$x_1 = -15\,\text{m}$ ל-$x_2 = 25\,\text{m}$ בלי לחזור לאחור. מה
      ההעתק שלו?
    answer: 40
    unit: m
    tolerance: 0.01
    correctFeedback: 'נכון: $\Delta x = 25\,\text{m} - (-15\,\text{m}) = +40\,\text{m}$. הוא עבר 15 מטרים עד הראשית, ועוד 25 מטרים אחריה.'
    wrongFeedback: 'הציבו ב-$\Delta x = x_2 - x_1$, ושימו לב לחיסור של מספר שלילי.'
    commonWrong:
      - value: 10
        feedback: 'חיסרתם $25 - 15$ ושכחתם שהמקום ההתחלתי שלילי. מינוס של מינוס הוא פלוס: $25 - (-15) = 40$.'
      - value: -40
        feedback: 'חישבתם $x_1 - x_2$. ההעתק הוא הסוף פחות ההתחלה, והחתול נע ימינה, בכיוון החיובי.'
      - value: 25
        feedback: '25 מטרים הוא המקום הסופי. הוא היה נכון כהעתק רק אם החתול היה מתחיל בראשית.'
        misconception: MC-position-equals-displacement
    hints:
      - 'ציירו את הציר: כמה מטרים יש מ-$-15$ עד 0, וכמה מ-0 עד 25?'

  - id: Q-1.1-elevator
    type: numeric
    objectives: [OBJ-1.1-2]
    level: mid
    prompt: >-
      בבניין, הגובה בין קומה לקומה הוא $3.0\,\text{m}$. בוחרים ציר אנכי: הראשית בקומת הקרקע (קומה 0), והכיוון
      החיובי למעלה. מעלית עלתה מקומה 2 לקומה 6, ואחר כך ירדה לקומה $-1$, החניון. מה ההעתק של המעלית בכל הנסיעה?
    answer: -9
    unit: m
    tolerance: 0.01
    correctFeedback: >-
      נכון: $x_1 = 2\cdot3.0 = 6\,\text{m}$ ו-$x_2 = -1\cdot3.0 = -3\,\text{m}$, ולכן
      $\Delta x = -3\,\text{m} - 6\,\text{m} = -9\,\text{m}$. העלייה לקומה 6 לא משנה את ההעתק.
    wrongFeedback: 'ההעתק תלוי רק במקום בהתחלה ובמקום בסוף. המירו את הקומות למטרים.'
    commonWrong:
      - value: 33
        feedback: >-
          זו הדרך: 12 מטרים למעלה ועוד 21 מטרים למטה. ההעתק לא סופר את כל הנסיעה, רק משווה בין הסוף להתחלה.
        misconception: MC-distance-equals-displacement
      - value: 9
        feedback: 'הגודל נכון, אבל המעלית סיימה נמוך יותר משהתחילה, נגד הכיוון החיובי, ולכן $\Delta x$ שלילי.'
      - value: -3
        feedback: 'זה המקום הסופי, החניון. ההעתק משווה אותו למקום ההתחלתי, קומה 2.'
        misconception: MC-position-equals-displacement
      - value: 12
        feedback: 'זה ההעתק של החלק הראשון בלבד, מקומה 2 לקומה 6. השאלה שואלת על כל הנסיעה.'
    hints:
      - 'מה המקום של קומה 2, ומה המקום של קומה $-1$, במטרים?'

  - id: Q-1.1-two-origins
    type: twotier
    objectives: [OBJ-1.1-2, OBJ-1.1-1]
    qualitative: true
    level: mid
    prompt: >-
      דנה ויוסי מתארים אותה ריצה על שביל ישר. לשניהם הכיוון החיובי מזרחה, אבל דנה שמה את הראשית בשער הפארק, ויוסי
      במזרקה. האם הם יקבלו אותו העתק לריצה?
    choices:
      - text: כן, אותו העתק בדיוק.
        correct: true
        feedback: נכון. המקומות שלהם שונים, אבל ההפרש בין המקום הסופי למקום ההתחלתי זהה.
      - text: לא, כי כל אחד מהם רושם מקומות אחרים.
        feedback: >-
          המקומות באמת שונים, אבל ההעתק הוא הפרש של מקומות. הזזת הראשית משנה את שני המקומות באותה כמות, ולכן ההפרש ביניהם לא משתנה.
        misconception: MC-position-equals-displacement
      - text: אי אפשר לדעת בלי לדעת כמה רחוקה המזרקה מהשער.
        feedback: >-
          בשביל המקומות זה נחוץ, אבל לא בשביל ההעתק. נסו מספרים: אם המזרקה 50 מטרים מזרחית לשער, כל מקום של יוסי
          קטן ב-50 מזה של דנה, וההפרש נשאר אותו הפרש.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'הזזת הראשית משנה את שני המקומות באותה כמות, ולכן ההפרש $\Delta x = x_2 - x_1$ לא משתנה.'
        correct: true
        feedback: 'בדיוק. אם המזרקה 50 מטרים מזרחית לשער, כל מקום של יוסי קטן ב-50 מזה של דנה, וההעתק שלו הוא $(x_2 - 50) - (x_1 - 50) = x_2 - x_1$, כמו של דנה.'
      - text: ההעתק שווה למקום הסופי, והמקום הסופי שונה אצל כל אחד.
        feedback: 'ההעתק הוא השינוי במקום, $x_2 - x_1$, לא המקום הסופי. הם שווים רק כשהגוף התחיל בראשית.'
        misconception: MC-position-equals-displacement
      - text: לכל גוף יש מקום אחד אמיתי, ולכן רק אחד מהם מודד נכון.
        feedback: אין מקום "אמיתי" אחד. כל ראשית שבוחרים נותנת מספרים נכונים, כל עוד מצהירים עליה.
        misconception: MC-position-absolute

  - id: Q-1.1-flip-sign
    type: mc
    objectives: [OBJ-1.1-2]
    qualitative: true
    level: basic
    prompt: >-
      גוף נע על ציר, וההעתק שלו הוא $\Delta x = +6\,\text{m}$. עכשיו הופכים את הכיוון החיובי של הציר, ומשאירים את
      הראשית במקומה. מה יהיה ההעתק של אותה תנועה?
    choices:
      - text: '$\Delta x = -6\,\text{m}$'
        correct: true
        feedback: >-
          נכון. הגוף זז לאותו צד כמו קודם, אבל עכשיו הצד הזה הוא הכיוון השלילי. הגודל נשאר 6 מטרים, והסימן מתהפך.
      - text: '$\Delta x = +6\,\text{m}$, כי הגוף לא שינה את התנועה שלו.'
        feedback: >-
          התנועה באמת לא השתנתה, אבל הסימן אומר "בכיוון החיובי" או "נגדו", והכיוון החיובי התהפך. נסו את הכפתור
          באיור 1.1א.
      - text: '$\Delta x = 0$, כי אחרי ההיפוך החלק החיובי והחלק השלילי מבטלים זה את זה.'
        feedback: ההיפוך לא מוסיף תנועה. הגוף עדיין סיים 6 מטרים מהמקום שבו התחיל, רק בצד שקוראים לו עכשיו שלילי.
      - text: אי אפשר לדעת בלי לדעת איפה הגוף התחיל.
        feedback: >-
          המקום ההתחלתי משפיע על המקומות, לא על ההעתק. כל המקומות מחליפים סימן, ולכן גם ההפרש ביניהם מחליף סימן.

  - id: Q-1.1-rank-dx
    type: rank
    objectives: [OBJ-1.1-2]
    level: mid
    prompt: >-
      ארבע נסיעות על אותו ציר, שהכיוון החיובי שלו ימינה. בכל נסיעה המקומות כתובים במטרים, לפי הסדר שבו הגוף עבר בהם.
      דרגו את הנסיעות לפי ההעתק $\Delta x$, עם הסימן, מהגדול לקטן.
    items:
      - { id: A, label: 'מ-0 ל-5' }
      - { id: B, label: 'מ-5 ל-0' }
      - { id: C, label: 'מ-0 ל-8, ומשם חזרה ל-2' }
      - { id: D, label: 'מ-3 ל-10, ומשם חזרה ל-3' }
    order: [A, C, D, B]
    correctFeedback: >-
      נכון: ההעתקים הם $+5$, $+2$, $0$ ו-$-5$ מטרים. בנסיעה D הגוף עבר 14 מטרים, אבל חזר למקום שבו התחיל, ולכן
      ההעתק שלה אפס, גדול מההעתק השלילי של B.
    wrongFeedback: >-
      חשבו בכל נסיעה רק "סוף פחות התחלה", בלי האמצע. מספר שלילי קטן מאפס, גם אם הגודל שלו גדול.
    hints:
      - 'הנקודה שבאמצע הנסיעה לא משפיעה על ההעתק.'

  # ---------------------------------------------------------------- OBJ-1.1-3: displacement vs path length
  - id: Q-1.1-path
    type: numeric
    objectives: [OBJ-1.1-3]
    level: mid
    prompt: >-
      על ציר שהכיוון החיובי שלו מזרחה, כלב רץ מ-$x = 2\,\text{m}$ ל-$x = 10\,\text{m}$, הסתובב, ורץ ל-$x = -4\,\text{m}$.
      מה הדרך שהכלב עבר?
    answer: 22
    unit: m
    tolerance: 0.01
    correctFeedback: 'נכון: 8 מטרים מזרחה (מ-2 ל-10) ועוד 14 מטרים מערבה (מ-10 ל-$-4$). הדרך היא $8 + 14 = 22\,\text{m}$, בלי סימן.'
    wrongFeedback: 'חלקו את הריצה לקטעים בין נקודות הסיבוב, וחברו את האורכים של כל הקטעים.'
    commonWrong:
      - value: -6
        feedback: 'זה ההעתק, $\Delta x = -4 - 2 = -6\,\text{m}$. הדרך סופרת את כל המטרים שהכלב רץ, לכל כיוון, ואף פעם אינה שלילית.'
        misconception: MC-distance-equals-displacement
      - value: 6
        feedback: 'זה גודל ההעתק, המרחק בין נקודת ההתחלה לנקודת הסוף. אבל הכלב לא רץ ישר מההתחלה לסוף: הוא הגיע קודם ל-10.'
        misconception: MC-distance-equals-displacement
      - value: 14
        feedback: 'זה רק הקטע השני, מ-10 ל-$-4$. הוסיפו גם את הקטע הראשון, מ-2 ל-10.'
      - value: 2
        feedback: 'חיסרתם את הקטע השני מהראשון ($8 - 14$) וזרקתם את הסימן. בדרך לא מחסירים: כל קטע נוסף לדרך, לאיזה כיוון שלא יהיה.'
      - value: 16
        feedback: >-
          חיברתם את המקומות עצמם, $2 + 10 + 4$. אבל מקום אומר איפה הכלב נמצא, לא כמה הוא רץ. הדרך היא סכום האורכים של
          הקטעים: מ-2 עד 10 הם 8 מטרים, ומ-10 עד $-4$ הם 14 מטרים.
    hints:
      - 'כמה מטרים בקטע הראשון? כמה בשני?'

  - id: Q-1.1-run-app
    type: twotier
    objectives: [OBJ-1.1-3]
    qualitative: true
    level: basic
    prompt: >-
      באימון כדורסל, ליאור רץ "ריצת הלוך-חזור": הוא מתחיל ליד קונוס A, רץ לקונוס B שנמצא $20\,\text{m}$ ממנו, חוזר
      ל-A, רץ שוב ל-B, וחוזר שוב ל-A. שעון הריצה שלו הציג $80\,\text{m}$. מה ההעתק של ליאור בכל התרגיל?
    choices:
      - text: אפס.
        correct: true
        feedback: נכון. הוא סיים ליד קונוס A, בדיוק במקום שבו התחיל.
      - text: '$80\,\text{m}$'
        feedback: >-
          80 מטרים הם הדרך: כל המטרים שליאור רץ, הלוך ושוב. ההעתק משווה רק בין המקום שבו סיים למקום שבו התחיל.
        misconception: MC-distance-equals-displacement
      - text: '$20\,\text{m}$'
        feedback: >-
          20 מטרים הם גודל ההעתק כשליאור הגיע ל-B, באמצע התרגיל. אחרי החזרה ל-A, המקום שלו שוב זהה למקום ההתחלתי.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: ההעתק תלוי רק במקום בהתחלה ובמקום בסוף, והם אותו מקום.
        correct: true
        feedback: 'בדיוק: $\Delta x = x_2 - x_1 = 0$ כש-$x_2 = x_1$, מה שלא יקרה באמצע.'
      - text: ההעתק הוא כל המטרים שהוא רץ, כמו ששעון הריצה סופר.
        feedback: שעון הריצה סופר דרך. העתק ודרך שווים רק כשאין חזרה לאחור.
        misconception: MC-distance-equals-displacement
      - text: ההעתק אפס כי בסוף התרגיל ליאור עומד במקום.
        feedback: >-
          העמידה בסוף לא קובעת את ההעתק. אילו ליאור היה עוצר ליד B, הוא היה עומד במקום, וההעתק שלו היה 20 מטרים. מה שקובע
          הוא שהמקום הסופי שלו שווה למקום ההתחלתי.

  - id: Q-1.1-always-true
    type: mc
    objectives: [OBJ-1.1-3]
    qualitative: true
    level: mid
    prompt: >-
      גוף נע הלוך ושוב לאורך קו ישר. איזו מהטענות נכונה **תמיד**, לכל תנועה כזו?
    choices:
      - text: הדרך גדולה מגודל ההעתק או שווה לו.
        correct: true
        feedback: >-
          נכון. הדרך המינימלית מנקודה אחת לאחרת היא ללכת ישר, בלי לחזור. כל חזרה לאחור מוסיפה דרך ולא מוסיפה העתק.
      - text: הדרך שווה לגודל ההעתק.
        feedback: >-
          רק כשהגוף לא חזר לאחור. מי שהלך 6 מטרים קדימה ו-6 חזרה עבר דרך של 12 מטרים, וההעתק שלו אפס.
        misconception: MC-distance-equals-displacement
      - text: כשהגוף נע נגד הכיוון החיובי, הדרך שלילית.
        feedback: >-
          ההעתק יכול להיות שלילי, הדרך לא. הדרך היא אורך, כמו מספר הצעדים במד-צעדים, ולכן היא אף פעם לא שלילית.
        misconception: MC-distance-equals-displacement
      - text: ההעתק גדול מהדרך כשהגוף נע בכיוון החיובי.
        feedback: >-
          ההעתק יכול לכל היותר להשתוות לדרך, כשהגוף נע כל הזמן בכיוון אחד. הוא לא יכול לעבור אותה.
