# Question bank for lesson 1.5 (instantaneous velocity). Strings may hold $inline$ TeX; they are rendered at build time.
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with src/physics/kinematics.ts (secantSlope, avgVelocity, velocity): screens/check-1-5b.ts.

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.5-1: secant slope = average velocity
  - id: Q-1.5-chord-slope
    type: numeric
    objectives: [OBJ-1.5-1]
    prompt: >-
      גרף המקום-זמן של גוף מעוקל. הכיוון החיובי הוא ימינה. ברגע $t = 2\,\text{s}$ הגוף נמצא ב-$x = 6\,\text{m}$, וברגע
      $t = 5\,\text{s}$ הוא נמצא ב-$x = 21\,\text{m}$. מה השיפוע של המיתר בין שתי הנקודות האלה על הגרף, כלומר המהירות
      הממוצעת בקטע?
    answer: 5
    unit: m/s
    correctFeedback: 'נכון: $\bar{v} = \dfrac{\Delta x}{\Delta t} = \dfrac{21 - 6}{5 - 2} = \dfrac{15}{3} = 5\,\text{m/s}$, בכיוון החיובי.'
    wrongFeedback: 'השיפוע של מיתר הוא השינוי במקום חלקי השינוי בזמן, בין שתי הנקודות שהוא מחבר.'
    commonWrong:
      - value: 4.2
        feedback: >-
          חילקתם את המקום בזמן של הנקודה השנייה, $21/5$. זה השיפוע של הקו מהראשית של הגרף, לא של המיתר. צריך את
          ההפרשים: $\Delta x = 21 - 6$ ו-$\Delta t = 5 - 2$.
        misconception: MC-x-over-t
      - value: 3
        feedback: 'את $\Delta x = 15\,\text{m}$ חישבתם נכון, אבל חילקתם ב-5, הזמן של הנקודה השנייה. הקטע נמשך $\Delta t = 5 - 2 = 3\,\text{s}$.'
    hints:
      - 'מה $\Delta x$ ומה $\Delta t$ בין שתי הנקודות?'

  - id: Q-1.5-interval-matters
    type: mc
    objectives: [OBJ-1.5-1]
    qualitative: true
    prompt: >-
      גרף המקום-זמן של מכונית מתעקל כלפי מעלה. תלמיד חישב את המהירות הממוצעת בין $t = 0$ ל-$t = 2\,\text{s}$, ואחר כך בין
      $t = 0$ ל-$t = 6\,\text{s}$, וקיבל שני מספרים שונים. מה נכון?
    choices:
      - text: הוא לא טעה. בגרף מעוקל לכל מיתר יש שיפוע אחר, ולכן המהירות הממוצעת תלויה בקטע שבוחרים.
        correct: true
        feedback: >-
          נכון. רק בגרף ישר, בתנועה קצובה, כל המיתרים הם אותו קו עם אותו שיפוע. כאן הגרף נעשה תלול יותר, ולכן המיתר
          הארוך תלול מהקצר.
      - text: הוא טעה. למכונית יש מהירות ממוצעת אחת, ושני החישובים היו צריכים לתת אותו מספר.
        feedback: >-
          המהירות הממוצעת שייכת תמיד לקטע מסוים. בגרף מעוקל קטעים שונים נותנים מיתרים בשיפועים שונים, ולכן מספרים
          שונים. אין "מהירות ממוצעת של המכונית" בלי לומר באיזה קטע.
        misconception: MC-curve-gives-constant
      - text: הוא טעה, כי בגרף מעוקל אי אפשר לחשב מהירות ממוצעת. אפשר רק לקרוא משיק.
        feedback: >-
          אפשר: המהירות הממוצעת היא $\Delta x/\Delta t$ בין שתי נקודות, וזה נכון לכל גרף. המשיק נותן משהו אחר, את
          המהירות ברגע אחד.
      - text: הוא לא טעה, אבל הקטע הארוך נותן את המהירות האמיתית, כי יש בו יותר מידע.
        feedback: >-
          שני המספרים נכונים, כל אחד לקטע שלו. אף אחד מהם אינו "המהירות האמיתית": בכל רגע המכונית נוסעת במהירות אחרת.
        misconception: MC-instantaneous-is-average

  - id: Q-1.5-same-endpoints
    type: twotier
    objectives: [OBJ-1.5-1]
    qualitative: true
    level: mid
    prompt: >-
      שני רצים יוצאים יחד מקו הזינוק ומגיעים יחד לקו הסיום, $100\,\text{m}$ משם, אחרי $20\,\text{s}$. גרף המקום-זמן של
      הרץ הראשון ישר. הגרף של השני מתעקל: הוא התחיל לאט וסיים מהר. איך משתוות המהירויות הממוצעות שלהם בכל המרוץ?
    choices:
      - text: הן שוות.
        correct: true
        feedback: 'נכון. לשניהם $\bar{v} = 100/20 = 5\,\text{m/s}$.'
      - text: לרץ השני מהירות ממוצעת גדולה יותר, כי בסוף הוא רץ מהר יותר מהראשון.
        feedback: >-
          בסוף הוא אכן מהיר יותר, אבל בהתחלה הוא היה איטי יותר. המהירות הממוצעת תלויה רק בהעתק ובזמן של כל הקטע.
        misconception: MC-instantaneous-is-average
      - text: לרץ הראשון מהירות ממוצעת גדולה יותר, כי הוא הוביל רוב הזמן.
        feedback: >-
          ההובלה באמצע לא משנה את המהירות הממוצעת. שניהם התחילו באותו מקום, סיימו באותו מקום ובאותו זמן.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: לשניהם אותו $\Delta x$ ואותו $\Delta t$, ולכן המיתר בין נקודת הזינוק לנקודת הסיום משותף לשני הגרפים.
        correct: true
        feedback: >-
          בדיוק. המיתר של הגרף המעוקל מהזינוק לסיום הוא הקו הישר של הרץ הראשון, ולכן לשניהם אותו שיפוע.
      - text: הגרף המעוקל ארוך יותר על הדף, ולכן הרץ השני עבר יותר דרך.
        feedback: >-
          האורך של הקו על הדף אינו הדרך שהרץ עבר. שניהם עברו $100\,\text{m}$ על אותו מסלול ישר. הגרף מראה מקום מול
          זמן, לא את צורת המסלול.
        misconception: MC-graph-is-path
      - text: המהירות הממוצעת היא הממוצע של המהירות בהתחלה ושל המהירות בסוף.
        feedback: >-
          זה נכון רק במקרים מיוחדים. ההגדרה היא העתק חלקי זמן, ומכאן מקבלים מיד שהמספרים שווים.
        misconception: MC-average-of-speeds

  # ---------------------------------------------------------------- OBJ-1.5-2: tangent and shrinking interval
  - id: Q-1.5-table-limit
    type: numeric
    objectives: [OBJ-1.5-2]
    prompt: >-
      כדור מתגלגל במורד מדרון, והכיוון החיובי הוא במורד. תלמידה חישבה את השיפוע של מיתרים שמתחילים ברגע
      $t = 3\,\text{s}$ ונמשכים $\Delta t$:

      $\Delta t = 1\,\text{s}$: $7\,\text{m/s}$; $\Delta t = 0.5\,\text{s}$: $6.5\,\text{m/s}$; $\Delta t = 0.1\,\text{s}$:
      $6.1\,\text{m/s}$; $\Delta t = 0.01\,\text{s}$: $6.01\,\text{m/s}$.

      מה המהירות הרגעית של הכדור ברגע $t = 3\,\text{s}$?
    answer: 6
    unit: m/s
    tolerance: 0.001
    correctFeedback: >-
      נכון. בכל שורה השיפוע גדול מ-$6\,\text{m/s}$ בדיוק ב-$\Delta t$: ב-$1$, ב-$0.5$, ב-$0.1$ וב-$0.01$. כש-$\Delta t$ קטן
      עוד ועוד, גם התוספת הזו קטנה עוד ועוד, והשיפוע מתקרב ל-$6\,\text{m/s}$. כל מיתר תלול קצת מהמשיק, כי הכדור
      מאיץ בתוך הקטע.
    wrongFeedback: 'לאן מתקרבים המספרים כש-$\Delta t$ קטן עוד ועוד?'
    commonWrong:
      - value: 7
        feedback: >-
          זו המהירות הממוצעת בשנייה שאחרי $t = 3\,\text{s}$. בשנייה הזו הכדור האיץ, ולכן הממוצע גדול מהמהירות ברגע
          עצמו.
        misconception: MC-instantaneous-is-average
      - value: 0
        feedback: >-
          ברגע אחד אמנם לא עובר זמן, אבל לא מחלקים אפס באפס. מחשבים קטעים קטנים יותר ויותר, והשיפוע מתייצב על מספר
          מסוים.
        misconception: MC-instant-undefined
      - value: 6.01
        feedback: >-
          זה שיפוע המיתר הקצר ביותר בטבלה: עדיין מהירות ממוצעת, על $0.01\,\text{s}$. השוו כל שיפוע ל-$6$: הוא גדול
          ממנו ב-$1$, ב-$0.5$, ב-$0.1$ וב-$0.01$, כלומר בדיוק ב-$\Delta t$. מיתר קצר יותר ייתן תוספת קטנה עוד יותר. לאיזה
          מספר השיפוע מתקרב כשהתוספת נעלמת?

  - id: Q-1.5-tangent-points
    type: numeric
    objectives: [OBJ-1.5-2]
    level: mid
    prompt: >-
      הכיוון החיובי הוא צפונה. בגרף המקום-זמן של אופנוע, הנקודה של $t = 6\,\text{s}$ היא $(6\,\text{s},\ 20\,\text{m})$.
      המשיק בנקודה הזו עובר גם דרך $(2\,\text{s},\ 30\,\text{m})$ ודרך $(10\,\text{s},\ 10\,\text{m})$. מה המהירות של
      האופנוע ב-$t = 6\,\text{s}$? כתבו את המספר עם הסימן שלו.
    answer: -2.5
    unit: m/s
    correctFeedback: >-
      נכון: $v = \dfrac{10 - 30}{10 - 2} = \dfrac{-20}{8} = -2.5\,\text{m/s}$. הסימן אומר שהאופנוע נע דרומה, נגד הכיוון החיובי.
    wrongFeedback: 'בחרו שתי נקודות על המשיק, וחשבו $\Delta x/\Delta t$ ביניהן, עם הסימן.'
    commonWrong:
      - value: 2.5
        feedback: >-
          הגודל נכון, אבל המשיק יורד: $x$ קטן מ-30 ל-10 כשהזמן גדל. לכן $\Delta x$ שלילי, והמהירות $-2.5\,\text{m/s}$.
      - value: 3.33
        feedback: >-
          חילקתם $20/6$, את המקום של נקודת ההשקה בזמן שלה. זה השיפוע של הקו מהראשית, לא של המשיק. השתמשו בשתי
          הנקודות שעל המשיק.
        misconception: MC-x-over-t
    hints:
      - 'כש-$t$ גדל מ-2 ל-10 שניות, מה קורה ל-$x$ על המשיק?'

  - id: Q-1.5-speedometer
    type: mc
    objectives: [OBJ-1.5-2]
    qualitative: true
    prompt: >-
      מד המהירות של מכונית מראה 72 קמ״ש. מה המספר הזה?
    choices:
      - text: גודל המהירות הרגעית של המכונית, בלי הכיוון.
        correct: true
        feedback: >-
          נכון. המכשיר מודד העתק קטן מאוד בזמן קצר מאוד, ולכן התוצאה קרובה מאוד למהירות הרגעית. הוא לא יודע לאן
          נוסעים: גם ברוורס הוא מראה מספר חיובי.
      - text: המהירות הממוצעת מתחילת הנסיעה.
        feedback: >-
          ממוצע מתחילת נסיעה ארוכה כמעט לא זז, אבל מד המהירות משתנה מרגע לרגע: הוא עולה כשלוחצים על הגז ויורד
          כשבולמים. (המחשב של המכונית מראה ממוצע אחר: הדרך חלקי הזמן, כלומר המהירות הממוצעת לפי הדרך משיעור 1.3.
          המהירות הממוצעת היא העתק חלקי זמן.)
        misconception: MC-instantaneous-is-average
      - text: שום דבר מדויק. ברגע אחד המכונית לא זזה, ולכן אין לה מהירות, והמכשיר רק מעריך.
        feedback: >-
          למכונית יש מהירות בכל רגע: הערך ש-$\Delta x/\Delta t$ מתקרב אליו כשהקטע קטן. המכשיר מודד בקטע קצר כל כך
          שההבדל זניח.
        misconception: MC-instant-undefined
      - text: המהירות של המכונית, כולל הכיוון שלה.
        feedback: >-
          מד המהירות מראה רק מספר אחד, חיובי. הוא לא יודע אם נוסעים צפונה או דרומה, ולכן הוא מראה את גודל המהירות.

  - id: Q-1.5-notation
    type: twotier
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בדף הנוסחאות כתוב "מהירות רגעית: $v = \dfrac{dx}{dt}$". מה הפירוש של הכתיב הזה?
    choices:
      - text: >-
          הערך שאליו מתקרב $\Delta x/\Delta t$ כשקטע הזמן $\Delta t$ סביב הרגע הזה קטן עוד ועוד.
        correct: true
        feedback: 'נכון. בגרף מקום-זמן זה השיפוע של המשיק.'
      - text: המקום של הגוף חלקי הזמן שעבר מההתחלה.
        feedback: >-
          זה $x/t$, השיפוע של הקו מהראשית של הגרף. ה-$d$ מחליף את ה-$\Delta$: מדובר בשינויים קטנים, לא במקום ובזמן
          עצמם.
        misconception: MC-x-over-t
      - text: אפס חלקי אפס, כי ברגע אחד לא עובר זמן. לכן זו רק דרך לכתוב שהגוף עומד.
        feedback: >-
          אף פעם לא מחלקים אפס באפס. מחשבים יחס של שני מספרים קטנים, שאף אחד מהם אינו אפס, ושואלים לאן היחס מתקרב.
        misconception: MC-instant-undefined
    reasonPrompt: ואיך מוצאים את המספר הזה בפועל, בלי חשבון של פרק 8?
    reasons:
      - text: מחשבים את $\Delta x/\Delta t$ לקטעים קצרים יותר ויותר, או משרטטים משיק וקוראים את השיפוע שלו.
        correct: true
        feedback: 'בדיוק. אלה שתי הדרכים של השיעור: טבלה של מיתרים מתקצרים, ושיפוע של משיק.'
      - text: מחשבים את $\Delta x/\Delta t$ לקטע אחד, ארוך ככל האפשר, כדי שיהיו פחות שגיאות מדידה.
        feedback: >-
          בקטע ארוך המהירות משתנה, והתוצאה היא ממוצע שיכול להיות רחוק מאוד מהמהירות ברגע עצמו, אפילו בסימן.
        misconception: MC-instantaneous-is-average
      - text: מודדים את הזווית בין הגרף לציר הזמן במד-זווית.
        feedback: >-
          הזווית שבציור תלויה בקנה המידה של הצירים: אם מותחים את ציר הזמן, הזווית משתנה, והמהירות לא. השיפוע נמדד
          ביחידות של הצירים, $\Delta x/\Delta t$.
        misconception: MC-slope-is-angle

  # ---------------------------------------------------------------- OBJ-1.5-3: fastest, at rest, turning
  - id: Q-1.5-steep-not-high
    type: mc
    objectives: [OBJ-1.5-3]
    qualitative: true
    prompt: >-
      על גרף מקום-זמן של גוף מסומנות שלוש נקודות. בנקודה P הגרף בפסגה, והמשיק אופקי. בנקודה Q הגרף נמוך ויורד בתלילות.
      בנקודה R הגרף גבוה ועולה בשיפוע מתון. באיזו נקודה גודל המהירות של הגוף הכי גדול?
    choices:
      - text: Q, כי שם המשיק הכי תלול.
        correct: true
        feedback: >-
          נכון. גודל המהירות הוא גודל השיפוע של המשיק, בלי קשר לגובה. ב-Q המהירות שלילית, והגוף נע נגד הכיוון
          החיובי, מהר.
      - text: P, כי שם הגרף הכי גבוה.
        feedback: >-
          ב-P המשיק אופקי, ולכן $v = 0$: זה הרגע שבו הגוף משנה כיוון. הגובה של הגרף אומר איפה הגוף נמצא, לא כמה מהר
          הוא זז.
        misconception: MC-height-not-slope
      - text: R, כי שם הגרף גם גבוה וגם עולה.
        feedback: >-
          הגובה לא משנה, ושיפוע מתון פירושו מהירות קטנה. גם סימן השיפוע לא קובע את גודל המהירות: ירידה תלולה היא
          תנועה מהירה בכיוון השלילי.
        misconception: MC-negative-velocity-slower
      - text: אי אפשר לדעת בלי המספרים על הצירים.
        feedback: >-
          כדי לחשב את המהירות צריך מספרים, אבל כדי להשוות שלוש נקודות על אותו גרף, עם אותם צירים, מספיק להשוות את
          התלילות של המשיקים.

  - id: Q-1.5-top-of-graph
    type: mc
    objectives: [OBJ-1.5-3]
    qualitative: true
    prompt: >-
      גרף המקום-זמן של כדור עולה, מגיע לפסגה ברגע $t = 3\,\text{s}$, ויורד. הכיוון החיובי הוא למעלה. מה קורה ברגע
      $t = 3\,\text{s}$?
    choices:
      - text: המהירות אפס לרגע אחד בלבד, והכדור משנה כיוון.
        correct: true
        feedback: >-
          נכון. המשיק בפסגה אופקי, ולכן $v = 0$. רגע לפני כן הגרף עלה ($v$ חיובית), ורגע אחרי הוא יורד ($v$ שלילית).
      - text: הכדור עומד במנוחה זמן מה, ואחר כך מתחיל לרדת.
        feedback: >-
          עמידה של זמן מה נראית בגרף כקטע אופקי. כאן הגרף מגיע לפסגה ומיד ממשיך לרדת, והמשיק אופקי רק בנקודה אחת,
          ברגע $t = 3\,\text{s}$: המנוחה רגעית.
      - text: המהירות של הכדור הכי גדולה, כי הוא בגובה הכי גבוה.
        feedback: >-
          הגובה של הגרף הוא המקום, לא המהירות. בפסגה השיפוע אפס, ולכן המהירות אפס.
        misconception: MC-height-not-slope
      - text: המהירות שלילית, כי הכדור מתחיל לרדת.
        feedback: >-
          המהירות שלילית רק **אחרי** הפסגה. בפסגה עצמה המשיק אופקי, והמהירות אפס.

  - id: Q-1.5-direction-from-slope
    type: vector
    objectives: [OBJ-1.5-3]
    qualitative: true
    prompt: >-
      הכיוון החיובי של ציר המקום הוא מזרחה. ברגע מסוים גרף המקום-זמן של גוף נמצא מעל ציר הזמן ($x > 0$), אבל יורד. לאיזה
      כיוון נע הגוף באותו רגע?
    answer: w
    correctFeedback: >-
      נכון. הגרף יורד, ולכן שיפוע המשיק שלילי: $v < 0$, נגד הכיוון החיובי, כלומר מערבה. זה שהגוף נמצא בצד המזרחי של
      הראשית ($x > 0$) לא משנה את הכיוון שבו הוא נע.
    wrongFeedback: 'הכיוון של התנועה נקבע לפי הסימן של שיפוע המשיק, לא לפי הסימן של $x$.'
    wrong:
      - dir: e
        feedback: >-
          $x > 0$ אומר רק שהגוף נמצא מזרחית לראשית. הגרף יורד, כלומר $x$ קטן עם הזמן: הגוף מתקרב לראשית מהמזרח, ונע
          מערבה.
        misconception: MC-height-not-slope
      - dir: zero
        feedback: 'הגוף במנוחה רק כשהמשיק אופקי. כאן הגרף יורד, ולכן הגוף נע.'

  - id: Q-1.5-rank-tangents
    type: rank
    objectives: [OBJ-1.5-3]
    level: mid
    prompt: >-
      על גרף מקום-זמן של גוף שרטטו משיקים בארבעה רגעים, וקראו את השיפועים שלהם (במטרים לשנייה). דרגו את הרגעים לפי
      **גודל** המהירות, מהגדול לקטן.
    items:
      - { id: T1, label: 'רגע 1: שיפוע המשיק $+2$' }
      - { id: T2, label: 'רגע 2: שיפוע המשיק $-5$' }
      - { id: T3, label: 'רגע 3: משיק אופקי' }
      - { id: T4, label: 'רגע 4: שיפוע המשיק $+3.5$' }
    order: [T2, T4, T1, T3]
    correctFeedback: >-
      נכון: הגדלים הם 5, 3.5, 2 ו-0. ברגע 2 הגוף נע נגד הכיוון החיובי, אבל הכי מהר; ברגע 3 הוא במנוחה רגעית.
    wrongFeedback: 'גודל המהירות הוא גודל השיפוע, בלי הסימן. שיפוע $-5$ פירושו 5 מטרים בכל שנייה, נגד הכיוון החיובי.'
