# Question bank of lesson 1.10 (velocity and acceleration in the plane). Strings may hold $inline$ TeX; they are
# rendered at build time. Single-quoted or >- strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with src/physics/vec.ts and planar.ts (see the lesson report).

chapter: 1
questions:
  # ------------------------------------------------ OBJ-1.10-1 position, displacement, velocity in the plane
  - id: Q-1.10-v-tangent
    type: vector
    objectives: [OBJ-1.10-1]
    qualitative: true
    prompt: >-
      מכונית נוסעת בכיכר עגולה, נגד כיוון השעון כשמסתכלים מלמעלה (צפון למעלה, מזרח ימינה).
      ברגע מסוים היא נמצאת בנקודה המזרחית ביותר של הכיכר. מה כיוון המהירות שלה ברגע הזה?
    answer: 'n'
    correctFeedback: >-
      נכון. המהירות משיקה למסלול. בנקודה המזרחית המשיק אנכי, והמכונית בדרך צפונה, כי היא נוסעת נגד כיוון השעון.
    wrong:
      - dir: 'w'
        feedback: >-
          מערבה זה אל מרכז הכיכר. בנקודה הזו לשם מצביעה **התאוצה**, לא המהירות. המהירות משיקה למסלול, מאונכת לקו אל המרכז.
        misconception: MC-accel-along-velocity
      - dir: 'e'
        feedback: >-
          מזרחה זה הכיוון מהמרכז אל המכונית, כלומר כיוון וקטור המקום מהמרכז. המהירות מאונכת לו: היא משיקה למסלול.
      - dir: 's'
        feedback: >-
          המשיק אכן אנכי, אבל דרומה הייתה המכונית נוסעת עם כיוון השעון. נגד כיוון השעון, מהנקודה המזרחית ממשיכים צפונה.
    wrongFeedback: >-
      המהירות הרגעית משיקה למסלול ומצביעה לאן שהגוף נע. ציירו את המעגל, סמנו את הנקודה המזרחית, ושאלו לאן המכונית תגיע רגע אחר כך.
    hints:
      - 'נגד כיוון השעון פירושו: ממזרח לצפון, משם למערב, לדרום, וחזרה למזרח.'

  - id: Q-1.10-avg-velocity
    type: numeric
    objectives: [OBJ-1.10-1]
    level: mid
    prompt: >-
      ראשית הצירים בפינת חצר, $x$ מזרחה ו-$y$ צפונה. כלב נמצא בנקודה $(6, 0)\,\text{m}$, ואחרי $2\,\text{s}$ הוא
      נמצא בנקודה $(0, 8)\,\text{m}$. מה גודל המהירות הממוצעת של הכלב בפרק הזמן הזה?
    answer: 5
    unit: m/s
    correctFeedback: >-
      נכון. $\Delta\vec r = (0 - 6,\ 8 - 0) = (-6,\ 8)\,\text{m}$, באורך $\sqrt{36 + 64} = 10\,\text{m}$, ולכן
      $|\bar{\vec v}| = 10 / 2 = 5\,\text{m/s}$, לצפון-מערב.
    wrongFeedback: >-
      מצאו קודם את ההעתק ברכיבים, $\Delta\vec r = \vec r_2 - \vec r_1$, אחר כך את אורכו בעזרת פיתגורס, ורק אז חלקו בזמן.
    commonWrong:
      - value: 1
        feedback: >-
          חיסרתם את המרחקים מהראשית, $(8 - 6)/2$. ההעתק הוא החץ מהמקום הראשון לשני, ומחסרים אותו רכיב מרכיב.
        misconception: MC-difference-of-magnitudes
      - value: 7
        feedback: >-
          חיברתם את גדלי הרכיבים, $(6 + 8)/2$. הרכיבים מאונכים, ולכן אורך ההעתק הוא $\sqrt{6^2 + 8^2} = 10\,\text{m}$, לא 14.
        misconception: MC-components-add-to-magnitude
      - value: 10
        feedback: 'זה אורך ההעתק, במטרים. המהירות הממוצעת היא ההעתק **חלקי הזמן**.'
    hints:
      - 'ההעתק ברכיבים: $\Delta x = x_2 - x_1$ ו-$\Delta y = y_2 - y_1$.'

  - id: Q-1.10-lap-average
    type: mc
    objectives: [OBJ-1.10-1]
    qualitative: true
    prompt: >-
      רץ משלים הקפה אחת במסלול ריצה של $400\,\text{m}$ תוך $80\,\text{s}$, וחוזר בדיוק לנקודה שממנה יצא.
      מה המהירות הממוצעת שלו בהקפה?
    choices:
      - text: אפס.
        correct: true
        feedback: >-
          נכון. הוא חזר לנקודת ההתחלה, ולכן ההעתק שלו אפס, וגם המהירות הממוצעת, שהיא ההעתק חלקי הזמן.
      - text: '$5\,\text{m/s}$, בכיוון הריצה.'
        feedback: >-
          $400/80 = 5$ הוא הדרך חלקי הזמן. אבל המהירות הממוצעת היא **ההעתק** חלקי הזמן, וההעתק בהקפה שלמה הוא אפס.
          ול"כיוון הריצה" אין משמעות אחת לאורך הקפה: הוא משתנה כל הזמן.
      - text: אי אפשר לדעת בלי לדעת את גודל המהירות בכל רגע.
        feedback: >-
          המהירות הממוצעת תלויה רק בנקודת ההתחלה, בנקודת הסוף ובזמן. מה שקרה בדרך, מהר או לאט, לא משנה אותה.
      - text: '$5\,\text{m/s}$, אבל רק אם הוא רץ בגודל מהירות קבוע.'
        feedback: >-
          גם בגודל מהירות קבוע ההעתק אחרי הקפה שלמה הוא אפס. $5\,\text{m/s}$ הוא גודל המהירות, לא המהירות הממוצעת.

  # ------------------------------------------------ OBJ-1.10-2 Δv by vector subtraction, average acceleration
  - id: Q-1.10-dv-turn
    type: vector
    objectives: [OBJ-1.10-2]
    qualitative: true
    prompt: >-
      כדור ביליארד נע מזרחה. הוא פוגע בדופן השולחן וממשיך צפונה, באותו גודל מהירות.
      מה כיוון השינוי במהירות שלו, $\Delta\vec v = \vec v_2 - \vec v_1$? (צפון למעלה, מזרח ימינה.)
    answer: 'nw'
    correctFeedback: >-
      נכון. $\Delta\vec v = \vec v_2 + (-\vec v_1)$: צפונה ועוד מערבה, באותו גודל, כלומר לצפון-מערב.
    wrong:
      - dir: 'zero'
        feedback: >-
          גודל המהירות לא השתנה, אבל הכיוון השתנה. מחסירים וקטורים, לא גדלים, ו-$\Delta\vec v$ כאן אפילו גדול מגודל המהירות.
        misconception: MC-difference-of-magnitudes
      - dir: 'ne'
        feedback: >-
          צפון-מזרח הוא כיוון **הסכום** $\vec v_1 + \vec v_2$. בהפרש הופכים את $\vec v_1$: מזרחה הופך למערבה.
      - dir: 'n'
        feedback: >-
          צפונה זה כיוון המהירות הסופית $\vec v_2$, לא השינוי. מ-$\vec v_2$ צריך עוד להחסיר את $\vec v_1$.
        misconception: MC-accel-along-velocity
      - dir: 'se'
        feedback: 'זה כיוון $\vec v_1 - \vec v_2$, ההפרש ההפוך. השינוי הוא הסופי פחות ההתחלתי: $\vec v_2 - \vec v_1$.'
    wrongFeedback: >-
      ציירו את $\vec v_1$ ואת $\vec v_2$ מאותה נקודה. $\Delta\vec v$ הוא החץ מקצה $\vec v_1$ לקצה $\vec v_2$.

  - id: Q-1.10-dv-numeric
    type: numeric
    objectives: [OBJ-1.10-2]
    level: mid
    prompt: >-
      סירת מנוע נעה מזרחה במהירות $12\,\text{m/s}$. תוך $4\,\text{s}$ היא מסתובבת ונעה צפונה במהירות $5\,\text{m/s}$.
      מה גודל התאוצה הממוצעת שלה בפרק הזמן הזה?
    answer: 3.25
    unit: m/s²
    correctFeedback: >-
      נכון. עם $x$ מזרחה ו-$y$ צפונה: $\Delta\vec v = (0 - 12,\ 5 - 0) = (-12,\ 5)\,\text{m/s}$, באורך
      $\sqrt{144 + 25} = 13\,\text{m/s}$. לכן $|\bar{\vec a}| = 13/4 = 3.25\,\text{m/s}^2$.
    wrongFeedback: >-
      כתבו את שתי המהירויות ברכיבים, החסירו רכיב מרכיב, מצאו את אורך $\Delta\vec v$ בעזרת פיתגורס, ורק אז חלקו בזמן.
    commonWrong:
      - value: 1.75
        feedback: >-
          חיסרתם גדלים, $(12 - 5)/4$. זה היה נכון רק אילו הסירה המשיכה באותו כיוון. השינוי במהירות הוא חיסור וקטורי.
        misconception: MC-difference-of-magnitudes
      - value: 4.25
        feedback: >-
          חיברתם גדלים, $(12 + 5)/4$. גודל $\Delta\vec v$ שווה לסכום הגדלים רק כששתי המהירויות בכיוונים מנוגדים בדיוק.
        misconception: MC-magnitudes-add
      - value: 13
        feedback: 'זה $|\Delta\vec v|$, ב-m/s. התאוצה הממוצעת היא השינוי במהירות **חלקי הזמן**.'
    hints:
      - '$\vec v_1 = (12,\ 0)$ ו-$\vec v_2 = (0,\ 5)$, ב-m/s.'

  - id: Q-1.10-bounce
    type: twotier
    objectives: [OBJ-1.10-2]
    qualitative: true
    prompt: >-
      כדור נע ימינה במהירות $6\,\text{m/s}$, פוגע בקיר, וחוזר שמאלה במהירות $6\,\text{m/s}$. האם המהירות של הכדור השתנתה?
    choices:
      - text: 'כן, ב-$12\,\text{m/s}$, שמאלה.'
        correct: true
        feedback: 'נכון. עם ציר חיובי ימינה: $\Delta v = (-6) - (+6) = -12\,\text{m/s}$, כלומר $12\,\text{m/s}$ שמאלה.'
      - text: לא. היא הייתה ונשארה 6 מטרים לשנייה.
        feedback: >-
          גודל המהירות לא השתנה, אבל הכיוון התהפך. מהירות היא וקטור, ולכן גם היפוך כיוון הוא שינוי, ואפילו גדול.
        misconception: MC-difference-of-magnitudes
      - text: 'כן, ב-$6\,\text{m/s}$, כי היא התהפכה.'
        feedback: >-
          כדי להגיע מ-$v = +6$ ל-$v = -6$ צריך קודם לרדת ל-0, וזה שינוי של 6, ואחר כך עוד 6 בכיוון ההפוך. ביחד 12.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'מחסירים וקטורים: $\vec v_2 - \vec v_1$, וכאן $\vec v_2 = -\vec v_1$, ולכן $\Delta\vec v = -2\vec v_1$.'
        correct: true
        feedback: נכון. כשהמהירות מתהפכת בדיוק, גודל השינוי הוא פעמיים גודל המהירות.
      - text: מחסירים את גודל המהירות הסופי מגודל המהירות ההתחלתי.
        feedback: 'כך מקבלים $6 - 6 = 0$, והתשובה מתעלמת מהכיוון. השינוי במהירות הוא חיסור וקטורי.'
        misconception: MC-difference-of-magnitudes
      - text: המהירות משתנה רק כשהכדור מאט או מאיץ.
        feedback: >-
          גם שינוי כיוון הוא שינוי של המהירות. כאן הכדור גם האט עד עצירה וגם האיץ חזרה, בזמן המגע הקצר עם הקיר.
        misconception: MC-constant-speed-no-accel
    hints:
      - 'בחרו ציר: ימינה חיובי. מה הסימן של המהירות לפני הפגיעה, ומה אחריה?'

  - id: Q-1.10-throw-dv
    type: vector
    objectives: [OBJ-1.10-2]
    qualitative: true
    prompt: >-
      כדור נזרק באלכסון. בנקודה P, בדרך למעלה, המהירות שלו נוטה ימינה ולמעלה. בנקודה Q, באותו גובה בדרך למטה, המהירות
      שלו באותו גודל ונוטה ימינה ולמטה. הרכיב האופקי של המהירות זהה בשתי הנקודות. מה כיוון $\Delta\vec v$ מ-P ל-Q?
    answer: 's'
    correctFeedback: >-
      נכון. הרכיב האופקי לא השתנה, ולכן $\Delta v_x = 0$. הרכיב האנכי עבר מחיובי לשלילי, ולכן $\Delta\vec v$ אנכי למטה,
      בכיוון התאוצה של הכדור.
    wrong:
      - dir: 'zero'
        feedback: >-
          גודל המהירות זהה בשתי הנקודות, אבל הכיוון לא. הרכיב האנכי התהפך, ולכן $\Delta\vec v$ לא אפס.
        misconception: MC-difference-of-magnitudes
      - dir: 'e'
        feedback: >-
          הכדור נע ימינה, אבל $\Delta\vec v$ הוא השינוי במהירות, לא המהירות. הרכיב האופקי לא השתנה כלל, ולכן אין ל-$\Delta\vec v$ רכיב אופקי.
        misconception: MC-accel-along-velocity
      - dir: 'ne'
        feedback: >-
          זה בערך כיוון המהירות ב-P. השינוי במהירות הוא $\vec v_Q - \vec v_P$, ובו נשאר רק הרכיב האנכי, כלפי מטה.
        misconception: MC-accel-along-velocity
    wrongFeedback: >-
      החסירו רכיב מרכיב: מה קרה לרכיב האופקי, ומה קרה לרכיב האנכי?

  # ------------------------------------------------ OBJ-1.10-3 tangential and radial parts of a
  - id: Q-1.10-circle-accel
    type: vector
    objectives: [OBJ-1.10-3]
    qualitative: true
    prompt: >-
      גוף נע במעגל נגד כיוון השעון, וגודל המהירות שלו קבוע. ברגע מסוים הוא נמצא בנקודה העליונה של המעגל.
      מה כיוון התאוצה שלו ברגע הזה?
    answer: 's'
    correctFeedback: >-
      נכון. גודל המהירות קבוע, ולכן אין רכיב משיקי, וכל התאוצה רדיאלית: אל מרכז המעגל, שנמצא מתחת לגוף.
    wrong:
      - dir: 'zero'
        feedback: >-
          גודל המהירות קבוע, אבל הכיוון שלה משתנה כל הזמן, ולכן המהירות משתנה ויש תאוצה.
        misconception: MC-constant-speed-no-accel
      - dir: 'w'
        feedback: >-
          בנקודה העליונה, נגד כיוון השעון, הגוף נע שמאלה. זה כיוון **המהירות**. התאוצה מאונכת לה, אל המרכז.
        misconception: MC-accel-along-velocity
      - dir: 'n'
        feedback: >-
          למעלה זה החוצה, הרחק מהמרכז. אבל $\Delta\vec v$ במעגל מצביע פנימה, ולכן גם התאוצה. את התחושה שנזרקים החוצה נסביר בפרק 2.
    wrongFeedback: >-
      במעגל בגודל מהירות קבוע יש רק רכיב רדיאלי, והוא מצביע אל הצד הפנימי של העיקול, כלומר אל המרכז.

  - id: Q-1.10-slowing-curve
    type: vector
    objectives: [OBJ-1.10-3]
    qualitative: true
    level: mid
    prompt: >-
      מכונית נוסעת צפונה ונכנסת לפנייה **שמאלה**. באמצע הפנייה הנהג גם **בולם**. ברגע שבו המהירות של המכונית עדיין
      מצביעה צפונה, מה בערך כיוון התאוצה שלה? (צפון למעלה, מזרח ימינה.)
    answer: 'sw'
    correctFeedback: >-
      נכון. הרכיב המשיקי נגד המהירות, דרומה, כי המכונית מאטה. הרכיב הרדיאלי אל הצד הפנימי של הפנייה, מערבה.
      הסכום מצביע לדרום-מערב בערך.
    wrong:
      - dir: 's'
        feedback: >-
          דרומה זה רק הרכיב המשיקי, שבא מהבלימה. המכונית גם פונה, ולכן יש לתאוצה גם רכיב רדיאלי, מערבה.
        misconception: MC-accel-along-velocity
      - dir: 'w'
        feedback: >-
          מערבה זה רק הרכיב הרדיאלי, שבא מהפנייה. אבל גודל המהירות קטן, ולכן יש גם רכיב משיקי נגד המהירות, דרומה.
      - dir: 'nw'
        feedback: >-
          צפון-מערב מתאים לפנייה שמאלה תוך **האצה**. כשבולמים, הרכיב המשיקי מצביע נגד המהירות: דרומה, לא צפונה.
      - dir: 'n'
        feedback: >-
          המכונית נוסעת צפונה, אבל היא מאטה, ולכן הרכיב המשיקי מצביע דרומה. בנוסף יש רכיב רדיאלי מערבה, בגלל הפנייה.
        misconception: MC-accel-along-velocity
    wrongFeedback: >-
      פרקו לשני חלקים: הבלימה נותנת רכיב נגד המהירות, והפנייה נותנת רכיב מאונך למהירות, אל הצד הפנימי של העיקול.

  - id: Q-1.10-ferris
    type: twotier
    objectives: [OBJ-1.10-3]
    qualitative: true
    prompt: >-
      תא בגלגל ענק נע במעגל בגודל מהירות קבוע. האם לתא יש תאוצה?
    choices:
      - text: כן.
        correct: true
        feedback: נכון. כיוון המהירות של התא משתנה כל הזמן, ולכן יש לו תאוצה, אל מרכז הגלגל.
      - text: לא.
        feedback: >-
          גודל המהירות קבוע, אבל המהירות היא וקטור, וכיוונה משתנה. מהירות שמשתנה פירושה תאוצה.
        misconception: MC-constant-speed-no-accel
      - text: רק בנקודה העליונה ובנקודה התחתונה.
        feedback: >-
          הכיוון של המהירות משתנה בכל נקודה במעגל, לא רק בשתי נקודות. לכן יש תאוצה כל הזמן, ובכל רגע היא מצביעה אל המרכז.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'כיוון המהירות משתנה, ולכן $\Delta\vec v \ne 0$ גם כשגודל המהירות קבוע.'
        correct: true
        feedback: 'נכון. זה הרכיב הרדיאלי של התאוצה: הוא משנה את הכיוון ולא את הגודל.'
      - text: תאוצה היא קצב השינוי של גודל המהירות, וכאן הוא לא משתנה.
        feedback: >-
          זה רק הרכיב המשיקי של התאוצה. תאוצה היא קצב השינוי של וקטור המהירות, כולל הכיוון שלו.
        misconception: MC-constant-speed-no-accel
      - text: התא נע כל הזמן, ולכל גוף שנע יש תאוצה.
        feedback: >-
          תנועה לא מחייבת תאוצה: מכונית בכביש ישר במהירות קבועה נעה בלי תאוצה. כאן יש תאוצה כי **הכיוון** משתנה.

  - id: Q-1.10-split-numeric
    type: numeric
    objectives: [OBJ-1.10-3]
    level: mid
    prompt: >-
      ברגע מסוים המהירות של גוף מצביעה בכיוון החיובי של ציר $x$, והתאוצה שלו היא $\vec a = (-3,\ 4)\,\text{m/s}^2$.
      מה הרכיב המשיקי של התאוצה, עם סימן (חיובי אם הגוף מאיץ, שלילי אם הוא מאט)?
    answer: -3
    unit: m/s²
    correctFeedback: >-
      נכון. המהירות לאורך $x$, ולכן הרכיב המשיקי הוא $a_x = -3\,\text{m/s}^2$: נגד המהירות, והגוף מאט.
      הרכיב הרדיאלי הוא $a_y = 4\,\text{m/s}^2$, והוא מסובב את המהירות לכיוון החיובי של ציר $y$.
    wrongFeedback: >-
      הרכיב המשיקי הוא החלק של התאוצה שלאורך המהירות. כאן המהירות לאורך $x$, אז איזה רכיב של $\vec a$ לאורכה?
    commonWrong:
      - value: 3
        feedback: >-
          הגודל נכון, אבל הסימן לא. $a_x$ שלילי והמהירות בכיוון החיובי של ציר $x$, ולכן הרכיב המשיקי נגד המהירות, והגוף מאט.
      - value: 5
        feedback: >-
          $5\,\text{m/s}^2$ הוא גודל התאוצה כולה. רק חלק ממנה לאורך המהירות; החלק האחר מאונך לה ומסובב אותה.
        misconception: MC-accel-along-velocity
      - value: 4
        feedback: 'זה הרכיב שמאונך למהירות, הרכיב הרדיאלי. המשיקי הוא הרכיב שלאורך המהירות, כאן $a_x$.'
    hints:
      - 'כשהמהירות לאורך ציר $x$, הרכיב המשיקי הוא $a_x$ והרדיאלי הוא $a_y$.'
