# Question bank for lesson 1.6 (acceleration, constant-acceleration motion). Strings may hold $inline$ TeX; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with src/physics/kinematics.ts (constantAcceleration, stateAt, avgAcceleration,
# stoppingDistance, stoppingTime, displacement); script: screens/check-1-6.ts, run with npx tsx.

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.6-1: acceleration from a table / v–t graph
  - id: Q-1.6-units-meaning
    type: mc
    objectives: [OBJ-1.6-1]
    qualitative: true
    prompt: >-
      התאוצה של רכבת היא $0.5\,\text{m/s}^2$ בכיוון הנסיעה, והיא קבועה. מה המשמעות של המספר הזה?
    choices:
      - text: בכל שנייה המהירות של הרכבת גדלה בחצי מטר לשנייה.
        correct: true
        feedback: >-
          נכון. היחידה $\text{m/s}^2$ פירושה מטר לשנייה בכל שנייה: אחרי 10 שניות המהירות גדלה ב-5 מטרים לשנייה.
      - text: בכל שנייה הרכבת עוברת חצי מטר.
        feedback: >-
          חצי מטר בכל שנייה זו **מהירות**, $0.5\,\text{m/s}$. התאוצה לא אומרת כמה מטרים הרכבת עוברת, אלא בכמה
          משתנה המהירות שלה בכל שנייה. הרכבת יכולה לנסוע 30 מטרים בשנייה ובכל זאת להאיץ רק בחצי מטר לשנייה בכל שנייה.
        misconception: MC-fast-means-accel
      - text: המהירות של הרכבת היא חצי מטר לשנייה.
        feedback: >-
          המהירות והתאוצה הן גדלים שונים. מהתאוצה בלבד אי אפשר לדעת מה המהירות, רק כמה מהר היא משתנה.
        misconception: MC-fast-means-accel
      - text: הרכבת עוברת חצי מטר בכל שנייה בריבוע, כלומר בכל ארבע שניות.
        feedback: >-
          "שנייה בריבוע" אינה פרק זמן. $\text{m/s}^2$ הוא קיצור של $\frac{\text{m/s}}{\text{s}}$: שינוי של מהירות, חלקי זמן.

  - id: Q-1.6-table-accel
    type: numeric
    objectives: [OBJ-1.6-1]
    prompt: >-
      הכיוון החיובי הוא כיוון הנסיעה. מד המהירות של אוטובוס שמתקרב לתחנה הראה $18\,\text{m/s}$ ברגע
      $t = 0$, $12\,\text{m/s}$ ברגע $t = 2\,\text{s}$, ו-$6\,\text{m/s}$ ברגע $t = 4\,\text{s}$. מה התאוצה של
      האוטובוס? כתבו את המספר עם הסימן שלו.
    answer: -3
    unit: m/s²
    correctFeedback: >-
      נכון: $\bar{a} = \frac{\Delta v}{\Delta t} = \frac{6 - 18}{4 - 0} = -3\,\text{m/s}^2$. המהירות חיובית והתאוצה
      שלילית: האוטובוס מאט.
    wrongFeedback: >-
      התאוצה היא השינוי במהירות חלקי הזמן: $\bar{a} = \frac{v_2 - v_1}{t_2 - t_1}$. קחו שתי שורות בטבלה, וחסרו
      מהמהירות המאוחרת את המוקדמת.
    commonWrong:
      - value: 3
        feedback: >-
          הגודל נכון, אבל הסימן חסר. המהירות **קטנה**, ולכן $\Delta v$ שלילי: $6 - 18 = -12$. כשהמהירות חיובית
          והגוף מאט, התאוצה שלילית.
      - value: -6
        feedback: >-
          זה השינוי במהירות בין שתי שורות סמוכות, $12 - 18 = -6\,\text{m/s}$. אבל השינוי הזה קרה בשתי שניות,
          ולכן צריך לחלק ב-$\Delta t = 2\,\text{s}$.
      - value: 6
        feedback: >-
          חילקתם מהירות בזמן, $12 / 2$. התאוצה היא **השינוי** במהירות חלקי פרק הזמן, לא המהירות עצמה חלקי הזמן.
        misconception: MC-fast-means-accel
    hints:
      - 'בכמה מטרים לשנייה משתנה המהירות בכל שתי שניות? ובכל שנייה?'

  - id: Q-1.6-vt-slope
    type: numeric
    objectives: [OBJ-1.6-1]
    level: mid
    prompt: >-
      גרף מהירות-זמן של עגלה הוא קו ישר שעובר דרך הנקודות $(0\ \text{s},\ {-2}\ \text{m/s})$ ו-$(5\ \text{s},\ 8\ \text{m/s})$.
      מה התאוצה של העגלה? כתבו את המספר עם הסימן שלו.
    answer: 2
    unit: m/s²
    correctFeedback: >-
      נכון. התאוצה היא השיפוע: $a = \frac{8 - (-2)}{5 - 0} = \frac{10}{5} = +2\,\text{m/s}^2$. בהתחלה העגלה נעה בכיוון
      השלילי ומאטה, עומדת ברגע $t = 1\,\text{s}$, ואחר כך מאיצה בכיוון החיובי.
    wrongFeedback: 'השיפוע של קו ישר: $\frac{\Delta v}{\Delta t}$, עם הסימנים של שתי המהירויות.'
    commonWrong:
      - value: 1.6
        feedback: >-
          חילקתם את המהירות הסופית בזמן, $8 / 5$. השיפוע הוא השינוי בגובה: מ-$v = -2$ ל-$v = 8$ הקו עולה 10, ולא 8.
        misconception: MC-fast-means-accel
      - value: 1.2
        feedback: >-
          הצבתם $8 - 2$, כאילו המהירות ההתחלתית חיובית. הנקודה הראשונה מתחת לציר הזמן: $8 - (-2) = 10$.
    hints:
      - 'בכמה עולה הקו מהנקודה הראשונה לשנייה, ובכמה שניות?'

  - id: Q-1.6-fast-not-accel
    type: twotier
    objectives: [OBJ-1.6-1]
    qualitative: true
    prompt: >-
      מטוס נוסעים טס בקו ישר במהירות קבועה של $250\,\text{m/s}$. רוכבת אופניים יוצאת מרמזור ומגיעה למהירות
      $5\,\text{m/s}$ אחרי $2\,\text{s}$. למי מהם תאוצה גדולה יותר באותן שתי שניות?
    choices:
      - text: לרוכבת.
        correct: true
        feedback: >-
          נכון. לרוכבת $\bar{a} = \frac{5 - 0}{2} = 2.5\,\text{m/s}^2$, ולמטוס תאוצה אפס.
      - text: למטוס.
        feedback: >-
          המטוס מהיר מאוד, אבל המהירות שלו לא משתנה. התאוצה מודדת את השינוי במהירות, ולכן היא אפס.
        misconception: MC-fast-means-accel
      - text: התאוצות שוות, כי שניהם נעים קדימה.
        feedback: >-
          כיוון התנועה המשותף לא קובע את התאוצה. אצל המטוס המהירות קבועה ואצל הרוכבת היא גדלה.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: התאוצה היא השינוי במהירות בכל שנייה, ולא גודל המהירות.
        correct: true
        feedback: >-
          בדיוק. בגרף מהירות-זמן המטוס הוא קו אופקי גבוה (שיפוע אפס) והרוכבת קו נמוך שעולה (שיפוע חיובי).
      - text: גוף מהיר יותר הוא גוף עם תאוצה גדולה יותר.
        feedback: >-
          זה מבלבל בין הגובה של גרף מהירות-זמן לבין השיפוע שלו. המהירות היא הגובה, והתאוצה היא השיפוע.
        misconception: MC-fast-means-accel
      - text: למטוס יש מנוע חזק יותר.
        feedback: >-
          המנוע של המטוס באמת חזק, אבל כאן הוא רק שומר על המהירות. התאוצה נקבעת מהשינוי במהירות שרואים בפועל.
    hints:
      - 'חשבו על גרף מהירות-זמן של כל אחד מהם. מה הגובה, ומה השיפוע?'

  # ---------------------------------------------------------------- OBJ-1.6-2: speeding up or slowing down
  - id: Q-1.6-neg-neg
    type: mc
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      הכיוון החיובי הוא ימינה. ברגע מסוים המהירות של גוף היא $v = -5\,\text{m/s}$ והתאוצה שלו
      $a = -2\,\text{m/s}^2$, והתאוצה קבועה. מה קורה לגוף בשניות הבאות?
    choices:
      - text: הוא נע שמאלה, מהר יותר ויותר.
        correct: true
        feedback: >-
          נכון. למהירות ולתאוצה אותו סימן, ולכן גודל המהירות גדל: אחרי שנייה $v = -7\,\text{m/s}$, אחרי שתיים
          $v = -9\,\text{m/s}$.
      - text: הוא נע שמאלה ומאט, כי התאוצה שלילית.
        feedback: >-
          תאוצה שלילית אינה בלימה. היא אומרת שהמהירות משתנה שמאלה, וכשהגוף כבר נע שמאלה, זה מגביר אותו.
          הסימנים זהים, ולכן הגוף מאיץ.
        misconception: MC-negative-accel-slows
      - text: הוא נעצר ומתחיל לנוע ימינה.
        feedback: >-
          כדי לעצור, המהירות צריכה להשתנות **ימינה**, לכיוון האפס. כאן היא משתנה שמאלה, ומתרחקת מאפס.
        misconception: MC-negative-accel-slows
      - text: הוא נע ימינה, כי שני הסימנים השליליים מבטלים זה את זה.
        feedback: >-
          הסימנים לא מוכפלים זה בזה. הסימן של המהירות לבדו אומר לאן הגוף נע: מינוס פירושו שמאלה.
    hints:
      - 'כתבו את המהירות אחרי שנייה אחת: $v = v_0 + at$.'

  - id: Q-1.6-slows-multi
    type: multi
    objectives: [OBJ-1.6-2]
    qualitative: true
    level: mid
    prompt: >-
      בכל המקרים הכיוון החיובי הוא ימינה. באילו מהם הגוף **מאט** באותו רגע? סמנו את כל התשובות הנכונות.
    choices:
      - text: '$v = +3\,\text{m/s}$, ו-$a = -1\,\text{m/s}^2$'
        correct: true
        feedback: נכון. סימנים מנוגדים, ולכן הגוף מאט.
      - text: '$v = -3\,\text{m/s}$, ו-$a = +1\,\text{m/s}^2$'
        correct: true
        feedback: >-
          נכון. התאוצה חיובית, ובכל זאת הגוף מאט: הוא נע שמאלה, והמהירות משתנה ימינה, לכיוון האפס.
      - text: '$v = -3\,\text{m/s}$, ו-$a = -1\,\text{m/s}^2$'
        feedback: >-
          אותו סימן, ולכן הגוף מאיץ שמאלה. תאוצה שלילית אינה בהכרח בלימה.
        misconception: MC-negative-accel-slows
      - text: '$v = +3\,\text{m/s}$, ו-$a = +1\,\text{m/s}^2$'
        feedback: אותו סימן, ולכן הגוף מאיץ ימינה.
      - text: '$v = +3\,\text{m/s}$, ו-$a = 0$'
        feedback: >-
          בלי תאוצה המהירות לא משתנה: הגוף לא מאט ולא מאיץ. זו תנועה קצובה.
    hints:
      - 'בכל מקרה השוו את הסימן של המהירות לסימן של התאוצה.'

  - id: Q-1.6-axis-flip
    type: twotier
    objectives: [OBJ-1.6-2]
    qualitative: true
    level: mid
    prompt: >-
      הכיוון החיובי הוא מזרחה. מכונית נוסעת **מערבה** ובולמת לפני מעבר חציה. מה הסימן של התאוצה שלה?
    choices:
      - text: חיובי.
        correct: true
        feedback: >-
          נכון. המהירות שלילית (מערבה), והמכונית מאטה, ולכן התאוצה בסימן ההפוך: חיובית, מזרחה.
      - text: שלילי.
        feedback: >-
          בבלימה התאוצה הפוכה למהירות, לא תמיד שלילית. המהירות כאן שלילית, ולכן התאוצה חיובית.
        misconception: MC-negative-accel-slows
      - text: אפס, כי המכונית נעצרת.
        feedback: >-
          כל עוד המכונית בולמת, המהירות שלה משתנה, ולכן יש תאוצה. היא תהיה אפס רק אחרי שהמכונית תעמוד.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: כשגוף מאט, למהירות ולתאוצה יש סימנים מנוגדים.
        correct: true
        feedback: >-
          בדיוק. המהירות משתנה מ-$v < 0$ לכיוון האפס, כלומר מזרחה, וזה הכיוון של התאוצה.
      - text: בלימה היא תמיד תאוצה שלילית.
        feedback: >-
          זה נכון רק כשהגוף נע בכיוון החיובי. אם הופכים את הציר, הסימנים של $v$ ושל $a$ מתהפכים שניהם.
        misconception: MC-negative-accel-slows
      - text: התאוצה תמיד בכיוון שאליו המכונית נוסעת.
        feedback: >-
          המכונית נוסעת מערבה, אבל המהירות שלה משתנה מזרחה, ולכן התאוצה מזרחה. כשגוף מאט, התאוצה נגד כיוון התנועה.
        misconception: MC-accel-along-velocity
    hints:
      - 'מה הסימן של המהירות? ולאיזה כיוון היא משתנה כשהמכונית מאטה?'

  - id: Q-1.6-turn-moment
    type: mc
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      עגלת המאוורר של איור 1.6א נעה ימינה, מאטה, עומדת לרגע ברגע $t = 2\,\text{s}$, וחוזרת שמאלה. התאוצה שלה קבועה,
      $a = -2\,\text{m/s}^2$ (הכיוון החיובי ימינה). מה התאוצה שלה ברגע $t = 2\,\text{s}$, כשהמהירות אפס?
    choices:
      - text: $a = -2\,\text{m/s}^2$, כמו בכל רגע אחר.
        correct: true
        feedback: >-
          נכון. גם ברגע הזה המהירות משתנה: שנייה לפניו היא הייתה $+2$, ושנייה אחריו $-2$. שינוי של מהירות פירושו תאוצה.
      - text: אפס, כי העגלה עומדת.
        feedback: >-
          העגלה עומדת רק לרגע אחד, והמהירות לא נשארת אפס. אילו התאוצה הייתה אפס ברגע הזה, המהירות הייתה נשארת
          אפס, והעגלה הייתה נשארת במקום.
        misconception: MC-zero-velocity-zero-accel
      - text: $a = +2\,\text{m/s}^2$, כי העגלה מתחילה לנוע לכיוון ההפוך.
        feedback: >-
          המאוורר לא שינה כיוון: המהירות ממשיכה להשתנות שמאלה, ולכן התאוצה נשארת שלילית.
        misconception: MC-accel-along-velocity
    hints:
      - 'מה המהירות חצי שנייה לפני הרגע הזה, ומה היא חצי שנייה אחריו?'

  # ---------------------------------------------------------------- OBJ-1.6-3: the constant-acceleration equations
  - id: Q-1.6-braking-distance
    type: numeric
    objectives: [OBJ-1.6-3]
    prompt: >-
      מכונית נוסעת במהירות $25\,\text{m/s}$ ובולמת עד עצירה, בתאוצה קבועה שגודלה $5\,\text{m/s}^2$. כמה מטרים
      היא עוברת מתחילת הבלימה ועד שהיא נעצרת?
    answer: 62.5
    unit: m
    correctFeedback: >-
      נכון. הכיוון החיובי הוא כיוון הנסיעה: $0 = 25^2 + 2(-5)(x - x_0)$, ולכן $x - x_0 = \frac{625}{10} = 62.5\,\text{m}$.
    wrongFeedback: >-
      הזמן לא נתון ולא נשאל, ולכן בחרו את $v^2 = v_0^2 + 2a(x - x_0)$, עם $v = 0$ ו-$a$ שלילית.
    commonWrong:
      - value: 125
        feedback: 'שכחתם את ה-2 שבנוסחה: $x - x_0 = \frac{v_0^2}{2|a|} = \frac{625}{2\cdot 5}$, ולא $\frac{625}{5}$.'
      - value: 5
        feedback: >-
          זה **זמן** הבלימה, $\frac{25}{5} = 5\,\text{s}$, ולא הדרך. אם מתחילים ממנו, ההעתק הוא המהירות הממוצעת
          כפול הזמן: $\frac{25 + 0}{2}\cdot 5 = 62.5\,\text{m}$.
      - value: -62.5
        feedback: >-
          המכונית נוסעת בכיוון החיובי ולא חוזרת לאחור, ולכן ההעתק חיובי. בדקו את הסימן של $a$ בהצבה:
          $x - x_0 = \frac{0 - 625}{2\cdot(-5)}$.
    hints:
      - 'מה המהירות הסופית? ואיזו מהנוסחאות לא צריכה זמן?'

  - id: Q-1.6-double-speed
    type: mc
    objectives: [OBJ-1.6-3]
    qualitative: true
    prompt: >-
      במהירות $50$ קמ״ש, מרחק הבלימה של מכונית הוא $12\,\text{m}$. מה יהיה מרחק הבלימה שלה במהירות $100$ קמ״ש,
      עם אותם בלמים, כלומר עם אותה תאוצה?
    choices:
      - text: $48\,\text{m}$
        correct: true
        feedback: >-
          נכון. מרחק הבלימה הוא $\frac{v_0^2}{2|a|}$: מהירות כפולה, ריבוע גדול פי 4. בגרף מהירות-זמן המשולש גבוה
          פי 2 וגם רחב פי 2, כי הבלימה נמשכת פי 2 זמן.
      - text: $24\,\text{m}$
        feedback: >-
          זה היה נכון אילו המרחק היה ביחס ישר למהירות. אבל במהירות כפולה הבלימה גם נמשכת פי 2 זמן, וגם בכל רגע
          המכונית מהירה פי 2: פי 4 בסך הכול.
        misconception: MC-square-law-doubles
      - text: $12\,\text{m}$, כי הבלמים אותם בלמים.
        feedback: >-
          הבלמים קובעים את התאוצה, אבל ממהירות גדולה יותר לוקח יותר זמן, ויותר מטרים, להגיע לאפס.
      - text: $36\,\text{m}$
        feedback: >-
          אין כאן פי 3. הצבה בנוסחה $\frac{v_0^2}{2|a|}$ עם $v_0$ כפול נותנת $2^2 = 4$ פעמים המרחק.
        misconception: MC-square-law-doubles
    hints:
      - 'איזה גודל מופיע בריבוע בנוסחה $v^2 = v_0^2 + 2a(x - x_0)$?'

  - id: Q-1.6-from-rest
    type: numeric
    objectives: [OBJ-1.6-3]
    prompt: >-
      אופנוע יוצא ממנוחה ומאיץ בתאוצה קבועה של $4\,\text{m/s}^2$. כמה מטרים הוא עובר ב-$5\,\text{s}$ הראשונות?
    answer: 50
    unit: m
    correctFeedback: >-
      נכון: $x - x_0 = v_0 t + \frac{1}{2}at^2 = 0 + \frac{1}{2}\cdot 4\cdot 5^2 = 50\,\text{m}$.
    wrongFeedback: 'יוצאים ממנוחה, ולכן $v_0 = 0$. השתמשו ב-$x = x_0 + v_0 t + \frac{1}{2}at^2$.'
    commonWrong:
      - value: 100
        feedback: 'שכחתם את החצי: $\frac{1}{2}\cdot 4\cdot 25 = 50$, ולא $4\cdot 25$.'
      - value: 20
        feedback: >-
          $20\,\text{m/s}$ היא **המהירות** אחרי 5 שניות, $v = 4\cdot 5$. הדרך היא המהירות הממוצעת, $10\,\text{m/s}$,
          כפול הזמן.
        misconception: MC-fast-means-accel
      - value: 10
        feedback: >-
          שכחתם להעלות את הזמן בריבוע: $\frac{1}{2}\cdot 4\cdot 5 = 10$. בנוסחה מופיע $t^2$: $\frac{1}{2}\cdot 4\cdot 5^2 = 50$.
    hints:
      - 'מה המהירות ההתחלתית?'

  - id: Q-1.6-avg-velocity
    type: numeric
    objectives: [OBJ-1.6-3]
    level: mid
    prompt: >-
      רכבת מאיצה בתאוצה קבועה מ-$10\,\text{m/s}$ ל-$30\,\text{m/s}$ ב-$10\,\text{s}$. כמה מטרים היא עוברת בזמן הזה?
    answer: 200
    unit: m
    correctFeedback: >-
      נכון. בתאוצה קבועה המהירות הממוצעת היא $\frac{v_0 + v}{2} = 20\,\text{m/s}$, ולכן $x - x_0 = 20\cdot 10 = 200\,\text{m}$.
    wrongFeedback: >-
      התאוצה קבועה, ולכן אפשר להשתמש ב-$x = x_0 + \frac{v_0 + v}{2}\,t$, בלי לחשב את התאוצה.
    commonWrong:
      - value: 300
        feedback: >-
          כפלתם את המהירות **הסופית** בזמן, כאילו הרכבת נסעה כל הזמן $30\,\text{m/s}$. היא הגיעה למהירות הזו רק בסוף.
      - value: 100
        feedback: >-
          כפלתם את המהירות ההתחלתית בזמן, כאילו הרכבת לא האיצה. בתאוצה קבועה משתמשים בממוצע של שתי המהירויות.
    hints:
      - 'מה המהירות הממוצעת, כשהמהירות גדלה באופן אחיד?'

  - id: Q-1.6-rank-stop
    type: rank
    objectives: [OBJ-1.6-3]
    level: mid
    prompt: >-
      ארבעה כלי רכב בולמים עד עצירה, כל אחד בתאוצה קבועה. דרגו אותם לפי מרחק הבלימה. את הארוך ביותר שימו למעלה.
    items:
      - id: car
        label: 'מכונית, $20\,\text{m/s}$, גודל התאוצה $5\,\text{m/s}^2$'
      - id: bike
        label: 'אופניים, $10\,\text{m/s}$, גודל התאוצה $2\,\text{m/s}^2$'
      - id: sports
        label: 'מכונית מרוץ, $30\,\text{m/s}$, גודל התאוצה $10\,\text{m/s}^2$'
      - id: scooter
        label: 'קטנוע, $20\,\text{m/s}$, גודל התאוצה $10\,\text{m/s}^2$'
    order: [sports, car, bike, scooter]
    correctFeedback: >-
      נכון. לפי $\frac{v_0^2}{2|a|}$: מכונית המרוץ $45\,\text{m}$, המכונית $40\,\text{m}$, האופניים $25\,\text{m}$
      והקטנוע $20\,\text{m}$. מכונית המרוץ בולמת הכי חזק, ובכל זאת צריכה הכי הרבה מקום, כי המהירות בריבוע.
    wrongFeedback: >-
      חשבו לכל אחד $\frac{v_0^2}{2|a|}$. המהירות מופיעה בריבוע, ולכן היא משפיעה יותר מהתאוצה.
