# Question bank for lesson 1.7 (free fall and the vertical throw). Strings may hold $inline$ TeX; rendered at build time.
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.
# Every number recomputed with apex / flight / stateAt / timesAtPosition from src/physics/kinematics.ts and G from
# src/physics/constants.ts (script: screens/check-1-7.ts, run with npx tsx).

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.7-1: model a free fall with a stated axis
  - id: Q-1.7-sign-up-axis
    type: mc
    objectives: [OBJ-1.7-1]
    qualitative: true
    prompt: >-
      אבן נופלת מגג. בפתרון בחרתם את הכיוון החיובי כלפי מעלה, ואת הראשית בקרקע. איזה ערך מציבים לתאוצה של האבן?
    choices:
      - text: '$a = -10\,\text{m/s}^2$'
        correct: true
        feedback: >-
          נכון. התאוצה מכוונת כלפי מטה, נגד הכיוון החיובי שבחרתם, ולכן היא שלילית: $a = -g$.
      - text: '$a = +10\,\text{m/s}^2$'
        feedback: >-
          $g$ הוא גודל, ולכן הוא חיובי, אבל התאוצה היא מספר עם סימן לפי הציר. היא מכוונת כלפי מטה, והכיוון החיובי
          שבחרתם כלפי מעלה, ולכן $a = -10\,\text{m/s}^2$. עם $a = +10$ האבן הייתה מאיצה כלפי מעלה.
        misconception: MC-free-fall-sign
      - text: 'אפס, עד שהאבן מתחילה לזוז.'
        feedback: >-
          ברגע שהאבן עוזבת את הגג היא בנפילה חופשית, והתאוצה שלה היא $a = -g$ כבר מהרגע הראשון. דווקא בגלל זה היא
          מתחילה לזוז: המהירות שלה משתנה מאפס.
        misconception: MC-zero-velocity-zero-accel
      - text: 'זה תלוי במסה של האבן.'
        feedback: >-
          הניסויים מראים שכשהשפעת האוויר זניחה, לכל הגופים אותה תאוצה, בלי קשר למסה: נייר מקומט וספר, פטיש ונוצה
          על הירח. השאלה כאן היא רק הסימן, והוא נקבע לפי הציר.
        misconception: MC-heavier-falls-faster

  - id: Q-1.7-drop-time
    type: numeric
    objectives: [OBJ-1.7-1]
    prompt: >-
      משמיטים כדור ממנוחה מגובה $80\,\text{m}$ מעל הקרקע. הזניחו את השפעת האוויר. אחרי כמה שניות הכדור פוגע בקרקע?
    answer: 4
    unit: s
    correctFeedback: >-
      נכון. עם כיוון חיובי כלפי מעלה: $0 = 80 - 5t^2$, ולכן $t^2 = 16$ ו-$t = 4\,\text{s}$. זה בדיוק
      $t = \sqrt{2h/g}$.
    wrongFeedback: >-
      כתבו את משוואת המקום עם $v_0 = 0$: $y = h - \tfrac{1}{2}gt^2$, הציבו $y = 0$, ובודדו את $t$. אל תשכחו את השורש.
    commonWrong:
      - value: 8
        feedback: >-
          חילקתם $h/g = 80/10$. אבל הכדור לא יורד אותו מרחק בכל שנייה: המרחק גדל כמו $t^2$, כי
          $h = \tfrac{1}{2}gt^2$. לכן $t = \sqrt{2h/g}$.
      - value: 16
        feedback: >-
          חישבתם את $t^2 = 2h/g = 16$, ושכחתם להוציא שורש. $t = \sqrt{16} = 4\,\text{s}$.
      - value: 2.83
        feedback: >-
          חישבתם $\sqrt{h/g}$ ושכחתם את ה-$\tfrac{1}{2}$ שבמשוואה: $h = \tfrac{1}{2}gt^2$, ולכן $t = \sqrt{2h/g}$.
    hints:
      - 'מה הגובה של הכדור ברגע שהוא פוגע בקרקע?'

  - id: Q-1.7-impact-speed
    type: numeric
    objectives: [OBJ-1.7-1]
    level: mid
    prompt: >-
      משמיטים אבן ממנוחה מגשר בגובה $45\,\text{m}$ מעל הנהר. הזניחו את השפעת האוויר. מה גודל המהירות של האבן כשהיא
      פוגעת במים?
    answer: 30
    unit: m/s
    correctFeedback: >-
      נכון. עם כיוון חיובי כלפי מטה וראשית בגשר: $v^2 = 0 + 2\cdot10\cdot(45 - 0) = 900$, ולכן $v = 30\,\text{m/s}$. או בשני
      שלבים: $t = \sqrt{2\cdot45/10} = 3\,\text{s}$, ו-$v = 10\cdot3 = 30\,\text{m/s}$.
    wrongFeedback: >-
      השתמשו במשוואה בלי זמן, $v^2 = v_0^2 + 2a(y - y_0)$, אחרי שקבעתם כיוון חיובי וראשית.
    commonWrong:
      - value: 900
        feedback: >-
          זה $v^2$. גודל המהירות הוא השורש: $\sqrt{900} = 30\,\text{m/s}$.
      - value: 450
        feedback: >-
          כפלתם $g\cdot h$. המהירות אינה $gh$ (היחידות שלו הן $\text{m}^2/\text{s}^2$), אלא $\sqrt{2gh}$.
      - value: 21.2
        feedback: >-
          חישבתם $\sqrt{gh}$ ושכחתם את ה-2 שבמשוואה: $v^2 = 2gh$.

  - id: Q-1.7-velocity-after
    type: numeric
    objectives: [OBJ-1.7-1]
    prompt: >-
      הכיוון החיובי הוא כלפי מעלה. משמיטים מפתח ממנוחה מחלון גבוה. מה המהירות של המפתח $1.5\,\text{s}$ אחרי
      ההשמטה? כתבו את המספר עם הסימן שלו.
    answer: -15
    unit: m/s
    correctFeedback: >-
      נכון. $v = v_0 + at = 0 + (-10)\cdot1.5 = -15\,\text{m/s}$. הסימן אומר שהמפתח נע כלפי מטה.
    wrongFeedback: 'כתבו את התאוצה עם הסימן שלה לפי הציר, והציבו ב-$v = v_0 + at$.'
    commonWrong:
      - value: 15
        feedback: >-
          זה גודל המהירות. עם כיוון חיובי כלפי מעלה, מפתח שנופל נע נגד הכיוון החיובי, ולכן $v = -15\,\text{m/s}$.
          אם קיבלתם $v = +15$ כי הצבתם $a = +10$, בדקו שוב את הסימן של התאוצה.
        misconception: MC-free-fall-sign
      - value: -11.25
        feedback: >-
          זה ההעתק של המפתח, $y - y_0 = -\tfrac{1}{2}\cdot10\cdot1.5^2$, ולא המהירות. המהירות היא $v = v_0 + at$.

  # ---------------------------------------------------------------- OBJ-1.7-2: the vertical throw
  - id: Q-1.7-top-time
    type: numeric
    objectives: [OBJ-1.7-2]
    prompt: >-
      זורקים כדור מהקרקע אנכית כלפי מעלה, במהירות $30\,\text{m/s}$. אחרי כמה שניות הוא מגיע לנקודה הגבוהה ביותר?
    answer: 3
    unit: s
    correctFeedback: >-
      נכון. בנקודה הגבוהה ביותר $v = 0$: $0 = 30 - 10t$, ולכן $t = 3\,\text{s}$.
    wrongFeedback: 'מה המהירות של הכדור בנקודה הגבוהה ביותר? הציבו אותה במשוואת המהירות.'
    commonWrong:
      - value: 6
        feedback: >-
          זה זמן כל המעוף, עד שהכדור חוזר לקרקע. הנקודה הגבוהה ביותר נמצאת באמצע: $3\,\text{s}$.
      - value: 0.333
        feedback: >-
          חילקתם $g/v_0$ במקום $v_0/g$. בדקו ביחידות: $\dfrac{\text{m/s}}{\text{m/s}^2} = \text{s}$.

  - id: Q-1.7-max-height
    type: numeric
    objectives: [OBJ-1.7-2]
    prompt: >-
      זורקים כדור מהקרקע אנכית כלפי מעלה, במהירות $16\,\text{m/s}$. מה הגובה המרבי שאליו הוא מגיע?
    answer: 12.8
    unit: m
    correctFeedback: >-
      נכון. בנקודה הגבוהה ביותר $v = 0$: $0 = 16^2 - 2\cdot10\cdot H$, ולכן $H = 256/20 = 12.8\,\text{m}$.
    wrongFeedback: 'השתמשו ב-$v^2 = v_0^2 + 2a(y - y_0)$ עם $v = 0$ בנקודה הגבוהה ביותר, ו-$a = -g$.'
    commonWrong:
      - value: 25.6
        feedback: >-
          חישבתם $v_0^2/g$. במשוואה יש $2a$: $H = v_0^2/(2g) = 256/20 = 12.8\,\text{m}$.
      - value: 1.6
        feedback: >-
          זה **הזמן** עד הנקודה הגבוהה ביותר, $v_0/g = 1.6\,\text{s}$, ולא הגובה.
      - value: -12.8
        feedback: >-
          הצבתם $a = +10$ עם ציר כלפי מעלה, וקיבלתם גובה שלילי, כלומר כדור שעולה ונמצא מתחת לקרקע. עם ציר כלפי מעלה
          $a = -g$, ו-$H = +12.8\,\text{m}$.
        misconception: MC-free-fall-sign
    hints:
      - 'בנקודה הגבוהה ביותר המהירות היא אפס, והזמן לא ידוע. איזו משוואה לא צריכה זמן?'

  - id: Q-1.7-return-speed
    type: mc
    objectives: [OBJ-1.7-2]
    qualitative: true
    prompt: >-
      זורקים כדור אנכית כלפי מעלה במהירות $12\,\text{m/s}$, ותופסים אותו כשהוא חוזר לאותו גובה. הזניחו את השפעת
      האוויר. באיזו מהירות הוא חוזר?
    choices:
      - text: '$12\,\text{m/s}$ כלפי מטה.'
        correct: true
        feedback: >-
          נכון. הירידה היא העלייה "בהילוך אחורי": אותו זמן, ובכל גובה אותו גודל מהירות, בכיוון ההפוך. בחשבון:
          $v^2 = v_0^2 - 2g\cdot0$, ולכן $|v| = 12\,\text{m/s}$.
      - text: 'פחות מ-$12\,\text{m/s}$, כי הכדור איבד מהירות בדרך למעלה.'
        feedback: >-
          הוא איבד מהירות בדרך למעלה, אבל הרוויח בדיוק אותה מהירות בדרך למטה: אותה תאוצה, לאורך אותו זמן. בלי אוויר
          אין שום דבר שיגרום לירידה להיות שונה מהעלייה.
      - text: 'יותר מ-$12\,\text{m/s}$, כי בדרך למטה הכדור מאיץ.'
        feedback: >-
          הוא מאיץ בדרך למטה, אבל רק מאפס, ורק לאורך זמן שווה לזמן העלייה. לכן הוא מגיע בדיוק ל-$12\,\text{m/s}$.
      - text: 'אפס, כי בנקודה הגבוהה ביותר הוא איבד את כל המהירות.'
        feedback: >-
          בנקודה הגבוהה ביותר המהירות היא אפס רק לרגע. משם התאוצה ממשיכה לשנות אותה, והכדור צובר מהירות כלפי מטה.
        misconception: MC-zero-velocity-zero-accel

  - id: Q-1.7-roof-time
    type: numeric
    objectives: [OBJ-1.7-2]
    level: mid
    prompt: >-
      מגג בגובה $15\,\text{m}$ זורקים כדור אנכית כלפי מעלה, במהירות $10\,\text{m/s}$. הכדור עולה ויורד ליד
      הבניין עד הקרקע. אחרי כמה שניות מרגע הזריקה הוא פוגע בקרקע?
    answer: 3
    unit: s
    correctFeedback: >-
      נכון. עם ציר כלפי מעלה וראשית בקרקע: $0 = 15 + 10t - 5t^2$, כלומר $t^2 - 2t - 3 = 0$, ו-$(t - 3)(t + 1) = 0$.
      הפתרון שאחרי הזריקה הוא $t = 3\,\text{s}$.
    wrongFeedback: >-
      כתבו $y = y_0 + v_0 t - \tfrac{1}{2}gt^2$ עם $y_0 = +15$ ו-$v_0 = +10$, הציבו $y = 0$, ופתרו משוואה ריבועית.
    commonWrong:
      - value: 2
        feedback: >-
          אחרי $2\,\text{s}$ הכדור חוזר לגובה הגג, $2v_0/g$. הוא עוד צריך לרדת $15\,\text{m}$ עד הקרקע.
      - value: 1
        feedback: >-
          זה זמן העלייה, $v_0/g$. הכדור עוד צריך לעלות, לרדת לגובה הגג ולהמשיך עד הקרקע.
      - value: 1.73
        feedback: >-
          זה זמן הנפילה ממנוחה מ-$15\,\text{m}$, $\sqrt{2\cdot15/10}$. אבל הכדור נזרק כלפי מעלה, ולכן הוא עולה קודם
          ואז נופל מגובה רב יותר.

  - id: Q-1.7-rank-airtime
    type: rank
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    level: mid
    prompt: >-
      סדרו את ארבעת הכדורים לפי הזמן שהם נמצאים באוויר עד שהם פוגעים בקרקע, מהארוך לקצר. אם יש שני זמנים שווים,
      שימו אותם זה ליד זה בכל סדר. הזניחו את השפעת האוויר.
    items:
      - { id: P1, label: 'נזרק מהקרקע כלפי מעלה, במהירות $10\,\text{m/s}$' }
      - { id: P2, label: 'הושמט ממנוחה מגובה $20\,\text{m}$' }
      - { id: P3, label: 'נזרק מהקרקע כלפי מעלה, במהירות $20\,\text{m/s}$' }
      - { id: P4, label: 'הושמט ממנוחה מגובה $45\,\text{m}$' }
    order: [P3, P4, [P1, P2]]
    correctFeedback: >-
      נכון. $P3$: $2\cdot20/10 = 4\,\text{s}$. $P4$: $\sqrt{2\cdot45/10} = 3\,\text{s}$. $P1$: $2\cdot10/10 = 2\,\text{s}$,
      ו-$P2$: $\sqrt{2\cdot20/10} = 2\,\text{s}$, שווים.
    wrongFeedback: >-
      לזריקה מהקרקע: זמן המעוף $2v_0/g$. להשמטה ממנוחה: $\sqrt{2h/g}$. חשבו את ארבעת הזמנים לפני שאתם מסדרים.

  # ---------------------------------------------------------------- OBJ-1.7-3: a = −g at the top; mass does not matter
  - id: Q-1.7-top-twotier
    type: twotier
    objectives: [OBJ-1.7-3]
    qualitative: true
    prompt: >-
      כדור נזרק אנכית כלפי מעלה. מה התאוצה שלו ברגע שהוא נמצא בנקודה הגבוהה ביותר?
    choices:
      - text: 'אפס.'
        feedback: >-
          המהירות שם אפס, אבל רק לרגע. התאוצה היא קצב השינוי של המהירות, והמהירות ממשיכה להשתנות: מחיובית לשלילית.
        misconception: MC-zero-velocity-zero-accel
      - text: '$10\,\text{m/s}^2$ כלפי מטה.'
        correct: true
        feedback: נכון. בנפילה חופשית התאוצה היא $g$ כלפי מטה בכל רגע, גם בנקודה הגבוהה ביותר.
      - text: '$10\,\text{m/s}^2$ כלפי מעלה.'
        feedback: >-
          עד הרגע הזה הכדור עלה, אבל התאוצה אינה מכוונת לפי כיוון התנועה. כל הדרך למעלה הכדור האט, ולכן התאוצה
          הייתה כלפי מטה כל הזמן.
        misconception: MC-accel-along-velocity
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          שנייה לפני הנקודה הגבוהה ביותר המהירות כלפי מעלה, ושנייה אחריה היא כלפי מטה. המהירות ממשיכה להשתנות באותו
          קצב גם ברגע שהיא אפס.
        correct: true
        feedback: >-
          בדיוק. המהירות עוברת דרך אפס בלי להתעכב שם, ולכן קצב השינוי שלה, התאוצה, לא משתנה.
      - text: 'כשהגוף לא זז, אין לו תאוצה.'
        feedback: >-
          "לא זז" נכון רק לרגע אחד. אילו גם התאוצה הייתה אפס, המהירות הייתה נשארת אפס, והכדור היה תלוי באוויר.
        misconception: MC-zero-velocity-zero-accel
      - text: 'התאוצה תמיד באותו כיוון כמו התנועה שהייתה עד עכשיו.'
        feedback: >-
          בדרך למעלה הכדור מאט, ולכן התאוצה שלו מנוגדת לתנועה. התאוצה והמהירות לא חייבות להיות באותו כיוון.
        misconception: MC-accel-along-velocity
    hints:
      - 'מה המהירות של הכדור חצי שנייה לפני הנקודה הגבוהה ביותר? וחצי שנייה אחריה?'

  - id: Q-1.7-heavy-light
    type: mc
    objectives: [OBJ-1.7-3]
    qualitative: true
    prompt: >-
      מפילים יחד, ממנוחה ומאותו גובה, שני כדורי מתכת באותו גודל: אחד במסה של $1\,\text{kg}$ והשני במסה של
      $10\,\text{kg}$. השפעת האוויר זניחה. מה קורה?
    choices:
      - text: 'שניהם מגיעים לקרקע יחד.'
        correct: true
        feedback: >-
          נכון. כשהשפעת האוויר זניחה, כל הגופים נופלים באותה תאוצה, $g$. כך הראו המדידות של גלילאו, הנייר המקומט,
          והפטיש והנוצה על הירח.
      - text: 'הכבד מגיע ראשון, פי עשרה מהר יותר.'
        feedback: >-
          זה מה שלימד אריסטו, וגלילאו הראה שזה לא נכון. בלי השפעת האוויר, לכל הגופים אותה תאוצה.
        misconception: MC-heavier-falls-faster
      - text: 'הכבד מגיע ראשון, אבל רק במעט.'
        feedback: >-
          כשהשפעת האוויר זניחה, כמו בשאלה, הם מגיעים בדיוק יחד. באוויר אמיתי הכבד באמת יקדים במעט, כי האוויר משפיע
          על גוף קל יותר מאשר על גוף כבד באותו גודל. אבל זו השפעה של האוויר, ובשאלה הזו הזנחנו אותה.
        misconception: MC-heavier-falls-faster
      - text: 'הקל מגיע ראשון, כי קל יותר להזיז אותו.'
        feedback: >-
          בנפילה חופשית המסה לא משנה בכלל: לא לטובת הכבד ולא לטובת הקל. שניהם נעים באותה תאוצה.

  - id: Q-1.7-rising-accel
    type: vector
    objectives: [OBJ-1.7-3]
    qualitative: true
    prompt: >-
      כדור נזרק אנכית כלפי מעלה, וכבר עזב את היד. הוא עדיין בדרך למעלה. מה כיוון התאוצה שלו?
    answer: s
    correctFeedback: >-
      נכון. בנפילה חופשית התאוצה תמיד כלפי מטה. בדרך למעלה היא מנוגדת למהירות, ולכן הכדור מאט.
    wrong:
      - dir: n
        feedback: >-
          המהירות כלפי מעלה, אבל התאוצה לא. אילו התאוצה הייתה כלפי מעלה, הכדור היה עולה מהר יותר ויותר ולא היה
          חוזר.
        misconception: MC-accel-along-velocity
      - dir: zero
        feedback: >-
          הכדור מאט: המהירות שלו משתנה בכל שנייה. שינוי במהירות פירושו תאוצה שאינה אפס.
        misconception: MC-zero-velocity-zero-accel
    wrongFeedback: 'האם הכדור מאט או מאיץ בדרך למעלה? מה זה אומר על הכיוון של התאוצה ביחס למהירות?'

  - id: Q-1.7-feather
    type: mc
    objectives: [OBJ-1.7-3]
    qualitative: true
    prompt: >-
      בכיתה מפילים יחד מאותו גובה מטבע ונוצה. המטבע מגיע ראשון לרצפה. מה ההסבר הנכון?
    choices:
      - text: 'האוויר משפיע הרבה על הנוצה ומעט מאוד על המטבע. בלי אוויר הם היו נוחתים יחד.'
        correct: true
        feedback: >-
          נכון. לנוצה שטח גדול ביחס למסה שלה, ולכן התנגדות האוויר מאטה אותה. כך נראה גם בסרטון מהירח: בלי אוויר,
          פטיש ונוצה נוחתים יחד.
      - text: 'המטבע כבד יותר, ולכן התאוצה שלו גדולה יותר.'
        feedback: >-
          אילו המסה הייתה הסיבה, גם בלי אוויר המטבע היה מקדים. אבל בתא ריק מאוויר הם נוחתים יחד. ההבדל בכיתה נובע
          מהאוויר.
        misconception: MC-heavier-falls-faster
      - text: 'על המטבע כדור הארץ משפיע, ועל הנוצה כמעט לא, כי היא קלה מאוד.'
        feedback: >-
          הנוצה נופלת, ולכן כדור הארץ משפיע גם עליה. בלי אוויר היא נופלת בדיוק כמו המטבע.
        misconception: MC-heavier-falls-faster

  - id: Q-1.7-vt-shape
    type: mc
    objectives: [OBJ-1.7-3, OBJ-1.7-2]
    qualitative: true
    level: mid
    prompt: >-
      כדור נזרק מהקרקע אנכית כלפי מעלה וחוזר לקרקע. הכיוון החיובי כלפי מעלה. איך נראה גרף המהירות-זמן שלו, מהזריקה
      עד הנחיתה?
    choices:
      - text: 'קו ישר יורד אחד, שמתחיל בערך חיובי, חוצה את האפס באמצע הזמן, ומסתיים בערך שלילי באותו גודל.'
        correct: true
        feedback: >-
          נכון. התאוצה קבועה, $a = -g$, ולכן השיפוע קבוע: קו ישר אחד. הוא חוצה את האפס בנקודה הגבוהה ביותר, בלי
          להתעכב שם.
      - text: 'קו יורד עד אפס, קטע אופקי קצר באפס, ואחר כך קו יורד מתחת לציר.'
        feedback: >-
          קטע אופקי באפס פירושו שהכדור עומד באוויר זמן מה, ושהתאוצה אפס לאורך הקטע. אבל התאוצה היא $a = -g$ גם בנקודה
          הגבוהה ביותר, ולכן אין קטע כזה.
        misconception: MC-zero-velocity-zero-accel
      - text: 'צורת V: קו יורד עד אפס, ואחר כך קו עולה בחזרה לאותו ערך חיובי.'
        feedback: >-
          זה גרף של **גודל** המהירות. המהירות עצמה שלילית בדרך למטה, כשהכיוון החיובי כלפי מעלה, ולכן הקו ממשיך
          לרדת מתחת לציר.
      - text: 'קו ישר אופקי, כי התאוצה קבועה.'
        feedback: >-
          התאוצה קבועה, ולכן גרף ה**תאוצה** הוא קו אופקי. גרף המהירות הוא קו ישר משופע, שהשיפוע שלו הוא התאוצה.
