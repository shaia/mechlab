# Workbook for lesson 1.4: ten practice problems and two sourced challenge problems.
# Every number recomputed with velocityInFrame / meetingTime / positionAt from src/physics/relative.ts
# (script: screens/check-1-4.ts, run with npx tsx).

lesson: '1.4'
practice:
  - id: W-1.4-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-1]
    prompt: >-
      דנה יושבת ברכבת שעומדת בתחנה. מהחלון היא רואה את הרכבת שעל המסילה הסמוכה נעה לאט אחורה, לכיוון הזנב של
      הרכבת שלה.

      (א) תנו שני הסברים שונים למה שדנה רואה.

      (ב) איך דנה יכולה להחליט איזה הסבר נכון, בלי לשאול אף אחד?
    answer: >-
      (א) או שהרכבת השנייה נוסעת אחורה ביחס לרציף, או שהרכבת של דנה התחילה לנסוע קדימה (ייתכן גם ששתיהן נעות).

      (ב) להסתכל על משהו שעומד ביחס לרציף, למשל עמוד או בניין, ולבדוק אם הוא זז ביחס לחלון שלה.
    solution:
      - kind: reasoning
        text: >-
          דנה רואה רק את המהירות של הרכבת השנייה ביחס לרכבת שלה, $v_{21} = v_2 - v_1$. היא שלילית (אחורה) אם
          $v_2$ שלילית ו-$v_1 = 0$, אבל גם אם $v_2 = 0$ ו-$v_1$ חיובית (קדימה).
      - kind: reasoning
        text: >-
          כדי להבחין, צריך גוף שמהירותו ביחס לרציף ידועה. עמוד על הרציף עומד ביחס לרציף. אם הוא זז ביחס לחלון,
          הרכבת של דנה נוסעת. אם הוא לא זז, הרכבת השנייה היא שנוסעת.
      - kind: result
        text: >-
          (א) הרכבת השנייה נוסעת אחורה, או הרכבת של דנה נוסעת קדימה. (ב) לבדוק את התנועה ביחס לגוף שעומד על הרציף.

  - id: W-1.4-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.4-2]
    prompt: >-
      הכיוון החיובי הוא צפונה. משאית A נוסעת צפונה במהירות $15\,\text{m/s}$, ומכונית B נוסעת דרומה במהירות
      $20\,\text{m/s}$.

      (א) חשבו את $v_{AB}$ ואת $v_{BA}$.

      (ב) מה המהירות שהנהג של B רואה למשאית, בקמ״ש?
    answer: >-
      (א) $v_{AB} = +35\,\text{m/s}$ (צפונה), $v_{BA} = -35\,\text{m/s}$ (דרומה).

      (ב) $126$ קמ״ש, צפונה.
    solution:
      - kind: given
        text: >-
          $v_A = +15\,\text{m/s}$ ו-$v_B = -20\,\text{m/s}$, עם הכיוון החיובי צפונה.
      - kind: formula
        text: >-
          $v_{AB} = v_A - v_B$, ו-$v_{BA} = v_B - v_A$.
      - kind: substitution
        text: >-
          $v_{AB} = 15 - (-20) = +35\,\text{m/s}$, ו-$v_{BA} = -20 - 15 = -35\,\text{m/s}$.
      - kind: substitution
        text: >-
          הנהג של B רואה את המשאית במהירות $v_{AB}$. בקמ״ש כופלים ב-3.6: $35\cdot3.6 = 126$ קמ״ש.
      - kind: result
        text: >-
          (א) $v_{AB} = +35\,\text{m/s}$, $v_{BA} = -35\,\text{m/s}$. (ב) הנהג של B רואה את המשאית מתקרבת צפונה ב-126 קמ״ש.

  - id: W-1.4-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      בהליכון בחדר כושר, החגורה נעה אחורה במהירות $3\,\text{m/s}$ ביחס לרצפה. רץ רץ על ההליכון ונשאר באותו מקום
      ביחס לרצפה. הכיוון החיובי הוא הכיוון שאליו הרץ פונה.

      (א) מה מהירות הרץ ביחס לרצפה, ומה מהירותו ביחס לחגורה?

      (ב) הרץ מגביר את הקצב ל-$3.5\,\text{m/s}$ ביחס לחגורה. באיזו מהירות הוא נע עכשיו ביחס לרצפה, וכמה הוא
      יתקדם ב-4 שניות?
    answer: >-
      (א) $0$ ביחס לרצפה, ו-$+3\,\text{m/s}$ ביחס לחגורה.

      (ב) $+0.5\,\text{m/s}$, ו-$2\,\text{m}$ קדימה.
    solution:
      - kind: given
        text: >-
          מהירות החגורה ביחס לרצפה $v_H = -3\,\text{m/s}$. הרץ במקום: $v_R = 0$.
      - kind: formula
        text: >-
          המהירות של הרץ ביחס לחגורה: $v_{RH} = v_R - v_H$. בכיוון ההפוך: $v_R = v_{RH} + v_H$.
      - kind: substitution
        text: >-
          (א) $v_{RH} = 0 - (-3) = +3\,\text{m/s}$. (ב) $v_R = 3.5 + (-3) = +0.5\,\text{m/s}$, ובמהירות קבועה הוא מתקדם
          $\Delta x = v_R\,\Delta t = 0.5\cdot4 = 2\,\text{m}$.
      - kind: result
        text: >-
          (א) $0$ ביחס לרצפה, $+3\,\text{m/s}$ ביחס לחגורה. (ב) $+0.5\,\text{m/s}$, ואחרי 4 שניות הוא $2\,\text{m}$ קדימה, וכנראה
          כבר נתקע בקדמת ההליכון.

  - id: W-1.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      בגרף מקום-זמן של שני גופים, A ו-B, יש שני קווים ישרים. הקו של A עובר בנקודות $(0\,\text{s},\ 0\,\text{m})$
      ו-$(10\,\text{s},\ 200\,\text{m})$, והקו של B עובר בנקודות $(0\,\text{s},\ 50\,\text{m})$ ו-$(10\,\text{s},\
      250\,\text{m})$.

      (א) מצאו את $v_A$ ואת $v_B$.

      (ב) מה $v_{BA}$? מה זה אומר על המרחק בין הגופים?

      (ג) תארו במילים את גרף המקום-זמן של B כפי שהוא נראה ממערכת הייחוס של A, כשהראשית ב-A.
    answer: >-
      (א) $v_A = v_B = 20\,\text{m/s}$.

      (ב) $v_{BA} = 0$, והמרחק קבוע: $50\,\text{m}$.

      (ג) קו ישר אופקי בגובה $50\,\text{m}$.
    solution:
      - kind: formula
        text: >-
          המהירות היא השיפוע של גרף מקום-זמן: $v = \dfrac{\Delta x}{\Delta t}$.
      - kind: substitution
        text: >-
          $v_A = \dfrac{200 - 0}{10} = 20\,\text{m/s}$, ו-$v_B = \dfrac{250 - 50}{10} = 20\,\text{m/s}$.
      - kind: reasoning
        text: >-
          $v_{BA} = v_B - v_A = 0$. הקווים מקבילים, ולכן ההפרש ביניהם, המרחק, זהה בכל רגע: $50\,\text{m}$. קווים
          מקבילים בגרף מקום-זמן פירושם מהירויות שוות.
      - kind: reasoning
        text: >-
          במערכת של A, המקום של B הוא $x_B - x_A = 50\,\text{m}$ בכל רגע. גרף של מקום קבוע הוא קו אופקי.
      - kind: result
        text: >-
          (א) $20\,\text{m/s}$ לשניהם. (ב) $v_{BA} = 0$, והמרחק נשאר $50\,\text{m}$. (ג) קו אופקי ב-$50\,\text{m}$: מ-A, B עומד.

  - id: W-1.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      רכבת נוסעת במהירות $20\,\text{m/s}$. נוסע אחד מגלגל כדור במעבר בין המושבים, קדימה, במהירות $5\,\text{m/s}$
      ביחס לרכבת. נוסע אחר מגלגל כדור אחורה, גם הוא $5\,\text{m/s}$ ביחס לרכבת.

      (א) מה המהירות של כל אחד מהכדורים ביחס לרציף?

      (ב) קבעו ונמקו: האם כדור שמגלגלים אחורה ברכבת יכול לנוע קדימה ביחס לרציף? האם הוא יכול לעמוד ביחס לרציף?
    answer: >-
      (א) $+25\,\text{m/s}$ ו-$+15\,\text{m/s}$, שניהם קדימה.

      (ב) כן לשתי השאלות. הוא נע קדימה כל עוד מהירותו ביחס לרכבת קטנה מ-$20\,\text{m/s}$, ועומד אם היא בדיוק $20\,\text{m/s}$ אחורה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. $v_R = +20\,\text{m/s}$. הכדורים ביחס לרכבת: $+5$ ו-$-5\,\text{m/s}$.
      - kind: formula
        text: >-
          המהירות ביחס לרציף: $v = v_{\text{rel}} + v_R$.
      - kind: substitution
        text: >-
          $v_1 = 5 + 20 = +25\,\text{m/s}$, ו-$v_2 = -5 + 20 = +15\,\text{m/s}$.
      - kind: reasoning
        text: >-
          לכדור שמגלגלים אחורה $v = -u + 20$, כאשר $u$ הוא הגודל של מהירותו ביחס לרכבת. הוא חיובי (קדימה) כל עוד
          $u < 20\,\text{m/s}$, ואפס כאשר $u = 20\,\text{m/s}$: אז מהרציף רואים את הכדור עומד, והרכבת נוסעת ממנו
          והלאה.
      - kind: result
        text: >-
          (א) $+25\,\text{m/s}$ ו-$+15\,\text{m/s}$. (ב) כן: כדור שמגלגלים אחורה לאט נע קדימה ביחס לרציף, וכדור שמגלגלים
          אחורה ב-$20\,\text{m/s}$ עומד ביחס לרציף.

  - id: W-1.4-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.4-3]
    prompt: >-
      שני מטיילים נמצאים $600\,\text{m}$ זה מזה על שביל ישר, והולכים זה לקראת זה: אחד $1.5\,\text{m/s}$ והשני
      $1.0\,\text{m/s}$. כלב יוצא מהמטייל הראשון ורץ הלוך ושוב בין שניהם, תמיד $4\,\text{m/s}$, עד שהם נפגשים.
      כמה מטרים רץ הכלב (הדרך, לא ההעתק)?
    answer: '$960\,\text{m}$.'
    solution:
      - kind: reasoning
        text: >-
          לחשב כל הלוך ושוב של הכלב בנפרד זה ארוך מאוד. במקום זה, מוצאים כמה זמן הכלב רץ: בדיוק עד שהמטיילים
          נפגשים.
      - kind: formula
        text: >-
          במערכת של מטייל אחד, השני מתקרב במהירות היחסית $v_{\text{rel}} = 1.5 - (-1.0) = 2.5\,\text{m/s}$, והזמן
          $t = d/v_{\text{rel}}$.
      - kind: substitution
        text: >-
          $t = \dfrac{600}{2.5} = 240\,\text{s}$.
      - kind: substitution
        text: >-
          הכלב רץ כל הזמן הזה בגודל מהירות $4\,\text{m/s}$, ולכן הדרך שלו $4\cdot240 = 960\,\text{m}$.
      - kind: result
        text: >-
          הכלב רץ $960\,\text{m}$. ההעתק שלו קטן הרבה יותר, כי הוא הלך הלוך ושוב.

  - id: W-1.4-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.4-2, OBJ-1.4-3]
    prompt: >-
      כשהמדרגות הנעות בקניון מושבתות, אורי עולה בהן ברגל ב-$60\,\text{s}$. כשהן פועלות ואורי עומד עליהן, הן
      מעלות אותו ב-$40\,\text{s}$.

      (א) כמה זמן ייקח לאורי לעלות אם הוא הולך באותו קצב על מדרגות פועלות?

      (ב) אורי עומד על המדרגות הפועלות. באמצע הדרך למעלה הוא מסתובב, ומתחיל ללכת למטה באותו קצב הליכה. לאן הוא
      נע ביחס לקרקע, באיזה קצה של המדרגות הוא יוצא, וכמה זמן אחרי שהסתובב?
    answer: >-
      (א) $24\,\text{s}$.

      (ב) הוא נע למעלה, $L/120$ בכל שנייה, ויוצא בראש המדרגות אחרי $60\,\text{s}$, אף שהוא הולך למטה.
    solution:
      - kind: given
        text: >-
          נסמן ב-$L$ את אורך המדרגות. הכיוון החיובי למעלה. מהירות אורי ביחס למדרגות $u = L/60$, ומהירות המדרגות
          ביחס לקרקע $w = L/40$.
      - kind: formula
        text: >-
          המהירות ביחס לקרקע היא המהירות ביחס למדרגות ועוד מהירות המדרגות: $v = u + w$.
      - kind: manipulation
        text: >-
          (א) $v = \dfrac{L}{60} + \dfrac{L}{40} = \dfrac{2L + 3L}{120} = \dfrac{L}{24}$ לשנייה, ולכן $t = L/v = 24\,\text{s}$.
      - kind: manipulation
        text: >-
          (ב) עכשיו אורי הולך למטה: $v = -\dfrac{L}{60} + \dfrac{L}{40} = \dfrac{-2L + 3L}{120} = +\dfrac{L}{120}$ לשנייה. הסימן
          חיובי: למרות ההליכה, הוא נע למעלה ביחס לקרקע. מאמצע הדרך נשארה לו חצי מהאורך, $L/2$, עד הראש:
          $t = \dfrac{L/2}{L/120} = 60\,\text{s}$.
      - kind: result
        text: >-
          (א) $24\,\text{s}$. (ב) הוא לא יגיע למטה: המדרגות מהירות ממנו, והן מעלות אותו לראש המדרגות אחרי $60\,\text{s}$.

  - id: W-1.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-2, OBJ-1.4-3]
    prompt: >-
      רצה רצה על שביל לצד כביש במהירות $4\,\text{m/s}$. בכביש נוסעות באותו כיוון מכוניות, כולן $14\,\text{m/s}$,
      במרווחים שווים זו מזו. כל $30\,\text{s}$ מכונית חולפת על פני הרצה.

      (א) מה המרחק בין שתי מכוניות סמוכות?

      (ב) כל כמה זמן חולפת מכונית על פני אדם שעומד בצד הכביש?

      (ג) כל כמה זמן חולפת מכונית על פני רץ שרץ $4\,\text{m/s}$ בכיוון ההפוך לנסיעה?
    answer: >-
      (א) $300\,\text{m}$.

      (ב) כל $21\,\text{s}$ בקירוב.

      (ג) כל $17\,\text{s}$ בקירוב.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. מהירות המכוניות $+14\,\text{m/s}$, ומהירות הרצה $+4\,\text{m/s}$. הזמן בין
          שתי מכוניות שחולפות על פניה $T = 30\,\text{s}$.
      - kind: reasoning
        text: >-
          במערכת של הרצה, הרצה עומדת, ושיירת המכוניות נעה במהירות $14 - 4 = 10\,\text{m/s}$. המרחק בין המכוניות
          זהה בכל מערכת ייחוס, ובכל $30\,\text{s}$ עובר על פניה מרחק אחד כזה.
      - kind: substitution
        text: >-
          (א) $d = 10\cdot30 = 300\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) לאדם שעומד, המכוניות נעות $14\,\text{m/s}$: $T = 300/14 \approx 21.4\,\text{s}$.
          (ג) לרץ שמהירותו $-4\,\text{m/s}$, המכוניות נעות $14 - (-4) = 18\,\text{m/s}$: $T = 300/18 \approx 16.7\,\text{s}$.
      - kind: result
        text: >-
          (א) $300\,\text{m}$. (ב) כ-$21\,\text{s}$. (ג) כ-$17\,\text{s}$. מי שנע נגד התנועה פוגש יותר מכוניות.

  - id: W-1.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-1, OBJ-1.4-3]
    prompt: >-
      חותר שט בנהר במעלה הזרם. כשהוא עובר מתחת לגשר, נופל מהסירה בקבוק ריק וצף על המים. החותר מגלה זאת אחרי
      $10$ דקות, מסובב את הסירה, וחותר בחזרה באותו מאמץ, כלומר באותה מהירות ביחס למים. הוא משיג את הבקבוק
      $1.0\,\text{km}$ במורד הזרם מהגשר.

      (א) כמה זמן עבר מנפילת הבקבוק עד שהחותר השיג אותו? רמז: פתרו במערכת הייחוס של המים.

      (ב) מה מהירות הזרם?
    answer: >-
      (א) $20$ דקות.

      (ב) כ-$0.83\,\text{m/s}$, כלומר $3$ קמ״ש.
    solution:
      - kind: reasoning
        text: >-
          במערכת הייחוס של המים, הבקבוק עומד, והסירה נעה בגודל מהירות קבוע: מתרחקת מהבקבוק 10 דקות, ואחר כך חוזרת
          אליו באותה מהירות. הדרך חזרה שווה לדרך הלוך, ולכן גם היא לוקחת 10 דקות.
      - kind: reasoning
        text: >-
          (א) מהנפילה עד ההשגה עברו $10 + 10 = 20$ דקות, כלומר $1200\,\text{s}$.
      - kind: formula
        text: >-
          ביחס לגדה הבקבוק נע עם המים, ולכן הוא עבר $1.0\,\text{km}$ במהירות הזרם: $v_M = \dfrac{\Delta x}{\Delta t}$.
      - kind: substitution
        text: >-
          $v_M = \dfrac{1000\,\text{m}}{1200\,\text{s}} \approx 0.83\,\text{m/s}$, ובקמ״ש: $0.833\cdot3.6 = 3.0$.
      - kind: result
        text: >-
          (א) $20$ דקות. (ב) הזרם $0.83\,\text{m/s}$ בקירוב, כלומר $3$ קמ״ש. לא צריך לדעת את מהירות הסירה.

  - id: W-1.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-3]
    prompt: >-
      המרחק בין עיר X לעיר Y לאורך כביש ישר הוא $9.0\,\text{km}$. רוכב אופניים יוצא מ-X לכיוון Y במהירות
      $6\,\text{m/s}$. כעבור $5$ דקות יוצאת מכונית מ-Y לכיוון X במהירות $15\,\text{m/s}$.

      (א) מה המרחק ביניהם כשהמכונית יוצאת?

      (ב) כמה זמן אחרי יציאת הרוכב הם נפגשים, ובאיזה מרחק מ-X?

      (ג) בדקו את המקום בעזרת הדרך שהמכונית עברה.
    answer: >-
      (א) $7.2\,\text{km}$.

      (ב) כ-$643\,\text{s}$ (כ-$10.7$ דקות) אחרי יציאת הרוכב, כ-$3.86\,\text{km}$ מ-X.

      (ג) המכונית עברה כ-$5.14\,\text{km}$, ו-$9.0 - 5.14 = 3.86\,\text{km}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי מ-X ל-Y, והראשית ב-X. הרוכב: $v_1 = +6\,\text{m/s}$ מ-$t = 0$. המכונית: $v_2 = -15\,\text{m/s}$
          מ-$t = 300\,\text{s}$, מ-$x = 9000\,\text{m}$.
      - kind: substitution
        text: >-
          (א) ב-$t = 300\,\text{s}$ הרוכב נמצא ב-$x_1 = 6\cdot300 = 1800\,\text{m}$, ולכן המרחק $9000 - 1800 = 7200\,\text{m}$.
      - kind: formula
        text: >-
          במערכת של הרוכב, המכונית מתקרבת במהירות $|v_2 - v_1| = |-15 - 6| = 21\,\text{m/s}$, והזמן עד הפגישה
          $\Delta t = d/21$.
      - kind: substitution
        text: >-
          $\Delta t = \dfrac{7200}{21} \approx 342.9\,\text{s}$, ולכן $t = 300 + 342.9 \approx 643\,\text{s}$. המקום:
          $x = 6\cdot642.9 \approx 3857\,\text{m}$.
      - kind: substitution
        text: >-
          (ג) המכונית נסעה $\Delta t \approx 342.9\,\text{s}$, ועברה $15\cdot342.9 \approx 5143\,\text{m}$. המקום שלה:
          $9000 - 5143 = 3857\,\text{m}$. אותו מקום.
      - kind: result
        text: >-
          (א) $7.2\,\text{km}$. (ב) כ-$643\,\text{s}$ אחרי יציאת הרוכב, כ-$3.86\,\text{km}$ מ-X. (ג) הבדיקה מתאימה.

challenge:
  - id: W-1.4-c1
    stars: 1
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      שתי רכבות, A ו-B, נוסעות על מסילות מקבילות בכיוונים מנוגדים: A במהירות $36$ קמ״ש, ו-B במהירות $72$ קמ״ש,
      שתיהן ביחס לקרקע. נוסע ברכבת A הולך במעבר לכיוון הזנב של הרכבת, במהירות $1.8$ קמ״ש ביחס לרכבת.

      (א) מה המהירות של הנוסע, בגודל ובכיוון, כפי שהיא נראית מרכבת B? תנו את התשובה במטרים לשנייה.

      (ב) מה הייתה התשובה אילו הנוסע היה הולך לכיוון הקטר?

      (ג) באיזו מהירות, ולאיזה כיוון ביחס לרכבת, היה הנוסע צריך ללכת כדי שאדם שעומד ליד המסילה יראה אותו
      עומד? האם זה אפשרי?
    answer: >-
      (א) $29.5\,\text{m/s}$, בכיוון הנסיעה של A.

      (ב) $30.5\,\text{m/s}$.

      (ג) $10\,\text{m/s}$ ($36$ קמ״ש) לכיוון הזנב. זו מהירות של ספרינטר עולמי, ולא של הליכה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה של A. ממירים ל-$\text{m/s}$ (מחלקים ב-3.6): $v_A = +10\,\text{m/s}$,
          $v_B = -20\,\text{m/s}$, ומהירות הנוסע ביחס ל-A היא $-0.5\,\text{m/s}$.
      - kind: formula
        text: >-
          מהירות הנוסע ביחס לקרקע: $v_P = v_{PA} + v_A$. ביחס ל-B: $v_{PB} = v_P - v_B$.
      - kind: substitution
        text: >-
          (א) $v_P = -0.5 + 10 = +9.5\,\text{m/s}$, ו-$v_{PB} = 9.5 - (-20) = +29.5\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) $v_P = +0.5 + 10 = +10.5\,\text{m/s}$, ו-$v_{PB} = 10.5 - (-20) = +30.5\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ג) כדי ש-$v_P = 0$, צריך $v_{PA} = -v_A = -10\,\text{m/s}$: עשרה מטרים בשנייה לכיוון הזנב. זו מהירות ריצה של
          אצן מהיר מאוד, ובמעבר של רכבת אי אפשר להגיע אליה.
      - kind: result
        text: >-
          (א) $29.5\,\text{m/s}$ בכיוון הנסיעה של A. (ב) $30.5\,\text{m/s}$. (ג) $10\,\text{m/s}$ לכיוון הזנב: לא מעשי.
    source:
      name: 'JEE Main (India; text from canvasclasses.in, a third-party solutions site, not the official NTA paper)'
      year: 2020
      problem: 'September 2020 session, Shift 1: train A, train B and a passenger walking in train A'
      url: https://www.canvasclasses.in/the-crucible/q/c666acdf-710e-4400-808a-907c4b4316e6
      verified: '2026-11-05'
      adapted: true

  - id: W-1.4-c2
    stars: 1
    objectives: [OBJ-1.4-2, OBJ-1.4-3]
    prompt: >-
      רכבת A נוסעת במהירות $90$ קמ״ש. על המסילה הסמוכה נוסעת בכיוון ההפוך רכבת B במהירות $54$ קמ״ש. נוסע
      שיושב ליד חלון ברכבת A רואה את רכבת B חולפת על פניו, מהקטר ועד הקרון האחרון, ב-$8\,\text{s}$.

      (א) מה האורך של רכבת B?

      (ב) האורך של רכבת A הוא $200\,\text{m}$. כמה זמן רואה נוסע ברכבת B את רכבת A חולפת על פניו?

      (ג) כמה זמן עובר מהרגע שהקטרים של שתי הרכבות נמצאים זה מול זה עד שהקרונות האחרונים נפרדים?

      (ד) מה משתנה אם B נוסעת באותו כיוון כמו A, באותה מהירות, ו-A עוקפת אותה? כמה זמן יראה עכשיו הנוסע ב-A את
      B חולפת על פניו?
    answer: >-
      (א) $320\,\text{m}$.

      (ב) $5\,\text{s}$.

      (ג) $13\,\text{s}$.

      (ד) המהירות היחסית יורדת ל-$10\,\text{m/s}$, והחלפה נמשכת $32\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה של A. $v_A = 90/3.6 = +25\,\text{m/s}$, ו-$v_B = -54/3.6 = -15\,\text{m/s}$.
      - kind: formula
        text: >-
          במערכת של A, הנוסע עומד, ו-B נעה במהירות $v_{BA} = v_B - v_A$. אורך הרכבת שחולפת הוא המרחק שהיא עוברת
          ביחס אליו: $L = |v_{BA}|\,t$.
      - kind: substitution
        text: >-
          (א) $v_{BA} = -15 - 25 = -40\,\text{m/s}$, ולכן $L_B = 40\cdot8 = 320\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) במערכת של B, A נעה $40\,\text{m/s}$, ולכן $t = 200/40 = 5\,\text{s}$.
      - kind: reasoning
        text: >-
          (ג) במערכת של A, B צריכה לעבור את כל אורך A ועוד את כל אורכה שלה, עד שהקרון האחרון שלה עובר את הקרון
          האחרון של A: $(200 + 320)/40 = 13\,\text{s}$.
      - kind: substitution
        text: >-
          (ד) עכשיו $v_B = +15\,\text{m/s}$, ו-$|v_{BA}| = |15 - 25| = 10\,\text{m/s}$. החלפה של $320\,\text{m}$ נמשכת
          $320/10 = 32\,\text{s}$.
      - kind: result
        text: >-
          (א) $320\,\text{m}$. (ב) $5\,\text{s}$. (ג) $13\,\text{s}$. (ד) $32\,\text{s}$: כשהרכבות נוסעות לאותו כיוון,
          המהירות היחסית קטנה פי 4, והחלפה ארוכה פי 4.
    source:
      name: 'JEE Main (India; text from cracku.in, a third-party solutions site, not the official NTA paper)'
      year: 2023
      problem: '13 April 2023, Shift 2, Physics Question 3'
      url: https://cracku.in/3-a-passenger-sitting-in-a-train-a-moving-at-90-km-h-x-nta-jee-main-13-april-2023-shift-2-physics
      verified: '2026-11-05'
      adapted: true
