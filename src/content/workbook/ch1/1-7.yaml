# Workbook for lesson 1.7: ten practice problems and two sourced challenge problems.
# Every number recomputed with apex / flight / stateAt / timesAtPosition from src/physics/kinematics.ts and G from
# src/physics/constants.ts (script: screens/check-1-7.ts, run with npx tsx).

lesson: '1.7'
practice:
  - id: W-1.7-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.7-1]
    prompt: >-
      ילד משמיט כדור ממנוחה מחלון בקומה החמישית, בגובה $20\,\text{m}$ מעל המדרכה. הזניחו את השפעת האוויר.

      (א) אחרי כמה זמן הכדור פוגע במדרכה?

      (ב) מה המהירות שלו ברגע הפגיעה?

      (ג) כמה מטרים עובר הכדור בשנייה הראשונה, וכמה בשנייה השנייה? למה המספרים שונים?
    answer: >-
      (א) $2\,\text{s}$.

      (ב) $20\,\text{m/s}$ כלפי מטה.

      (ג) $5\,\text{m}$ בשנייה הראשונה ו-$15\,\text{m}$ בשנייה השנייה, כי המהירות גדלה כל הזמן.
    solution:
      - kind: given
        text: >-
          $h = 20\,\text{m}$, $v_0 = 0$. הכיוון החיובי **כלפי מטה**, והראשית בחלון, ולכן $a = +g = +10\,\text{m/s}^2$
          והמדרכה ב-$y = +20\,\text{m}$.
      - kind: formula
        text: >-
          $y = y_0 + v_0 t + \tfrac{1}{2}at^2$ ו-$v = v_0 + at$. עם $y_0 = 0$ ו-$v_0 = 0$: $y = \tfrac{1}{2}gt^2$.
      - kind: manipulation
        text: >-
          במדרכה $y = h$, ולכן $h = \tfrac{1}{2}gt^2$. כופלים ב-2 ומחלקים ב-$g$: $t^2 = 2h/g$, ולכן $t = \sqrt{2h/g}$.
      - kind: substitution
        text: >-
          (א) $t = \sqrt{2\cdot20/10} = \sqrt{4} = 2\,\text{s}$. (ב) $v = 0 + 10\cdot2 = +20\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ג) אחרי שנייה אחת $y = 5\cdot1^2 = 5\,\text{m}$, ואחרי שתי שניות $y = 5\cdot2^2 = 20\,\text{m}$. בשנייה השנייה
          הכדור עבר $20 - 5 = 15\,\text{m}$.
      - kind: reasoning
        text: >-
          בשנייה השנייה הכדור כבר מהיר: הוא מתחיל אותה במהירות $10\,\text{m/s}$, ולא מאפס. לכן הוא עובר בה מרחק גדול
          יותר. בתאוצה קבועה ממנוחה, המרחקים בשניות עוקבות הם ביחס 1 : 3 : 5, כפי שמצא גלילאו.
      - kind: result
        text: >-
          (א) $2\,\text{s}$. (ב) $20\,\text{m/s}$ כלפי מטה. (ג) $5\,\text{m}$ ואחר כך $15\,\text{m}$, כי המהירות גדלה.

  - id: W-1.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.7-3]
    prompt: >-
      גלילאו הציע ניסוי מחשבתי נגד הטענה של אריסטו, ש"גוף כבד נופל מהר יותר מגוף קל". נניח שהטענה נכונה. קושרים
      בחוט אבן כבדה לאבן קלה, ומפילים את הזוג.

      (א) לפי הטענה, הקלה נופלת לאט יותר, ולכן היא מושכת את הכבדה לאחור. האם הזוג ייפול מהר יותר או לאט יותר מהאבן
      הכבדה לבדה?

      (ב) מצד שני, הזוג הקשור הוא גוף אחד, כבד יותר מהאבן הכבדה. מה הטענה אומרת עליו עכשיו?

      (ג) מה אפשר להסיק מהסתירה?
    answer: >-
      (א) לאט יותר.

      (ב) מהר יותר.

      (ג) הטענה מובילה לשתי מסקנות סותרות, ולכן היא לא נכונה. המסקנה היחידה שלא סותרת את עצמה: כל הגופים נופלים
      באותו קצב.
    solution:
      - kind: reasoning
        text: >-
          (א) לפי הטענה, האבן הקלה איטית יותר. כשהיא קשורה לכבדה היא מעכבת אותה, והכבדה מושכת אותה קדימה. הזוג ייפול
          במהירות שבין שתיהן: לאט יותר מהאבן הכבדה לבדה.
      - kind: reasoning
        text: >-
          (ב) הזוג הקשור כבד יותר מכל אחת מהאבנים. לפי אותה טענה, גוף כבד יותר נופל מהר יותר, ולכן הזוג ייפול מהר
          יותר מהאבן הכבדה לבדה.
      - kind: reasoning
        text: >-
          (ג) אותה טענה נותנת לאותו זוג גם "לאט יותר" וגם "מהר יותר". טענה שמובילה לסתירה אינה נכונה. הסתירה נעלמת
          רק אם כל הגופים נופלים באותו קצב: אז גם הזוג, גם הכבדה וגם הקלה נופלות יחד. ניסוי מחשבתי מראה רק שהטענה
          של אריסטו סותרת את עצמה. את התשובה הנכונה נותנים הניסויים: המדידות של גלילאו, והפטיש והנוצה על הירח.
      - kind: result
        text: >-
          (א) לאט יותר. (ב) מהר יותר. (ג) סתירה, ולכן הטענה של אריסטו לא נכונה: בלי השפעת האוויר, כל הגופים נופלים
          באותו קצב.

  - id: W-1.7-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.7-2]
    prompt: >-
      שחקנית כדורעף מקפיצה כדור ישר כלפי מעלה, במהירות $15\,\text{m/s}$, מגובה הידיים שלה.

      (א) כמה זמן עולה הכדור?

      (ב) כמה מטרים מעל הידיים הוא מגיע?

      (ג) אחרי כמה זמן מרגע ההקפצה הוא חוזר לגובה הידיים, ובאיזו מהירות?
    answer: >-
      (א) $1.5\,\text{s}$.

      (ב) $11.25\,\text{m}$, כ-$11\,\text{m}$.

      (ג) אחרי $3\,\text{s}$, במהירות $15\,\text{m/s}$ כלפי מטה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בגובה הידיים: $y_0 = 0$, $v_0 = +15\,\text{m/s}$, $a = -10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $v = v_0 + at$, ו-$v^2 = v_0^2 + 2a(y - y_0)$. בנקודה הגבוהה ביותר $v = 0$.
      - kind: manipulation
        text: >-
          $0 = v_0 - g\,t_{\text{top}}$, ולכן $t_{\text{top}} = v_0/g$. ו-$0 = v_0^2 - 2gH$, ולכן $H = v_0^2/(2g)$.
      - kind: substitution
        text: >-
          (א) $t_{\text{top}} = 15/10 = 1.5\,\text{s}$. (ב) $H = 225/20 = 11.25\,\text{m}$.
      - kind: substitution
        text: >-
          (ג) בגובה הידיים $y = 0$: $0 = 15t - 5t^2 = 5t(3 - t)$, ולכן $t = 3\,\text{s}$, ו-$v = 15 - 10\cdot3 = -15\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $1.5\,\text{s}$. (ב) כ-$11\,\text{m}$ מעל הידיים. (ג) אחרי $3\,\text{s}$, במהירות $15\,\text{m/s}$ כלפי מטה.

  - id: W-1.7-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      רון זרק כדור אנכית כלפי מעלה במהירות $10\,\text{m/s}$, ורצה לחשב את הגובה המרבי. הוא כתב: "הכיוון החיובי כלפי
      מעלה. $v^2 = v_0^2 + 2a(y - y_0)$, ובנקודה הגבוהה ביותר $v = 0$. מציבים $a = 10$: $0 = 100 + 20H$, ולכן
      $H = -5\,\text{m}$."

      (א) איך אפשר לדעת, בלי לחשב שוב, שהתשובה של רון לא נכונה?

      (ב) מצאו את הטעות, ותקנו את הפתרון.

      (ג) תלמידה אחרת בחרה את הכיוון החיובי כלפי מטה ופתרה נכון. אילו ערכים היא הציבה ל-$v_0$ ול-$a$, ומה היא
      קיבלה?
    answer: >-
      (א) גובה מרבי שלילי פירושו כדור שנזרק למעלה ומגיע אל מתחת לנקודת הזריקה.

      (ב) עם ציר כלפי מעלה $a = -10\,\text{m/s}^2$, ו-$H = +5\,\text{m}$.

      (ג) $v_0 = -10\,\text{m/s}$, $a = +10\,\text{m/s}^2$. היא קיבלה שהנקודה הגבוהה ביותר ב-$y = -5\,\text{m}$, כלומר
      הגובה המרבי $H = 5\,\text{m}$ מעל נקודת הזריקה.
    solution:
      - kind: reasoning
        text: >-
          (א) $H$ הוא הגובה מעל נקודת הזריקה. כדור שנזרק כלפי מעלה עולה, ולכן $H$ חייב להיות חיובי. תשובה שלילית
          היא סימן לטעות בסימן.
      - kind: reasoning
        text: >-
          (ב) רון בחר את הכיוון החיובי כלפי מעלה, אבל הציב $a = +10$, כאילו התאוצה כלפי מעלה. התאוצה בנפילה חופשית
          מכוונת כלפי מטה, ולכן עם הציר שלו $a = -g = -10\,\text{m/s}^2$.
      - kind: substitution
        text: >-
          $0 = 10^2 + 2\cdot(-10)\cdot H = 100 - 20H$, ולכן $20H = 100$ ו-$H = +5\,\text{m}$.
      - kind: substitution
        text: >-
          (ג) הכיוון החיובי כלפי מטה, והראשית בנקודת הזריקה ($y_0 = 0$). הכדור נזרק נגד הכיוון החיובי:
          $v_0 = -10\,\text{m/s}$, והתאוצה בכיוון החיובי: $a = +10\,\text{m/s}^2$. בנקודה הגבוהה ביותר
          $0 = (-10)^2 + 2\cdot10\cdot(y - 0)$, ולכן $y = -5\,\text{m}$: חמישה מטרים נגד הכיוון החיובי, כלומר מעל נקודת
          הזריקה. הגובה המרבי $H = 5\,\text{m}$, כמו בתיקון של (ב).
      - kind: result
        text: >-
          (א) גובה מרבי שלילי אינו אפשרי. (ב) הטעות: $a = +10$ במקום $a = -10$. התשובה: $H = 5\,\text{m}$. (ג)
          $v_0 = -10\,\text{m/s}$, $a = +10\,\text{m/s}^2$, ואותה תשובה: $5\,\text{m}$ מעל נקודת הזריקה.

  - id: W-1.7-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.7-1]
    prompt: >-
      מגשר בגובה $40\,\text{m}$ מעל הנהר זורקים אבן אנכית **כלפי מטה**, במהירות $10\,\text{m/s}$. הזניחו את השפעת
      האוויר.

      (א) אחרי כמה זמן האבן פוגעת במים?

      (ב) מה המהירות שלה ברגע הפגיעה?

      (ג) בכמה זמן קצר יותר זמן הנפילה, בהשוואה לאבן שרק משמיטים?
    answer: >-
      (א) $2\,\text{s}$.

      (ב) $30\,\text{m/s}$ כלפי מטה.

      (ג) בכ-$0.83\,\text{s}$: אבן שמשמיטים נופלת כ-$2.83\,\text{s}$.
    solution:
      - kind: given
        text: >-
          כל התנועה כלפי מטה, ולכן הכיוון החיובי **כלפי מטה**, והראשית בגשר: $y_0 = 0$, $v_0 = +10\,\text{m/s}$,
          $a = +g = +10\,\text{m/s}^2$, והמים ב-$y = +40\,\text{m}$.
      - kind: formula
        text: >-
          $y = y_0 + v_0 t + \tfrac{1}{2}at^2$, ו-$v = v_0 + at$.
      - kind: manipulation
        text: >-
          במים $y = 40$: $40 = 10t + 5t^2$. מחלקים ב-5 ומעבירים אגף: $t^2 + 2t - 8 = 0$, כלומר $(t + 4)(t - 2) = 0$.
      - kind: substitution
        text: >-
          (א) הפתרון החיובי: $t = 2\,\text{s}$. (ב) $v = 10 + 10\cdot2 = +30\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ג) אבן שמשמיטים: $t = \sqrt{2\cdot40/10} = \sqrt{8} \approx 2.83\,\text{s}$. ההפרש: $2.83 - 2 \approx 0.83\,\text{s}$.
      - kind: result
        text: >-
          (א) $2\,\text{s}$. (ב) $30\,\text{m/s}$ כלפי מטה. (ג) קצר בכ-$0.8\,\text{s}$.

  - id: W-1.7-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.7-2]
    prompt: >-
      זורקים כדור מהקרקע אנכית כלפי מעלה, במהירות $25\,\text{m/s}$. בבניין שליד, חלון בגובה $30\,\text{m}$.

      (א) מתי הכדור חולף על פני החלון? מצאו את שני הזמנים.

      (ב) מה המהירות של הכדור בכל אחד משני הרגעים?

      (ג) כמה זמן הכדור נמצא מעל גובה החלון?
    answer: >-
      (א) $t = 2\,\text{s}$ ו-$t = 3\,\text{s}$.

      (ב) $v = +5\,\text{m/s}$ (עולה) ו-$v = -5\,\text{m/s}$ (יורד), עם כיוון חיובי כלפי מעלה.

      (ג) $1\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בקרקע: $y_0 = 0$, $v_0 = +25\,\text{m/s}$, $a = -10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $y = y_0 + v_0 t + \tfrac{1}{2}at^2 = 25t - 5t^2$, ו-$v = 25 - 10t$.
      - kind: manipulation
        text: >-
          בחלון $y = 30$: $30 = 25t - 5t^2$. מעבירים אגף ומחלקים ב-5: $t^2 - 5t + 6 = 0$, כלומר $(t - 2)(t - 3) = 0$.
      - kind: substitution
        text: >-
          (ב) $v(2) = 25 - 20 = +5\,\text{m/s}$, ו-$v(3) = 25 - 30 = -5\,\text{m/s}$.
      - kind: reasoning
        text: >-
          שני הזמנים סימטריים סביב הנקודה הגבוהה ביותר, $t_{\text{top}} = 25/10 = 2.5\,\text{s}$, ובשניהם אותו גודל מהירות.
          (ג) בין $t = 2\,\text{s}$ ל-$t = 3\,\text{s}$ הכדור מעל החלון: שנייה אחת.
      - kind: result
        text: >-
          (א) $2\,\text{s}$ ו-$3\,\text{s}$. (ב) $5\,\text{m/s}$ כלפי מעלה, ואחר כך $5\,\text{m/s}$ כלפי מטה. (ג) $1\,\text{s}$.

  - id: W-1.7-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      מגג בגובה $40\,\text{m}$ זורקים כדור אנכית כלפי מעלה, במהירות $10\,\text{m/s}$. הכדור עולה ונופל עד הקרקע.
      הכיוון החיובי כלפי מעלה, והראשית בקרקע.

      (א) שרטטו, זה מתחת לזה ועם אותו ציר זמן, את גרף הגובה-זמן, גרף המהירות-זמן וגרף התאוצה-זמן, מהזריקה עד
      הנחיתה. סמנו על כל אחד מהם את הנקודה הגבוהה ביותר.

      (ב) ציינו בכל גרף מה רואים בו בנקודה הגבוהה ביותר.

      (ג) חשבו את הזמן של הנקודה הגבוהה ביותר ואת זמן הנחיתה, וכתבו אותם על ציר הזמן.
    answer: >-
      (א) גובה: פרבולה שנפתחת כלפי מטה, מ-$40\,\text{m}$ עד שיא של $45\,\text{m}$ ועד $0$. מהירות: קו ישר יורד, מ-$v = +10$
      עד $v = -30\,\text{m/s}$. תאוצה: קו אופקי ב-$a = -10\,\text{m/s}^2$.

      (ב) בנקודה הגבוהה ביותר: לגרף הגובה יש פסגה (משיק אופקי), גרף המהירות חוצה את האפס, וגרף התאוצה לא משתנה.

      (ג) שיא ב-$t = 1\,\text{s}$, נחיתה ב-$t = 4\,\text{s}$.
    solution:
      - kind: given
        text: >-
          $y_0 = +40\,\text{m}$, $v_0 = +10\,\text{m/s}$, $a = -10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $y = 40 + 10t - 5t^2$, $v = 10 - 10t$, $a = -10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          (א) $y$ ריבועי ב-$t$ עם מקדם שלילי של $t^2$, ולכן גרף הגובה הוא פרבולה שנפתחת כלפי מטה. $v$ ליניארי עם
          שיפוע $a = -10\,\text{m/s}^2$: קו ישר יורד. $a$ קבוע: קו אופקי מתחת לציר.
      - kind: reasoning
        text: >-
          (ב) בנקודה הגבוהה ביותר $v = 0$, ולכן המשיק לגרף הגובה אופקי, וגרף המהירות חוצה את ציר הזמן. גרף התאוצה
          לא "יודע" על הנקודה הזו בכלל: $a = -10\,\text{m/s}^2$ גם שם.
      - kind: substitution
        text: >-
          (ג) $t_{\text{top}} = 10/10 = 1\,\text{s}$, ושם $y = 40 + 10 - 5 = 45\,\text{m}$. בנחיתה $0 = 40 + 10t - 5t^2$,
          כלומר $t^2 - 2t - 8 = 0$ ו-$(t - 4)(t + 2) = 0$, ולכן $t = 4\,\text{s}$, ו-$v = 10 - 40 = -30\,\text{m/s}$.
      - kind: result
        text: >-
          פרבולה בגרף הגובה, קו ישר יורד בגרף המהירות וקו אופקי בגרף התאוצה. השיא ב-$t = 1\,\text{s}$ ($45\,\text{m}$,
          $v = 0$, $a = -10\,\text{m/s}^2$), והנחיתה ב-$t = 4\,\text{s}$, במהירות $30\,\text{m/s}$ כלפי מטה.

  - id: W-1.7-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      כדור פורח עולה אנכית במהירות קבועה של $10\,\text{m/s}$. כשהוא בגובה $75\,\text{m}$, משחרר אחד הנוסעים שק חול
      קטן מדופן הסל. ברגע השחרור המהירות של השק שווה למהירות של הכדור הפורח. הזניחו את השפעת האוויר על השק.

      (א) מה המהירות ההתחלתית של השק, בגודל ובכיוון? האם הוא מתחיל מיד לרדת?

      (ב) לאיזה גובה מרבי מעל הקרקע מגיע השק?

      (ג) אחרי כמה זמן מרגע השחרור השק פוגע בקרקע, ובאיזו מהירות?

      (ד) באיזה גובה נמצא הכדור הפורח ברגע שהשק פוגע בקרקע?
    answer: >-
      (א) $10\,\text{m/s}$ כלפי מעלה. לא: הוא עולה עוד שנייה.

      (ב) $80\,\text{m}$.

      (ג) אחרי $5\,\text{s}$, במהירות $40\,\text{m/s}$ כלפי מטה.

      (ד) $125\,\text{m}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בקרקע. לשק: $y_0 = +75\,\text{m}$, $v_0 = +10\,\text{m/s}$,
          $a = -10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          (א) ברגע השחרור השק נע עם הכדור הפורח, ולכן $v_0 = +10\,\text{m/s}$, כלפי מעלה. מהרגע הזה הוא בנפילה חופשית:
          הוא מאט, נעצר ורק אז מתחיל לרדת.
      - kind: substitution
        text: >-
          (ב) $t_{\text{top}} = v_0/g = 1\,\text{s}$. מעל נקודת השחרור השק עולה $H = v_0^2/(2g) = 100/20 = 5\,\text{m}$, ולכן
          הגובה המרבי מעל הקרקע $y_{\text{max}} = y_0 + H = 75 + 5 = 80\,\text{m}$.
      - kind: manipulation
        text: >-
          (ג) בקרקע $y = 0$: $0 = 75 + 10t - 5t^2$. מחלקים ב-5 ומחליפים סימנים: $t^2 - 2t - 15 = 0$, כלומר $(t - 5)(t + 3) = 0$.
      - kind: substitution
        text: >-
          הזמן שאחרי השחרור: $t = 5\,\text{s}$. המהירות: $v = 10 - 10\cdot5 = -40\,\text{m/s}$. בדיקה: מ-$80\,\text{m}$
          השק נופל ממנוחה $\sqrt{2\cdot80/10} = 4\,\text{s}$, ועם השנייה של העלייה, $5\,\text{s}$.
      - kind: substitution
        text: >-
          (ד) הכדור הפורח ממשיך במהירות קבועה: $y = 75 + 10\cdot5 = 125\,\text{m}$.
      - kind: result
        text: >-
          (א) $10\,\text{m/s}$ כלפי מעלה; השק עולה עוד שנייה לפני שהוא מתחיל לרדת. (ב) $80\,\text{m}$. (ג) אחרי
          $5\,\text{s}$, במהירות $40\,\text{m/s}$ כלפי מטה. (ד) $125\,\text{m}$.

  - id: W-1.7-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      ג'אגלר זורק כדור אנכית כלפי מעלה במהירות $20\,\text{m/s}$. שנייה אחת אחר כך הוא זורק כדור שני מאותה נקודה,
      באותה מהירות. הזניחו את השפעת האוויר.

      (א) מתי, ובאיזה גובה מעל נקודת הזריקה, הכדורים נפגשים?

      (ב) מה מהירות כל אחד מהם ברגע הפגישה? הסבירו את התוצאה בעזרת הסימטריה של זריקה אנכית.

      (ג) מה המהירות של הכדור השני ביחס לראשון, בכל רגע שבו שניהם באוויר?
    answer: >-
      (א) $2.5\,\text{s}$ אחרי הזריקה הראשונה, בגובה $18.75\,\text{m}$ (כ-$19\,\text{m}$).

      (ב) הראשון $5\,\text{m/s}$ כלפי מטה, השני $5\,\text{m/s}$ כלפי מעלה.

      (ג) $10\,\text{m/s}$ כלפי מעלה, קבועה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, הראשית בנקודת הזריקה, והשעון מתחיל בזריקה הראשונה. $v_0 = +20\,\text{m/s}$,
          $a = -10\,\text{m/s}^2$ לשני הכדורים; הכדור השני יוצא ב-$t = 1\,\text{s}$.
      - kind: formula
        text: >-
          $y_1 = 20t - 5t^2$, ו-$y_2 = 20(t - 1) - 5(t - 1)^2$ עבור $t \ge 1\,\text{s}$.
      - kind: manipulation
        text: >-
          בפגישה $y_1 = y_2$. פותחים סוגריים: $20t - 5t^2 = 20t - 20 - 5t^2 + 10t - 5$. האיברים $20t$ ו-$5t^2$ מתבטלים,
          ונשאר $0 = 10t - 25$, ולכן $t = 2.5\,\text{s}$.
      - kind: substitution
        text: >-
          $y = 20\cdot2.5 - 5\cdot2.5^2 = 50 - 31.25 = 18.75\,\text{m}$. $v_1 = 20 - 10\cdot2.5 = -5\,\text{m/s}$,
          ו-$v_2 = 20 - 10\cdot1.5 = +5\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ב) הראשון מגיע לשיא ב-$t = 2\,\text{s}$, והשני ב-$t = 3\,\text{s}$. הפגישה באמצע, $t = 2.5\,\text{s}$: הראשון חצי
          שנייה אחרי השיא שלו, והשני חצי שנייה לפני השיא שלו. בסימטריה, הם באותו גובה ובאותו גודל מהירות, בכיוונים
          מנוגדים.
      - kind: reasoning
        text: >-
          (ג) $v_2 - v_1 = [20 - 10(t - 1)] - [20 - 10t] = +10\,\text{m/s}$. לשני הכדורים אותה תאוצה, ולכן המהירות
          היחסית לא משתנה.
      - kind: result
        text: >-
          (א) $t = 2.5\,\text{s}$, בגובה כ-$19\,\text{m}$. (ב) $5\,\text{m/s}$ כלפי מטה ו-$5\,\text{m/s}$ כלפי מעלה. (ג)
          $10\,\text{m/s}$ כלפי מעלה, כל הזמן.

  - id: W-1.7-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      מגובה $h$ מעל הקרקע זורקים כדור אנכית כלפי מעלה, במהירות $v_0$. הזניחו את השפעת האוויר.

      (א) בטאו באמצעות $v_0$, $h$ ו-$g$ את גודל המהירות של הכדור כשהוא פוגע בקרקע.

      (ב) בטאו באמצעות $v_0$, $h$ ו-$g$ את הזמן מרגע הזריקה עד הפגיעה בקרקע.

      (ג) בדקו את התשובה של (ב) בשני מקרים שאתם יודעים לפתור: $v_0 = 0$, ו-$h = 0$.

      (ד) הציבו $h = 32\,\text{m}$ ו-$v_0 = 12\,\text{m/s}$.
    answer: >-
      (א) $\sqrt{v_0^2 + 2gh}$.

      (ב) $t = \dfrac{v_0 + \sqrt{v_0^2 + 2gh}}{g}$.

      (ג) $v_0 = 0$ נותן $\sqrt{2h/g}$, ו-$h = 0$ נותן $2v_0/g$.

      (ד) $28\,\text{m/s}$ ו-$4\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בקרקע: $y_0 = +h$, $v_0 > 0$, $a = -g$.
      - kind: formula
        text: >-
          $v^2 = v_0^2 + 2a(y - y_0)$, ו-$v = v_0 + at$.
      - kind: manipulation
        text: >-
          (א) בקרקע $y = 0$: $v^2 = v_0^2 - 2g(0 - h) = v_0^2 + 2gh$. לכן גודל המהירות $\sqrt{v_0^2 + 2gh}$, והמהירות
          עצמה שלילית (כלפי מטה): $v = -\sqrt{v_0^2 + 2gh}$.
      - kind: manipulation
        text: >-
          (ב) מציבים את המהירות הזו ב-$v = v_0 - gt$ ומבודדים את $t$: $gt = v_0 - v = v_0 + \sqrt{v_0^2 + 2gh}$, ולכן
          $t = \left(v_0 + \sqrt{v_0^2 + 2gh}\right)/g$.
      - kind: reasoning
        text: >-
          (ג) עם $v_0 = 0$: $t = \sqrt{2gh}/g = \sqrt{2h/g}$, זמן הנפילה ממנוחה. עם $h = 0$: $t = (v_0 + v_0)/g = 2v_0/g$,
          זמן המעוף בחזרה לגובה הזריקה. שני המקרים מתאימים.
      - kind: substitution
        text: >-
          (ד) $\sqrt{12^2 + 2\cdot10\cdot32} = \sqrt{144 + 640} = \sqrt{784} = 28\,\text{m/s}$, ו-$t = (12 + 28)/10 = 4\,\text{s}$.
      - kind: result
        text: >-
          (א) $\sqrt{v_0^2 + 2gh}$. (ב) $\left(v_0 + \sqrt{v_0^2 + 2gh}\right)/g$. (ג) שני המקרים מתאימים. (ד)
          $28\,\text{m/s}$ כלפי מטה, אחרי $4\,\text{s}$.

challenge:
  - id: W-1.7-c1
    stars: 1
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      מראש מגדל זורקים כדור אנכית כלפי מעלה, והוא פוגע בקרקע אחרי $6\,\text{s}$. כדור שני נזרק מאותה נקודה אנכית
      **כלפי מטה**, באותו גודל מהירות, ופוגע בקרקע אחרי $1.5\,\text{s}$. הזניחו את השפעת האוויר.

      (א) מצאו את גודל מהירות הזריקה ואת גובה המגדל.

      (ב) כדור שלישי משמיטים ממנוחה מאותה נקודה. אחרי כמה זמן הוא פוגע בקרקע?

      (ג) הראו שבכל מגדל ובכל מהירות, זמן הנפילה ממנוחה הוא הממוצע ההנדסי של שני הזמנים האחרים:
      $t_3 = \sqrt{t_1 t_2}$.
    answer: >-
      (א) $22.5\,\text{m/s}$, ומגדל בגובה $45\,\text{m}$.

      (ב) $3\,\text{s}$.

      (ג) $t_1 t_2 = 2h/g = t_3^2$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בראש המגדל; הקרקע ב-$y = -h$. כדור 1: $v_0 = +u$, $t_1 = 6\,\text{s}$.
          כדור 2: $v_0 = -u$, $t_2 = 1.5\,\text{s}$. לשניהם $a = -10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $y = v_0 t - \tfrac{1}{2}gt^2$. בקרקע $y = -h$, ולכן $5t_1^2 - u t_1 = h$ ו-$5t_2^2 + u t_2 = h$.
      - kind: manipulation
        text: >-
          מחסירים את המשוואה השנייה מהראשונה. $h$ מתבטל: $5(t_1^2 - t_2^2) - u(t_1 + t_2) = 0$. ההפרש של שני ריבועים
          מתפרק לפי $t_1^2 - t_2^2 = (t_1 - t_2)(t_1 + t_2)$, ולכן $5(t_1 - t_2)(t_1 + t_2) = u(t_1 + t_2)$.
          עכשיו $(t_1 + t_2)$ מופיע בשני האגפים, ואינו אפס, ולכן מחלקים בו: $u = 5(t_1 - t_2) = \tfrac{1}{2}g(t_1 - t_2)$.
          מציבים חזרה במשוואה השנייה: $h = u t_2 + 5t_2^2 = 5(t_1 - t_2)t_2 + 5t_2^2 = 5t_1 t_2 = \tfrac{1}{2}g\,t_1 t_2$.
      - kind: substitution
        text: >-
          (א) $u = 5\cdot(6 - 1.5) = 22.5\,\text{m/s}$, ו-$h = 5\cdot6\cdot1.5 = 45\,\text{m}$. בדיקה בכדור 1:
          $22.5\cdot6 - 5\cdot36 = 135 - 180 = -45\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) $t_3 = \sqrt{2h/g} = \sqrt{2\cdot45/10} = 3\,\text{s}$.
      - kind: reasoning
        text: >-
          (ג) מ-(א): $h = \tfrac{1}{2}g\,t_1 t_2$. לנפילה ממנוחה: $h = \tfrac{1}{2}g\,t_3^2$. משווים: $t_3^2 = t_1 t_2$, ולכן
          $t_3 = \sqrt{t_1 t_2}$, בלי קשר ל-$u$ ול-$h$. כאן: $\sqrt{6\cdot1.5} = \sqrt{9} = 3\,\text{s}$.
      - kind: result
        text: >-
          (א) $22.5\,\text{m/s}$ ו-$45\,\text{m}$. (ב) $3\,\text{s}$. (ג) $t_3 = \sqrt{t_1 t_2}$.
    source:
      name: JEE Main
      year: 2022
      problem: '24 June 2022, Shift 1, Q21: a ball thrown up and one thrown down from a tower; time for a ball released from rest'
      url: https://cracku.in/21-from-the-top-of-a-tower-a-ball-is-thrown-verticall-x-nta-jee-main-24-june-2022-shift-1
      verified: '2026-11-05'
      adapted: true

  - id: W-1.7-c2
    stars: 1
    objectives: [OBJ-1.7-2]
    prompt: >-
      כדור נזרק אנכית כלפי מעלה במהירות $v_0$. כשגודל המהירות שלו ירד לחצי, $v_0/2$, הוא כבר עלה לגובה $h$ מעל נקודת
      הזריקה. הזניחו את השפעת האוויר.

      (א) בטאו את הגובה המרבי $H$ באמצעות $h$ בלבד.

      (ב) נתון $h = 15\,\text{m}$. מצאו את $v_0$, את $H$, ואת שני הרגעים שבהם הכדור נמצא בגובה $h$.

      (ג) קבעו ונמקו: כמה זמן אחרי הנקודה הגבוהה ביותר גודל המהירות שוב שווה ל-$v_0/2$, ובאיזה גובה?
    answer: >-
      (א) $H = \tfrac{4}{3}h$.

      (ב) $v_0 = 20\,\text{m/s}$, $H = 20\,\text{m}$, ו-$t = 1\,\text{s}$ ו-$t = 3\,\text{s}$.

      (ג) $1\,\text{s}$ אחרי השיא, שוב בגובה $15\,\text{m}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי כלפי מעלה, והראשית בנקודת הזריקה. $a = -g$; בגובה $h$ המהירות $v = +v_0/2$, ובשיא $v = 0$.
      - kind: formula
        text: >-
          $v^2 = v_0^2 + 2a(y - y_0)$.
      - kind: manipulation
        text: >-
          (א) בגובה $h$: $\tfrac{1}{4}v_0^2 = v_0^2 - 2gh$, ולכן $h = \tfrac{3}{4}\cdot\dfrac{v_0^2}{2g}$. בשיא:
          $H = \dfrac{v_0^2}{2g}$. לכן $h = \tfrac{3}{4}H$, ו-$H = \tfrac{4}{3}h$.
      - kind: substitution
        text: >-
          (ב) $H = \tfrac{4}{3}\cdot15 = 20\,\text{m}$, ו-$v_0 = \sqrt{2gH} = \sqrt{400} = 20\,\text{m/s}$. בגובה $15\,\text{m}$:
          $15 = 20t - 5t^2$, כלומר $t^2 - 4t + 3 = 0$, ו-$t = 1\,\text{s}$ או $t = 3\,\text{s}$.
      - kind: reasoning
        text: >-
          (ג) השיא ב-$t_{\text{top}} = 20/10 = 2\,\text{s}$. בדרך למעלה גודל המהירות $v_0/2 = 10\,\text{m/s}$ ב-$t = 1\,\text{s}$,
          שנייה לפני השיא. בסימטריה, שנייה אחרי השיא, ב-$t = 3\,\text{s}$, הכדור שוב בגובה $15\,\text{m}$, במהירות
          $10\,\text{m/s}$ כלפי מטה: $v = 20 - 30 = -10\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $H = \tfrac{4}{3}h$. (ב) $v_0 = 20\,\text{m/s}$, $H = 20\,\text{m}$, ובגובה $h$ ב-$1\,\text{s}$ וב-$3\,\text{s}$.
          (ג) שנייה אחרי השיא, באותו גובה $15\,\text{m}$.
    source:
      name: AAPT F = ma Exam (US Physics Team)
      year: 2022
      problem: 'Exam A, Question 1: speed halves after rising h; maximum height'
      url: https://www.aapt.org/physicsteam/upload/2022_Fma_Exam_A_Solutions.pdf
      verified: '2026-11-05'
      adapted: true
