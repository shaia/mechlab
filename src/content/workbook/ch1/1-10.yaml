# Workbook for lesson 1.10: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/vec.ts and src/physics/planar.ts (ellipsePath, deltaV,
# averageVelocity, accelComponents) and G from src/physics/constants.ts.

lesson: '1.10'
practice:
  - id: W-1.10-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.10-1]
    prompt: >-
      ראשית הצירים בנמל, ציר $x$ מזרחה וציר $y$ צפונה, והמרחקים בקילומטרים. בשעה 10:00 סירה נמצאת בנקודה
      $(-4, 3)\,\text{km}$, ובשעה 10:30 בנקודה $(5, 15)\,\text{km}$.

      (א) מצאו את ההעתק של הסירה: רכיבים, גודל וכיוון.

      (ב) מצאו את גודל המהירות הממוצעת שלה, בקמ״ש ובמטרים לשנייה.
    answer: >-
      (א) $\Delta\vec r = (9, 12)\,\text{km}$, באורך $15\,\text{km}$, כ-$53^\circ$ צפונה מכיוון מזרח.

      (ב) $30\,\text{km/h}$, כלומר כ-$8.3\,\text{m/s}$, באותו כיוון.
    solution:
      - kind: given
        text: >-
          $\vec r_1 = (-4, 3)\,\text{km}$, $\vec r_2 = (5, 15)\,\text{km}$, $\Delta t = 0.5\,\text{h}$. ציר $x$ חיובי מזרחה, $y$ חיובי צפונה.
      - kind: formula
        text: >-
          $\Delta\vec r = \vec r_2 - \vec r_1$, רכיב מרכיב, ו-$\bar{\vec v} = \Delta\vec r / \Delta t$.
      - kind: substitution
        text: >-
          $\Delta x = 5 - (-4) = 9\,\text{km}$ ו-$\Delta y = 15 - 3 = 12\,\text{km}$. האורך: $\sqrt{9^2 + 12^2} = 15\,\text{km}$.
          הכיוון: $\tan\theta = 12/9$, ולכן $\theta \approx 53.1^\circ$ צפונה ממזרח.
      - kind: substitution
        text: >-
          $|\bar{\vec v}| = 15 / 0.5 = 30\,\text{km/h}$. להמרה מחלקים ב-3.6: $30 / 3.6 \approx 8.3\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $(9, 12)\,\text{km}$, $15\,\text{km}$, כ-$53^\circ$ צפונה ממזרח. (ב) $30\,\text{km/h} \approx 8.3\,\text{m/s}$, בכיוון ההעתק.

  - id: W-1.10-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.10-1]
    prompt: >-
      מכונית מרוץ נוסעת במסלול אליפטי שבנוי משני קטעים ישרים ארוכים, אחד בדרום ואחד בצפון, ומשתי קשתות חצי-מעגל בקצוות.
      היא נוסעת נגד כיוון השעון כשמסתכלים מלמעלה, ולכן על הקטע הדרומי היא נוסעת מזרחה.

      (א) מה כיוון המהירות באמצע הקטע הדרומי, באמצע הקשת המזרחית ובאמצע הקטע הצפוני?

      (ב) על הקטע הדרומי מד המהירות מראה מספר קבוע. האם המהירות קבועה שם? ובקשת, כשמד המהירות מראה אותו מספר?

      (ג) מה כיוון המהירות הממוצעת מאמצע הקטע הדרומי עד אמצע הקטע הצפוני?
    answer: >-
      (א) מזרחה, צפונה, מערבה.

      (ב) על הקטע הישר כן; בקשת לא, כי הכיוון משתנה.

      (ג) צפונה.
    solution:
      - kind: reasoning
        text: >-
          המהירות משיקה למסלול ומצביעה לאן שהמכונית נעה. בקטע הדרומי היא נעה מזרחה. באמצע הקשת המזרחית המשיק אנכי, והמכונית
          בדרך מהקטע הדרומי לצפוני, כלומר צפונה. בקטע הצפוני היא חוזרת, מערבה.
      - kind: reasoning
        text: >-
          בקטע ישר הכיוון קבוע, ואם גם הגודל קבוע, המהירות קבועה. בקשת הגודל קבוע אבל הכיוון מסתובב, ולכן המהירות משתנה, ויש תאוצה.
      - kind: reasoning
        text: >-
          המהירות הממוצעת בכיוון ההעתק. אמצע הקטע הצפוני נמצא בדיוק צפונה מאמצע הקטע הדרומי, ולכן ההעתק, וגם המהירות הממוצעת,
          מצביעים צפונה. זה לא הכיוון של המהירות באף אחת משתי הנקודות.
      - kind: result
        text: >-
          (א) מזרחה, צפונה, מערבה. (ב) בקטע הישר המהירות קבועה; בקשת היא משתנה, כי כיוונה משתנה. (ג) צפונה.

  - id: W-1.10-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.10-2]
    prompt: >-
      כדור נע מזרחה במהירות $5\,\text{m/s}$, פוגע בקיר, וחוזר מערבה במהירות $3\,\text{m/s}$. המגע עם הקיר נמשך $0.02\,\text{s}$.

      (א) מה השינוי במהירות של הכדור?

      (ב) מה התאוצה הממוצעת שלו בזמן המגע?
    answer: >-
      (א) $8\,\text{m/s}$, מערבה.

      (ב) $400\,\text{m/s}^2$, מערבה.
    solution:
      - kind: given
        text: >-
          ציר חיובי מזרחה. $v_1 = +5\,\text{m/s}$, $v_2 = -3\,\text{m/s}$, $\Delta t = 0.02\,\text{s}$.
      - kind: formula
        text: >-
          $\Delta v = v_2 - v_1$ ו-$\bar a = \Delta v / \Delta t$, עם הסימנים.
      - kind: substitution
        text: >-
          $\Delta v = -3 - 5 = -8\,\text{m/s}$. $\bar a = -8 / 0.02 = -400\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          הסימן השלילי פירושו מערבה. מי שמחסירים גדלים מקבלים $5 - 3 = 2\,\text{m/s}$, ומפספסים את היפוך הכיוון.
      - kind: result
        text: >-
          (א) $\Delta v = 8\,\text{m/s}$ מערבה. (ב) $\bar a = 400\,\text{m/s}^2$ מערבה.

  - id: W-1.10-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.10-2]
    prompt: >-
      דיסקית הוקי מחליקה על הקרח במהירות $\vec v_1 = (8, 6)\,\text{m/s}$, כאשר $x$ ימינה ו-$y$ למעלה במבט מלמעלה. היא פוגעת
      בדופן ימנית אנכית (לאורך ציר $y$), וממשיכה במהירות $\vec v_2 = (-8, 6)\,\text{m/s}$. המגע נמשך $0.05\,\text{s}$.

      (א) השוו את גודל המהירות לפני הפגיעה ואחריה.

      (ב) מצאו את $\Delta\vec v$ ואת התאוצה הממוצעת בזמן המגע: גודל וכיוון.
    answer: >-
      (א) $10\,\text{m/s}$ לפני ואחרי.

      (ב) $\Delta\vec v = (-16, 0)\,\text{m/s}$; $|\bar{\vec a}| = 320\,\text{m/s}^2$, שמאלה, מאונכת לדופן.
    solution:
      - kind: given
        text: >-
          $\vec v_1 = (8, 6)\,\text{m/s}$, $\vec v_2 = (-8, 6)\,\text{m/s}$, $\Delta t = 0.05\,\text{s}$.
      - kind: substitution
        text: >-
          $|\vec v_1| = |\vec v_2| = \sqrt{8^2 + 6^2} = 10\,\text{m/s}$.
      - kind: formula
        text: >-
          $\Delta\vec v = \vec v_2 - \vec v_1$, ו-$\bar{\vec a} = \Delta\vec v / \Delta t$.
      - kind: substitution
        text: >-
          $\Delta\vec v = (-8 - 8,\ 6 - 6) = (-16,\ 0)\,\text{m/s}$. $\bar{\vec a} = (-16, 0) / 0.05 = (-320,\ 0)\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          הרכיב שמקביל לדופן לא השתנה, והרכיב שמאונך לה התהפך. לכן $\Delta\vec v$ מאונך לדופן ומצביע הרחק ממנה, שמאלה,
          אף שגודל המהירות לא השתנה.
      - kind: result
        text: >-
          (א) $10\,\text{m/s}$ בשני המקרים. (ב) $\Delta\vec v = 16\,\text{m/s}$ שמאלה, ו-$\bar{\vec a} = 320\,\text{m/s}^2$ שמאלה.

  - id: W-1.10-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.10-3]
    prompt: >-
      קרונית ברכבת הרים עוברת ארבעה מקומות. קבעו ונמקו בכל אחד את כיוון התאוצה, בעזרת הרכיב המשיקי והרכיב הרדיאלי.

      (א) על מדרון ישר, בדרך למטה, והקרונית מאיצה.

      (ב) בנקודה הנמוכה ביותר של עמק: המסלול מתעקל שם כלפי מעלה, וגודל המהירות מקסימלי ברגע הזה.

      (ג) בנקודה הגבוהה ביותר של גבעה עגולה: המסלול מתעקל כלפי מטה, וגודל המהירות מינימלי ברגע הזה.

      (ד) על מדרון ישר, בדרך למעלה, והקרונית מאטה.
    answer: >-
      (א) במורד המדרון, קדימה. (ב) אנכית למעלה. (ג) אנכית למטה. (ד) במורד המדרון, כלומר אחורה.
    solution:
      - kind: reasoning
        text: >-
          (א) קו ישר: אין רכיב רדיאלי. הקרונית מאיצה, ולכן הרכיב המשיקי בכיוון המהירות, במורד המדרון.
      - kind: reasoning
        text: >-
          (ב) גודל המהירות מקסימלי, כלומר ברגע הזה הוא לא גדל ולא קטן, ולכן הרכיב המשיקי אפס. המסלול מתעקל, ולכן יש רכיב רדיאלי,
          אל הצד הפנימי של העיקול. בעמק הצד הפנימי הוא למעלה.
      - kind: reasoning
        text: >-
          (ג) באותו אופן: רכיב משיקי אפס, ורכיב רדיאלי אל הצד הפנימי של העיקול, שבראש גבעה הוא למטה.
      - kind: reasoning
        text: >-
          (ד) קו ישר, אין רכיב רדיאלי. הקרונית מאטה, ולכן הרכיב המשיקי נגד המהירות: במורד המדרון, אף שהיא נוסעת במעלה המדרון.
      - kind: result
        text: >-
          (א) במורד המדרון. (ב) למעלה. (ג) למטה. (ד) במורד המדרון. רק ב-(א) התאוצה בכיוון התנועה.

  - id: W-1.10-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.10-1, OBJ-1.10-2]
    prompt: >-
      תרשים עקבות של מטוס צעצוע צולם מלמעלה, ומקומו נמדד כל שנייה ($x$ ימינה, $y$ למעלה, במטרים):
      ב-$t = 0$ בנקודה $(0, 0)$, ב-$1\,\text{s}$ ב-$(3, 3)$, ב-$2\,\text{s}$ ב-$(6, 4)$, ב-$3\,\text{s}$ ב-$(9, 3)$, וב-$4\,\text{s}$ ב-$(12, 0)$.

      (א) מצאו את המהירות הממוצעת בכל אחת מארבע השניות.

      (ב) מצאו את המהירות הממוצעת בין $t = 0$ ל-$t = 2\,\text{s}$: רכיבים וגודל.

      (ג) הניחו שהמהירות הממוצעת בכל שנייה שווה למהירות הרגעית באמצע אותה שנייה. העריכו את התאוצה של המטוס.
    answer: >-
      (א) $(3, 3)$, $(3, 1)$, $(3, -1)$, $(3, -3)\,\text{m/s}$.

      (ב) $(3, 2)\,\text{m/s}$, בגודל כ-$3.6\,\text{m/s}$.

      (ג) $(0, -2)\,\text{m/s}^2$: $2\,\text{m/s}^2$ כלפי מטה בתרשים, קבועה.
    solution:
      - kind: formula
        text: >-
          $\bar{\vec v} = \Delta\vec r / \Delta t$ בכל פרק זמן, ו-$\bar{\vec a} = \Delta\vec v / \Delta t$.
      - kind: substitution
        text: >-
          (א) בכל שנייה $\Delta t = 1\,\text{s}$, ולכן המהירות הממוצעת שווה להעתק: $(3, 3)$, $(3, 1)$, $(3, -1)$ ו-$(3, -3)\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) $\Delta\vec r = (6, 4)\,\text{m}$ ב-$2\,\text{s}$, ולכן $\bar{\vec v} = (3, 2)\,\text{m/s}$, וגודלה $\sqrt{9 + 4} \approx 3.6\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ג) אמצעי השניות, $0.5$, $1.5$, $2.5$ ו-$3.5\,\text{s}$, רחוקים זה מזה שנייה אחת. בין כל שני אמצעים סמוכים המהירות
          משתנה ב-$(0, -2)\,\text{m/s}$: הרכיב $x$ לא משתנה, והרכיב $y$ יורד ב-2.
      - kind: substitution
        text: >-
          $\bar{\vec a} = (0, -2) / 1 = (0, -2)\,\text{m/s}^2$, ואותו ערך בכל שלושת פרקי הזמן.
      - kind: result
        text: >-
          (א) $(3, 3)$, $(3, 1)$, $(3, -1)$, $(3, -3)\,\text{m/s}$. (ב) $(3, 2)\,\text{m/s}$, כ-$3.6\,\text{m/s}$. (ג) $(0, -2)\,\text{m/s}^2$, קבועה.

  - id: W-1.10-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.10-3]
    prompt: >-
      ברגע מסוים המהירות של גוף היא $\vec v = (3, 3)\,\text{m/s}$, כלומר ימינה ולמעלה ב-$45^\circ$. בכל אחד מהמקרים נתונה
      התאוצה שלו באותו רגע. קבעו ונמקו: האם גודל המהירות גדל, קטן או לא משתנה ברגע הזה, והאם הגוף פונה, ולאיזה צד?

      (א) $\vec a = (2, 2)\,\text{m/s}^2$.

      (ב) $\vec a = (-2, 2)\,\text{m/s}^2$.

      (ג) $\vec a = (-2, -2)\,\text{m/s}^2$.

      (ד) $\vec a = (0, -2)\,\text{m/s}^2$.
    answer: >-
      (א) מאיץ, לא פונה. (ב) גודל המהירות לא משתנה ברגע הזה, פונה שמאלה. (ג) מאט, לא פונה. (ד) מאט ופונה ימינה.
    solution:
      - kind: reasoning
        text: >-
          משווים את כיוון התאוצה לכיוון המהירות. בכיוון המהירות: רכיב משיקי חיובי. נגדה: שלילי. מאונך לה: רכיב רדיאלי, שמסובב את
          המהירות לצד שאליו הוא מצביע.
      - kind: reasoning
        text: >-
          (א) $(2, 2)$ בדיוק בכיוון $(3, 3)$: רק רכיב משיקי, חיובי. (ג) $(-2, -2)$ בדיוק נגד המהירות: רק רכיב משיקי, שלילי.
      - kind: reasoning
        text: >-
          (ב) $(-2, 2)$ מאונך ל-$(3, 3)$, כי $(-2)(3) + (2)(3) = 0$. אין רכיב משיקי, והרכיב הרדיאלי מצביע שמאלה ולמעלה, שמאלה
          מכיוון התנועה, ולכן הגוף פונה שמאלה.
      - kind: reasoning
        text: >-
          (ד) $(0, -2)$ מצביע ישר למטה. מותחים את הקו של המהירות דרך הגוף: מאחורי הגוף הוא יורד שמאלה, $45^\circ$ מתחת
          לאופק. הזווית החדה בין התאוצה לחלק הזה של הקו היא $90^\circ - 45^\circ = 45^\circ$. לכן $|a_T| = 2\cos 45^\circ \approx 1.4\,\text{m/s}^2$,
          והחלק הזה מצביע אחורה, נגד המהירות: $a_T \approx -1.4\,\text{m/s}^2$. הרכיב הרדיאלי $a_R = 2\sin 45^\circ \approx 1.4\,\text{m/s}^2$
          מצביע ימינה ולמטה, לצד ימין של כיוון התנועה.
      - kind: result
        text: >-
          (א) מאיץ בקו ישר. (ב) גודל מהירות לא משתנה, פונה שמאלה. (ג) מאט בקו ישר. (ד) מאט ופונה ימינה.

  - id: W-1.10-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.10-2, OBJ-1.10-3]
    prompt: >-
      גוף נע במעגל נגד כיוון השעון. ראשית הצירים במרכז המעגל, $x$ ימינה ו-$y$ למעלה. בנקודה $A$, הקצה הימני של המעגל, מהירותו
      $4\,\text{m/s}$ למעלה. כעבור $1.5\,\text{s}$ הוא מגיע לנקודה $B$, הקצה העליון, ומהירותו $6\,\text{m/s}$ שמאלה.

      (א) מצאו את $\Delta\vec v$ ואת התאוצה הממוצעת בין $A$ ל-$B$: רכיבים, גודל וכיוון.

      (ב) אילו גודל המהירות היה קבוע, $\Delta\vec v$ היה מצביע בדיוק אל המרכז מאמצע הקשת, כלומר $45^\circ$ מתחת לכיוון השלילי של ציר $x$.
      לאיזה צד נוטה $\Delta\vec v$ כאן, ולמה?

      (ג) פרקו את התאוצה הממוצעת לרכיב לאורך כיוון התנועה באמצע הקשת ולרכיב אל המרכז.
    answer: >-
      (א) $\Delta\vec v = (-6, -4)\,\text{m/s}$, כ-$7.2\,\text{m/s}$; $|\bar{\vec a}| \approx 4.8\,\text{m/s}^2$, כ-$34^\circ$ מתחת לכיוון השלילי של ציר $x$.

      (ב) הוא נוטה לכיוון התנועה, כי הגוף מאיץ.

      (ג) כ-$0.94\,\text{m/s}^2$ קדימה וכ-$4.7\,\text{m/s}^2$ אל המרכז.
    solution:
      - kind: given
        text: >-
          $\vec v_A = (0, 4)\,\text{m/s}$, $\vec v_B = (-6, 0)\,\text{m/s}$, $\Delta t = 1.5\,\text{s}$.
      - kind: substitution
        text: >-
          $\Delta\vec v = (-6 - 0,\ 0 - 4) = (-6,\ -4)\,\text{m/s}$, באורך $\sqrt{36 + 16} \approx 7.21\,\text{m/s}$.
          $\bar{\vec a} = \Delta\vec v / 1.5 = (-4,\ -2.67)\,\text{m/s}^2$, בגודל $7.21 / 1.5 \approx 4.81\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          הכיוון: $\tan\varphi = 4/6$, ולכן $\varphi \approx 33.7^\circ$ מתחת לכיוון השלילי של ציר $x$. במעגל בגודל מהירות קבוע הזווית הייתה
          $45^\circ$. כאן $\Delta\vec v$ "שטוח" יותר, כלומר נוטה שמאלה ומעלה יותר, לכיוון התנועה באמצע הקשת.
      - kind: reasoning
        text: >-
          באמצע הקשת, בזווית $45^\circ$, הכיוון אל המרכז הוא שמאלה ולמטה, $45^\circ$ מתחת לכיוון השלילי של ציר $x$, וכיוון התנועה
          מאונך לו, שמאלה ולמעלה. $\Delta\vec v$ נוטה $33.7^\circ$ מתחת לכיוון השלילי של ציר $x$, ולכן הזווית החדה בינו לבין
          הכיוון אל המרכז היא $45^\circ - 33.7^\circ = 11.3^\circ$. במשולש ישר-הזווית: הרכיב אל המרכז
          $7.21\cos 11.3^\circ \approx 7.07\,\text{m/s}$, והרכיב לאורך התנועה $7.21\sin 11.3^\circ \approx 1.41\,\text{m/s}$.
          $\Delta\vec v$ נוטה מהכיוון אל המרכז לעבר כיוון התנועה, ולכן הרכיב הזה מצביע קדימה.
      - kind: substitution
        text: >-
          מחלקים ב-$1.5\,\text{s}$: רכיב לאורך התנועה $\approx 0.94\,\text{m/s}^2$, ורכיב אל המרכז $\approx 4.71\,\text{m/s}^2$.
      - kind: result
        text: >-
          (א) $\Delta\vec v = (-6, -4)\,\text{m/s}$; $\bar{\vec a} \approx 4.8\,\text{m/s}^2$, כ-$34^\circ$ מתחת לכיוון השלילי של ציר $x$.
          (ב) לכיוון התנועה, כי גודל המהירות גדל. (ג) כ-$0.94\,\text{m/s}^2$ משיקי, קדימה, וכ-$4.7\,\text{m/s}^2$ אל המרכז.

  - id: W-1.10-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.10-3, OBJ-1.10-2]
    prompt: >-
      מטוטלת, משקולת קטנה בקצה חוט, מתנדנדת בקשת הלוך וחזור. קבעו ונמקו את כיוון התאוצה של המשקולת:

      (א) בקצה הקשת, ברגע שבו היא עוצרת לרגע לפני שהיא חוזרת.

      (ב) בנקודה הנמוכה ביותר, שבה גודל המהירות מקסימלי.

      (ג) באמצע הדרך מהקצה לנקודה הנמוכה, בדרך למטה.
    answer: >-
      (א) לאורך הקשת, לכיוון הנקודה הנמוכה (משיקית בלבד). (ב) אנכית למעלה, אל נקודת התלייה (רדיאלית בלבד).
      (ג) בין כיוון התנועה לבין הכיוון אל נקודת התלייה: יש רכיב משיקי קדימה ורכיב רדיאלי.
    solution:
      - kind: reasoning
        text: >-
          (א) ברגע העצירה $\vec v = 0$, אבל רגע אחר כך המשקולת כבר נעה לאורך הקשת, לכיוון הנקודה הנמוכה. לכן $\Delta\vec v$ מצביע
          לשם, והתאוצה אינה אפס. מהירות אפס לא אומרת תאוצה אפס.
      - kind: reasoning
        text: >-
          (ב) גודל המהירות מקסימלי, ולכן ברגע הזה הוא לא גדל ולא קטן: הרכיב המשיקי אפס. המשקולת נעה בקשת שמתעקלת כלפי מעלה,
          ולכן יש רכיב רדיאלי אל הצד הפנימי, אל נקודת התלייה.
      - kind: reasoning
        text: >-
          (ג) בדרך למטה גודל המהירות גדל: רכיב משיקי בכיוון התנועה. המסלול מתעקל: רכיב רדיאלי אל נקודת התלייה. התאוצה היא סכום שניהם.
      - kind: result
        text: >-
          (א) משיקית, לכיוון הנקודה הנמוכה. (ב) למעלה, אל נקודת התלייה. (ג) קדימה ופנימה, בין כיוון התנועה לבין נקודת התלייה.

  - id: W-1.10-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.10-1, OBJ-1.10-2]
    prompt: >-
      גוף נע במעגל שרדיוסו $R$ בגודל מהירות קבוע $v$. בטאו באמצעות $R$ ו-$v$, עבור חצי הקפה:

      (א) את הזמן שהיא לוקחת.

      (ב) את גודל ההעתק ואת גודל המהירות הממוצעת.

      (ג) את גודל השינוי במהירות ואת גודל התאוצה הממוצעת.

      (ד) הציבו $R = 4\,\text{m}$ ו-$v = 2\,\text{m/s}$, והשוו את התאוצה הממוצעת לערך $|a| = 1\,\text{m/s}^2$ שאיור 1.10ב מראה במעגל הזה. למה הממוצעת קטנה יותר?
    answer: >-
      (א) $\pi R / v$. (ב) $2R$; $2v/\pi$. (ג) $2v$; $\dfrac{2v^2}{\pi R}$.

      (ד) כ-$0.64\,\text{m/s}^2$, קטנה מ-$1\,\text{m/s}^2$, כי על חצי הקפה מחברים תאוצות שמצביעות לכיוונים שונים.
    solution:
      - kind: formula
        text: >-
          הדרך בחצי הקפה היא חצי היקף, $\pi R$. $\bar{\vec v} = \Delta\vec r/\Delta t$ ו-$\bar{\vec a} = \Delta\vec v/\Delta t$.
      - kind: manipulation
        text: >-
          (א) $\Delta t = \dfrac{\pi R}{v}$. (ב) הגוף מגיע לנקודה שמול נקודת ההתחלה, ולכן ההעתק הוא הקוטר, $2R$, ו-$|\bar{\vec v}| = \dfrac{2R}{\pi R / v} = \dfrac{2v}{\pi}$.
      - kind: manipulation
        text: >-
          (ג) אחרי חצי הקפה המהירות הפוכה בדיוק: $\vec v_2 = -\vec v_1$, ולכן $|\Delta\vec v| = 2v$, ו-$|\bar{\vec a}| = \dfrac{2v}{\pi R / v} = \dfrac{2v^2}{\pi R}$.
      - kind: substitution
        text: >-
          (ד) $|\bar{\vec a}| = \dfrac{2 \cdot 2^2}{\pi \cdot 4} \approx 0.64\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          לאורך חצי ההקפה התאוצה הרגעית מסתובבת ומצביעה כל רגע אל המרכז, לכיוונים שונים. בממוצע חלק מהכיוונים מבטלים זה את זה,
          ולכן הממוצעת קטנה מהגודל הרגעי.
      - kind: result
        text: >-
          (א) $\pi R/v$. (ב) $2R$ ו-$2v/\pi$. (ג) $2v$ ו-$2v^2/(\pi R)$. (ד) כ-$0.64\,\text{m/s}^2$, פחות מ-$1\,\text{m/s}^2$.

challenge:
  - id: W-1.10-c1
    stars: 1
    objectives: [OBJ-1.10-2, OBJ-1.10-1]
    prompt: >-
      גוף נע במעגל, נגד כיוון השעון. הוא יוצא מהנקודה העליונה של המעגל, וגודל מהירותו שם $17.0\,\text{m/s}$. גודל המהירות
      גדל, עד שהגוף מסתובב $55^\circ$ סביב המרכז. התאוצה הממוצעת בתנועה הזו היא $10\,\text{m/s}^2$, אנכית למטה.

      (א) מצאו את גודל המהירות של הגוף בסוף התנועה.

      (ב) מצאו כמה זמן נמשכה התנועה.
    answer: >-
      (א) כ-$29.6\,\text{m/s}$.

      (ב) כ-$2.43\,\text{s}$.
    solution:
      - kind: given
        text: >-
          $x$ ימינה, $y$ למעלה, ראשית במרכז. בנקודה העליונה, נגד כיוון השעון, הגוף נע שמאלה: $\vec v_1 = (-17,\ 0)\,\text{m/s}$.
      - kind: reasoning
        text: >-
          הגוף התחיל בזווית $90^\circ$ (מציר $x$) והגיע לזווית $145^\circ$. שם הרדיוס אל הגוף נוטה $180^\circ - 145^\circ = 35^\circ$
          מעל הכיוון השלילי של ציר $x$. המהירות מאונכת לרדיוס, ולכן היא נוטה $90^\circ - 35^\circ = 55^\circ$ מתחת לכיוון השלילי
          של ציר $x$: שמאלה ולמטה, כי נגד כיוון השעון הגוף יורד בצד השמאלי. לכן
          $\vec v_2 = (-v\cos 55^\circ,\ -v\sin 55^\circ) \approx v\,(-0.574,\ -0.819)$.
      - kind: reasoning
        text: >-
          התאוצה הממוצעת אנכית, ולכן גם $\Delta\vec v = \vec v_2 - \vec v_1$ אנכי: הרכיב האופקי שלו אפס.
      - kind: manipulation
        text: >-
          $\Delta v_x = -0.574\,v - (-17) = 0$, ולכן $v = \dfrac{17}{0.574} \approx 29.6\,\text{m/s}$.
      - kind: substitution
        text: >-
          $\Delta v_y = -0.819 \cdot 29.6 - 0 \approx -24.3\,\text{m/s}$. מ-$\bar a = |\Delta\vec v| / \Delta t$:
          $\Delta t = \dfrac{24.3}{10} \approx 2.43\,\text{s}$.
      - kind: result
        text: >-
          (א) כ-$29.6\,\text{m/s}$. (ב) כ-$2.43\,\text{s}$.
    source:
      name: PhysicsBowl (AAPT)
      year: 2016
      problem: 'Questions 39 and 40'
      url: https://aapt.org/Programs/PhysicsBowl/upload/PhysicsBowl_2016.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-1.10-c2
    stars: 1
    objectives: [OBJ-1.10-1, OBJ-1.10-2]
    prompt: >-
      חלקיק נע במעגל בגודל מהירות קבוע של $\pi\,\text{m/s}$. הוא עובר מנקודה $A$ לנקודה $B$ על המעגל, וקשת $AB$ נשענת על זווית
      מרכזית של $120^\circ$.

      (א) מצאו את גודל המהירות הממוצעת של החלקיק מ-$A$ ל-$B$. שימו לב: הרדיוס לא נתון, ואין בו צורך.

      (ב) מצאו את גודל השינוי במהירות מ-$A$ ל-$B$.

      (ג) הרדיוס הוא $2\,\text{m}$. מצאו את גודל התאוצה הממוצעת מ-$A$ ל-$B$.
    answer: >-
      (א) $1.5\sqrt3 \approx 2.6\,\text{m/s}$.

      (ב) $\pi\sqrt3 \approx 5.4\,\text{m/s}$.

      (ג) כ-$4.1\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          $|\vec v| = \pi\,\text{m/s}$, זווית מרכזית $120^\circ = \tfrac{2\pi}{3}$ רדיאנים, רדיוס $R$.
      - kind: reasoning
        text: >-
          הזמן: אורך הקשת $\tfrac{2\pi}{3}R$, ולכן $\Delta t = \dfrac{2\pi R/3}{\pi} = \dfrac{2R}{3}$. ההעתק הוא המיתר $AB$. במשולש
          שווה-שוקיים עם שוקיים $R$ וזווית ראש $120^\circ$, המיתר הוא $2R\sin 60^\circ = R\sqrt3$.
      - kind: substitution
        text: >-
          (א) $|\bar{\vec v}| = \dfrac{R\sqrt3}{2R/3} = 1.5\sqrt3 \approx 2.60\,\text{m/s}$. הרדיוס מצטמצם.
      - kind: reasoning
        text: >-
          (ב) המהירות מאונכת לרדיוס, ולכן גם היא מסתובבת ב-$120^\circ$ בין $A$ ל-$B$. $\vec v_A$ ו-$\vec v_B$ באותו גודל
          ובזווית $120^\circ$ ביניהם, ולכן ההפרש שלהם הוא כמו המיתר: $|\Delta\vec v| = 2v\sin 60^\circ = v\sqrt3 = \pi\sqrt3 \approx 5.44\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ג) $\Delta t = \dfrac{2 \cdot 2}{3} \approx 1.33\,\text{s}$, ולכן $|\bar{\vec a}| = \dfrac{5.44}{1.33} \approx 4.08\,\text{m/s}^2$.
      - kind: result
        text: >-
          (א) כ-$2.6\,\text{m/s}$. (ב) כ-$5.4\,\text{m/s}$. (ג) כ-$4.1\,\text{m/s}^2$.
    source:
      name: JEE Main (NTA), as reproduced by the Cracku question bank (third-party copy, not an NTA page)
      year: 2023
