# Workbook, lesson 1.1. Every number recomputed with npx tsx against src/physics/kinematics.ts
# (legs + displacement + pathLength for every trip; 2πR with Math.PI for the challenge problem).

lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.1-1]
    prompt: >-
      לאורך דרך ישרה עומדים עץ, בית ובאר. הבאר נמצאת $40\,\text{m}$ מזרחית לבית, והעץ $25\,\text{m}$ מערבית לבית.

      (א) בחרו ראשית בבית וכיוון חיובי מזרחה. מה המקום של הבאר ושל העץ?

      (ב) עכשיו הראשית בעץ, והכיוון החיובי עדיין מזרחה. מה המקום של הבית ושל הבאר?
    answer: '(א) באר $x = +40\,\text{m}$, עץ $x = -25\,\text{m}$ (ב) בית $x = +25\,\text{m}$, באר $x = +65\,\text{m}$'
    solution:
      - { kind: given, text: 'הבאר $40\,\text{m}$ מזרחית לבית; העץ $25\,\text{m}$ מערבית לבית.' }
      - { kind: reasoning, text: 'למקום יש גודל וסימן: הגודל הוא כמה מטרים הנקודה רחוקה מהראשית, והסימן פלוס בצד שאליו מצביע הכיוון החיובי (מזרח), ומינוס בצד השני.' }
      - { kind: reasoning, text: '(א) הבאר בצד המזרחי של הבית: $x = +40\,\text{m}$. העץ בצד המערבי: $x = -25\,\text{m}$.' }
      - { kind: substitution, text: '(ב) הבית $25\,\text{m}$ מזרחית לעץ: $x = +25\,\text{m}$. הבאר רחוקה מהעץ $25 + 40 = 65$ מטרים, מזרחה: $x = +65\,\text{m}$.' }
      - { kind: result, text: '(א) הבאר ב-$x = +40\,\text{m}$, העץ ב-$x = -25\,\text{m}$. (ב) הבית ב-$x = +25\,\text{m}$, הבאר ב-$x = +65\,\text{m}$.' }

  - id: W-1.1-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.1-2]
    prompt: >-
      על ציר שהכיוון החיובי שלו ימינה, גוף עבר בכל סעיף מהמקום הראשון למקום השני בלי לחזור לאחור. מצאו את ההעתק,
      ואמרו לאיזה כיוון הגוף זז.

      (א) מ-$x_1 = 3\,\text{m}$ ל-$x_2 = 11\,\text{m}$;

      (ב) מ-$x_1 = 11\,\text{m}$ ל-$x_2 = 3\,\text{m}$;

      (ג) מ-$x_1 = -4\,\text{m}$ ל-$x_2 = -10\,\text{m}$;

      (ד) מ-$x_1 = -7\,\text{m}$ ל-$x_2 = 5\,\text{m}$.
    answer: '(א) $+8\,\text{m}$, ימינה (ב) $-8\,\text{m}$, שמאלה (ג) $-6\,\text{m}$, שמאלה (ד) $+12\,\text{m}$, ימינה'
    solution:
      - { kind: formula, text: '$\Delta x = x_2 - x_1$. סימן חיובי פירושו שהגוף זז ימינה (בכיוון החיובי), ושלילי שמאלה.' }
      - { kind: substitution, text: '(א) $11 - 3 = +8\,\text{m}$. (ב) $3 - 11 = -8\,\text{m}$.' }
      - { kind: substitution, text: '(ג) $-10 - (-4) = -10 + 4 = -6\,\text{m}$. שני המקומות שליליים, והגוף התרחק מהראשית שמאלה.' }
      - { kind: substitution, text: '(ד) $5 - (-7) = 5 + 7 = +12\,\text{m}$: 7 מטרים עד הראשית, ועוד 5 אחריה.' }
      - { kind: result, text: '(א) $+8\,\text{m}$ (ב) $-8\,\text{m}$ (ג) $-6\,\text{m}$ (ד) $+12\,\text{m}$. בסעיף (ג) המקום הסופי שלילי וגם ההעתק שלילי, אבל בסעיף (ד) המקום ההתחלתי שלילי וההעתק חיובי: הסימן של ההעתק נקבע לפי הכיוון שבו הגוף זז, לא לפי הצד של הראשית שבו הוא נמצא.' }

  - id: W-1.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      קבעו אם כל טענה נכונה או לא, ונמקו במשפט אחד.

      (א) הדרך יכולה להיות שלילית, אם הגוף נע נגד הכיוון החיובי.

      (ב) ההעתק יכול להיות אפס גם כשהגוף זז.

      (ג) גוף שנמצא ב-$x = -5\,\text{m}$ זז נגד הכיוון החיובי.

      (ד) כשהופכים את הכיוון החיובי, הדרך לא משתנה.
    answer: '(א) לא נכון (ב) נכון (ג) לא נכון (ד) נכון'
    solution:
      - { kind: reasoning, text: '(א) לא נכון. הדרך היא אורך המסלול, סכום של אורכים, ולכן היא אף פעם לא שלילית. רק ההעתק יכול להיות שלילי.' }
      - { kind: reasoning, text: '(ב) נכון. גוף שחזר למקום שבו התחיל עשה העתק אפס, אף שעבר דרך.' }
      - { kind: reasoning, text: '(ג) לא נכון. $x = -5\,\text{m}$ אומר רק איפה הגוף נמצא: 5 מטרים מהראשית, בצד השלילי. הוא יכול לעמוד, או לנוע לכל כיוון. כדי לדעת לאן הוא זז צריך שני מקומות, בשני רגעים.' }
      - { kind: reasoning, text: '(ד) נכון. היפוך הכיוון מחליף את הסימן של כל מקום ושל כל העתק, אבל אורכי הקטעים, ולכן גם הדרך, לא משתנים.' }
      - { kind: result, text: 'נכונות: (ב) ו-(ד). לא נכונות: (א) ו-(ג).' }

  - id: W-1.1-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      כלב משחק בחוף. בוחרים ציר לאורך קו המים, עם כיוון חיובי צפונה. הכלב רץ מ-$x = -5\,\text{m}$ צפונה עד
      $x = 20\,\text{m}$, חוזר דרומה עד $x = 8\,\text{m}$, ורץ שוב צפונה עד $x = 14\,\text{m}$, שם הוא נעצר.

      (א) מה ההעתק של כל אחד משלושת הקטעים?

      (ב) מה ההעתק של כל הריצה, ומה הדרך?
    answer: '(א) $+25\,\text{m}$, $-12\,\text{m}$, $+6\,\text{m}$ (ב) $\Delta x = +19\,\text{m}$, הדרך $43\,\text{m}$'
    solution:
      - { kind: given, text: 'נקודות הסיבוב לפי הסדר: $-5$, $20$, $8$, $14$ (במטרים). הכיוון החיובי צפונה.' }
      - { kind: formula, text: '$\Delta x = x_2 - x_1$ לכל קטע; הדרך היא סכום האורכים של הקטעים.' }
      - { kind: substitution, text: '(א) $20 - (-5) = +25\,\text{m}$; $8 - 20 = -12\,\text{m}$; $14 - 8 = +6\,\text{m}$.' }
      - { kind: substitution, text: '(ב) $\Delta x = 14 - (-5) = +19\,\text{m}$. בדיקה: $25 - 12 + 6 = 19$. הדרך: $25 + 12 + 6 = 43\,\text{m}$.' }
      - { kind: result, text: '(א) $+25\,\text{m}$, $-12\,\text{m}$, $+6\,\text{m}$. (ב) $\Delta x = +19\,\text{m}$, כלומר 19 מטרים צפונה מנקודת ההתחלה, והדרך $43\,\text{m}$.' }

  - id: W-1.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      על כביש ישר עומדים שני צופים, A ו-B. כל אחד שם את הראשית במקום שבו הוא עומד. אצל A הכיוון החיובי מזרחה, והוא
      רושם שמכונית חונה נמצאת ב-$x = +50\,\text{m}$. B רושם שאותה מכונית נמצאת ב-$x = -30\,\text{m}$.

      (א) אם גם אצל B הכיוון החיובי מזרחה, איפה עומד B ביחס ל-A?

      (ב) ואם אצל B הכיוון החיובי מערבה?

      (ג) מה מלמדת התשובה על מספר שנמסר בלי מערכת ייחוס?
    answer: '(א) $80\,\text{m}$ מזרחית ל-A (ב) $20\,\text{m}$ מזרחית ל-A (ג) המספר לבדו לא מספיק: צריך לדעת את הראשית ואת הכיוון החיובי.'
    solution:
      - { kind: reasoning, text: 'המכונית נמצאת $50\,\text{m}$ מזרחית ל-A. המקום שלה אצל B אומר כמה מטרים, ולאיזה צד, היא רחוקה מ-B.' }
      - { kind: reasoning, text: '(א) אצל B החיובי מזרחה, ו-$x = -30\,\text{m}$ פירושו שהמכונית $30\,\text{m}$ מערבית ל-B. לכן B נמצא $30\,\text{m}$ מזרחית למכונית: $50 + 30 = 80$ מטרים מזרחית ל-A.' }
      - { kind: reasoning, text: '(ב) אצל B החיובי מערבה, ו-$x = -30\,\text{m}$ פירושו שהמכונית $30\,\text{m}$ מזרחית ל-B. לכן B נמצא $30\,\text{m}$ מערבית למכונית: $50 - 30 = 20$ מטרים מזרחית ל-A.' }
      - { kind: reasoning, text: '(ג) אותו מספר, $-30\,\text{m}$, מתאר שני מקומות שונים של B, לפי הכיוון שבחר. מספר בלי ראשית ובלי כיוון חיובי לא מצביע על נקודה.' }
      - { kind: result, text: '(א) B עומד $80\,\text{m}$ מזרחית ל-A. (ב) B עומד $20\,\text{m}$ מזרחית ל-A. (ג) מקום הוא משפט שלם רק עם מערכת הייחוס שלו.' }

  - id: W-1.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      שחיינית שוחה בבריכה שאורכה $25\,\text{m}$, הלוך ושוב לאורכה. בוחרים ראשית בקיר שממנו היא מתחילה, וכיוון חיובי לעבר
      הקיר הרחוק.

      (א) מה המקום, ההעתק מההתחלה והדרך אחרי שלוש בריכות (שלוש פעמים לאורך הבריכה)?

      (ב) מה המקום וההעתק מההתחלה ברגע שהדרך שלה הגיעה ל-$60\,\text{m}$?
    answer: '(א) $x = 25\,\text{m}$, $\Delta x = +25\,\text{m}$, דרך $75\,\text{m}$ (ב) $x = 10\,\text{m}$, $\Delta x = +10\,\text{m}$'
    solution:
      - { kind: given, text: 'אורך הבריכה $25\,\text{m}$. ההתחלה ב-$x_1 = 0$, והקיר הרחוק ב-$x = 25\,\text{m}$.' }
      - { kind: reasoning, text: '(א) אחרי בריכה אחת היא ב-25, אחרי שתיים חזרה ל-0, ואחרי שלוש שוב ב-25. הדרך: $3\cdot25 = 75\,\text{m}$.' }
      - { kind: substitution, text: '$\Delta x = 25\,\text{m} - 0 = +25\,\text{m}$.' }
      - { kind: reasoning, text: '(ב) $60\,\text{m}$ של דרך הם שתי בריכות שלמות ($50\,\text{m}$, חזרה לקיר ההתחלה) ועוד $10\,\text{m}$ לעבר הקיר הרחוק. לכן $x = 10\,\text{m}$.' }
      - { kind: substitution, text: '$\Delta x = 10\,\text{m} - 0 = +10\,\text{m}$.' }
      - { kind: result, text: '(א) $x = 25\,\text{m}$, $\Delta x = +25\,\text{m}$, דרך $75\,\text{m}$. (ב) $x = 10\,\text{m}$ ו-$\Delta x = +10\,\text{m}$, אף שהדרך $60\,\text{m}$. כאן המקום וההעתק שווים, כי היא התחילה בראשית.' }

  - id: W-1.1-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      עגלה נעה על מסילה ישרה. הטבלה מתארת את המקום שלה (הכיוון החיובי ימינה), והעגלה מחליפה כיוון רק ברגעים שבטבלה.

      | $t\ (\text{s})$ | 0 | 2 | 4 | 6 | 8 |
      |---|---|---|---|---|---|
      | $x\ (\text{m})$ | 0 | 6 | 2 | $-4$ | 1 |

      (א) מה ההעתק ומה הדרך מ-$t = 0$ עד $t = 8\,\text{s}$?

      (ב) מה פרק הזמן, ההעתק והדרך מ-$t = 2\,\text{s}$ עד $t = 6\,\text{s}$?
    answer: '(א) $\Delta x = +1\,\text{m}$, דרך $21\,\text{m}$ (ב) $\Delta t = 4\,\text{s}$, $\Delta x = -10\,\text{m}$, דרך $10\,\text{m}$'
    solution:
      - { kind: given, text: 'המקומות ברגעים 0, 2, 4, 6, 8 שניות: $0$, $6$, $2$, $-4$, $1$ מטרים. הכיוון החיובי ימינה.' }
      - { kind: formula, text: '$\Delta x = x_2 - x_1$, $\Delta t = t_2 - t_1$; הדרך היא סכום האורכים של הקטעים בין נקודות הסיבוב.' }
      - { kind: reasoning, text: 'נקודות הסיבוב: ב-$t = 2\,\text{s}$ (מימינה לשמאלה) וב-$t = 6\,\text{s}$ (משמאלה לימינה). בין 2 ל-6 שניות העגלה נעה כל הזמן שמאלה.' }
      - { kind: substitution, text: '(א) $\Delta x = 1 - 0 = +1\,\text{m}$. אורכי הקטעים: מ-0 עד 6 הם 6 מטרים, מ-6 עד $-4$ הם 10 מטרים, ומ-$-4$ עד 1 הם 5 מטרים. הדרך: $6 + 10 + 5 = 21\,\text{m}$.' }
      - { kind: substitution, text: '(ב) $\Delta t = 6 - 2 = 4\,\text{s}$. $\Delta x = -4 - 6 = -10\,\text{m}$. כאן העגלה לא הסתובבה, ולכן הדרך שווה לגודל ההעתק: $10\,\text{m}$.' }
      - { kind: result, text: '(א) $\Delta x = +1\,\text{m}$, דרך $21\,\text{m}$. (ב) $\Delta t = 4\,\text{s}$, $\Delta x = -10\,\text{m}$, דרך $10\,\text{m}$.' }

  - id: W-1.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      גוף נקודתי מתחיל במקום $x_0$ על ציר. הוא נע בכיוון החיובי קטע שאורכו $L$, מסתובב, ונע בכיוון השלילי קטע שאורכו
      $\tfrac{3}{2}L$, ושם הוא נעצר.

      (א) בטאו באמצעות $L$ את ההעתק ואת הדרך.

      (ב) פי כמה הדרך גדולה מגודל ההעתק?

      (ג) האם התשובות תלויות ב-$x_0$? מה משתנה בהן אם הופכים את הכיוון החיובי?
    answer: '(א) $\Delta x = -\tfrac{1}{2}L$, דרך $\tfrac{5}{2}L$ (ב) פי 5 (ג) לא תלויות ב-$x_0$; בהיפוך הכיוון $\Delta x = +\tfrac{1}{2}L$ והדרך לא משתנה.'
    solution:
      - { kind: given, text: 'מקום התחלתי $x_0$; נקודת הסיבוב $x_0 + L$; המקום הסופי $x_0 + L - \tfrac{3}{2}L = x_0 - \tfrac{1}{2}L$.' }
      - { kind: formula, text: '$\Delta x = x_2 - x_1$; הדרך היא סכום האורכים של הקטעים.' }
      - { kind: manipulation, text: '(א) $\Delta x = \left(x_0 - \tfrac{1}{2}L\right) - x_0 = -\tfrac{1}{2}L$. הדרך: $L + \tfrac{3}{2}L = \tfrac{5}{2}L$.' }
      - { kind: manipulation, text: '(ב) $\dfrac{\tfrac{5}{2}L}{\tfrac{1}{2}L} = 5$.' }
      - { kind: reasoning, text: '(ג) $x_0$ מתבטל בחיסור, ולכן ההעתק לא תלוי בו, וגם לא הדרך, שהיא סכום של אורכים. בהיפוך הכיוון כל המקומות מחליפים סימן, ולכן $\Delta x = +\tfrac{1}{2}L$; האורכים לא משתנים, והדרך נשארת $\tfrac{5}{2}L$.' }
      - { kind: result, text: '(א) $\Delta x = -\tfrac{1}{2}L$, דרך $\tfrac{5}{2}L$. (ב) הדרך גדולה פי 5 מגודל ההעתק. (ג) אין תלות ב-$x_0$; בהיפוך הכיוון ההעתק $+\tfrac{1}{2}L$ והדרך כשהייתה.' }

  - id: W-1.1-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-3]
    prompt: >-
      תלמידים רשמו ארבע מדידות של תנועות על קו ישר. קבעו לגבי כל אחת אם היא אפשרית, ונמקו.

      (א) דרך $10\,\text{m}$, העתק $\Delta x = +12\,\text{m}$.

      (ב) דרך $10\,\text{m}$, העתק $\Delta x = -4\,\text{m}$.

      (ג) דרך $0$, העתק $\Delta x = +3\,\text{m}$.

      (ד) דרך $7\,\text{m}$, העתק $\Delta x = -7\,\text{m}$.

      (ה) מה הדרך הקטנה ביותר שגוף יכול לעבור כדי לעשות העתק $\Delta x = -7\,\text{m}$, ובאיזו תנועה?
    answer: '(א) לא אפשרי (ב) אפשרי (ג) לא אפשרי (ד) אפשרי (ה) $7\,\text{m}$, בתנועה בכיוון השלילי בלי לחזור.'
    solution:
      - { kind: reasoning, text: 'הכלל: הדרך גדולה מגודל ההעתק או שווה לו, כי כל חזרה לאחור מוסיפה דרך ולא מוסיפה העתק. הסימן של ההעתק לא משנה את הכלל.' }
      - { kind: reasoning, text: '(א) גודל ההעתק, $|\Delta x| = 12\,\text{m}$ (ההעתק בלי הסימן), גדול מהדרך, $10\,\text{m}$: אי אפשר להגיע 12 מטרים מנקודת ההתחלה בלי לעבור לפחות 12 מטרים.' }
      - { kind: reasoning, text: '(ב) $4\,\text{m} \le 10\,\text{m}$: אפשרי, למשל 3 מטרים בכיוון החיובי ו-7 מטרים חזרה.' }
      - { kind: reasoning, text: '(ג) דרך אפס פירושה שהגוף לא זז, ולכן גם ההעתק אפס.' }
      - { kind: reasoning, text: '(ד) הדרך שווה לגודל ההעתק: אפשרי, כשהגוף נע 7 מטרים בכיוון השלילי בלי לחזור. הדרך חיובית אף שההעתק שלילי.' }
      - { kind: result, text: 'אפשריות: (ב) ו-(ד). לא אפשריות: (א) ו-(ג). (ה) הדרך הקטנה ביותר היא $7\,\text{m}$, בתנועה בכיוון השלילי בלי חזרה לאחור.' }

  - id: W-1.1-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.1-1, OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      רכבת מעבורת נוסעת על מסילה ישרה בין שתי תחנות, מערבית ומזרחית, שנמצאות $4\,\text{km}$ זו מזו. בוחרים ראשית
      באמצע הדרך בין התחנות, וכיוון חיובי מזרחה. הרכבת יוצאת מהתחנה המערבית.

      (א) מה המקום של כל תחנה?

      (ב) הרכבת עשתה 7 נסיעות, כל אחת מתחנה לתחנה. מה הדרך, ומה ההעתק?

      (ג) אחרי כמה נסיעות ההעתק הוא אפס? מה הדרך אחרי 10 נסיעות?

      (ד) האם התשובה ל-(ב) הייתה משתנה אם הראשית הייתה בתחנה המערבית?
    answer: '(א) $x = -2\,\text{km}$ ו-$x = +2\,\text{km}$ (ב) דרך $28\,\text{km}$, $\Delta x = +4\,\text{km}$ (ג) אחרי מספר זוגי של נסיעות; $40\,\text{km}$ (ד) לא'
    solution:
      - { kind: given, text: 'בין התחנות $4\,\text{km}$; הראשית באמצע; החיובי מזרחה; ההתחלה בתחנה המערבית.' }
      - { kind: reasoning, text: '(א) כל תחנה רחוקה $2\,\text{km}$ מהראשית: המערבית ב-$x = -2\,\text{km}$, המזרחית ב-$x = +2\,\text{km}$.' }
      - { kind: reasoning, text: '(ב) כל נסיעה מוסיפה $4\,\text{km}$ לדרך: $7\cdot4 = 28\,\text{km}$. אחרי מספר אי-זוגי של נסיעות הרכבת בתחנה המזרחית.' }
      - { kind: substitution, text: '$\Delta x = x_2 - x_1 = 2\,\text{km} - (-2\,\text{km}) = +4\,\text{km}$.' }
      - { kind: reasoning, text: '(ג) אחרי מספר זוגי של נסיעות הרכבת חוזרת לתחנה המערבית, ולכן $\Delta x = 0$. אחרי 10 נסיעות הדרך $10\cdot4 = 40\,\text{km}$ וההעתק אפס.' }
      - { kind: reasoning, text: '(ד) לא. הזזת הראשית משנה את המקומות (התחנות ב-0 וב-$4\,\text{km}$), אבל ההעתק נשאר $4 - 0 = +4\,\text{km}$, והדרך לא תלויה בראשית.' }
      - { kind: result, text: '(א) $-2\,\text{km}$ ו-$+2\,\text{km}$. (ב) דרך $28\,\text{km} = 2.8\cdot10^{4}\,\text{m}$, העתק $+4\,\text{km}$ (מזרחה). (ג) בכל מספר זוגי של נסיעות; אחרי 10 נסיעות הדרך $40\,\text{km}$. (ד) לא.' }

challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-3, OBJ-1.1-2]
    prompt: >-
      רצה רצה על מסלול מעגלי שהרדיוס שלו $R = 50\,\text{m}$. היא מתחילה בנקודה A. (תזכורת מחטיבת הביניים: ההיקף של
      מעגל שהרדיוס שלו $R$ הוא $2\pi R$.)

      (א) מה ההעתק שלה ומה הדרך שעברה אחרי סיבוב שלם?

      (ב) אחרי חצי סיבוב היא בנקודה B, הנקודה במסלול שנמצאת מול A, בקצה השני של הקוטר. מתחו ציר מקום ישר מ-A דרך מרכז
      המעגל אל B, עם ראשית ב-A וכיוון חיובי לעבר B. מה ההעתק לאורך הציר הזה, ומה הדרך?

      (ג) מה ההעתק והדרך אחרי סיבוב וחצי? פי כמה הדרך גדולה מגודל ההעתק בסעיף (ב), ובסעיף (ג)?
    answer: '(א) העתק אפס, דרך $2\pi R \approx 314\,\text{m}$ (ב) $\Delta x = +2R = +100\,\text{m}$, דרך $\pi R \approx 157\,\text{m}$ (ג) $\Delta x = +100\,\text{m}$, דרך $3\pi R \approx 471\,\text{m}$; פי $\pi/2 \approx 1.57$ ופי $3\pi/2 \approx 4.71$'
    solution:
      - { kind: given, text: '$R = 50\,\text{m}$. היקף המעגל $2\pi R$. A ו-B הם שני הקצוות של קוטר, ולכן המרחק ביניהם $2R$.' }
      - { kind: reasoning, text: '(א) אחרי סיבוב שלם הרצה חוזרת ל-A: המקום הסופי שווה למקום ההתחלתי, וההעתק אפס. הדרך היא כל ההיקף: $2\pi R = 2\pi\cdot50\,\text{m} = 314\,\text{m}$.' }
      - { kind: reasoning, text: '(ב) התנועה עצמה עקומה, אבל ההעתק משווה רק בין ההתחלה לסוף, ושתיהן על הציר שבחרנו: $x_A = 0$ ו-$x_B = 2R = 100\,\text{m}$.' }
      - { kind: substitution, text: '$\Delta x = x_B - x_A = 100\,\text{m} - 0 = +100\,\text{m}$. הדרך היא חצי היקף: $\pi R = \pi\cdot50\,\text{m} = 157\,\text{m}$.' }
      - { kind: reasoning, text: '(ג) אחרי סיבוב וחצי הרצה שוב ב-B, ולכן $\Delta x = +100\,\text{m}$ כמו בסעיף (ב). הדרך: $3\pi R = 471\,\text{m}$.' }
      - { kind: manipulation, text: 'היחס בסעיף (ב): $\dfrac{\pi R}{2R} = \dfrac{\pi}{2} \approx 1.57$. בסעיף (ג): $\dfrac{3\pi R}{2R} = \dfrac{3\pi}{2} \approx 4.71$. היחס לא תלוי ב-$R$.' }
      - { kind: result, text: '(א) $\Delta x = 0$, דרך $\approx 314\,\text{m}$. (ב) $\Delta x = +100\,\text{m}$, דרך $\approx 157\,\text{m}$. (ג) $\Delta x = +100\,\text{m}$, דרך $\approx 471\,\text{m}$. הדרך גדולה מגודל ההעתק פי $\pi/2$ ופי $3\pi/2$.' }
    source:
      name: PhysicsBowl
      year: 2018
      problem: 'Question 5'
      url: https://aapt.org/Programs/PhysicsBowl/upload/2018-PhysicsBowl-Exam.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-1.1-c2
    stars: 1
    objectives: [OBJ-1.1-3, OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      ג׳וק זוחל על הרצפה, על הקירות ועל התקרה של אולם בצורת תיבה. הרצפה היא ריבוע שאורך הצלע שלו $6\,\text{m}$, וגובה
      האולם $3\,\text{m}$. הג׳וק מתחיל בפינה A של הרצפה ומסיים בפינה B של התקרה, הפינה הרחוקה ביותר מ-A: B נמצאת בדיוק
      מעל הפינה C של הרצפה, שבקצה השני של האלכסון של הרצפה מ-A. (תזכורת מחטיבת הביניים, משפט פיתגורס: במשולש ישר-זווית,
      הריבוע של היתר שווה לסכום הריבועים של שני הניצבים.)

      (א) מתחו ציר מקום ישר מ-A אל B, עם ראשית ב-A וכיוון חיובי לעבר B. מה ההעתק של הג׳וק לאורך הציר הזה? ומה היה
      ההעתק אילו הכיוון החיובי היה מ-B לעבר A?

      (ב) הג׳וק זוחל לאורך קווי המפגש של הקירות עם הרצפה ושל הקירות זה עם זה: $6\,\text{m}$ לאורך קיר אחד, $6\,\text{m}$
      לאורך הקיר הסמוך עד C, ואז $3\,\text{m}$ במעלה הפינה עד B. מה הדרך? פי כמה היא גדולה מגודל ההעתק?

      (ג) במסלול אחר הג׳וק זוחל לאורך האלכסון של הרצפה מ-A עד C, ואז במעלה הפינה עד B. מה הדרך עכשיו?

      (ד) קבעו ונמקו: האם יש מסלול על הרצפה, על הקירות ועל התקרה שבו הדרך שווה לגודל ההעתק?
    answer: '(א) $\Delta x = +9\,\text{m}$; עם הכיוון ההפוך $\Delta x = -9\,\text{m}$ (ב) $15\,\text{m}$, פי $\tfrac{5}{3} \approx 1.67$ (ג) $6\sqrt{2} + 3 \approx 11.5\,\text{m}$ (ד) לא: הדרך שווה לגודל ההעתק רק בתנועה לאורך הקטע הישר AB, והוא עובר באוויר שבתוך האולם.'
    solution:
      - { kind: given, text: 'צלע הרצפה $6\,\text{m}$, גובה האולם $3\,\text{m}$. הפינה C של הרצפה נמצאת בדיוק מתחת ל-B, בקצה השני של האלכסון של הרצפה מ-A.' }
      - { kind: reasoning, text: 'ההעתק משווה רק בין ההתחלה לסוף, ושתיהן על הציר שבחרנו: $x_A = 0$, ו-$x_B$ הוא אורך הקטע הישר AB. את האורך הזה מוצאים בשני צעדים של משפט פיתגורס.' }
      - { kind: manipulation, text: 'אלכסון הרצפה AC הוא היתר של משולש ישר-זווית שהניצבים שלו שתי צלעות של הרצפה: $AC^2 = 6^2 + 6^2 = 72$, ולכן $AC = \sqrt{72} = 6\sqrt{2} \approx 8.49\,\text{m}$. הפינה CB אנכית, ולכן היא ניצבת לרצפה ול-AC, והמשולש ACB ישר-זווית ב-C: $AB^2 = AC^2 + CB^2 = 72 + 3^2 = 81$, ולכן $AB = 9\,\text{m}$.' }
      - { kind: substitution, text: '(א) $\Delta x = x_B - x_A = 9\,\text{m} - 0 = +9\,\text{m}$. כשהכיוון החיובי מ-B לעבר A, הנקודה B נמצאת בצד השלילי של הראשית: $x_B = -9\,\text{m}$, ו-$\Delta x = -9\,\text{m} - 0 = -9\,\text{m}$. בשני המקרים ההעתק לא תלוי במסלול שהג׳וק בחר.' }
      - { kind: substitution, text: '(ב) הדרך היא סכום האורכים של הקטעים: $6 + 6 + 3 = 15\,\text{m}$. היחס: $\dfrac{15\,\text{m}}{9\,\text{m}} = \dfrac{5}{3} \approx 1.67$.' }
      - { kind: substitution, text: '(ג) $AC + CB = 6\sqrt{2}\,\text{m} + 3\,\text{m} \approx 8.49\,\text{m} + 3\,\text{m} = 11.5\,\text{m}$. הדרך קצרה יותר מבסעיף (ב), אבל עדיין גדולה מגודל ההעתק, וההעתק נשאר $+9\,\text{m}$.' }
      - { kind: reasoning, text: '(ד) הדרך שווה לגודל ההעתק רק כשהגוף נע בקו ישר מנקודת ההתחלה לנקודת הסוף, בלי לסטות ובלי לחזור. הקו הישר מ-A ל-B חוצה את האוויר שבתוך האולם, ורק שני הקצוות שלו נוגעים בקירות. לכן כל מסלול על הרצפה, על הקירות ועל התקרה ארוך מ-$9\,\text{m}$.' }
      - { kind: result, text: '(א) $\Delta x = +9\,\text{m}$, ועם הכיוון ההפוך $-9\,\text{m}$. (ב) דרך $15\,\text{m}$, פי $\tfrac{5}{3} \approx 1.67$ מגודל ההעתק. (ג) דרך $\approx 11.5\,\text{m}$. (ד) לא: על המשטחים הדרך תמיד גדולה מ-$9\,\text{m}$.' }
    source:
      name: AAPT F = ma Exam (US Physics Team)
      year: 2008
      problem: 'Question 2: a cockroach crawls along the walls of a cubical room (edge 3 m) to the opposite corner; magnitude of its displacement'
      url: https://www.aapt.org/Programs/contests/upload/olympiad_2008_fnet_ma.pdf
      verified: '2026-11-05'
      adapted: true
