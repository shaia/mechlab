# Workbook for lesson 1.8: ten practice problems and two sourced challenge problems.
# Every number recomputed with stateAt / areaVT / areaAT / displacement / pathLength / timesAtPosition from
# src/physics/kinematics.ts (script: screens/check-1-8.ts, run with npx tsx).

lesson: '1.8'
practice:
  - id: W-1.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.8-1]
    prompt: >-
      שתי מכוניות, A ו-B, נוסעות בכביש ישר, והכיוון החיובי הוא כיוון הנסיעה. גרף המקום-זמן של A הוא קו ישר מ-$(0,\ 0)$
      ל-$(10\,\text{s},\ 150\,\text{m})$. גרף המקום-זמן של B הוא קו ישר מ-$(0,\ 100\,\text{m})$ ל-$(10\,\text{s},\ 200\,\text{m})$.

      (א) חשבו את המהירות של כל מכונית.

      (ב) ב-$t = 5\,\text{s}$: איזו מכונית מקדימה, ואיזו מהירה יותר?

      (ג) אם המהירויות לא ישתנו, מתי ואיפה A תשיג את B?
    answer: >-
      (א) $v_A = +15\,\text{m/s}$, $v_B = +10\,\text{m/s}$.

      (ב) B מקדימה ($150\,\text{m}$ לעומת $75\,\text{m}$), ו-A מהירה יותר.

      (ג) ב-$t = 20\,\text{s}$, ב-$x = 300\,\text{m}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. שני הגרפים קווים ישרים, כלומר שתי המכוניות במהירות קבועה.
      - kind: formula
        text: >-
          המהירות היא השיפוע של גרף המקום-זמן: $v = \dfrac{\Delta x}{\Delta t}$. המקום: $x = x_0 + vt$.
      - kind: substitution
        text: >-
          (א) $v_A = \dfrac{150 - 0}{10} = 15\,\text{m/s}$, ו-$v_B = \dfrac{200 - 100}{10} = 10\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) $x_A(5) = 15\cdot5 = 75\,\text{m}$ ו-$x_B(5) = 100 + 10\cdot5 = 150\,\text{m}$. הקו של B גבוה יותר, ולכן
          B מקדימה. הקו של A תלול יותר, ולכן A מהירה יותר.
      - kind: manipulation
        text: >-
          (ג) בפגישה המקומות שווים: $15t = 100 + 10t$, ולכן $5t = 100$ ו-$t = 20\,\text{s}$. המקום:
          $x = 15\cdot20 = 300\,\text{m}$.
      - kind: result
        text: >-
          (א) $15\,\text{m/s}$ ו-$10\,\text{m/s}$. (ב) B מקדימה, A מהירה. (ג) $t = 20\,\text{s}$, $x = 300\,\text{m}$.

  - id: W-1.8-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      אוטובוס יוצא מתחנה ממנוחה. גרף המהירות-זמן שלו: המהירות עולה בקו ישר עד $12\,\text{m/s}$ ב-$6\,\text{s}$, נשארת
      $12\,\text{m/s}$ במשך $10\,\text{s}$, ויורדת בקו ישר עד עצירה ב-$4\,\text{s}$ נוספות.

      (א) כמה מטרים בין שתי התחנות?

      (ב) מה המהירות הממוצעת של האוטובוס בין התחנות?
    answer: >-
      (א) $180\,\text{m}$.

      (ב) $9\,\text{m/s}$ בכיוון הנסיעה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית בתחנה הראשונה. גרף המהירות עובר דרך $(0,\ 0)$, $(6,\ 12)$, $(16,\ 12)$
          ו-$(20\,\text{s},\ 0)$.
      - kind: formula
        text: >-
          ההעתק הוא השטח מתחת לגרף המהירות-זמן. המהירות הממוצעת: $\bar v = \dfrac{\Delta x}{\Delta t}$.
      - kind: substitution
        text: >-
          (א) משולש, מלבן ומשולש: $\tfrac12\cdot6\cdot12 + 10\cdot12 + \tfrac12\cdot4\cdot12 = 36 + 120 + 24 = 180\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) $\bar v = \dfrac{180\,\text{m}}{20\,\text{s}} = 9\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $180\,\text{m}$. (ב) $9\,\text{m/s}$ בכיוון הנסיעה.

  - id: W-1.8-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    prompt: >-
      גרף המהירות-זמן של גוף הוא קו אופקי בגובה $+3\,\text{m/s}$, מ-$t = 0$ עד $t = 6\,\text{s}$. קבעו ונמקו לגבי
      כל אחד מהמשפטים אם הוא נכון:

      (א) הגוף במנוחה, כי הגרף אופקי.

      (ב) התאוצה של הגוף אפס.

      (ג) גרף המקום-זמן שלו הוא קו ישר עולה, שהשיפוע שלו $3\,\text{m/s}$.

      (ד) גרף המקום-זמן שלו הוא קו אופקי בגובה $3\,\text{m}$.
    answer: >-
      (א) לא נכון. (ב) נכון. (ג) נכון. (ד) לא נכון.
    solution:
      - kind: reasoning
        text: >-
          (א) גרף **מהירות**-זמן אופקי פירושו מהירות קבועה, לא מנוחה. כאן הגוף עובר $3$ מטרים בכל שנייה. מנוחה הייתה
          נראית כקו על ציר הזמן.
      - kind: reasoning
        text: >-
          (ב) התאוצה היא השיפוע של גרף המהירות-זמן, וקו אופקי הוא שיפוע אפס.
      - kind: reasoning
        text: >-
          (ג) המהירות היא השיפוע של גרף המקום-זמן. מהירות קבועה וחיובית היא קו ישר עולה, והשיפוע שלו
          $3\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ד) זו העתקה של הצורה של גרף המהירות. קו אופקי בגרף מקום-זמן הוא מנוחה, והגוף נע.
      - kind: result
        text: >-
          (א) לא נכון. (ב) נכון. (ג) נכון. (ד) לא נכון.

  - id: W-1.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      רצה בריצת $100\,\text{m}$ מאיצה באחידות מעמידה עד $10\,\text{m/s}$ ב-$4\,\text{s}$, ומשם רצה במהירות קבועה עד
      קו הסיום.

      (א) כמה מטרים היא עוברת בארבע השניות הראשונות?

      (ב) מה הזמן שלה בריצה כולה?

      (ג) מה המהירות הממוצעת שלה בריצה?
    answer: >-
      (א) $20\,\text{m}$.

      (ב) $12\,\text{s}$.

      (ג) כ-$8.3\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הריצה, והראשית בקו הזינוק. המהירות עולה בקו ישר מ-$0$ ל-$10\,\text{m/s}$ ב-$4\,\text{s}$,
          ואחר כך קבועה.
      - kind: formula
        text: >-
          ההעתק הוא השטח מתחת לגרף המהירות-זמן.
      - kind: substitution
        text: >-
          (א) משולש: $\tfrac12\cdot4\cdot10 = 20\,\text{m}$.
      - kind: manipulation
        text: >-
          (ב) נשארו $100 - 20 = 80\,\text{m}$. השטח של המלבן שאחרי $4\,\text{s}$ צריך להיות $80\,\text{m}$, והגובה שלו
          $10\,\text{m/s}$, ולכן הרוחב שלו $\dfrac{80}{10} = 8\,\text{s}$. הזמן הכולל $4 + 8 = 12\,\text{s}$.
      - kind: substitution
        text: >-
          (ג) $\bar v = \dfrac{100}{12} \approx 8.3\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $20\,\text{m}$. (ב) $12\,\text{s}$. (ג) כ-$8.3\,\text{m/s}$.

  - id: W-1.8-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      עגלה יוצאת ממנוחה. גרף התאוצה-זמן שלה: $+4\,\text{m/s}^2$ מ-$0$ עד $2\,\text{s}$, אפס מ-$2$ עד $5\,\text{s}$,
      ו-$-2\,\text{m/s}^2$ מ-$5$ עד $9\,\text{s}$. הכיוון החיובי הוא כיוון התנועה בהתחלה.

      (א) חשבו את המהירות ב-$t = 2$, $5$ ו-$9\,\text{s}$, ושרטטו את גרף המהירות-זמן.

      (ב) חשבו את ההעתק מ-$0$ עד $9\,\text{s}$.
    answer: >-
      (א) $8$, $8$ ו-$0\,\text{m/s}$.

      (ב) $48\,\text{m}$ בכיוון החיובי.
    solution:
      - kind: given
        text: >-
          $v_0 = 0$, וגרף התאוצה-זמן בנוי משלושה קטעים אופקיים.
      - kind: formula
        text: >-
          השטח מתחת לגרף התאוצה-זמן הוא $\Delta v$: $v = v_0 + \Delta v$. ההעתק הוא השטח מתחת לגרף המהירות-זמן.
      - kind: substitution
        text: >-
          (א) $v(2) = 0 + 4\cdot2 = 8\,\text{m/s}$, $v(5) = 8 + 0 = 8\,\text{m/s}$, ו-$v(9) = 8 + (-2)\cdot4 = 0$.
          גרף המהירות: קו עולה מ-$0$ ל-$8$, קטע אופקי, וקו יורד ל-$0$.
      - kind: substitution
        text: >-
          (ב) משולש, מלבן ומשולש: $\tfrac12\cdot2\cdot8 + 3\cdot8 + \tfrac12\cdot4\cdot8 = 8 + 24 + 16 = 48\,\text{m}$.
      - kind: result
        text: >-
          (א) $8$, $8$ ו-$0\,\text{m/s}$. (ב) $48\,\text{m}$ בכיוון החיובי.

  - id: W-1.8-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.8-3]
    prompt: >-
      גרף המהירות-זמן של דיסקית על משטח קרח הוא קו ישר שיורד מ-$+6\,\text{m/s}$ ב-$t = 0$ ל-$-6\,\text{m/s}$
      ב-$t = 6\,\text{s}$. הדיסקית מתחילה בראשית.

      (א) תארו את גרף המקום-זמן מ-$0$ עד $6\,\text{s}$: איפה הוא עולה, איפה יורד, איפה יש לו שיא, ואיך הוא מתעקם.

      (ב) תארו את גרף התאוצה-זמן.

      (ג) איפה הדיסקית ב-$t = 6\,\text{s}$, ואיזו דרך עברה?
    answer: >-
      (א) עולה מ-$0$ עד $3\,\text{s}$ ומתמתן, שיא של $9\,\text{m}$ ב-$3\,\text{s}$, ואחר כך יורד ונעשה תלול יותר.

      (ב) קו אופקי בגובה $-2\,\text{m/s}^2$.

      (ג) בראשית; הדרך $18\,\text{m}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון התנועה בהתחלה. המהירות חיובית עד $t = 3\,\text{s}$, אפס ב-$3\,\text{s}$, ושלילית
          אחר כך.
      - kind: reasoning
        text: >-
          (א) כשהמהירות חיובית גרף המקום עולה, וכשהיא שלילית הוא יורד. ב-$t = 3\,\text{s}$ הגרף אופקי לרגע: שיא.
          השטח עד השיא: $\tfrac12\cdot3\cdot6 = 9\,\text{m}$. כל הזמן המהירות יורדת, ולכן הגרף מתעקם כלפי מטה:
          לפני השיא הוא מתמתן, ואחריו נעשה תלול יותר כלפי מטה.
      - kind: substitution
        text: >-
          (ב) השיפוע של גרף המהירות: $a = \dfrac{-6 - 6}{6} = -2\,\text{m/s}^2$, קבוע. גרף התאוצה: קו אופקי
          בגובה $-2\,\text{m/s}^2$, גם ברגע שבו המהירות אפס.
      - kind: reasoning
        text: >-
          (ג) המשולש מתחת לציר, מ-$3$ עד $6\,\text{s}$, שווה למשולש שמעליו: $-9\,\text{m}$. ההעתק $9 - 9 = 0$,
          והדרך $9 + 9 = 18\,\text{m}$.
      - kind: result
        text: >-
          (א) עולה ומתמתן עד שיא של $9\,\text{m}$ ב-$3\,\text{s}$, ואז יורד ונעשה תלול. (ב) $a = -2\,\text{m/s}^2$
          קבועה. (ג) בראשית, אחרי דרך של $18\,\text{m}$.

  - id: W-1.8-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.8-1, OBJ-1.8-2]
    prompt: >-
      מעלית נמצאת בגובה $45\,\text{m}$ מעל הקרקע ויורדת. הכיוון החיובי למעלה. גרף המהירות-זמן שלה: מאפס בקו ישר
      עד $-3\,\text{m/s}$ ב-$3\,\text{s}$, $-3\,\text{m/s}$ קבועה במשך $10\,\text{s}$, ובקו ישר חזרה לאפס
      ב-$3\,\text{s}$ נוספות.

      (א) חשבו את התאוצה בכל קטע, עם הסימן.

      (ב) באיזה גובה נעצרת המעלית?

      (ג) בקטע האחרון התאוצה חיובית והמעלית יורדת. האם המעלית מאיצה או מאטה שם?
    answer: >-
      (א) $-1\,\text{m/s}^2$, אפס, $+1\,\text{m/s}^2$.

      (ב) $6\,\text{m}$ מעל הקרקע.

      (ג) מאטה.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי למעלה, והראשית בקרקע: $y_0 = 45\,\text{m}$. גרף המהירות עובר דרך $(0,\ 0)$, $(3,\ -3)$,
          $(13,\ -3)$ ו-$(16\,\text{s},\ 0)$.
      - kind: formula
        text: >-
          $a = \dfrac{\Delta v}{\Delta t}$ (השיפוע), ו-$y = y_0 + \Delta y$, כש-$\Delta y$ הוא השטח עם הסימן.
      - kind: substitution
        text: >-
          (א) $a_1 = \dfrac{-3 - 0}{3} = -1\,\text{m/s}^2$, $a_2 = 0$, $a_3 = \dfrac{0 - (-3)}{3} = +1\,\text{m/s}^2$.
      - kind: substitution
        text: >-
          (ב) כל השטח מתחת לציר: $\Delta y = -\left(\tfrac12\cdot3\cdot3 + 10\cdot3 + \tfrac12\cdot3\cdot3\right) = -39\,\text{m}$,
          ולכן $y = 45 - 39 = 6\,\text{m}$.
      - kind: reasoning
        text: >-
          (ג) המהירות שלילית והתאוצה חיובית: הסימנים מנוגדים, ולכן גודל המהירות קטן. המעלית מאטה. בגרף: הקו
          מתקרב לציר.
      - kind: result
        text: >-
          (א) $-1$, $0$ ו-$+1\,\text{m/s}^2$. (ב) $6\,\text{m}$ מעל הקרקע. (ג) מאטה.

  - id: W-1.8-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.8-3, OBJ-1.8-2]
    prompt: >-
      הכיוון החיובי הוא ימינה. גרף המהירות-זמן של עגלה: קו ישר מ-$(0,\ 0)$ ל-$(2\,\text{s},\ 4\,\text{m/s})$, קטע
      אופקי עד $4\,\text{s}$, וקו ישר יורד עד $(8\,\text{s},\ -4\,\text{m/s})$. העגלה מתחילה בראשית.

      (א) ארבעה תלמידים שרטטו את גרף התאוצה-זמן. קבעו ונמקו איזה שרטוט נכון, ומה הטעות בכל אחד מהאחרים.

      שרטוט 1: $+2$ מ-$0$ עד $2\,\text{s}$, אפס עד $4\,\text{s}$, $-2\,\text{m/s}^2$ עד $8\,\text{s}$.

      שרטוט 2: כמו 1, אבל מ-$6$ עד $8\,\text{s}$ התאוצה $+2\,\text{m/s}^2$.

      שרטוט 3: קו עולה, קטע אופקי וקו יורד.

      שרטוט 4: כמו 1, אבל ב-$t = 6\,\text{s}$ התאוצה יורדת לרגע לאפס.

      (ב) מה המקום הימני ביותר של העגלה, ומתי היא שם?

      (ג) איפה העגלה ב-$t = 8\,\text{s}$, ואיזו דרך עברה?
    answer: >-
      (א) שרטוט 1.

      (ב) $16\,\text{m}$, ב-$t = 6\,\text{s}$.

      (ג) ב-$x = 12\,\text{m}$, אחרי דרך של $20\,\text{m}$.
    solution:
      - kind: substitution
        text: >-
          (א) השיפועים: $\dfrac{4 - 0}{2} = +2$, אפס, ו-$\dfrac{-4 - 4}{4} = -2\,\text{m/s}^2$. שרטוט 1 נכון.
      - kind: reasoning
        text: >-
          שרטוט 2: מ-$6$ עד $8\,\text{s}$ העגלה באמת מאיצה, אבל שמאלה. הקו עדיין יורד באותו שיפוע, ולכן התאוצה
          $-2\,\text{m/s}^2$. שרטוט 3 מעתיק את הצורה של גרף המהירות. שרטוט 4: ב-$t = 6\,\text{s}$ המהירות אפס, אבל
          השיפוע של הקו לא משתנה שם, ולכן גם התאוצה לא.
      - kind: reasoning
        text: >-
          (ב) המהירות חיובית עד $t = 6\,\text{s}$, ושם מתאפסת: $4 - 2(t - 4) = 0$. המקום הימני ביותר הוא השטח עד
          $6\,\text{s}$: $\tfrac12\cdot2\cdot4 + 2\cdot4 + \tfrac12\cdot2\cdot4 = 4 + 8 + 4 = 16\,\text{m}$.
      - kind: substitution
        text: >-
          (ג) מ-$6$ עד $8\,\text{s}$ משולש מתחת לציר: $-\tfrac12\cdot2\cdot4 = -4\,\text{m}$. המקום $16 - 4 = 12\,\text{m}$,
          והדרך $16 + 4 = 20\,\text{m}$.
      - kind: result
        text: >-
          (א) שרטוט 1. (ב) $16\,\text{m}$ ב-$t = 6\,\text{s}$. (ג) $x = 12\,\text{m}$, דרך $20\,\text{m}$.

  - id: W-1.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.8-2, OBJ-1.8-3]
    prompt: >-
      מכונית עומדת ברמזור. ברגע שהאור מתחלף לירוק, המכונית מתחילה לנסוע בתאוצה $2\,\text{m/s}^2$ עד שהיא מגיעה
      ל-$20\,\text{m/s}$, ומשם נוסעת במהירות קבועה. באותו רגע חולפת על פניה משאית שנוסעת במהירות קבועה
      $15\,\text{m/s}$ באותו כיוון.

      (א) שרטטו את גרפי המהירות-זמן של שתיהן באותה מערכת צירים, ומצאו מתי הגרפים נחתכים.

      (ב) מה הפער הגדול ביותר בין המשאית למכונית, ומתי?

      (ג) מתי ואיפה המכונית משיגה את המשאית?
    answer: >-
      (א) ב-$t = 7.5\,\text{s}$.

      (ב) כ-$56\,\text{m}$, ב-$t = 7.5\,\text{s}$.

      (ג) ב-$t = 20\,\text{s}$, $300\,\text{m}$ אחרי הרמזור.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית ברמזור. המכונית: מהירות עולה בקו ישר מ-$0$ ל-$20\,\text{m/s}$ ב-$10\,\text{s}$,
          ואחר כך קבועה. המשאית: קו אופקי בגובה $15\,\text{m/s}$.
      - kind: substitution
        text: >-
          (א) המהירות של המכונית $2t$, והיא שווה ל-$15$ כש-$t = 7.5\,\text{s}$.
      - kind: reasoning
        text: >-
          (ב) עד $7.5\,\text{s}$ המשאית מהירה יותר והפער גדל. אחר כך המכונית מהירה יותר והפער קטן. הפער הגדול ביותר הוא
          ההפרש בין השטחים עד $7.5\,\text{s}$: $15\cdot7.5 - \tfrac12\cdot7.5\cdot15 = 112.5 - 56.25 = 56.25\,\text{m}$.
      - kind: substitution
        text: >-
          (ג) עד $10\,\text{s}$ המכונית עוברת $\tfrac12\cdot10\cdot20 = 100\,\text{m}$, והמשאית $150\,\text{m}$. הפער
          $50\,\text{m}$, והוא נסגר בקצב $20 - 15 = 5\,\text{m/s}$: עוד $10\,\text{s}$. ב-$t = 20\,\text{s}$ המשאית
          ב-$15\cdot20 = 300\,\text{m}$, והמכונית ב-$100 + 20\cdot10 = 300\,\text{m}$.
      - kind: result
        text: >-
          (א) $t = 7.5\,\text{s}$. (ב) כ-$56\,\text{m}$ ב-$t = 7.5\,\text{s}$. (ג) $t = 20\,\text{s}$, $x = 300\,\text{m}$.

  - id: W-1.8-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.8-2, OBJ-1.8-1]
    prompt: >-
      רכבת יוצאת ממנוחה מתחנה A ונעצרת בתחנה B, $2000\,\text{m}$ משם. היא מאיצה בתאוצה $0.5\,\text{m/s}^2$ עד
      $20\,\text{m/s}$, נוסעת במהירות הזו, ובולמת בתאוצה שגודלה $1\,\text{m/s}^2$ עד עצירה בתחנה B.

      (א) שרטטו את גרף המהירות-זמן, וחשבו את הזמן ואת ההעתק בכל אחד משלושת הקטעים.

      (ב) כמה זמן נמשכת הנסיעה?

      (ג) מה משתנה אם המהירות המרבית $25\,\text{m/s}$, והתאוצות לא משתנות?
    answer: >-
      (א) האצה $40\,\text{s}$ ו-$400\,\text{m}$, בלימה $20\,\text{s}$ ו-$200\,\text{m}$, באמצע $70\,\text{s}$ ו-$1400\,\text{m}$.

      (ב) $130\,\text{s}$.

      (ג) $117.5\,\text{s}$: חיסכון של $12.5\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי מ-A ל-B, והראשית ב-A. גרף המהירות-זמן הוא טרפז: קו עולה בשיפוע $0.5\,\text{m/s}^2$, קטע אופקי
          בגובה $20\,\text{m/s}$, וקו יורד בשיפוע $-1\,\text{m/s}^2$.
      - kind: formula
        text: >-
          הזמן של קטע עם שיפוע $a$: $t = \dfrac{\Delta v}{a}$. ההעתק הוא השטח, והשטח הכולל $2000\,\text{m}$.
      - kind: substitution
        text: >-
          (א) האצה: $t_1 = \dfrac{20}{0.5} = 40\,\text{s}$, שטח $\tfrac12\cdot40\cdot20 = 400\,\text{m}$. בלימה:
          $t_3 = \dfrac{20}{1} = 20\,\text{s}$, שטח $\tfrac12\cdot20\cdot20 = 200\,\text{m}$. באמצע נשארו
          $2000 - 400 - 200 = 1400\,\text{m}$, ולכן $t_2 = \dfrac{1400}{20} = 70\,\text{s}$.
      - kind: substitution
        text: >-
          (ב) $40 + 70 + 20 = 130\,\text{s}$.
      - kind: substitution
        text: >-
          (ג) $t_1 = 50\,\text{s}$ ו-$625\,\text{m}$; $t_3 = 25\,\text{s}$ ו-$312.5\,\text{m}$; באמצע
          $1062.5\,\text{m}$ ב-$25\,\text{m/s}$, כלומר $42.5\,\text{s}$. ביחד $117.5\,\text{s}$.
      - kind: result
        text: >-
          (א) $40$, $70$ ו-$20\,\text{s}$; $400$, $1400$ ו-$200\,\text{m}$. (ב) $130\,\text{s}$. (ג) $117.5\,\text{s}$.
          מהירות מרבית גבוהה ב-25% חוסכת רק כ-10% מהזמן, כי ההאצה והבלימה נעשות ארוכות יותר.

challenge:
  - id: W-1.8-c1
    stars: 1
    objectives: [OBJ-1.8-2, OBJ-1.8-3]
    prompt: >-
      גוף נע לאורך ציר ישר, והכיוון החיובי ימינה. גרף המהירות-זמן שלו בנוי מקטעים אופקיים: $+8\,\text{m/s}$ מ-$0$
      עד $2\,\text{s}$, $-4\,\text{m/s}$ מ-$2$ עד $4\,\text{s}$, $+4\,\text{m/s}$ מ-$4$ עד $8\,\text{s}$, ו-$-4\,\text{m/s}$
      מ-$8$ עד $10\,\text{s}$.

      (א) מה היחס בין ההעתק לבין הדרך מ-$0$ עד $10\,\text{s}$?

      (ב) מה המקום הימני ביותר שהגוף מגיע אליו, ביחס למקום ההתחלתי, ומתי?

      (ג) שרטטו את גרף המקום-זמן, וחשבו את המהירות הממוצעת ואת הדרך חלקי הזמן בעשר השניות.
    answer: >-
      (א) $1:3$ ($16\,\text{m}$ לעומת $48\,\text{m}$).

      (ב) $24\,\text{m}$ ימינה, ב-$t = 8\,\text{s}$.

      (ג) $1.6\,\text{m/s}$ ו-$4.8\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי ימינה, והראשית במקום ההתחלתי. ארבעה מלבנים מתחת לגרף המהירות-זמן.
      - kind: formula
        text: >-
          ההעתק הוא סכום השטחים עם הסימנים, והדרך היא סכום השטחים בלי סימנים.
      - kind: substitution
        text: >-
          (א) השטחים: $+16$, $-8$, $+16$, $-8\,\text{m}$. ההעתק $16 - 8 + 16 - 8 = 16\,\text{m}$, והדרך
          $16 + 8 + 16 + 8 = 48\,\text{m}$. היחס $16:48 = 1:3$.
      - kind: reasoning
        text: >-
          (ב) המקומות בפינות: $x(2) = 16$, $x(4) = 8$, $x(8) = 24$ ו-$x(10) = 16\,\text{m}$. המקום הימני ביותר הוא
          $24\,\text{m}$, ב-$t = 8\,\text{s}$, הרגע שבו המהירות מחליפה סימן מחיובי לשלילי.
      - kind: substitution
        text: >-
          (ג) גרף המקום-זמן: ארבעה קווים ישרים בין הנקודות $(0,\ 0)$, $(2,\ 16)$, $(4,\ 8)$, $(8,\ 24)$ ו-$(10,\ 16)$.
          המהירות הממוצעת $\dfrac{16}{10} = 1.6\,\text{m/s}$, והדרך חלקי הזמן $\dfrac{48}{10} = 4.8\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $1:3$. (ב) $24\,\text{m}$ ב-$t = 8\,\text{s}$. (ג) $1.6\,\text{m/s}$ ימינה, ו-$4.8\,\text{m/s}$.
    source:
