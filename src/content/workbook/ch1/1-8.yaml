  - id: W-1.8-c2
    stars: 1
    objectives: [OBJ-1.8-2, OBJ-1.8-1]
    prompt: >-
      גוף יוצא מהראשית ב-$t = 0$ ונע בכיוון החיובי של ציר x. גרף המהירות-זמן שלו: קו ישר מ-$(0,\ 0)$ ל-$(2\,\text{s},\ 2\,\text{m/s})$,
      קטע אופקי בגובה $2\,\text{m/s}$ עד $t = 4\,\text{s}$, וקטע אופקי בגובה $3\,\text{m/s}$ מ-$4$ עד $5\,\text{s}$:
      ב-$t = 4\,\text{s}$ המהירות קופצת בבת אחת.

      (א) איפה הגוף ב-$t = 5\,\text{s}$?

      (ב) שרטטו את גרף התאוצה-זמן לפי השיפועים, וחשבו את השטח מתחתיו מ-$0$ עד $5\,\text{s}$. האם הוא שווה לשינוי
      המהירות? הסבירו.

      (ג) מה המהירות הממוצעת של הגוף בחמש השניות?
    answer: >-
      (א) $9\,\text{m}$.

      (ב) השטח $2\,\text{m/s}$, אבל המהירות השתנתה ב-$3\,\text{m/s}$: הקפיצה ב-$t = 4\,\text{s}$ אינה נראית בגרף
      התאוצה.

      (ג) $1.8\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון ציר x, והגוף מתחיל בראשית, $x_0 = 0$.
      - kind: substitution
        text: >-
          (א) השטח מתחת לגרף המהירות: משולש $\tfrac12\cdot2\cdot2 = 2\,\text{m}$, מלבן $2\cdot2 = 4\,\text{m}$, ומלבן
          $1\cdot3 = 3\,\text{m}$. ביחד $9\,\text{m}$, ולכן $x(5) = 0 + 9 = 9\,\text{m}$.
      - kind: reasoning
        text: >-
          (ב) השיפועים: $1\,\text{m/s}^2$ מ-$0$ עד $2\,\text{s}$, ואפס אחר כך. השטח מתחת לגרף התאוצה $1\cdot2 = 2\,\text{m/s}$,
          אבל המהירות עלתה מ-$0$ ל-$3\,\text{m/s}$. החסר, $1\,\text{m/s}$, הוא הקפיצה ב-$t = 4\,\text{s}$. בקפיצה
          בבת אחת אין לשיפוע ערך, ולכן היא לא מופיעה בגרף. בגוף אמיתי המהירות משתנה בזמן קצר מאוד, בתאוצה גדולה מאוד,
          והשטח של "המחט" הזו בגרף התאוצה הוא $1\,\text{m/s}$. הכלל "השטח מתחת לגרף התאוצה הוא $\Delta v$" נכון רק
          כשהמהירות לא קופצת.
      - kind: substitution
        text: >-
          (ג) $\bar v = \dfrac{9}{5} = 1.8\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $9\,\text{m}$. (ב) $2\,\text{m/s}$, לא שווה ל-$\Delta v = 3\,\text{m/s}$, בגלל הקפיצה. (ג) $1.8\,\text{m/s}$.
