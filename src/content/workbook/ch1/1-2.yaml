      שניות, עולה בקו ישר עד 12 מטרים ב-t שווה 6 שניות, אופקי בגובה 12 מטרים עד t שווה 10 שניות, יורד בקו ישר עד 4
      מטרים ב-t שווה 14 שניות, ונשאר אופקי.
    answer: >-
      (א) מ-0 עד 2 שניות בגובה $0$; מ-6 עד 10 שניות בגובה $12\,\text{m}$; מ-14 שניות בגובה $4\,\text{m}$.

      (ב) עולה מ-2 עד 6 שניות; יורדת מ-10 עד 14 שניות.

      (ג) $8\,\text{m}$.

      (ד) ב-$t = 5\,\text{s}$ וב-$t = 11.5\,\text{s}$.
    solution:
      - kind: reasoning
        text: >-
          (א) המעלית עומדת בקטעים האופקיים: מ-0 עד 2 שניות ב-$y = 0$, מ-6 עד 10 שניות ב-$y = 12\,\text{m}$, ומ-14 שניות
          והלאה ב-$y = 4\,\text{m}$.
      - kind: reasoning
        text: >-
          (ב) הקו עולה מ-2 עד 6 שניות: $y$ גדל, והמעלית עולה. הקו יורד מ-10 עד 14 שניות: המעלית יורדת.
      - kind: reasoning
        text: >-
          (ג) בירידה המעלית יורדת $12 - 4 = 8$ מטרים ב-4 שניות, כלומר 2 מטרים בכל שנייה. ב-$t = 12\,\text{s}$ עברו 2 שניות
          מתחילת הירידה: $y = 12 - 2\cdot2 = 8\,\text{m}$. אפשר גם לקרוא מהגרף: באמצע הקטע היורד, באמצע הדרך בין 12 ל-4.
      - kind: reasoning
        text: >-
          (ד) קו אופקי בגובה $9\,\text{m}$ חותך את הגרף פעמיים. בעלייה המעלית עולה 12 מטרים ב-4 שניות, 3 מטרים בכל שנייה,
          ולכן מגיעה ל-$9\,\text{m}$ שלוש שניות אחרי $t = 2\,\text{s}$, ב-$t = 5\,\text{s}$. בירידה, מ-12 ל-9 יש 3 מטרים,
          ב-2 מטרים בכל שנייה: $1.5\,\text{s}$ אחרי $t = 10\,\text{s}$, כלומר ב-$t = 11.5\,\text{s}$.
      - kind: result
        text: >-
          (א) 0–2 שניות בקרקע, 6–10 שניות ב-$12\,\text{m}$, מ-14 שניות ב-$4\,\text{m}$. (ב) עולה 2–6 שניות, יורדת 10–14
          שניות. (ג) $8\,\text{m}$. (ד) ב-$t = 5\,\text{s}$ וב-$t = 11.5\,\text{s}$.

  - id: W-1.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      מכונית צעצוע נעה על מסילה ישרה. הכיוון החיובי הוא ימינה. זו טבלת המקום שלה:
      $$\begin{array}{c|ccccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline x\ (\text{m}) & -4 & -1 & 2 & 2 & 2 & 0 & -2 \end{array}$$
      בכל קטע בין עצירות או החלפות כיוון, המכונית עוברת אותו מספר מטרים בכל שנייה.

      (א) שרטטו את גרף המקום-זמן.

      (ב) מתי המכונית עומדת, ומתי היא נעה שמאלה?

      (ג) באילו רגעים היא עוברת בראשית?

      (ד) תארו את תרשים העקבות שלה.
    answer: >-
      (א) קו ישר עולה מ-$(0,\ -4\,\text{m})$ עד $(2\,\text{s},\ 2\,\text{m})$, אופקי עד $t = 4\,\text{s}$, וקו ישר יורד עד
      $(6\,\text{s},\ -2\,\text{m})$.

      (ב) עומדת מ-2 עד 4 שניות; נעה שמאלה מ-4 עד 6 שניות.

      (ג) ב-$t \approx 1.33\,\text{s}$ (ימינה) וב-$t = 5\,\text{s}$ (שמאלה).

      (ד) שלוש נקודות במרווחים של 3 מטרים ימינה, שלוש נקודות זו על זו ב-$2\,\text{m}$, ובשורה נפרדת נקודות במרווחים של
      2 מטרים שמאלה.
    solution:
      - kind: reasoning
        text: >-
          (א, ב) מ-0 עד 2 שניות $x$ גדל ב-3 בכל שנייה: קו ישר עולה, תנועה ימינה. מ-2 עד 4 שניות $x = 2\,\text{m}$ קבוע: קו
          אופקי, המכונית עומדת. מ-4 עד 6 שניות $x$ קטן ב-2 בכל שנייה: קו ישר יורד, תנועה שמאלה.
      - kind: manipulation
        text: >-
          (ג) בעלייה המכונית צריכה לעבור מ-$x = -4\,\text{m}$ עד הראשית, כלומר 4 מטרים, ובכל שנייה היא עוברת 3 מטרים.
          מספר השניות הוא 4 חלקי 3. זה לא מספר שלם של שניות, ולכן הרגע הזה לא מופיע בטבלה.
      - kind: substitution
        text: >-
          (ג) $t = 4/3 \approx 1.33\,\text{s}$. בירידה, מהטבלה: $x = 0$ ב-$t = 5\,\text{s}$.
      - kind: reasoning
        text: >-
          (ד) בדרך ימינה נקודות במקומות $x = -4,\ -1,\ 2$ (במטרים). ב-$2\,\text{m}$ שלוש נקודות זו על זו (2, 3 ו-4 שניות).
          בדרך חזרה, בשורה נפרדת, נקודות במקומות $x = 0$ ו-$x = -2\,\text{m}$, במרווחים של 2 מטרים בלבד: הדרך חזרה איטית
          יותר.
      - kind: result
        text: >-
          (ב) עומדת 2–4 שניות; נעה שמאלה 4–6 שניות. (ג) ב-$t \approx 1.33\,\text{s}$ וב-$t = 5\,\text{s}$. (א, ד) כמתואר.

