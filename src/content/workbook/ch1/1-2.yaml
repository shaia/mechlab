    diagramAlt: >-
      ארבעה גרפים קטנים של מקום מול זמן, בלי מספרים על הצירים. גרף 1: קו ישר שיורד, מתחיל מעל הציר האופקי ועובר אל
      מתחתיו. גרף 2: עקומה שמתחילה מעל הציר, יורדת אל מתחתיו ועולה מעט בחזרה, כמו קערה. גרף 3: עקומה שמתחילה מתחת
      לציר, עולה מעליו, מגיעה לפסגה מעוגלת ויורדת. גרף 4: קו ישר שעולה, מתחיל מתחת לציר ועובר אל מעליו.
    answer: >-
      (א) גרף 3.

      (ב) במטרים, ב-0 עד 6 שניות: $x = -5,\ 0,\ 3,\ 4,\ 3,\ 0,\ -5$.

      (ג) ב-$t = 1\,\text{s}$ (ימינה) וב-$t = 5\,\text{s}$ (שמאלה).

      (ד) $x = 4\,\text{m}$, ב-$t = 3\,\text{s}$.
    solution:
      - kind: reasoning
        text: >-
          (א) העגלה מתחילה ב-$x$ שלילי, ולכן הגרף מתחיל **מתחת** לציר האופקי: זה פוסל את גרפים 1 ו-2. היא נעה ימינה, $x$
          גדל, ולכן הגרף מתחיל בעלייה. היא מאטה ונעצרת לרגע: העלייה הולכת ונעשית שטוחה עד פסגה מעוגלת. אחר כך היא חוזרת
          שמאלה מהר יותר ויותר: הגרף יורד, ונעשה תלול יותר. זה גרף 3.
      - kind: reasoning
        text: >-
          (א) גרף 4 מתחיל נכון, אבל הוא קו ישר: עגלה שנעה ימינה כל הזמן, אותו מספר מטרים בכל שנייה, בלי להאט ובלי לחזור. גרף 1 מתאר עגלה
          שנעה שמאלה כל הזמן, מצד ימין של הראשית. גרף 2 מתחיל מימין לראשית ונע קודם שמאלה.
      - kind: substitution
        text: >-
          (ב) מציבים, למשל $x(2) = -5 + 12 - 4 = 3\,\text{m}$:
          $$\begin{array}{c|ccccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline x\ (\text{m}) & -5 & 0 & 3 & 4 & 3 & 0 & -5 \end{array}$$
      - kind: reasoning
        text: >-
          (ג) $x = 0$ ב-$t = 1\,\text{s}$ וב-$t = 5\,\text{s}$. בדיקה: $x(5) = -5 + 30 - 25 = 0$. ב-$t = 1\,\text{s}$ $x$ גדל
          (מ-$x = -5\,\text{m}$ ל-$x = 3\,\text{m}$): העגלה עוברת בראשית ימינה. ב-$t = 5\,\text{s}$ $x$ קטן (מ-$x = 3\,\text{m}$
          ל-$x = -5\,\text{m}$): היא עוברת בה שמאלה.
      - kind: reasoning
        text: >-
          (ד) הטבלה סימטרית סביב $t = 3\,\text{s}$: $x(2) = x(4)$ ו-$x(1) = x(5)$. לכן הפסגה בדיוק ב-$t = 3\,\text{s}$,
          ב-$x(3) = -5 + 18 - 9 = 4\,\text{m}$.
      - kind: result
        text: >-
          (א) גרף 3 (התשובה המקורית). (ב) במטרים: $x = -5,\ 0,\ 3,\ 4,\ 3,\ 0,\ -5$. (ג) ב-$t = 1\,\text{s}$ ימינה, וב-$t = 5\,\text{s}$
          שמאלה. (ד) $4\,\text{m}$, ב-$t = 3\,\text{s}$.
