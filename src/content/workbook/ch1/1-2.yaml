# Workbook for lesson 1.2: ten practice problems and two sourced challenge problems.
# Every number recomputed with legs / uniform / makeMotion / constantAcceleration / timesAtPosition / pathLength from
# src/physics/kinematics.ts (script: screens/check-1-2.ts, run with npx tsx). The x–t graphs below are drawn by the
# same script from the same motions.

lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      אוטובוס מתקרב לתחנה ובולם. הכיוון החיובי הוא כיוון הנסיעה, והראשית במקום שבו הנהג התחיל לבלום. אלה המקומות של
      האוטובוס בכל שנייה מתחילת הבלימה:
      $$\begin{array}{c|ccccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline x\ (\text{m}) & 0 & 9 & 16 & 21 & 24 & 25 & 25 \end{array}$$

      (א) תארו את תרשים העקבות של האוטובוס.

      (ב) מתי האוטובוס נעצר? נמקו לפי הטבלה.
    answer: >-
      (א) שש נקודות שהמרווחים ביניהן קטנים: 9, 7, 5, 3 ו-1 מטרים, ואחריהן נקודה שנייה על הנקודה ב-$25\,\text{m}$.

      (ב) ב-$t = 5\,\text{s}$, ב-$x = 25\,\text{m}$: מאז המקום לא משתנה.
    solution:
      - kind: reasoning
        text: >-
          (א) מחשבים את ההפרשים בין שורות סמוכות: $9 - 0 = 9$, $16 - 9 = 7$, $21 - 16 = 5$, $24 - 21 = 3$, $25 - 24 = 1$,
          $25 - 25 = 0$. בתרשים העקבות אלה המרווחים בין נקודות סמוכות. הם קטנים בהתמדה, ולכן האוטובוס מאט.
      - kind: reasoning
        text: >-
          (ב) מ-$t = 5\,\text{s}$ ל-$t = 6\,\text{s}$ המקום נשאר $25\,\text{m}$: שתי נקודות זו על זו. האוטובוס עומד מ-$t = 5\,\text{s}$.
          (הטבלה לא מראה מה קרה בין השורות, אבל המרווחים שקטנו באופן סדיר, 3 ואז 1, מתאימים לעצירה ב-$t = 5\,\text{s}$.)
      - kind: result
        text: >-
          (א) נקודות שהולכות ומתקרבות זו לזו (מרווחים 9, 7, 5, 3, 1 מטרים), ושתי נקודות זו על זו ב-$25\,\text{m}$.
          (ב) ב-$t = 5\,\text{s}$, ב-$25\,\text{m}$ מנקודת תחילת הבלימה.

  - id: W-1.2-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.2-2]
    prompt: >-
      המקום של מכונית צעצוע נתון בביטוי $x(t) = 20 - 5t$, כש-$x$ במטרים ו-$t$ בשניות.

      (א) בנו טבלה של המקום ב-$t = 0, 1, 2, 3, 4$ ו-$5\,\text{s}$.

      (ב) לאיזה כיוון נעה המכונית?

      (ג) מתי היא עוברת בראשית?
    answer: >-
      (א) במטרים: $x = 20,\ 15,\ 10,\ 5,\ 0,\ -5$.

      (ב) בכיוון השלילי.

      (ג) ב-$t = 4\,\text{s}$.
    solution:
      - kind: formula
        text: >-
          מציבים כל רגע בביטוי. למשל $x(3) = 20 - 5\cdot3 = 5\,\text{m}$.
      - kind: substitution
        text: >-
          $$\begin{array}{c|cccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 \\ \hline x\ (\text{m}) & 20 & 15 & 10 & 5 & 0 & -5 \end{array}$$
      - kind: reasoning
        text: >-
          (ב) $x$ קטן ב-5 מטרים בכל שנייה, ולכן המכונית נעה בכיוון השלילי, כל הזמן.
      - kind: reasoning
        text: >-
          (ג) בראשית $x = 0$. בטבלה זה קורה ב-$t = 4\,\text{s}$. בדיקה בביטוי: $20 - 5\cdot4 = 0$. אחרי הרגע הזה המכונית
          בצד השלילי של הראשית, וממשיכה בכיוון השלילי.
      - kind: result
        text: >-
          (א) במטרים: $x = 20,\ 15,\ 10,\ 5,\ 0,\ -5$. (ב) בכיוון השלילי. (ג) ב-$t = 4\,\text{s}$.

