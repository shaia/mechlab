    diagramAlt: >-
      גרף מקום-זמן. הציר האופקי t בשניות, מ-0 עד 10. הציר האנכי x במטרים, ממינוס 10 עד 10. הקו אופקי בגובה 8 מטרים
      עד t שווה 3 שניות, יורד בקו ישר עד 0 ב-t שווה 5 שניות, אופקי ב-0 עד t שווה 6 שניות, יורד בקו ישר עד מינוס 8 מטרים
      ב-t שווה 8 שניות, אופקי עד t שווה 9 שניות, ועולה בקו ישר ותלול עד 10 מטרים ב-t שווה 10 שניות.
    answer: >-
      (א) $34\,\text{m}$.

      (ב) $+2\,\text{m}$.

      (ג) עומד: 0–3, 5–6 ו-8–9 שניות; בכיוון השלילי: 3–5 ו-6–8 שניות.

      (ד) מ-$t = 5\,\text{s}$ עד $t = 6\,\text{s}$ (עומד בראשית), ושוב ב-$t \approx 9.44\,\text{s}$.
    solution:
      - kind: given
        text: >-
          קוראים את הפינות של הגרף: $(0,\ 8)$, $(3,\ 8)$, $(5,\ 0)$, $(6,\ 0)$, $(8,\ -8)$, $(9,\ -8)$, $(10,\ 10)$, עם $t$
          בשניות ו-$x$ במטרים.
      - kind: reasoning
        text: >-
          (א) הדרך היא סכום המטרים שהגוף עבר בכל קטע, בלי סימן. בקטעים האופקיים הוא לא עבר כלום. מ-$x = 8\,\text{m}$ עד
          הראשית: 8 מטרים. מהראשית עד $x = -8\,\text{m}$: 8 מטרים. מ-$x = -8\,\text{m}$ עד $x = 10\,\text{m}$: 18 מטרים.
      - kind: substitution
        text: >-
          (א) $8 + 8 + 18 = 34\,\text{m}$.
      - kind: formula
        text: >-
          (ב) ההעתק הוא המקום הסופי פחות המקום ההתחלתי: $\Delta x = x_2 - x_1$.
      - kind: substitution
        text: >-
          (ב) $\Delta x = 10 - 8 = +2\,\text{m}$. ההעתק קטן בהרבה מהדרך, כי הגוף הלך הלוך ושוב.
      - kind: reasoning
        text: >-
          (ג) קטעים אופקיים, עמידה: 0–3, 5–6 ו-8–9 שניות. קטעים יורדים, כיוון שלילי: 3–5 ו-6–8 שניות. הקטע האחרון עולה:
          כיוון חיובי.
      - kind: manipulation
        text: >-
          (ד) $x = 0$ לאורך כל הקטע האופקי מ-5 עד 6 שניות. בקטע האחרון הגוף עולה 18 מטרים בשנייה אחת. מ-$x = -8\,\text{m}$ עד
          הראשית יש 8 מטרים, ולכן הוא עובר בראשית $\frac{8}{18}$ שנייה אחרי $t = 9\,\text{s}$:
          $$t = 9 + \frac{8}{18} \approx 9.44\ \text{s}$$
      - kind: result
        text: >-
          (א) $34\,\text{m}$ (התשובה המקורית). (ב) $+2\,\text{m}$. (ג) עומד 0–3, 5–6, 8–9 שניות; נע בכיוון השלילי 3–5 ו-6–8
          שניות. (ד) מ-5 עד 6 שניות, וב-$t \approx 9.44\,\text{s}$.
