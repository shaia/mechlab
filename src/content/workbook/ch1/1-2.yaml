  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      עגלה עם מאוורר עומדת על מסילה אופקית ישרה. הכיוון החיובי הוא ימינה. ב-$t = 0$ העגלה נמצאת ב-$x = -5\,\text{m}$,
      ונעה ימינה. המאוורר שעליה נושף אוויר ימינה, ולכן האוויר דוחף את העגלה שמאלה (את הסיבה תלמדו בפרק 2): העגלה מאטה,
      נעצרת לרגע, וחוזרת שמאלה מהר יותר ויותר.

      (א) איזה מארבעת הגרפים מתאר את המקום של העגלה? נמקו, ולכל גרף אחר אמרו מה בו לא מתאים.

      (ב) בניסוי מסוים המקום של העגלה הוא $x(t) = -5 + 6t - t^2$, כש-$x$ במטרים ו-$t$ בשניות. בנו טבלה מ-0 עד 6 שניות.

      (ג) מתי העגלה עוברת בראשית, ולאיזה כיוון היא נעה בכל פעם?

      (ד) מה המקום הימני ביותר שהעגלה מגיעה אליו, ומתי?
