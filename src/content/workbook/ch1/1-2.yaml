    prompt: >-
      גוף נע לאורך ציר אופקי. זה גרף המקום-זמן שלו, מ-$t = 0$ עד $t = 10\,\text{s}$:

      (א) מה הדרך הכוללת שהגוף עבר בעשר השניות? (תשובות אפשריות בשאלה המקורית: 2, 18, 26, 34 או 42 מטרים.)

