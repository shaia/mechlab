    diagramAlt: >-
      גרף מקום-זמן של שני רצים. הציר האופקי t בשניות, מ-0 עד 10. הציר האנכי x במטרים, מ-0 עד 30. הקו הרציף, A, הוא קו
      ישר מהראשית עד 30 מטרים ב-t שווה 10 שניות. הקו המקווקו, B, אופקי בגובה 12 מטרים עד t שווה 2 שניות, ואחר כך עולה
      בקו ישר, פחות תלול, עד 20 מטרים ב-t שווה 10 שניות. הקווים נחתכים ב-t שווה 5 שניות, בגובה 15 מטרים.
    answer: >-
      (1) נכון. (2) לא נכון. (3) נכון. (4) לא נכון. (5) נכון.
    solution:
      - kind: reasoning
        text: >-
          (1) ב-$t = 1\,\text{s}$, B ב-$12\,\text{m}$ ו-A ב-$3\,\text{m}$. הכיוון החיובי הוא כיוון הריצה, ולכן B לפני A.
          נכון.
      - kind: reasoning
        text: >-
          (2) ב-$t = 5\,\text{s}$ הקווים נחתכים: שני הרצים ב-$15\,\text{m}$, כלומר A עוקף את B. אבל הקו של A תלול יותר: A
          עובר 3 מטרים בכל שנייה, ו-B רק מטר אחד. חיתוך = אותו מקום, לא אותו מספר מטרים בכל שנייה. לא נכון.
      - kind: reasoning
        text: >-
          (3) הקו של B אופקי ואחר כך עולה, ואף פעם לא יורד: הוא עומד ואחר כך נע בכיוון החיובי. נכון.
      - kind: reasoning
        text: >-
          (4) ב-$t = 1\,\text{s}$, B עומד (הקו שלו אופקי עד $t = 2\,\text{s}$), ו-A נע. קו גבוה פירושו מקום מתקדם יותר, לא
          ריצה מהירה יותר. לא נכון.
      - kind: reasoning
        text: >-
          (5) ב-$t = 8\,\text{s}$: A ב-$24\,\text{m}$, B ב-$18\,\text{m}$. A מקדים. נכון.
      - kind: result
        text: >-
          נכונים: (1), (3), (5). לא נכונים: (2) החיתוך הוא עקיפה, A מהיר יותר; (4) B עומד ב-$t = 1\,\text{s}$.

  - id: W-1.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      במעבדה מחברים עגלה לסרט נייר שעובר דרך רשם-זמן. רשם הזמן מסמן נקודה על הסרט כל $0.02\,\text{s}$. העגלה יוצאת ממנוחה.
      מודדים את המרחק של כל נקודה מהנקודה הראשונה (בסנטימטרים):
      $$0,\ 0.2,\ 0.8,\ 1.8,\ 3.2,\ 5.0$$

      (א) בנו טבלה של זמן ומקום, כשהזמן נמדד מהנקודה הראשונה.

      (ב) מה מראה הסרט על התנועה של העגלה?

      (ג) תלמידה טוענת שהמקום מתואר בביטוי $x(t) = 5t^2$, כש-$x$ במטרים ו-$t$ בשניות. בדקו את הטענה בשתי שורות של
      הטבלה.

      (ד) לפי הביטוי, באיזה מרחק מהנקודה הראשונה תהיה הנקודה הבאה?
    answer: >-
      (א) $t = 0, 0.02, 0.04, 0.06, 0.08, 0.10\,\text{s}$ מול $x = 0, 0.2, 0.8, 1.8, 3.2, 5.0\,\text{cm}$.

      (ב) הרווחים גדלים (0.2, 0.6, 1.0, 1.4, 1.8 סנטימטרים): העגלה נעה מהר יותר ויותר.

      (ג) הביטוי מתאים.

      (ד) $7.2\,\text{cm}$.
    solution:
      - kind: given
        text: >-
          $0.02\,\text{s}$ בין נקודות סמוכות. הסרט הוא תרשים עקבות של העגלה: הנקודה ה-$n$ סומנה ב-$t = 0.02\cdot(n - 1)\,\text{s}$.
      - kind: substitution
        text: >-
          (א)
          $$\begin{array}{c|cccccc} t\ (\text{s}) & 0 & 0.02 & 0.04 & 0.06 & 0.08 & 0.10 \\ \hline x\ (\text{cm}) & 0 & 0.2 & 0.8 & 1.8 & 3.2 & 5.0 \end{array}$$
      - kind: reasoning
        text: >-
          (ב) הרווחים בין נקודות סמוכות: 0.2, 0.6, 1.0, 1.4, 1.8 סנטימטרים. בכל $0.02\,\text{s}$ העגלה עוברת יותר
          מבקודמת, ולכן היא נעה מהר יותר ויותר.
      - kind: substitution
        text: >-
          (ג) מציבים, ומעבירים לסנטימטרים (כופלים ב-100): ב-$t = 0.04\,\text{s}$:
          $x = 5\cdot0.04^2 = 5\cdot0.0016 = 0.008\,\text{m} = 0.8\,\text{cm}$. ב-$t = 0.10\,\text{s}$:
          $x = 5\cdot0.01 = 0.05\,\text{m} = 5.0\,\text{cm}$. שתי השורות מתאימות.
      - kind: substitution
        text: >-
          (ד) הנקודה הבאה ב-$t = 0.12\,\text{s}$: $x = 5\cdot0.12^2 = 5\cdot0.0144 = 0.072\,\text{m} = 7.2\,\text{cm}$.
      - kind: result
        text: >-
          (ב) העגלה מאיצה: הרווחים גדלים ב-0.4 סנטימטרים בכל פעם. (ג) הביטוי מתאים לטבלה. (ד) $7.2\,\text{cm}$ מהנקודה
          הראשונה.

  - id: W-1.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      שעון ספורט עם מקלט מיקום רושם כל 10 שניות את המקום של רצה לאורך מסלול ישר. הכיוון החיובי הוא כיוון היציאה:
      $$\begin{array}{c|ccccccccc} t\ (\text{s}) & 0 & 10 & 20 & 30 & 40 & 50 & 60 & 70 & 80 \\ \hline x\ (\text{m}) & 0 & 40 & 80 & 110 & 110 & 90 & 60 & 60 & 100 \end{array}$$

      (א) באילו פרקי זמן נראה שהרצה עמדה? האם אפשר להיות בטוחים בזה מהטבלה?

      (ב) באילו פרקי זמן היא נעה בכיוון השלילי?

      (ג) שרטטו את הגרף בקווים ישרים בין הנקודות, וסמנו בו את הרגעים שבהם היא החליפה כיוון.
    answer: >-
      (א) בין 30 ל-40 שניות ובין 60 ל-70 שניות; אי אפשר להיות בטוחים, כי הטבלה לא מראה מה קרה בין הרשומות.

      (ב) מ-40 עד 60 שניות.

      (ג) החלפת כיוון סביב $t = 30$–$40\,\text{s}$ ב-$110\,\text{m}$, ושוב סביב $t = 60$–$70\,\text{s}$ ב-$60\,\text{m}$.
    solution:
      - kind: reasoning
        text: >-
          (א) המקום זהה ב-30 וב-40 שניות ($110\,\text{m}$), וזהה ב-60 וב-70 שניות ($60\,\text{m}$). ההסבר הפשוט הוא שהרצה
          עמדה. אבל הטבלה מראה רק רגעים בודדים: ייתכן שהרצה רצה קדימה וחזרה בדיוק לאותו מקום בתוך 10 השניות. כדי להיות
          בטוחים צריך רשומות תכופות יותר.
      - kind: reasoning
        text: >-
          (ב) $x$ קטן מ-110 ל-90 ול-60 בין 40 ל-60 שניות: תנועה בכיוון השלילי.
      - kind: reasoning
        text: >-
          (ג) עד $t = 30\,\text{s}$ $x$ גדל, ומ-$t = 40\,\text{s}$ הוא קטן: בגרף, פסגה שטוחה בגובה $110\,\text{m}$. מ-$t = 60\,\text{s}$
          עד $t = 70\,\text{s}$ שוב קטע שטוח, ואחריו $x$ גדל: שקע שטוח בגובה $60\,\text{m}$.
      - kind: result
        text: >-
          (א) 30–40 ו-60–70 שניות, בלי ודאות מלאה. (ב) 40–60 שניות. (ג) שתי החלפות כיוון: ב-$110\,\text{m}$ (מחיובי לשלילי)
          וב-$60\,\text{m}$ (משלילי לחיובי).

  - id: W-1.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.2-1, OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      תלמידה עומדת מול מד-טווח, חיישן שמודד כל חצי שנייה את המרחק שלה ממנו. הראשית בחיישן, והכיוון החיובי הוא הרחק
      מהחיישן. אלה המדידות:
      $$\begin{array}{c|ccccccccccccccc} t\ (\text{s}) & 0 & 0.5 & 1 & 1.5 & 2 & 2.5 & 3 & 3.5 & 4 & 4.5 & 5 & 5.5 & 6 & 6.5 & 7 \\ \hline x\ (\text{m}) & 1 & 1 & 1 & 1.5 & 2 & 2.5 & 3 & 3.5 & 4 & 4 & 4 & 3 & 2 & 2 & 2 \end{array}$$

      (א) שרטטו את גרף המקום-זמן ותארו במילים איך התלמידה הלכה.

      (ב) תארו את תרשים העקבות, עם נקודה לכל שנייה שלמה.

      (ג) באילו רגעים היא נמצאת $3\,\text{m}$ מהחיישן?

      (ד) מזיזים את החיישן לקיר שמול התלמידה, $6\,\text{m}$ מהמקום הקודם, כך שהוא פונה אליה מהצד השני. התלמידה הולכת
      בדיוק אותה הליכה. בנו את הטבלה שהחיישן החדש ימדוד בכל שנייה שלמה, ותארו איך ישתנה הגרף.
    answer: >-
      (א) עומדת עד $t = 1\,\text{s}$, מתרחקת מטר בכל שנייה עד $t = 4\,\text{s}$, עומדת עד $t = 5\,\text{s}$, מתקרבת 2 מטרים בכל
      שנייה עד $t = 6\,\text{s}$, ועומדת.

      (ב) שתי נקודות זו על זו ב-$1\,\text{m}$, נקודות ב-2, 3 ו-4 מטרים, נקודה נוספת על הנקודה ב-$4\,\text{m}$, ובשורה נפרדת
      נקודות ב-2 מטרים (שתיים, זו על זו).

      (ג) ב-$t = 3\,\text{s}$ וב-$t = 5.5\,\text{s}$.

      (ד) 5, 5, 4, 3, 2, 2, 4, 4 מטרים ב-0 עד 7 שניות; הגרף מתהפך (המקום החדש הוא $6 - x$), והזמנים לא משתנים.
    solution:
      - kind: reasoning
        text: >-
          (א) עד $t = 1\,\text{s}$ $x = 1\,\text{m}$ קבוע: קו אופקי, עומדת. מ-1 עד 4 שניות $x$ גדל ב-$0.5\,\text{m}$ בכל חצי
          שנייה, כלומר מטר בכל שנייה: קו ישר עולה, מתרחקת. מ-4 עד 5 שניות $x = 4\,\text{m}$: עומדת. מ-5 עד 6 שניות $x$
          קטן מ-4 ל-2: קו ישר יורד, תלול פי 2 מהעלייה, מתקרבת 2 מטרים בכל שנייה. מ-6 שניות $x = 2\,\text{m}$: עומדת.
      - kind: reasoning
        text: >-
          (ב) במקומות ב-0, 1, 2, ..., 7 שניות: 1, 1, 2, 3, 4, 4, 2, 2 מטרים. נקודות שנופלות על אותו מקום נערמות, ואת שתי
          הנקודות של החזרה (ב-$2\,\text{m}$) מציירים בשורה נפרדת, כי הן נופלות ליד נקודת ההליכה ב-$2\,\text{m}$.
      - kind: reasoning
        text: >-
          (ג) קו אופקי בגובה $3\,\text{m}$ חותך את הגרף פעמיים. בהליכה הלוך, מהטבלה: $t = 3\,\text{s}$. בהליכה חזרה, $x$
          יורד מ-4 ל-2 בין 5 ל-6 שניות, וגובה 3 נמצא באמצע: $t = 5.5\,\text{s}$, כמו בטבלה.
      - kind: manipulation
        text: >-
          (ד) החיישן החדש נמצא $6\,\text{m}$ מהישן, והכיוון החיובי שלו הפוך. המקום החדש של התלמידה הוא המרחק שלה ממנו:
          $$x' = 6 - x$$
      - kind: substitution
        text: >-
          (ד) $$\begin{array}{c|cccccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 & 6 & 7 \\ \hline x'\ (\text{m}) & 5 & 5 & 4 & 3 & 2 & 2 & 4 & 4 \end{array}$$
      - kind: result
        text: >-
          (ג) ב-$t = 3\,\text{s}$ וב-$t = 5.5\,\text{s}$. (ד) הגרף החדש הוא תמונת ראי של הקודם: יורד היכן שהקודם עלה ועולה
          היכן שירד. הקטעים האופקיים והרגעים של כל שינוי נשארים אותו דבר.

  - id: W-1.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      המקום של גוף לאורך ציר נתון בביטוי $x(t) = t^2 - 6t + 8$, כש-$x$ במטרים ו-$t$ בשניות, עבור $0 \le t \le 6\,\text{s}$.

      (א) בנו טבלה של המקום בכל שנייה שלמה, ושרטטו את גרף המקום-זמן.

      (ב) מתי הגוף בראשית?

      (ג) מתי הוא מחליף כיוון, ובאיזה מקום? לאיזה כיוון הוא נע לפני הרגע הזה ואחריו?

      (ד) תלמיד אומר: "הגוף נע בתוך עמק: יורד לתחתית ועולה בצד השני." קבעו ונמקו אם הוא צודק.

      (ה) מה משתנה אם מזיזים את הראשית לנקודה שבה הגוף היה ב-$t = 0$, בלי לשנות את הכיוון החיובי? מתי הגוף בראשית
      החדשה?
    answer: >-
      (א) במטרים, ב-0 עד 6 שניות: $x = 8,\ 3,\ 0,\ -1,\ 0,\ 3,\ 8$; קשת הפוכה (שקע) עם תחתית ב-$(3\,\text{s},\ -1\,\text{m})$.

      (ב) ב-$t = 2\,\text{s}$ וב-$t = 4\,\text{s}$.

      (ג) ב-$t = 3\,\text{s}$, ב-$x = -1\,\text{m}$; לפני: בכיוון השלילי; אחרי: בכיוון החיובי.

      (ד) לא צודק: הגוף נע על קו ישר, הלוך ושוב; השקע הוא בגרף, לא במסלול.

      (ה) כל המקומות קטנים ב-$8\,\text{m}$ והגרף יורד 8 מטרים; הגוף בראשית החדשה ב-$t = 0$ וב-$t = 6\,\text{s}$.
    solution:
      - kind: formula
        text: >-
          מציבים כל רגע. למשל $x(3) = 9 - 18 + 8 = -1\,\text{m}$.
      - kind: substitution
        text: >-
          (א) $$\begin{array}{c|ccccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline x\ (\text{m}) & 8 & 3 & 0 & -1 & 0 & 3 & 8 \end{array}$$
          הגרף יורד מ-$x = 8\,\text{m}$ עד $x = -1\,\text{m}$ ועולה בחזרה ל-$x = 8\,\text{m}$, סימטרי סביב $t = 3\,\text{s}$, ומעוגל בתחתית.
      - kind: reasoning
        text: >-
          (ב) בראשית $x = 0$: מהטבלה ב-$t = 2\,\text{s}$ וב-$t = 4\,\text{s}$. בדיקה: $x(2) = 4 - 12 + 8 = 0$, ו-$x(4) = 16 - 24 + 8 = 0$.
      - kind: reasoning
        text: >-
          (ג) עד $t = 3\,\text{s}$ $x$ קטן (עד $x = -1\,\text{m}$): תנועה בכיוון השלילי. אחרי $t = 3\,\text{s}$ $x$ גדל: תנועה בכיוון
          החיובי. ההחלפה ב-$t = 3\,\text{s}$, בתחתית הגרף, ב-$x = -1\,\text{m}$. (הטבלה סימטרית סביב $t = 3\,\text{s}$:
          $x(2) = x(4)$, $x(1) = x(5)$, ולכן התחתית בדיוק שם.)
      - kind: reasoning
        text: >-
          (ד) הגרף נראה כמו עמק, אבל הציר האופקי שלו הוא הזמן. הגוף נע לאורך ציר אחד: הולך בכיוון השלילי עד
          $x = -1\,\text{m}$, מסתובב וחוזר. התלמיד קרא את הגרף כאילו הוא ציור של המסלול.
      - kind: manipulation
        text: >-
          (ה) בראשית החדשה, שנמצאת ב-$x = 8\,\text{m}$ של הציר הישן, המקום החדש הוא $x' = x - 8 = t^2 - 6t$. הגוף בראשית
          החדשה כש-$x' = 0$, כלומר כש-$x = 8\,\text{m}$: בטבלה, ב-$t = 0$ וב-$t = 6\,\text{s}$.
      - kind: result
        text: >-
          (ב) 2 ו-4 שניות. (ג) ב-$t = 3\,\text{s}$, ב-$x = -1\,\text{m}$, משלילי לחיובי. (ד) לא צודק. (ה) הגרף יורד 8 מטרים
          ושומר על צורתו; בראשית החדשה ב-$t = 0$ וב-$t = 6\,\text{s}$.

  - id: W-1.2-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.2-1, OBJ-1.2-3]
    prompt: >-
      נועה הולכת מהבית לקיוסק, $300\,\text{m}$ לאורך רחוב ישר, ב-200 שניות, ובכל שנייה היא עוברת אותו מספר מטרים.
      בקיוסק היא מחכה 100 שניות. בדרך חזרה היא הולכת מהר, 2 מטרים בכל שנייה, במשך 75 שניות. אז היא פוגשת חברה, ועומדת
      לדבר איתה 75 שניות. משם היא הולכת הביתה לאט, מטר אחד בכל שנייה. הראשית בבית, והכיוון החיובי הוא לכיוון הקיוסק.

      (א) היכן נועה פוגשת את החברה, ובאיזה רגע היא מגיעה הביתה?

      (ב) בנו טבלה של המקום ב-$t = 0, 100, 200, \ldots, 600\,\text{s}$.

      (ג) תארו את גרף המקום-זמן בחמישה קטעים, ולכל קטע אמרו אם הוא עולה, יורד או אופקי, ולמה.

      (ד) מתי נועה נמצאת $225\,\text{m}$ מהבית?
    answer: >-
      (א) ב-$x = 150\,\text{m}$ (ב-$t = 375\,\text{s}$); היא מגיעה הביתה ב-$t = 600\,\text{s}$.

      (ב) 0, 150, 300, 300, 150, 100, 0 מטרים.

      (ג) עולה (0–200), אופקי (200–300), יורד תלול (300–375), אופקי (375–450), יורד מתון (450–600).

      (ד) ב-$t = 150\,\text{s}$ וב-$t = 337.5\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הלוך: $300\,\text{m}$ ב-$200\,\text{s}$, כלומר $300/200 = 1.5$ מטרים בכל שנייה. המתנה 100 שניות. חזרה: 2 מטרים בכל
          שנייה במשך 75 שניות, 75 שניות שיחה, ואז מטר בכל שנייה עד הבית.
      - kind: substitution
        text: >-
          (א) החזרה מתחילה ב-$t = 300\,\text{s}$, ב-$x = 300\,\text{m}$. בקטע המהיר $x$ קטן ב-2 מטרים בכל שנייה, במשך 75
          שניות: $x = 300 - 2\cdot75 = 150\,\text{m}$. שם היא פוגשת את החברה, ב-$t = 300 + 75 = 375\,\text{s}$.
      - kind: substitution
        text: >-
          (א) השיחה נגמרת ב-$t = 375 + 75 = 450\,\text{s}$. נשארו לה $150\,\text{m}$ עד הבית, מטר אחד בכל שנייה, כלומר
          $150\,\text{s}$. היא מגיעה הביתה ב-$t = 450 + 150 = 600\,\text{s}$.
      - kind: substitution
        text: >-
          (ב) $$\begin{array}{c|ccccccc} t\ (\text{s}) & 0 & 100 & 200 & 300 & 400 & 500 & 600 \\ \hline x\ (\text{m}) & 0 & 150 & 300 & 300 & 150 & 100 & 0 \end{array}$$
          (ב-$t = 400\,\text{s}$ היא בשיחה, ב-$150\,\text{m}$; ב-$t = 500\,\text{s}$ עברו 50 שניות של הליכה איטית:
          $150 - 50 = 100\,\text{m}$.)
      - kind: reasoning
        text: >-
          (ג) 0–200 שניות: עולה, $x$ גדל, הולכת לכיוון הקיוסק. 200–300: אופקי, מחכה. 300–375: יורד, ותלול יותר מהעלייה,
          כי 2 מטרים בכל שנייה זה יותר מ-1.5. 375–450: אופקי, משוחחת. 450–600: יורד, ופחות תלול מכל הקטעים האחרים, מטר
          בכל שנייה.
      - kind: substitution
        text: >-
          (ד) בדרך הלוך: $225/1.5 = 150\,\text{s}$. בדרך חזרה, בקטע המהיר: מ-300 ל-225 מטרים יש 75 מטרים, ב-2 מטרים בכל
          שנייה: $37.5\,\text{s}$ אחרי $t = 300\,\text{s}$, כלומר $t = 337.5\,\text{s}$.
      - kind: result
        text: >-
          (א) $150\,\text{m}$ מהבית, ב-$t = 375\,\text{s}$; בבית ב-$t = 600\,\text{s}$. (ב) הטבלה שלמעלה. (ג) עולה, אופקי, יורד תלול, אופקי, יורד מתון.
          (ד) ב-$t = 150\,\text{s}$ וב-$t = 337.5\,\text{s}$.

