# Workbook for lesson 1.9: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/vec.ts (add, sub, len, angle) and src/physics/toolbox.ts
# (sinDeg, cosDeg, angleFromLegs). Axes: x east, y north (or up), stated in each solution.

lesson: '1.9'
practice:
  - id: W-1.9-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.9-1]
    prompt: >-
      שני מטיילים יוצאים מאותו חניון. דנה הולכת $2\,\text{km}$ מזרחה ואחר כך $3\,\text{km}$ צפונה. יואב הולך קודם $3\,\text{km}$ צפונה ואחר כך $2\,\text{km}$ מזרחה.

      (א) האם הם מגיעים לאותה נקודה? נמקו בעזרת שרטוט ראש לזנב.

      (ב) מה הגודל של ההעתק של כל אחד, ומה הדרך שעבר?
    answer: >-
      (א) כן: הסדר לא משנה את הסכום הווקטורי.

      (ב) לשניהם העתק של כ-$3.6\,\text{km}$, בזווית של כ-$56^\circ$ מכיוון מזרח לכיוון צפון, ודרך של $5\,\text{km}$.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $\vec A = (2, 0)\,\text{km}$ ו-$\vec B = (0, 3)\,\text{km}$. דנה עוברת $\vec A + \vec B$, ויואב $\vec B + \vec A$.
      - kind: reasoning
        text: >-
          בשרטוט, שני המסלולים הם שתי הצלעות של אותה מקבילית (כאן מלבן), משני צדי האלכסון. שניהם מסתיימים בקצה האלכסון, ולכן $\vec A + \vec B = \vec B + \vec A$. גם ברכיבים: $(2 + 0,\ 0 + 3) = (0 + 2,\ 3 + 0)$.
      - kind: formula
        text: >-
          $|\vec R| = \sqrt{R_x^2 + R_y^2}$ ו-$\tan\theta = R_y / R_x$.
      - kind: substitution
        text: >-
          $|\vec R| = \sqrt{2^2 + 3^2} = \sqrt{13} \approx 3.6\,\text{km}$, ו-$\tan\theta = 3/2 = 1.5$, ולכן $\theta \approx 56^\circ$.
      - kind: result
        text: >-
          (א) כן, לאותה נקודה. (ב) לשניהם העתק של כ-$3.6\,\text{km}$, בזווית של כ-$56^\circ$ מכיוון מזרח לכיוון צפון. הדרך של כל אחד $2 + 3 = 5\,\text{km}$, ארוכה מגודל ההעתק.

  - id: W-1.9-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.9-2]
    prompt: >-
      רחפן טס $250\,\text{m}$ בקו ישר, בזווית של $40^\circ$ מכיוון מזרח לכיוון צפון. כמה מטרים הוא התקדם מזרחה, וכמה צפונה?
    answer: >-
      כ-$192\,\text{m}$ מזרחה וכ-$161\,\text{m}$ צפונה
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $|\Delta\vec r| = 250\,\text{m}$, והזווית $\theta = 40^\circ$ נמדדת מציר x.
      - kind: formula
        text: >-
          הזווית נמדדת מציר x, ולכן $\Delta x = |\Delta\vec r|\cos\theta$ ו-$\Delta y = |\Delta\vec r|\sin\theta$.
      - kind: substitution
        text: >-
          $\Delta x = 250 \cdot \cos 40^\circ \approx 250 \cdot 0.766 \approx 192\,\text{m}$, ו-$\Delta y = 250 \cdot \sin 40^\circ \approx 250 \cdot 0.643 \approx 161\,\text{m}$.
      - kind: result
        text: >-
          כ-$192\,\text{m}$ מזרחה וכ-$161\,\text{m}$ צפונה. בדיקה: $\sqrt{192^2 + 161^2} \approx 250\,\text{m}$, וכל רכיב קטן מ-$250\,\text{m}$.

  - id: W-1.9-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.9-3]
    prompt: >-
      שחיין שוחה במהירות של $1.2\,\text{m/s}$ ביחס למים, ישר אל הגדה שממול. מי הנחל זורמים במהירות של $0.5\,\text{m/s}$ לאורך הגדה.
      מה גודל המהירות של השחיין ביחס לגדה, ובאיזו זווית היא נוטה מהכיוון הניצב לגדה?
    answer: >-
      $1.3\,\text{m/s}$, בזווית של כ-$23^\circ$ מהכיוון הניצב לגדה לכיוון הזרם
    solution:
      - kind: given
        text: >-
          ציר x לאורך הגדה, בכיוון הזרם, וציר y ניצב לה. נסמן את השחיין באות S ואת המים באות M: $\vec v_{SM} = (0, 1.2)\,\text{m/s}$ (השחיין ביחס למים) ו-$\vec v_M = (0.5, 0)\,\text{m/s}$ (המים ביחס לגדה).
      - kind: formula
        text: >-
          $\vec v_S = \vec v_{SM} + \vec v_M$ ו-$|\vec v_S| = \sqrt{v_x^2 + v_y^2}$. הזווית $\alpha$ נמדדת מהכיוון הניצב לגדה (ציר y), ולכן הניצב שמולה הוא $v_x$: $\tan\alpha = v_x / v_y$.
      - kind: substitution
        text: >-
          $\vec v_S = (0.5, 1.2)\,\text{m/s}$, $|\vec v_S| = \sqrt{0.25 + 1.44} = \sqrt{1.69} = 1.3\,\text{m/s}$, ו-$\tan\alpha = 0.5/1.2 \approx 0.417$, ולכן $\alpha \approx 23^\circ$.
      - kind: result
        text: >-
          $1.3\,\text{m/s}$ ביחס לגדה, בזווית של כ-$23^\circ$ מהכיוון הניצב לגדה לכיוון הזרם.

  - id: W-1.9-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.9-1]
    prompt: >-
      מכונית נוסעת במהירות של $20\,\text{m/s}$ מזרחה.

      (א) היא מסתובבת בפניית פרסה, ונוסעת $20\,\text{m/s}$ מערבה. מה השינוי במהירות שלה, $\Delta\vec v = \vec v_2 - \vec v_1$?

      (ב) במקום זה היא פונה שמאלה בצומת, ונוסעת $20\,\text{m/s}$ צפונה. מה השינוי במהירות עכשיו?

      (ג) חבר טוען: "גודל המהירות לא השתנה, אז המהירות לא השתנתה." קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) $40\,\text{m/s}$ מערבה.

      (ב) כ-$28\,\text{m/s}$, לכיוון צפון-מערב.

      (ג) הוא טועה: הכיוון השתנה, ולכן המהירות השתנתה.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $\vec v_1 = (20, 0)\,\text{m/s}$.
      - kind: formula
        text: >-
          $\Delta\vec v = \vec v_2 - \vec v_1 = \vec v_2 + (-\vec v_1)$, רכיב לרכיב.
      - kind: substitution
        text: >-
          (א) $\vec v_2 = (-20, 0)$: $\Delta\vec v = (-20 - 20,\ 0) = (-40, 0)\,\text{m/s}$.
          (ב) $\vec v_2 = (0, 20)$: $\Delta\vec v = (0 - 20,\ 20 - 0) = (-20, 20)\,\text{m/s}$, וגודלו $\sqrt{20^2 + 20^2} \approx 28\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ג) מהירות היא וקטור. שני וקטורים שווים רק אם יש להם אותו גודל **ואותו כיוון**. בשני המקרים הגודל נשאר $20\,\text{m/s}$, אבל הכיוון השתנה, ולכן $\Delta\vec v \ne 0$. ההפרש בין הגדלים, $20 - 20 = 0$, אינו הגודל של ההפרש בין הווקטורים.
      - kind: result
        text: >-
          (א) $40\,\text{m/s}$ מערבה. (ב) כ-$28\,\text{m/s}$, לכיוון צפון-מערב ($45^\circ$ מכיוון מערב לכיוון צפון). (ג) הוא טועה: המהירות השתנתה, למרות שגודלה לא השתנה.

  - id: W-1.9-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.9-2]
    prompt: >-
      ההעתק של כלב שרץ בפארק הוא $\Delta\vec r = (-120, 50)\,\text{m}$ (ציר x מזרחה, ציר y צפונה).
      מצאו את גודל ההעתק ואת הכיוון שלו. מה יראה המחשבון אם תקישו $\tan^{-1}(50 / (-120))$, ואיך מתקנים את זה?
    answer: >-
      $130\,\text{m}$, בזווית של כ-$23^\circ$ מכיוון מערב לכיוון צפון. המחשבון יראה כ-$-23^\circ$.
    solution:
      - kind: given
        text: >-
          $\Delta x = -120\,\text{m}$ (מערבה) ו-$\Delta y = 50\,\text{m}$ (צפונה). הווקטור פונה מערבה וצפונה.
      - kind: formula
        text: >-
          $|\Delta\vec r| = \sqrt{\Delta x^2 + \Delta y^2}$. החץ פונה שמאלה, ולכן הזווית החדה נמדדת מהחלק השלילי של ציר x (מערב), בעזרת הגדלים של הרכיבים: $\tan\alpha = |\Delta y| / |\Delta x|$.
      - kind: substitution
        text: >-
          $|\Delta\vec r| = \sqrt{120^2 + 50^2} = \sqrt{16900} = 130\,\text{m}$, ו-$\tan\alpha = 50/120 \approx 0.417$, ולכן $\alpha \approx 23^\circ$.
      - kind: reasoning
        text: >-
          המחשבון רואה רק את המנה $50/(-120) \approx -0.417$ ונותן כ-$-23^\circ$, כלומר מזרחה ודרומה. זה הכיוון ההפוך בדיוק. מהשרטוט (רכיב x שלילי, רכיב y חיובי) יודעים שהחץ פונה מערבה וצפונה.
      - kind: result
        text: >-
          $130\,\text{m}$, בזווית של כ-$23^\circ$ מכיוון מערב לכיוון צפון. המחשבון נותן כ-$-23^\circ$, ואת הצד מתקנים לפי הסימנים של הרכיבים.

  - id: W-1.9-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.9-3]
    prompt: >-
      מטיילת הולכת $3\,\text{km}$ צפונה, ואחר כך $4\,\text{km}$ בכיוון של $30^\circ$ מכיוון מזרח לכיוון דרום.
      מה ההעתק שלה מנקודת היציאה (גודל וכיוון), ומה הדרך שעברה?
    answer: >-
      כ-$3.6\,\text{km}$, בזווית של כ-$16^\circ$ מכיוון מזרח לכיוון צפון; הדרך $7\,\text{km}$
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $\vec d_1 = (0, 3)\,\text{km}$. הקטע השני נוטה $30^\circ$ מתחת לציר x החיובי, ולכן רכיב ה-y שלו שלילי.
      - kind: formula
        text: >-
          $d_{2x} = 4\cos 30^\circ$, $d_{2y} = -4\sin 30^\circ$, ואחר כך מחברים רכיב לרכיב.
      - kind: substitution
        text: >-
          $\vec d_2 \approx (3.46, -2)\,\text{km}$. $\vec R = (0 + 3.46,\ 3 - 2) = (3.46, 1)\,\text{km}$.
      - kind: substitution
        text: >-
          $|\vec R| = \sqrt{3.46^2 + 1^2} \approx 3.6\,\text{km}$, ו-$\tan\theta = 1/3.46 \approx 0.289$, ולכן $\theta \approx 16^\circ$.
      - kind: result
        text: >-
          ההעתק כ-$3.6\,\text{km}$, בזווית של כ-$16^\circ$ מכיוון מזרח לכיוון צפון. הדרך היא $3 + 4 = 7\,\text{km}$.

  - id: W-1.9-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.9-2]
    prompt: >-
      ספינה שטה $50\,\text{km}$ בכיוון של $30^\circ$ מכיוון צפון לכיוון מזרח (כך מודדים כיוונים בניווט: מהצפון).

      (א) קבעו בלי חישוב: האם הספינה התקדמה יותר צפונה או יותר מזרחה? נמקו.

      (ב) חשבו כמה היא התקדמה בכל כיוון.
    answer: >-
      (א) יותר צפונה.

      (ב) כ-$43\,\text{km}$ צפונה ו-$25\,\text{km}$ מזרחה.
    solution:
      - kind: reasoning
        text: >-
          (א) הזווית נמדדת מהצפון, והיא קטנה מ-$45^\circ$. לכן החץ קרוב יותר לכיוון צפון, והרכיב הצפוני גדול יותר.
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $|\vec d| = 50\,\text{km}$, והזווית $30^\circ$ נמדדת מציר **y**.
      - kind: formula
        text: >-
          הרכיב הצפוני צמוד לזווית ומקבל $\cos$: $d_y = |\vec d|\cos 30^\circ$. הרכיב המזרחי מול הזווית ומקבל $\sin$: $d_x = |\vec d|\sin 30^\circ$.
      - kind: substitution
        text: >-
          $d_y = 50 \cdot 0.866 \approx 43\,\text{km}$ ו-$d_x = 50 \cdot 0.5 = 25\,\text{km}$.
      - kind: result
        text: >-
          (א) יותר צפונה. (ב) כ-$43\,\text{km}$ צפונה ו-$25\,\text{km}$ מזרחה. מי שכותב "x מקבל cos" יקבל את ההפך, וזה סותר את ההחלטה מסעיף (א).

  - id: W-1.9-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      מטוס טס במהירות של $250\,\text{m/s}$ ביחס לאוויר. רוח נושבת לכיוון מזרח במהירות של $50\,\text{m/s}$ ביחס לקרקע. הטייס רוצה להגיע לעיר שנמצאת $600\,\text{km}$ צפונה, בקו ישר.

      (א) לאיזה כיוון צריך הטייס לכוון את חרטום המטוס?

      (ב) מה גודל המהירות של המטוס ביחס לקרקע? בטאו אותו באמצעות המהירות ביחס לאוויר $v$ ומהירות הרוח $w$, ואחר כך הציבו.

      (ג) כמה זמן נמשכת הטיסה? בכמה שניות היא ארוכה יותר מאשר ביום בלי רוח?
    answer: >-
      (א) כ-$11.5^\circ$ מכיוון צפון לכיוון מערב.

      (ב) $\sqrt{v^2 - w^2} \approx 245\,\text{m/s}$.

      (ג) כ-$2450\,\text{s}$ (כ-$41$ דקות), כ-$49\,\text{s}$ יותר.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. נסמן את המטוס באות M ואת האוויר באות A. מהירות הרוח $\vec v_A = (50, 0)\,\text{m/s}$, וגודלה $w$. המהירות של המטוס ביחס לאוויר היא $\vec v_{MA}$, שגודלה $v = 250\,\text{m/s}$, והמהירות ביחס לקרקע $\vec v_M = \vec v_{MA} + \vec v_A$.
      - kind: reasoning
        text: >-
          כדי לטוס צפונה בקו ישר, ל-$\vec v_M$ אסור שיהיה רכיב x. לכן רכיב ה-x של $\vec v_{MA}$ ועוד $50\,\text{m/s}$ צריך לתת אפס: רכיב ה-x של $\vec v_{MA}$ הוא $-50\,\text{m/s}$. החרטום צריך לנטות מערבה, נגד הרוח.
      - kind: formula
        text: >-
          אם $\varphi$ היא הזווית של החרטום מהצפון, הרכיב המערבי של $\vec v_{MA}$ מול הזווית: $v\sin\varphi = w$. המהירות ביחס לקרקע היא רק הרכיב הצפוני של $\vec v_{MA}$, ומפיתגורס: $|\vec v_M| = \sqrt{v^2 - w^2}$.
      - kind: substitution
        text: >-
          $\sin\varphi = 50/250 = 0.2$, ולכן $\varphi \approx 11.5^\circ$. $|\vec v_M| = \sqrt{250^2 - 50^2} = \sqrt{60000} \approx 245\,\text{m/s}$.
      - kind: substitution
        text: >-
          $\Delta t = 600\,000\,\text{m} / 244.9\,\text{m/s} \approx 2450\,\text{s}$. בלי רוח: $600\,000 / 250 = 2400\,\text{s}$. ההפרש כ-$49\,\text{s}$.
      - kind: result
        text: >-
          (א) כ-$11.5^\circ$ מכיוון צפון לכיוון מערב. (ב) $|\vec v_M| = \sqrt{v^2 - w^2} \approx 245\,\text{m/s}$. (ג) כ-$2450\,\text{s}$, כ-$41$ דקות, ארוכה בכ-$49\,\text{s}$ מטיסה בלי רוח: חלק מהמהירות "מבוזבז" על ביטול הרוח.

  - id: W-1.9-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      רחפן משלוחים יוצא מהמחסן וטס $300\,\text{m}$ בכיוון של $30^\circ$ מכיוון מזרח לכיוון צפון. היעד שלו נמצא $500\,\text{m}$ צפונית למחסן, בדיוק.

      (א) מה צריך להיות ההעתק של הקטע השני (גודל וכיוון)?

      (ב) מה הדרך הכוללת של הרחפן, ופי כמה היא ארוכה מגודל ההעתק הכולל?
    answer: >-
      (א) כ-$436\,\text{m}$, בזווית של כ-$53^\circ$ מכיוון מערב לכיוון צפון.

      (ב) כ-$736\,\text{m}$, פי $1.5$ בערך מ-$500\,\text{m}$.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $\vec d_1 = (300\cos 30^\circ,\ 300\sin 30^\circ) \approx (259.8, 150)\,\text{m}$, וההעתק הכולל $\vec R = (0, 500)\,\text{m}$.
      - kind: formula
        text: >-
          $\vec d_1 + \vec d_2 = \vec R$, ולכן $\vec d_2 = \vec R - \vec d_1$, רכיב לרכיב.
      - kind: substitution
        text: >-
          $\vec d_2 = (0 - 259.8,\ 500 - 150) = (-259.8, 350)\,\text{m}$. $|\vec d_2| = \sqrt{259.8^2 + 350^2} \approx 436\,\text{m}$, ו-$\tan\alpha = 350/259.8 \approx 1.35$, ולכן $\alpha \approx 53^\circ$ מציר x השלילי.
      - kind: substitution
        text: >-
          (ב) הדרך: $300 + 436 \approx 736\,\text{m}$, ו-$736/500 \approx 1.5$.
      - kind: result
        text: >-
          (א) כ-$436\,\text{m}$, בזווית של כ-$53^\circ$ מכיוון מערב לכיוון צפון (רכיב x שלילי, רכיב y חיובי). (ב) כ-$736\,\text{m}$, פי $1.5$ בערך מגודל ההעתק.

  - id: W-1.9-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.9-1, OBJ-1.9-3]
    prompt: >-
      ספינה A שטה צפונה במהירות של $9\,\text{m/s}$, וספינה B שטה מזרחה במהירות של $12\,\text{m/s}$, שתיהן ביחס למים השקטים.

      (א) מה המהירות של A ביחס ל-B (גודל וכיוון)? זו המהירות שרואה נוסע על B.

      (ב) מה המהירות של B ביחס ל-A? קבעו בלי חישוב חדש, ונמקו.

      (ג) מה משתנה במהירות היחסית אם שתי הספינות מכפילות את מהירותן?
    answer: >-
      (א) $15\,\text{m/s}$, בזווית של כ-$37^\circ$ מכיוון מערב לכיוון צפון.

      (ב) $15\,\text{m/s}$ בכיוון ההפוך: כ-$37^\circ$ מכיוון מזרח לכיוון דרום.

      (ג) הגודל גדל פי 2, ל-$30\,\text{m/s}$, והכיוון לא משתנה.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. $\vec v_A = (0, 9)\,\text{m/s}$ ו-$\vec v_B = (12, 0)\,\text{m/s}$.
      - kind: formula
        text: >-
          המהירות של A ביחס ל-B: $\vec v_{AB} = \vec v_A - \vec v_B$ (שיעור 1.4, הפעם בווקטורים).
      - kind: substitution
        text: >-
          $\vec v_{AB} = (0 - 12,\ 9 - 0) = (-12, 9)\,\text{m/s}$, $|\vec v_{AB}| = \sqrt{144 + 81} = 15\,\text{m/s}$, ו-$\tan\alpha = 9/12 = 0.75$, ולכן $\alpha \approx 37^\circ$ מציר x השלילי.
      - kind: reasoning
        text: >-
          (ב) $\vec v_{BA} = \vec v_B - \vec v_A = -(\vec v_A - \vec v_B) = -\vec v_{AB}$: אותו גודל, כיוון הפוך.
      - kind: reasoning
        text: >-
          (ג) כפל של שתי המהירויות ב-2 מכפיל כל רכיב ב-2, ולכן גם את ההפרש: $2\vec v_A - 2\vec v_B = 2\vec v_{AB}$. כפל במספר חיובי משנה רק את האורך, לא את הכיוון.
      - kind: result
        text: >-
          (א) $15\,\text{m/s}$, כ-$37^\circ$ מכיוון מערב לכיוון צפון. (ב) $15\,\text{m/s}$, כ-$37^\circ$ מכיוון מזרח לכיוון דרום. (ג) $30\,\text{m/s}$, באותו כיוון כמו ב-(א).

challenge:
  - id: W-1.9-c1
    stars: 1
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      חותרת רוצה לחצות נהר אל הנקודה שנמצאת בדיוק מול נקודת היציאה שלה, בגדה השנייה. רוחב הנהר $100\,\text{m}$,
      והיא רוצה לחצות אותו בקו ישר תוך $10\,\text{s}$. המים זורמים לאורך הגדות במהירות של $7.5\,\text{m/s}$.

      (א) באיזו מהירות, ביחס למים, עליה לחתור, ובאיזה כיוון?

      (ב) חותרת אחרת יכולה לחתור לכל היותר $7\,\text{m/s}$ ביחס למים. האם היא יכולה להגיע לנקודה שמולה, בזמן כלשהו? נמקו.
    answer: >-
      (א) $12.5\,\text{m/s}$, בזווית של כ-$53^\circ$ מהכיוון שנגד הזרם לכיוון הגדה השנייה.

      (ב) לא.
    solution:
      - kind: given
        text: >-
          ציר x לאורך הגדה, בכיוון הזרם, וציר y ניצב לה, אל הגדה השנייה. נסמן את הסירה באות S ואת המים באות M. מהירות המים ביחס לגדה $\vec v_M = (7.5, 0)\,\text{m/s}$.
      - kind: reasoning
        text: >-
          כדי לנוע בקו ישר אל הנקודה שממול, המהירות ביחס לגדה צריכה להיות ניצבת לגדה: $\vec v_S = (0,\ 100/10) = (0, 10)\,\text{m/s}$.
      - kind: formula
        text: >-
          $\vec v_S = \vec v_{SM} + \vec v_M$, ולכן המהירות ביחס למים היא $\vec v_{SM} = \vec v_S - \vec v_M$.
      - kind: substitution
        text: >-
          $\vec v_{SM} = (0 - 7.5,\ 10 - 0) = (-7.5, 10)\,\text{m/s}$, ו-$|\vec v_{SM}| = \sqrt{7.5^2 + 10^2} = \sqrt{156.25} = 12.5\,\text{m/s}$.
      - kind: reasoning
        text: >-
          רכיב x שלילי ורכיב y חיובי: החץ פונה נגד הזרם ואל הגדה השנייה. הזווית החדה בינו לבין הגדה (ציר x): $\tan\alpha = 10/7.5$, ולכן $\alpha \approx 53^\circ$.
      - kind: reasoning
        text: >-
          (ב) כדי לא להיסחף, הרכיב נגד הזרם של המהירות ביחס למים חייב להיות $7.5\,\text{m/s}$. רכיב אף פעם לא גדול מגודל הווקטור, ו-$7\,\text{m/s}$ קטן מ-$7.5\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $12.5\,\text{m/s}$ ביחס למים, בזווית של כ-$53^\circ$ מהכיוון שנגד הזרם לכיוון הגדה השנייה.

          (ב) לא: בכל כיוון שתחתור, הזרם יסחוף אותה במורד הנהר.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2016
      problem: 'Section B, Q15'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2016.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-1.9-c2
    stars: 1
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      במגרש ספורט ציר x פונה מזרחה וציר y צפונה. שחקנית Y תופסת את הכדור בראשית הצירים, ורצה מיד במהירות קבועה שרכיביה $(3, 4)\,\text{m/s}$.
      באותו רגע שחקנית X, שעומדת $21\,\text{m}$ מזרחית לראשית, מתחילה לרדוף אחריה: היא רצה בקו ישר, במהירות שגודלה $8.5\,\text{m/s}$,
      בכיוון שנבחר כך שתפגוש את Y.

      (א) מה גודל המהירות של Y?

      (ב) כעבור כמה זמן הן נפגשות?

      (ג) מה ההעתק של Y עד המפגש, ובאיזה כיוון רצה X?
    answer: >-
      (א) $5\,\text{m/s}$.

      (ב) $2\,\text{s}$.

      (ג) $10\,\text{m}$ בזווית של כ-$53^\circ$ מכיוון מזרח לכיוון צפון; X רצה בזווית של כ-$28^\circ$ מכיוון מערב לכיוון צפון.
    solution:
      - kind: substitution
        text: >-
          (א) $|\vec v_Y| = \sqrt{3^2 + 4^2} = 5\,\text{m/s}$.
      - kind: given
        text: >-
          בתנועה קצובה, אחרי זמן $t$ שחקנית Y נמצאת בנקודה $(3t, 4t)$. שחקנית X יוצאת מ-$(21, 0)$, ולכן ההעתק שלה עד המפגש הוא $(3t - 21,\ 4t)$.
      - kind: formula
        text: >-
          X רצה בקו ישר במהירות קבועה, ולכן גודל ההעתק שלה הוא $8.5t$: $(3t - 21)^2 + (4t)^2 = (8.5t)^2$.
      - kind: manipulation
        text: >-
          פותחים סוגריים: $9t^2 - 126t + 441 + 16t^2 = 72.25t^2$. מעבירים הכול לאגף אחד: $47.25t^2 + 126t - 441 = 0$. מחלקים ב-$15.75$: $3t^2 + 8t - 28 = 0$.
      - kind: substitution
        text: >-
          $t = \dfrac{-8 \pm \sqrt{64 + 336}}{6} = \dfrac{-8 \pm 20}{6}$. הפתרון החיובי הוא $t = 2\,\text{s}$ (השני, $-\tfrac{14}{3}\,\text{s}$, לפני תחילת המרדף, ואין לו משמעות כאן).
      - kind: substitution
        text: >-
          (ג) ההעתק של Y: $(6, 8)\,\text{m}$, שגודלו $10\,\text{m}$, ו-$\tan\theta = 8/6$, כלומר $\theta \approx 53^\circ$.
          ההעתק של X: $(6 - 21,\ 8) = (-15, 8)\,\text{m}$, שגודלו $17\,\text{m}$ (בדיקה: $17/2 = 8.5\,\text{m/s}$), ו-$\tan\varphi = 8/15$, כלומר $\varphi \approx 28^\circ$ מציר x השלילי.
      - kind: result
        text: >-
          (א) $5\,\text{m/s}$. (ב) הן נפגשות כעבור $2\,\text{s}$. (ג) Y עברה $10\,\text{m}$, בזווית של כ-$53^\circ$ מכיוון מזרח לכיוון צפון. X רצה $17\,\text{m}$, בזווית של כ-$28^\circ$ מכיוון מערב לכיוון צפון.
    source:
      name: British Physics Olympiad (BPhO) Round 1
      year: 2020
      problem: 'Section 1, Question 1(d)'
      url: https://www.bpho.org.uk/Papers/R1/2020Nov_R1_S1.pdf
      verified: '2026-11-05'
      adapted: true
