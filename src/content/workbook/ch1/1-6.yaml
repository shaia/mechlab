# Workbook for lesson 1.6: ten practice problems and two sourced challenge problems.
# Every number recomputed with constantAcceleration / makeMotion / stateAt / timesAtPosition / stoppingDistance /
# meetings from src/physics/kinematics.ts (script: screens/check-1-6.ts, run with npx tsx).

lesson: '1.6'
practice:
  - id: W-1.6-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.6-1, OBJ-1.6-2]
    prompt: >-
      רוכבת אופניים נוסעת מערבה. הכיוון החיובי הוא מזרחה. מד המהירות שלה מראה $8\,\text{m/s}$ ברגע $t = 0$,
      $6\,\text{m/s}$ ברגע $t = 2\,\text{s}$, ו-$4\,\text{m/s}$ ברגע $t = 4\,\text{s}$.

      (א) מה הסימן של המהירות שלה?

      (ב) מה התאוצה הממוצעת שלה בין $t = 0$ ל-$t = 4\,\text{s}$, עם הסימן?

      (ג) האם היא מאיצה או מאטה? נמקו בעזרת הסימנים.
    answer: >-
      (א) שלילי: $v = -8$, $v = -6$, $v = -4\,\text{m/s}$.

      (ב) $\bar{a} = +1\,\text{m/s}^2$, כלומר מזרחה.

      (ג) מאטה: הסימנים של $v$ ושל $a$ מנוגדים.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי מזרחה, והרוכבת נוסעת מערבה, ולכן כל המהירויות שליליות: $v_1 = -8\,\text{m/s}$ ברגע 0,
          ו-$v_2 = -4\,\text{m/s}$ ברגע $4\,\text{s}$. מד המהירות מראה רק את הגודל, ואת הסימן מוסיפים לפי הציר.
      - kind: formula
        text: '$\bar{a} = \frac{v_2 - v_1}{t_2 - t_1}$'
      - kind: substitution
        text: '$\bar{a} = \frac{-4 - (-8)}{4 - 0} = \frac{4}{4} = +1\,\text{m/s}^2$'
      - kind: reasoning
        text: >-
          המהירות שלילית והתאוצה חיובית: סימנים מנוגדים, ולכן הרוכבת מאטה. וזה מתאים למד המהירות: 8, 6, 4.
      - kind: result
        text: >-
          (א) המהירות שלילית. (ב) $\bar{a} = +1\,\text{m/s}^2$ (מזרחה). (ג) מאטה.

  - id: W-1.6-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.6-1]
    prompt: >-
      מכונית חשמלית מגיעה ממנוחה ל-$90$ קמ״ש ב-$10\,\text{s}$, בתאוצה קבועה.

      (א) מה התאוצה שלה במטרים לשנייה בריבוע?

      (ב) בכמה קמ״ש גדלה המהירות שלה בכל שנייה?

      (ג) מה המהירות שלה אחרי $4\,\text{s}$, ב-$\text{m/s}$?
    answer: >-
      (א) $2.5\,\text{m/s}^2$.

      (ב) 9 קמ״ש בכל שנייה.

      (ג) $10\,\text{m/s}$ (36 קמ״ש).
    solution:
      - kind: given
        text: >-
          $v_0 = 0$, $v = 90$ קמ״ש, כלומר $v = \frac{90}{3.6} = 25\,\text{m/s}$, ו-$t = 10\,\text{s}$. הכיוון החיובי הוא
          כיוון הנסיעה.
      - kind: formula
        text: '$\bar{a} = \frac{\Delta v}{\Delta t}$, ובתאוצה קבועה $v = v_0 + at$.'
      - kind: substitution
        text: >-
          (א) $a = \frac{25 - 0}{10} = 2.5\,\text{m/s}^2$. (ב) $\frac{90}{10} = 9$ קמ״ש בכל שנייה. (ג) $v = 0 + 2.5\cdot 4 = 10\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $2.5\,\text{m/s}^2$. (ב) 9 קמ״ש בכל שנייה, אותה תאוצה ביחידות אחרות. (ג) $10\,\text{m/s}$.

  - id: W-1.6-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.6-3]
    prompt: >-
      רכבת נוסעת במהירות $20\,\text{m/s}$ ומתחילה לבלום בתאוצה קבועה שגודלה $0.50\,\text{m/s}^2$.

      (א) מה המהירות שלה אחרי $30\,\text{s}$?

      (ב) כמה מטרים היא עוברת ב-$30$ השניות האלה?
    answer: >-
      (א) $5.0\,\text{m/s}$, בכיוון הנסיעה.

      (ב) $375\,\text{m}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. $v_0 = +20\,\text{m/s}$, ו-$a = -0.50\,\text{m/s}^2$ (הרכבת מאטה, ולכן הסימן
          הפוך לסימן המהירות). $t = 30\,\text{s}$.
      - kind: formula
        text: '$v = v_0 + at$, ו-$x = x_0 + \frac{v_0 + v}{2}\,t$.'
      - kind: substitution
        text: '(א) $v = 20 + (-0.50)\cdot 30 = 20 - 15 = 5.0\,\text{m/s}$.'
      - kind: substitution
        text: '(ב) $x - x_0 = \frac{20 + 5.0}{2}\cdot 30 = 12.5\cdot 30 = 375\,\text{m}$.'
      - kind: result
        text: '(א) $5.0\,\text{m/s}$. (ב) $375\,\text{m}$.'

  - id: W-1.6-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-1, OBJ-1.6-2]
    prompt: >-
      הכיוון החיובי הוא ימינה. גרף מהירות-זמן של עגלה הוא קו ישר מהנקודה $(0\ \text{s},\ {-6}\ \text{m/s})$ עד
      הנקודה $(6\ \text{s},\ 6\ \text{m/s})$.

      (א) תארו במילים את התנועה של העגלה: לאן היא נעה, מתי היא מאיצה ומתי מאטה.

      (ב) מה התאוצה שלה, והאם היא משתנה במהלך התנועה?

      (ג) תלמיד אומר: "ברגע $t = 3\,\text{s}$ המהירות אפס, ולכן גם התאוצה שם אפס." קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) עד $3\,\text{s}$ העגלה נעה שמאלה ומאטה, ב-$3\,\text{s}$ היא עומדת לרגע, ואחר כך נעה ימינה ומאיצה.

      (ב) $a = +2\,\text{m/s}^2$, קבועה לאורך כל התנועה.

      (ג) לא צודק: גם ברגע הזה $a = +2\,\text{m/s}^2$.
    solution:
      - kind: reasoning
        text: >-
          (א) עד $t = 3\,\text{s}$ הגרף מתחת לציר הזמן: $v < 0$, העגלה נעה שמאלה. הגרף מתקרב לציר, כלומר גודל
          המהירות קטן: היא מאטה. אחרי $3\,\text{s}$ הגרף מעל הציר ומתרחק ממנו: היא נעה ימינה ומאיצה.
      - kind: formula
        text: '(ב) התאוצה היא השיפוע: $a = \frac{\Delta v}{\Delta t}$.'
      - kind: substitution
        text: >-
          $a = \frac{6 - (-6)}{6 - 0} = \frac{12}{6} = +2\,\text{m/s}^2$. הגרף קו ישר, ולכן השיפוע זהה בכל מקום:
          התאוצה קבועה.
      - kind: reasoning
        text: >-
          (ג) ברגע $t = 3\,\text{s}$ הגרף חוצה את ציר הזמן, אבל השיפוע שלו שם הוא אותו שיפוע. שנייה לפני
          $v = -2\,\text{m/s}$ ושנייה אחרי $v = +2\,\text{m/s}$: המהירות משתנה, ולכן יש תאוצה.
      - kind: result
        text: >-
          (א) נעה שמאלה ומאטה, עוצרת ב-$3\,\text{s}$, נעה ימינה ומאיצה. (ב) $a = +2\,\text{m/s}^2$, קבועה. (ג) התלמיד
          טועה: המהירות אפס, אבל התאוצה $+2\,\text{m/s}^2$.

  - id: W-1.6-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.6-3]
    prompt: >-
      מכונית יוצאת ממנוחה בתאוצה קבועה, ועוברת $100\,\text{m}$ ב-$10\,\text{s}$ הראשונות.

      (א) מה התאוצה שלה?

      (ב) מה המהירות שלה בסוף 10 השניות?

      (ג) בדקו את התשובה לסעיף (ב) בעזרת המהירות הממוצעת.
    answer: >-
      (א) $2.0\,\text{m/s}^2$.

      (ב) $20\,\text{m/s}$.

      (ג) המהירות הממוצעת $10\,\text{m/s}$, וזה $\frac{0 + 20}{2}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית בנקודת היציאה. $v_0 = 0$, $x - x_0 = 100\,\text{m}$, $t = 10\,\text{s}$.
      - kind: formula
        text: '$x = x_0 + v_0 t + \frac{1}{2}at^2$, ואחר כך $v = v_0 + at$.'
      - kind: manipulation
        text: 'עם $v_0 = 0$: $x - x_0 = \frac{1}{2}at^2$, ולכן $a = \frac{2(x - x_0)}{t^2}$.'
      - kind: substitution
        text: '(א) $a = \frac{2\cdot 100}{10^2} = 2.0\,\text{m/s}^2$. (ב) $v = 0 + 2.0\cdot 10 = 20\,\text{m/s}$.'
      - kind: reasoning
        text: >-
          (ג) המהירות הממוצעת היא $\frac{100\,\text{m}}{10\,\text{s}} = 10\,\text{m/s}$. בתאוצה קבועה היא גם
          $\frac{v_0 + v}{2} = \frac{0 + 20}{2} = 10\,\text{m/s}$. מתאים.
      - kind: result
        text: '(א) $2.0\,\text{m/s}^2$. (ב) $20\,\text{m/s}$. (ג) שתי הדרכים נותנות $10\,\text{m/s}$.'

  - id: W-1.6-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.6-2, OBJ-1.6-3]
    prompt: >-
      דוחפים עגלה במעלה מסילה משופעת, והיא עוזבת את היד במהירות $6.0\,\text{m/s}$. הכיוון החיובי הוא במעלה
      המסילה, והתאוצה של העגלה קבועה, $a = -2.0\,\text{m/s}^2$.

      (א) כמה זמן העגלה עולה, ועד איזה מרחק מהיד?

      (ב) מתי היא חוזרת לנקודה שבה עזבה את היד, ובאיזו מהירות?

      (ג) באיזה חלק של התנועה היא מאיצה?
    answer: >-
      (א) $3.0\,\text{s}$, עד $9.0\,\text{m}$ במעלה המסילה.

      (ב) ברגע $t = 6.0\,\text{s}$, במהירות $v = -6.0\,\text{m/s}$ (במורד).

      (ג) בדרך למטה, אחרי $t = 3.0\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הראשית בנקודה שבה העגלה עוזבת את היד. $x_0 = 0$, $v_0 = +6.0\,\text{m/s}$, $a = -2.0\,\text{m/s}^2$.
      - kind: formula
        text: '$v = v_0 + at$; $v^2 = v_0^2 + 2a(x - x_0)$; $x = x_0 + v_0 t + \frac{1}{2}at^2$.'
      - kind: substitution
        text: >-
          (א) בנקודה הגבוהה ביותר $v = 0$: $0 = 6.0 - 2.0t$, כלומר $t = 3.0\,\text{s}$. ו-$0 = 6.0^2 + 2(-2.0)(x - 0)$,
          כלומר $x = \frac{36}{4.0} = 9.0\,\text{m}$.
      - kind: manipulation
        text: >-
          (ב) חוזרים ל-$x = 0$: $0 = 6.0t - 1.0t^2 = t\,(6.0 - t)$. הפתרון $t = 0$ הוא רגע העזיבה, והשני $t = 6.0\,\text{s}$.
      - kind: substitution
        text: '$v = 6.0 + (-2.0)\cdot 6.0 = -6.0\,\text{m/s}$: אותו גודל, בכיוון ההפוך.'
      - kind: reasoning
        text: >-
          (ג) עד $3.0\,\text{s}$ $v > 0$ ו-$a < 0$: העגלה מאטה. אחר כך $v < 0$ ו-$a < 0$: אותו סימן, והיא מאיצה במורד.
      - kind: result
        text: >-
          (א) $3.0\,\text{s}$, עד $9.0\,\text{m}$. (ב) אחרי $6.0\,\text{s}$, במהירות $6.0\,\text{m/s}$ במורד. (ג) בדרך למטה.

  - id: W-1.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-3]
    prompt: >-
      במהירות $v$ מרחק הבלימה של מכונית הוא $d$. בכל הסעיפים הבלימה בתאוצה קבועה עד עצירה.

      (א) בטאו באמצעות $d$ את מרחק הבלימה במהירות $3v$, עם אותם בלמים.

      (ב) בכביש רטוב גודל התאוצה בבלימה קטן פי 2. בטאו באמצעות $d$ את מרחק הבלימה במהירות $v$.

      (ג) נהג טוען: "בכביש רטוב אסע לאט פי 2, וכך אבלום באותו מרחק כמו בכביש יבש." קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) $9d$.

      (ב) $2d$.

      (ג) לא בדיוק: הוא יבלום ב-$\frac{1}{2}d$, כלומר הוא נזהר יותר מהנדרש. כדי לבלום ב-$d$ מספיק להאט פי $\sqrt{2}$.
    solution:
      - kind: formula
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. מ-$v^2 = v_0^2 + 2a(x - x_0)$ עם מהירות סופית אפס: מרחק הבלימה הוא
          $\frac{v_0^2}{2|a|}$. נתון $d = \frac{v^2}{2|a|}$.
      - kind: substitution
        text: '(א) $\frac{(3v)^2}{2|a|} = 9\cdot\frac{v^2}{2|a|} = 9d$.'
      - kind: substitution
        text: '(ב) $\frac{v^2}{2\cdot\frac{|a|}{2}} = 2\cdot\frac{v^2}{2|a|} = 2d$.'
      - kind: reasoning
        text: >-
          (ג) בכביש רטוב במהירות $\frac{v}{2}$: $\frac{(v/2)^2}{2\cdot(|a|/2)} = \frac{v^2/4}{|a|} = \frac{1}{2}d$. הנהג
          בולם אפילו במרחק קצר יותר. כדי לבלום בדיוק ב-$d$ צריך $u^2 = \frac{v^2}{2}$, כלומר $u = \frac{v}{\sqrt{2}} \approx 0.71v$.
      - kind: result
        text: >-
          (א) $9d$. (ב) $2d$. (ג) המהירות בריבוע, ולכן האטה פי 2 מקצרת את מרחק הבלימה פי 4, ומפצה על בלמים חלשים פי 2
          ועוד. מספיק להאט לכ-$0.71v$.

  - id: W-1.6-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.6-3]
    prompt: >-
      מכונית נוסעת במהירות $15\,\text{m/s}$. כשהיא נמצאת $30\,\text{m}$ לפני קו העצירה של צומת, הרמזור מתחלף
      לצהוב, והאור הצהוב דולק $3.0\,\text{s}$. זמן התגובה של הנהג $0.60\,\text{s}$, וגודל התאוצה המרבי בבלימה
      $5.0\,\text{m/s}^2$.

      (א) האם הנהג יכול לעצור לפני קו העצירה?

      (ב) אם הנהג ממשיך במהירות קבועה, האם הוא עובר את קו העצירה לפני שהרמזור מתחלף לאדום?

      (ג) מה גודל התאוצה המינימלי שהיה מאפשר לעצור בדיוק על הקו?
    answer: >-
      (א) לא: מרחק העצירה $31.5\,\text{m}$, יותר מ-30.

      (ב) כן: הוא מגיע לקו אחרי $2.0\,\text{s}$, לפני האדום.

      (ג) כ-$5.4\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית במקום שבו הנהג רואה את הצהוב. $v_0 = 15\,\text{m/s}$, $t_r = 0.60\,\text{s}$,
          הקו ב-$x = 30\,\text{m}$.
      - kind: substitution
        text: '(א) בזמן התגובה, במהירות קבועה: $15\cdot 0.60 = 9.0\,\text{m}$.'
      - kind: formula
        text: 'בבלימה, $v^2 = v_0^2 + 2a(x - x_0)$ עם $v = 0$ ו-$a = -5.0\,\text{m/s}^2$.'
      - kind: substitution
        text: >-
          $x - x_0 = \frac{0 - 15^2}{2\cdot(-5.0)} = \frac{225}{10} = 22.5\,\text{m}$. מרחק העצירה $9.0 + 22.5 = 31.5\,\text{m}$, יותר מ-$30\,\text{m}$.
      - kind: substitution
        text: '(ב) $t = \frac{30}{15} = 2.0\,\text{s}$, פחות מ-$3.0\,\text{s}$.'
      - kind: manipulation
        text: >-
          (ג) לבלימה נשארים $30 - 9.0 = 21\,\text{m}$. מ-$0 = v_0^2 - 2|a|\cdot 21$: $|a| = \frac{v_0^2}{2\cdot 21} = \frac{225}{42}$.
      - kind: substitution
        text: '$|a| = \frac{225}{42} \approx 5.4\,\text{m/s}^2$.'
      - kind: result
        text: >-
          (א) לא, מרחק העצירה $31.5\,\text{m}$. (ב) כן, אחרי $2.0\,\text{s}$. (ג) כ-$5.4\,\text{m/s}^2$, יותר ממה שהבלמים
          מאפשרים. במצב כזה עדיף להמשיך.

  - id: W-1.6-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      רכבת קלה יוצאת ממנוחה מתחנה. היא מאיצה בתאוצה קבועה של $1.2\,\text{m/s}^2$ במשך $15\,\text{s}$, נוסעת
      במהירות קבועה $40\,\text{s}$, ובולמת בתאוצה קבועה עד שהיא נעצרת בתחנה הבאה, $12\,\text{s}$ אחרי תחילת הבלימה.

      (א) מה המהירות המרבית של הרכבת?

      (ב) מה התאוצה שלה בזמן הבלימה, עם הסימן?

      (ג) מה המרחק בין התחנות?

      (ד) מה המהירות הממוצעת של הרכבת בין התחנות?

      (ה) תארו את גרף מהירות-זמן של הנסיעה.
    answer: >-
      (א) $18\,\text{m/s}$.

      (ב) $a = -1.5\,\text{m/s}^2$.

      (ג) $963\,\text{m}$.

      (ד) כ-$14\,\text{m/s}$.

      (ה) קו עולה מ-0 ל-18 ב-15 שניות, קו אופקי עד 55 שניות, וקו יורד עד 0 ב-67 שניות.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית בתחנה הראשונה. שלב 1: $v_0 = 0$, $a_1 = 1.2\,\text{m/s}^2$,
          $t_1 = 15\,\text{s}$. שלב 2: $t_2 = 40\,\text{s}$. שלב 3: $t_3 = 12\,\text{s}$ עד עצירה.
      - kind: substitution
        text: '(א) $v = v_0 + a_1 t_1 = 0 + 1.2\cdot 15 = 18\,\text{m/s}$.'
      - kind: substitution
        text: '(ב) $a_3 = \frac{0 - 18}{12} = -1.5\,\text{m/s}^2$.'
      - kind: formula
        text: 'בכל שלב, $x - x_0 = \frac{v_0 + v}{2}\,t$.'
      - kind: substitution
        text: >-
          (ג) שלב 1: $\frac{0 + 18}{2}\cdot 15 = 135\,\text{m}$. שלב 2: $18\cdot 40 = 720\,\text{m}$. שלב 3:
          $\frac{18 + 0}{2}\cdot 12 = 108\,\text{m}$. סך הכול $135 + 720 + 108 = 963\,\text{m}$.
      - kind: substitution
        text: '(ד) $\bar{v} = \frac{963}{15 + 40 + 12} = \frac{963}{67} \approx 14.4\,\text{m/s}$.'
      - kind: reasoning
        text: >-
          (ה) בשלב 1 קו ישר עולה, בשיפוע $1.2$. בשלב 2 קו אופקי בגובה 18. בשלב 3 קו ישר יורד, בשיפוע $-1.5$,
          עד ציר הזמן ברגע $67\,\text{s}$. השטח מתחת לגרף, טרפז, הוא $963\,\text{m}$.
      - kind: result
        text: >-
          (א) $18\,\text{m/s}$. (ב) $-1.5\,\text{m/s}^2$. (ג) $963\,\text{m}$. (ד) כ-$14\,\text{m/s}$. (ה) טרפז: עלייה,
          קו אופקי, ירידה.

  - id: W-1.6-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.6-2, OBJ-1.6-3]
    prompt: >-
      רץ רץ במהירות קבועה של $5.0\,\text{m/s}$ כדי לתפוס אוטובוס. כשהוא נמצא $12\,\text{m}$ מאחורי הדלת, האוטובוס
      יוצא ממנוחה בתאוצה קבועה של $1.0\,\text{m/s}^2$.

      (א) קבעו ונמקו: עד איזה רגע הרץ מקטין את הפער בינו לבין הדלת, ומאיזה רגע הפער רק גדל?

      (ב) האם הרץ מגיע לדלת? אם כן, מתי?

      (ג) מה משתנה אם הרץ נמצא $14\,\text{m}$ מאחורי הדלת כשהאוטובוס יוצא?
    answer: >-
      (א) הפער קטן עד הרגע שבו המהירויות שוות, $t = 5.0\,\text{s}$, ואחריו הוא גדל.

      (ב) כן, אחרי $4.0\,\text{s}$.

      (ג) הוא לא מגיע: המרחק הקטן ביותר $1.5\,\text{m}$, ברגע $5.0\,\text{s}$.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה, והראשית במקום של הרץ ברגע היציאה. רץ: $x_1 = 5.0t$. דלת: $x_2 = 12 + \frac{1}{2}\cdot 1.0\,t^2$.
      - kind: reasoning
        text: >-
          (א) הפער הוא $x_2 - x_1$. כל עוד הרץ מהיר מהאוטובוס, הפער קטן; כשהאוטובוס מהיר יותר, הפער גדל. לכן
          הפער קטן עד הרגע שבו המהירויות שוות: $1.0\,t = 5.0$, כלומר $t = 5.0\,\text{s}$. אם הרץ לא הגיע לדלת עד
          הרגע הזה, הוא כבר לא יגיע אליה.
      - kind: manipulation
        text: >-
          (ב) הרץ בדלת כש-$x_1 = x_2$: $5.0t = 12 + 0.5t^2$, כלומר $0.5t^2 - 5.0t + 12 = 0$, או $t^2 - 10t + 24 = 0$.
      - kind: substitution
        text: >-
          $t = \frac{10 \pm \sqrt{100 - 96}}{2} = \frac{10 \pm 2}{2}$: $t = 4.0\,\text{s}$ או $t = 6.0\,\text{s}$. הרץ
          מגיע לדלת לראשונה ברגע $4.0\,\text{s}$.
      - kind: substitution
        text: >-
          (ג) עכשיו $x_2 = 14 + 0.5t^2$. ברגע $5.0\,\text{s}$: $x_2 - x_1 = 14 + 12.5 - 25 = 1.5\,\text{m}$. זה המרחק
          הקטן ביותר, והוא אינו אפס.
      - kind: result
        text: >-
          (א) הפער קטן עד $5.0\,\text{s}$, כשהמהירויות שוות, ואחר כך גדל. (ב) כן, ברגע $4.0\,\text{s}$, עוד לפני
          $5.0\,\text{s}$. (ג) לא: הוא מתקרב עד $1.5\,\text{m}$,
          ואז האוטובוס מתרחק.

challenge:
  - id: W-1.6-c1
    stars: 1
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      מכונית יוצאת ממנוחה ומאיצה בתאוצה קבועה שגודלה $\alpha$. אחרי זמן מסוים היא מתחילה לבלום בתאוצה קבועה שגודלה
      $\beta$, עד שהיא נעצרת. כל הנסיעה, מהיציאה ועד העצירה, נמשכת זמן $t$.

      (א) בטאו באמצעות $\alpha$, $\beta$ ו-$t$ את המהירות המרבית של המכונית.

      (ב) בטאו באמצעות $\alpha$, $\beta$ ו-$t$ את הדרך שהמכונית עוברת.

      (ג) הציבו $\alpha = 0.50\,\text{m/s}^2$, $\beta = 1.0\,\text{m/s}^2$ ו-$t = 60\,\text{s}$.

      (ד) בדקו את הביטוי מסעיף (ב) כשהבלמים חזקים מאוד, כלומר $\beta$ גדול מאוד. מה הוא צריך לתת?
    answer: >-
      (א) $v_{\max} = \frac{\alpha\beta t}{\alpha + \beta}$.

      (ב) $\frac{\alpha\beta t^2}{2(\alpha + \beta)}$.

      (ג) $20\,\text{m/s}$ ו-$600\,\text{m}$.

      (ד) הביטוי שואף ל-$\frac{1}{2}\alpha t^2$, הדרך של האצה בלבד.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. נסמן ב-$t_1$ את זמן ההאצה וב-$t_2$ את זמן הבלימה: $t_1 + t_2 = t$. בהאצה
          $a = +\alpha$, ובבלימה $a = -\beta$.
      - kind: formula
        text: '$v = v_0 + at$ בכל שלב, ו-$x - x_0 = \frac{v_0 + v}{2}\,t$.'
      - kind: manipulation
        text: >-
          בסוף ההאצה $v_{\max} = \alpha t_1$. בבלימה $0 = v_{\max} - \beta t_2$, כלומר $t_2 = \frac{v_{\max}}{\beta}$.
          לכן $t = \frac{v_{\max}}{\alpha} + \frac{v_{\max}}{\beta} = v_{\max}\,\frac{\alpha + \beta}{\alpha\beta}$.
      - kind: result
        text: '(א) $v_{\max} = \frac{\alpha\beta t}{\alpha + \beta}$.'
      - kind: manipulation
        text: >-
          (ב) בכל אחד מהשלבים המהירות הממוצעת היא $\frac{v_{\max}}{2}$, ולכן הדרך כולה היא
          $\frac{v_{\max}}{2}\,(t_1 + t_2) = \frac{v_{\max}\,t}{2} = \frac{\alpha\beta t^2}{2(\alpha + \beta)}$. בגרף מהירות-זמן
          זה שטח של משולש שבסיסו $t$ וגובהו $v_{\max}$.
      - kind: substitution
        text: >-
          (ג) $v_{\max} = \frac{0.50\cdot 1.0\cdot 60}{1.5} = 20\,\text{m/s}$, והדרך $\frac{20\cdot 60}{2} = 600\,\text{m}$.
          ($t_1 = 40\,\text{s}$, $t_2 = 20\,\text{s}$.)
      - kind: reasoning
        text: >-
          (ד) כש-$\beta$ גדול מאוד, $\frac{\beta}{\alpha + \beta}$ שואף ל-1, והדרך שואפת ל-$\frac{1}{2}\alpha t^2$: המכונית
          מאיצה כל הזמן ונעצרת ברגע. זה בדיוק $x - x_0 = \frac{1}{2}at^2$ ממנוחה.
      - kind: result
        text: >-
          (א) $\frac{\alpha\beta t}{\alpha + \beta}$. (ב) $\frac{\alpha\beta t^2}{2(\alpha + \beta)}$. (ג) $20\,\text{m/s}$,
          $600\,\text{m}$. (ד) $\frac{1}{2}\alpha t^2$, כצפוי.
    source:
      name: JEE Main (NTA)
      year: 2021
      problem: '17 March 2021, Shift 1, Physics Section A, Question 1'
      url: https://cracku.in/1-a-car-accelerates-from-rest-at-a-constant-rate-alp-x-nta-jee-main-17-mar-2021-shift-1-physics
      verified: '2026-11-05'
      adapted: true

  - id: W-1.6-c2
    stars: 1
    objectives: [OBJ-1.6-2, OBJ-1.6-3]
    prompt: >-
      מכונית ומשאית נוסעות באותו נתיב, שתיהן במהירות קבועה של $20\,\text{m/s}$, והמכונית $10\,\text{m}$ מאחורי
      המשאית. נהג המשאית בולם פתאום, והמשאית מאטה בתאוצה קבועה שגודלה $2.0\,\text{m/s}^2$ עד שהיא נעצרת. נהגת
      המכונית מתחילה לבלום $2.0\,\text{s}$ אחרי נהג המשאית, בתאוצה קבועה, וממש בקושי לא פוגעת במשאית.

      (א) מה המרחק בין הרכבים, ומה המהירות של המכונית ביחס למשאית, כשהנהגת מתחילה לבלום?

      (ב) מה גודל התאוצה של המכונית בבלימה?

      (ג) תלמיד פתר כך: "המשאית נעצרת $110\,\text{m}$ מהמקום ההתחלתי של המכונית, ולכן המכונית צריכה לעצור באותו
      מקום." קבעו ונמקו מה שגוי בפתרון הזה, ומה היה קורה למכונית עם התאוצה שהוא מקבל.
    answer: >-
      (א) $6.0\,\text{m}$, והמכונית מתקרבת למשאית ב-$4.0\,\text{m/s}$.

      (ב) $\frac{10}{3} \approx 3.3\,\text{m/s}^2$.

      (ג) הוא מניח שהסכנה היא רק בסוף. עם התאוצה שלו, $\frac{20}{7} \approx 2.9\,\text{m/s}^2$, המכונית פוגעת במשאית
      בערך $3.9\,\text{s}$ אחרי שהמשאית התחילה לבלום, עוד לפני שהמשאית נעצרת.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. השעון מתחיל כשהמשאית מתחילה לבלום. המשאית: $a = -2.0\,\text{m/s}^2$. המכונית
          נוסעת $20\,\text{m/s}$ עד $t = 2.0\,\text{s}$, ואחר כך בולמת בתאוצה שגודלה $a_c$.
      - kind: substitution
        text: >-
          (א) ב-$2.0\,\text{s}$ המשאית עוברת $20\cdot 2.0 - \frac{1}{2}\cdot 2.0\cdot 2.0^2 = 36\,\text{m}$ ומגיעה ל-$16\,\text{m/s}$.
          המכונית עוברת $40\,\text{m}$. המרחק $10 + 36 - 40 = 6.0\,\text{m}$, והמהירות של המכונית ביחס למשאית
          $20 - 16 = +4.0\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ב) נעבור למערכת הייחוס של המשאית. בה המכונית מתחילה $6.0\,\text{m}$ מאחור, במהירות $+4.0\,\text{m/s}$,
          והמהירות היחסית משתנה בכל שנייה ב-$-a_c + 2.0$ (המכונית מאטה ב-$a_c$, והמשאית ב-$2.0$). "בקושי לא פוגעת"
          פירושו שהמהירות היחסית מגיעה לאפס בדיוק כשהמרחק אפס.
      - kind: formula
        text: '$v^2 = v_0^2 + 2a(x - x_0)$, עם המהירות היחסית: $0 = 4.0^2 - 2(a_c - 2.0)\cdot 6.0$.'
      - kind: substitution
        text: >-
          $a_c - 2.0 = \frac{16}{12} = \frac{4}{3}$, ולכן $a_c = \frac{10}{3} \approx 3.3\,\text{m/s}^2$. זה קורה אחרי
          $\frac{4.0}{4/3} = 3.0\,\text{s}$ של בלימה, ברגע $t = 5.0\,\text{s}$, ואז המשאית עדיין נעה, $10\,\text{m/s}$.
          בדיקה במערכת הכביש: שני הרכבים ב-$85\,\text{m}$ מהמקום ההתחלתי של המכונית, ושניהם ב-$10\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ג) התלמיד דורש $40 + \frac{20^2}{2a_c} = 110$, כלומר $a_c = \frac{20}{7} \approx 2.9\,\text{m/s}^2$. אבל
          המכונית מתקרבת למשאית כל עוד היא מהירה ממנה, והמשאית נעצרת רק אחרי $10\,\text{s}$. עם $2.9\,\text{m/s}^2$
          המכונית מגיעה למשאית כבר ברגע $t \approx 3.9\,\text{s}$, כשהמשאית עוד נוסעת.
      - kind: result
        text: >-
          (א) $6.0\,\text{m}$ ו-$4.0\,\text{m/s}$. (ב) $\frac{10}{3} \approx 3.3\,\text{m/s}^2$. (ג) צריך לבדוק את הרגע שבו
          המהירויות שוות, ולא רק את מקומות העצירה. בתאוצה של התלמיד יש התנגשות.
