# Workbook for lesson 1.3: ten practice problems and two sourced challenge problems.
# Every number recomputed with uniform / legs / makeMotion / meetings / meetingUniform / avgVelocity / avgSpeed
# from src/physics/kinematics.ts (script: screens/check-1-3.ts, run with npx tsx).

lesson: '1.3'
practice:
  - id: W-1.3-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      רכבת צעצוע נוסעת על מסילה ישרה. הכיוון החיובי הוא ימינה. מדדו את מקומה בכל שנייה:

      ב-$t = 0, 1, 2, 3\,\text{s}$ המקום הוא $x = -6, -3, 0, 3\,\text{m}$.

      (א) האם התנועה קצובה? נמקו.

      (ב) מה מהירות הרכבת?

      (ג) כתבו ביטוי מקום-זמן, ומצאו איפה תהיה הרכבת ב-$t = 10\,\text{s}$.
    answer: >-
      (א) כן: בכל שנייה המקום גדל ב-$3\,\text{m}$.

      (ב) $v = +3\,\text{m/s}$, ימינה.

      (ג) $x = -6 + 3t$; ב-$t = 10\,\text{s}$, $x = 24\,\text{m}$.
    solution:
      - kind: given
        text: >-
          ארבעה מקומות בהפרשים של שנייה אחת; הכיוון החיובי ימינה.
      - kind: reasoning
        text: >-
          (א) ההעתקים בכל שנייה: $(-3)-(-6) = 3$, $0-(-3) = 3$, $3-0 = 3$ מטרים. אותו העתק בכל פרק זמן שווה, ולכן
          התנועה קצובה.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$, ובתנועה קצובה $x = x_0 + v\,t$.
      - kind: substitution
        text: >-
          (ב) $v = \dfrac{3 - (-6)}{3 - 0} = \dfrac{9}{3} = 3\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ג) $x_0 = -6\,\text{m}$, ולכן $x = -6 + 3t$. ב-$t = 10\,\text{s}$: $x = -6 + 30 = 24\,\text{m}$.
      - kind: result
        text: >-
          (א) כן. (ב) $v = +3\,\text{m/s}$. (ג) $x = -6 + 3t$, ו-$x(10\,\text{s}) = 24\,\text{m}$.

  - id: W-1.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-1]
    prompt: >-
      כדור מתגלגל על רצפה ישרה שמאלה, 2 מטרים בכל שנייה. דנה בוחרת ציר שהכיוון החיובי שלו ימינה, ויוסי בוחר ציר
      שהכיוון החיובי שלו שמאלה.

      (א) מה המהירות של הכדור לפי דנה, ומה לפי יוסי?

      (ב) מי מהם צודק? האם הכדור של דנה "איטי יותר"?
    answer: >-
      (א) לפי דנה $v = -2\,\text{m/s}$, ולפי יוסי $v = +2\,\text{m/s}$.

      (ב) שניהם צודקים. גודל המהירות, $2\,\text{m/s}$, זהה; רק הסימן תלוי בבחירת הציר.
    solution:
      - kind: given
        text: >-
          הכדור נע שמאלה, 2 מטרים בכל שנייה.
      - kind: reasoning
        text: >-
          (א) אצל דנה הכדור נע נגד הכיוון החיובי, ולכן המקום שלו קטן ב-2 מטרים בכל שנייה: $v = -2\,\text{m/s}$.
          אצל יוסי הכדור נע בכיוון החיובי: $v = +2\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ב) הסימן של המהירות אומר רק לאיזה כיוון הגוף נע ביחס לציר שבחרנו. כמה מהר הוא נע אומר גודל המהירות,
          והוא $2\,\text{m/s}$ אצל שניהם. אותה תנועה, שני תיאורים נכונים.
      - kind: result
        text: >-
          (א) $v = -2\,\text{m/s}$ אצל דנה, $v = +2\,\text{m/s}$ אצל יוסי. (ב) שניהם צודקים; הכדור לא איטי יותר אצל דנה.

  - id: W-1.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.3-3]
    prompt: >-
      הכיוון החיובי הוא מזרחה. הולך רגל הולך ברחוב ישר $400\,\text{m}$ מזרחה במשך 5 דקות, ואז חוזר $100\,\text{m}$
      מערבה במשך 2 דקות.

      (א) מה ההעתק שלו ומה הדרך שעבר?

      (ב) חשבו את המהירות הממוצעת ואת המהירות הממוצעת לפי הדרך, ב-$\text{m/s}$.
    answer: >-
      (א) העתק $\Delta x = +300\,\text{m}$ (מזרחה), דרך $500\,\text{m}$.

      (ב) $\bar{v} \approx +0.71\,\text{m/s}$ (מזרחה); מהירות ממוצעת לפי הדרך $\approx 1.19\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $400\,\text{m}$ מזרחה ב-$300\,\text{s}$, ואחר כך $100\,\text{m}$ מערבה ב-$120\,\text{s}$; הזמן הכולל
          $420\,\text{s}$.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$; מהירות ממוצעת לפי הדרך = הדרך חלקי הזמן.
      - kind: substitution
        text: >-
          (א) $\Delta x = +400 - 100 = +300\,\text{m}$; הדרך $400 + 100 = 500\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) $\bar{v} = \dfrac{300}{420} \approx 0.71\,\text{m/s}$, ומהירות ממוצעת לפי הדרך
          $\dfrac{500}{420} \approx 1.19\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $\Delta x = +300\,\text{m}$ ו-$500\,\text{m}$. (ב) $\approx 0.71\,\text{m/s}$ מזרחה, ו-$\approx 1.19\,\text{m/s}$.

  - id: W-1.3-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.3-2]
    prompt: >-
      ברגע $t = 0$ גוף נמצא ב-$x = -d$, ונע לכיוון הראשית במהירות קבועה שגודלה $u$. הכיוון החיובי הוא מהגוף
      לכיוון הראשית.

      (א) כתבו את ביטוי המקום-זמן של הגוף.

      (ב) בטאו באמצעות $d$ ו-$u$: מתי הגוף עובר בראשית?

      (ג) איפה הגוף נמצא ברגע $t = 3d/u$?
    answer: >-
      (א) $x = -d + u\,t$.

      (ב) $t = d/u$.

      (ג) $x = 2d$.
    solution:
      - kind: given
        text: >-
          $x_0 = -d$; הגוף נע בכיוון החיובי, ולכן $v = +u$.
      - kind: formula
        text: >-
          $x = x_0 + v\,t$.
      - kind: substitution
        text: >-
          (א) $x = -d + u\,t$.
      - kind: manipulation
        text: >-
          (ב) בראשית $x = 0$: $0 = -d + u\,t$, ולכן $u\,t = d$. מחלקים ב-$u$: $t = \dfrac{d}{u}$.
      - kind: substitution
        text: >-
          (ג) $x = -d + u\cdot\dfrac{3d}{u} = -d + 3d = 2d$.
      - kind: result
        text: >-
          (א) $x = -d + u\,t$. (ב) $t = d/u$. (ג) $x = 2d$, מעבר לראשית.

  - id: W-1.3-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.3-2]
    prompt: >-
      שביל ישר באורך $2.4\,\text{km}$ מחבר בין שתי נקודות, P ו-Q. הולכת יוצאת מ-P לכיוון Q ב-$1.5\,\text{m/s}$.
      כעבור 4 דקות יוצא רוכב מ-Q לכיוון P ב-$6\,\text{m/s}$. הניחו שכל אחד מגיע למהירותו מיד.

      (א) כתבו ביטוי מקום-זמן לכל אחד מהם.

      (ב) מתי ובאיזה מרחק מ-P הם נפגשים?
    answer: >-
      (א) $x_1 = 1.5t$; $x_2 = 2400 - 6\,(t - 240)$ עבור $t \ge 240\,\text{s}$.

      (ב) ב-$t = 512\,\text{s}$ מיציאת ההולכת, $768\,\text{m}$ מ-P.
    solution:
      - kind: given
        text: >-
          הראשית ב-P, והכיוון החיובי מ-P ל-Q. השעון מתחיל כשההולכת יוצאת. $v_1 = +1.5\,\text{m/s}$, ו-$v_2 = -6\,\text{m/s}$
          מ-$t = 240\,\text{s}$.
      - kind: formula
        text: >-
          $x = x_0 + v\,t$. לרוכב, שיוצא $240\,\text{s}$ מאוחר יותר, הזמן מאז היציאה הוא $(t - 240)$.
      - kind: substitution
        text: >-
          (א) $x_1 = 1.5t$, ו-$x_2 = 2400 - 6\,(t - 240) = 3840 - 6t$.
      - kind: manipulation
        text: >-
          (ב) בפגישה $1.5t = 3840 - 6t$, ולכן $7.5t = 3840$ ו-$t = 512\,\text{s}$ (כ-8.5 דקות). מציבים:
          $x_1 = 1.5\cdot512 = 768\,\text{m}$. בדיקה: $x_2 = 3840 - 3072 = 768\,\text{m}$.
      - kind: result
        text: >-
          (ב) $512\,\text{s}$ אחרי יציאת ההולכת, $768\,\text{m}$ מ-P.

  - id: W-1.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      בגרף מקום-זמן שני קווים ישרים. הקו של A עובר מ-$(0\,\text{s},\ 0\,\text{m})$ ל-$(10\,\text{s},\ 50\,\text{m})$,
      והקו של B עובר מ-$(0\,\text{s},\ 80\,\text{m})$ ל-$(10\,\text{s},\ 30\,\text{m})$.

      (א) קבעו ונמקו בלי חישוב: איזה גוף נע בכיוון החיובי, ואיזה נגדו?

      (ב) תלמיד אומר: "B מהיר יותר, כי הקו שלו גבוה יותר כל הזמן". האם הוא צודק? חשבו את שתי המהירויות.

      (ג) מתי ואיפה הגופים נפגשים?
    answer: >-
      (א) A בכיוון החיובי (הקו עולה), B נגדו (הקו יורד).

      (ב) לא. $v_A = +5\,\text{m/s}$, $v_B = -5\,\text{m/s}$: לשניהם אותו גודל מהירות. ובכלל, הקו של B לא גבוה כל
      הזמן: הקווים נחתכים.

      (ג) ב-$t = 8\,\text{s}$, ב-$x = 40\,\text{m}$.
    solution:
      - kind: reasoning
        text: >-
          (א) הקו של A עולה: $x$ גדל, ו-A נע בכיוון החיובי. הקו של B יורד: B נע נגדו.
      - kind: formula
        text: >-
          $v = \dfrac{\Delta x}{\Delta t}$; בפגישה $x_A = x_B$.
      - kind: substitution
        text: >-
          (ב) $v_A = \dfrac{50 - 0}{10} = +5\,\text{m/s}$, $v_B = \dfrac{30 - 80}{10} = -5\,\text{m/s}$. גודל המהירות של
          שניהם $5\,\text{m/s}$. הגובה של הקו הוא מקום, לא מהירות.
      - kind: manipulation
        text: >-
          (ג) $x_A = 5t$, $x_B = 80 - 5t$. $5t = 80 - 5t$, ולכן $10t = 80$ ו-$t = 8\,\text{s}$; $x = 40\,\text{m}$.
      - kind: result
        text: >-
          (א) A בכיוון החיובי, B נגדו. (ב) לא צודק: גודל המהירות של שניהם $5\,\text{m/s}$. (ג) $t = 8\,\text{s}$,
          $x = 40\,\text{m}$.

  - id: W-1.3-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.3-3]
    prompt: >-
      מכונית נוסעת בכביש ישר, כל הזמן לאותו כיוון: 20 דקות ב-$72$ קמ״ש, עצירה של 10 דקות בתחנת דלק, ואז 10 דקות
      ב-$90$ קמ״ש.

      (א) כמה קילומטרים עברה המכונית?

      (ב) מה המהירות הממוצעת שלה על כל 40 הדקות, בקמ״ש?

      (ג) נהג אחר טוען שהתשובה היא $81$ קמ״ש. מאיפה הגיע המספר, ומה הטעות?
    answer: >-
      (א) $39\,\text{km}$.

      (ב) $58.5$ קמ״ש.

      (ג) 81 הוא הממוצע של 72 ו-90. הוא מתעלם מהעצירה, ומכך שהקטעים לא נמשכים אותו זמן.
    solution:
      - kind: given
        text: >-
          הכיוון החיובי הוא כיוון הנסיעה. $\frac{1}{3}$ שעה ב-72 קמ״ש, $\frac{1}{6}$ שעה עמידה, $\frac{1}{6}$ שעה ב-90
          קמ״ש. הזמן הכולל $\frac{2}{3}$ שעה.
      - kind: substitution
        text: >-
          (א) $72\cdot\frac{1}{3} = 24\,\text{km}$, ו-$90\cdot\frac{1}{6} = 15\,\text{km}$. ביחד $39\,\text{km}$.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$, כולל זמן העמידה.
      - kind: substitution
        text: >-
          (ב) $\bar{v} = \dfrac{39\ \text{km}}{2/3\ \text{h}} = 58.5$ קמ״ש.
      - kind: reasoning
        text: >-
          (ג) $(72 + 90)/2 = 81$. אבל הקטע של 72 קמ״ש נמשך פי 2 יותר זמן מהקטע של 90 קמ״ש, ובעשר דקות העמידה
          השעון המשיך לרוץ. גם אילו מתעלמים רק מהעצירה, $39/0.5 = 78$ קמ״ש, ולא 81.
      - kind: result
        text: >-
          (א) $39\,\text{km}$. (ב) $58.5$ קמ״ש. (ג) ממוצע של מהירויות, בלי משקל לזמן ובלי העצירה.

  - id: W-1.3-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      שני רוכבי אופניים, A ו-B, נמצאים $30\,\text{km}$ זה מזה על כביש ישר, ויוצאים באותו רגע זה לקראת זה, כל אחד
      ב-$15$ קמ״ש. באותו רגע ציפור ממריאה מהכתף של A ועפה לכיוון B ב-$40$ קמ״ש. כשהיא מגיעה ל-B היא מסתובבת מיד
      וחוזרת ל-A, וכך הלוך ושוב, עד שהרוכבים נפגשים.

      (א) מתי ואיפה הציפור מגיעה ל-B בפעם הראשונה?

      (ב) קבעו ונמקו: כמה זמן עפה הציפור בסך הכול, ומה הדרך שעברה?

      (ג) מה ההעתק של הציפור, מה המהירות הממוצעת שלה ומה המהירות הממוצעת לפי הדרך שלה?
    answer: >-
      (א) כעבור $\frac{6}{11}$ שעה (כ-33 דקות), כ-$21.8\,\text{km}$ מנקודת היציאה של A.

      (ב) שעה אחת; $40\,\text{km}$.

      (ג) העתק $15\,\text{km}$ לכיוון B; מהירות ממוצעת $15$ קמ״ש; מהירות ממוצעת לפי הדרך $40$ קמ״ש.
    solution:
      - kind: given
        text: >-
          הראשית בנקודת היציאה של A, והכיוון החיובי מ-A ל-B. $x_A = 15t$, $x_B = 30 - 15t$ (קילומטרים, שעות).
      - kind: manipulation
        text: >-
          (א) הציפור: $x_P = 40t$. היא פוגשת את B כש-$40t = 30 - 15t$, ולכן $55t = 30$ ו-$t = \frac{6}{11} \approx 0.55$
          שעה; $x = 40\cdot\frac{6}{11} \approx 21.8\,\text{km}$.
      - kind: manipulation
        text: >-
          (ב) הרוכבים נפגשים כש-$15t = 30 - 15t$: $t = 1$ שעה, ב-$x = 15\,\text{km}$. הציפור עפה כל הזמן הזה
          ב-$40$ קמ״ש, בלי קשר למספר הסיבובים, ולכן עוברת דרך של $40\cdot1 = 40\,\text{km}$.
      - kind: reasoning
        text: >-
          (ג) הציפור מתחילה ב-$x = 0$ ומסיימת עם הרוכבים, ב-$x = 15\,\text{km}$. ההעתק $\Delta x = +15\,\text{km}$, והמהירות
          הממוצעת $15/1 = 15$ קמ״ש. המהירות הממוצעת לפי הדרך $40/1 = 40$ קמ״ש.
      - kind: result
        text: >-
          (א) $\frac{6}{11}$ שעה, $21.8\,\text{km}$ מ-A. (ב) שעה, $40\,\text{km}$. (ג) $\Delta x = +15\,\text{km}$; $15$ קמ״ש;
          $40$ קמ״ש.

  - id: W-1.3-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      רובוט שליחויות נע במסדרון ישר. הכיוון החיובי הוא ימינה, והרובוט מתחיל ב-$x = 0$. הוא נע $1.5\,\text{m/s}$ ימינה
      במשך $20\,\text{s}$, עומד $10\,\text{s}$, ואז נע $2\,\text{m/s}$ שמאלה במשך $20\,\text{s}$.

      (א) מה המקום של הרובוט בסוף כל קטע? תארו במילים את גרף המקום-זמן.

      (ב) חשבו את המהירות הממוצעת ואת המהירות הממוצעת לפי הדרך על כל $50$ השניות.

      (ג) באיזה רגע המהירות הממוצעת של הרובוט מתחילת התנועה שווה לאפס?
    answer: >-
      (א) $x = 30\,\text{m}$, $x = 30\,\text{m}$, $x = -10\,\text{m}$. קו עולה, קו אופקי, קו יורד תלול יותר.

      (ב) $\bar{v} = -0.2\,\text{m/s}$; מהירות ממוצעת לפי הדרך $1.4\,\text{m/s}$.

      (ג) ב-$t = 45\,\text{s}$.
    solution:
      - kind: given
        text: >-
          שלושה קטעים: $v = +1.5\,\text{m/s}$ במשך $20\,\text{s}$, $v = 0$ במשך $10\,\text{s}$, $v = -2\,\text{m/s}$
          במשך $20\,\text{s}$.
      - kind: substitution
        text: >-
          (א) $x(20) = 1.5\cdot20 = 30\,\text{m}$; $x(30) = 30\,\text{m}$; $x(50) = 30 - 2\cdot20 = -10\,\text{m}$. הגרף:
          עולה בשיפוע 1.5 עד $t = 20$, אופקי עד $t = 30$, ויורד בשיפוע $v = -2\,\text{m/s}$ עד $t = 50$.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$; מהירות ממוצעת לפי הדרך = הדרך חלקי הזמן.
      - kind: substitution
        text: >-
          (ב) $\Delta x = -10 - 0 = -10\,\text{m}$, ו-$\bar{v} = -10/50 = -0.2\,\text{m/s}$. הדרך $30 + 40 = 70\,\text{m}$,
          ו-$70/50 = 1.4\,\text{m/s}$.
      - kind: manipulation
        text: >-
          (ג) המהירות הממוצעת מההתחלה היא אפס כשההעתק אפס, כלומר כשהרובוט חוזר ל-$x = 0$. בקטע השלישי
          $x = 30 - 2\,(t - 30)$. מציבים $x = 0$: $2\,(t - 30) = 30$, ולכן $t - 30 = 15$ ו-$t = 45\,\text{s}$.
      - kind: result
        text: >-
          (א) $x = 30,\ 30,\ -10\,\text{m}$. (ב) $\bar{v} = -0.2\,\text{m/s}$ ו-$1.4\,\text{m/s}$. (ג) $t = 45\,\text{s}$.

  - id: W-1.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.3-2]
    prompt: >-
      שני גופים נמצאים בקצוות של קטע ישר באורך $d$. גוף A יוצא מ-$x = 0$ במהירות $v$, וגוף B יוצא מ-$x = d$ לכיוון
      A במהירות שגודלה $2v$.

      (א) הגופים יוצאים יחד. בטאו באמצעות $d$ ו-$v$ את רגע הפגישה ואת מקום הפגישה.

      (ב) B יוצא באיחור של $\tau$ אחרי A (ו-A עדיין לא הגיע ל-$d$). בטאו באמצעות $d$, $v$ ו-$\tau$ את רגע הפגישה
      ואת מקומה, כשהשעון מתחיל ביציאת A.

      (ג) מה צריך להיות האיחור $\tau$ כדי שהפגישה תהיה בדיוק באמצע הקטע?
    answer: >-
      (א) $t = \dfrac{d}{3v}$, $x = \dfrac{d}{3}$.

      (ב) $t = \dfrac{d + 2v\tau}{3v}$, $x = \dfrac{d + 2v\tau}{3}$.

      (ג) $\tau = \dfrac{d}{4v}$.
    solution:
      - kind: given
        text: >-
          הראשית בנקודת היציאה של A, והכיוון החיובי מ-A ל-B. $v_A = +v$, $v_B = -2v$.
      - kind: formula
        text: >-
          $x = x_0 + v\,t$ לכל גוף; בפגישה $x_A = x_B$.
      - kind: manipulation
        text: >-
          (א) $v\,t = d - 2v\,t$, ולכן $3v\,t = d$ ו-$t = \dfrac{d}{3v}$. $x = v\cdot\dfrac{d}{3v} = \dfrac{d}{3}$.
      - kind: manipulation
        text: >-
          (ב) הזמן מאז יציאת B הוא $(t - \tau)$: $x_B = d - 2v\,(t - \tau)$. מהשוויון $v\,t = d - 2v\,t + 2v\tau$
          מקבלים $3v\,t = d + 2v\tau$, ולכן $t = \dfrac{d + 2v\tau}{3v}$ ו-$x = v\,t = \dfrac{d + 2v\tau}{3}$.
      - kind: manipulation
        text: >-
          (ג) דורשים $x = \dfrac{d}{2}$: $\dfrac{d + 2v\tau}{3} = \dfrac{d}{2}$, ולכן $2d + 4v\tau = 3d$, ו-$\tau = \dfrac{d}{4v}$.
          בדיקה בגבול: $\tau = 0$ מחזיר את תשובת (א), $x = d/3$.
      - kind: result
        text: >-
          (א) $t = d/(3v)$, $x = d/3$. (ב) $t = (d + 2v\tau)/(3v)$, $x = (d + 2v\tau)/3$. (ג) $\tau = d/(4v)$.

challenge:
  - id: W-1.3-c1
    stars: 1
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      גוף נע על ציר ישר. הכיוון החיובי הוא ימינה. במשך $12\,\text{s}$ הראשונות מהירותו קבועה, $v = +8\,\text{m/s}$,
      ומיד אחר כך, עד $t = 28\,\text{s}$, מהירותו קבועה, $v = -6\,\text{m/s}$.

      (א) מה המהירות הממוצעת לפי הדרך על כל 28 השניות?

      (ב) מה המהירות הממוצעת על אותו פרק זמן?

      (ג) אם הגוף ממשיך במהירות $v = -6\,\text{m/s}$ עד $t = 36\,\text{s}$, מה הן שתי המהירויות הממוצעות על כל 36 השניות?
    answer: >-
      (א) $\approx 6.86\,\text{m/s}$.

      (ב) $0$.

      (ג) מהירות ממוצעת $\approx -1.33\,\text{m/s}$; מהירות ממוצעת לפי הדרך $\approx 6.67\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          קטע 1: $v = +8\,\text{m/s}$ במשך $12\,\text{s}$. קטע 2: $v = -6\,\text{m/s}$ מ-$t = 12\,\text{s}$.
      - kind: substitution
        text: >-
          העתק בקטע 1: $\Delta x_1 = 8\cdot12 = +96\,\text{m}$. בקטע 2 עד $t = 28\,\text{s}$: $\Delta x_2 = -6\cdot16 = -96\,\text{m}$. הגוף חוזר
          בדיוק לנקודת ההתחלה.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$; מהירות ממוצעת לפי הדרך = הדרך חלקי הזמן.
      - kind: substitution
        text: >-
          (א) הדרך $96 + 96 = 192\,\text{m}$, ו-$192/28 \approx 6.86\,\text{m/s}$. (ב) $\Delta x = 0$, ולכן $\bar{v} = 0$.
      - kind: substitution
        text: >-
          (ג) עד $t = 36\,\text{s}$ הקטע השני נמשך $24\,\text{s}$: העתק $\Delta x_2 = -144\,\text{m}$. $\Delta x = 96 - 144 = -48\,\text{m}$,
          ו-$\bar{v} = -48/36 \approx -1.33\,\text{m/s}$. הדרך $96 + 144 = 240\,\text{m}$, ו-$240/36 \approx 6.67\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $\approx 6.86\,\text{m/s}$. (ב) $0$. (ג) $\approx -1.33\,\text{m/s}$ ו-$\approx 6.67\,\text{m/s}$.
    source:
      name: PhysicsBowl (AAPT)
      year: 2024
      problem: 'Questions 1 and 2 (velocity-time graph over 28 s)'
      url: https://aapt.org/Programs/PhysicsBowl/upload/PB-Exam-Draft-I-Final-version-2024.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-1.3-c2
    stars: 1
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      רשם-זמן מסמן נקודה על סרט נייר 60 פעמים בשנייה. הסרט מחובר למכונית צעצוע על מסלול ישר.
      המרחקים בין כל שתי נקודות סמוכות, בחמישה מרווחים רצופים, הם (במטרים):
      $0.055,\ 0.065,\ 0.055,\ 0.070,\ 0.060$.

      (א) מה המהירות הממוצעת של המכונית על חמשת המרווחים?

      (ב) חשבו את המהירות הממוצעת בכל מרווח לבדו. האם התנועה קצובה? נמקו.

      (ג) אם המכונית ממשיכה באותה מהירות ממוצעת, כמה תתקדם ב-$1.5\,\text{s}$?
    answer: >-
      (א) $\approx 3.66\,\text{m/s}$.

      (ב) $3.3$, $3.9$, $3.3$, $4.2$, $3.6\,\text{m/s}$: בערך קצובה, עם פיזור של כ-$\pm 0.5\,\text{m/s}$ סביב הממוצע.

      (ג) $\approx 5.5\,\text{m}$.
    solution:
      - kind: given
        text: >-
          משך כל מרווח $\Delta t = \frac{1}{60}\,\text{s}$; חמישה מרווחים נמשכים $\frac{5}{60}\,\text{s}$. המכונית נעה
          כל הזמן לאותו כיוון, וזה הכיוון החיובי.
      - kind: formula
        text: >-
          $\bar{v} = \dfrac{\Delta x}{\Delta t}$.
      - kind: substitution
        text: >-
          (א) $\Delta x = 0.055 + 0.065 + 0.055 + 0.070 + 0.060 = 0.305\,\text{m}$, ו-$\bar{v} = \dfrac{0.305}{5/60} \approx 3.66\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) בכל מרווח $\bar{v} = 60\cdot\Delta x$: $3.3$, $3.9$, $3.3$, $4.2$, $3.6\,\text{m/s}$. אין מגמה של עלייה או
          ירידה; הערכים מתפזרים סביב $3.7\,\text{m/s}$, כנראה בגלל אי-ודאות במדידה של מרווחים קצרים. בקירוב
          התנועה קצובה.
      - kind: substitution
        text: >-
          (ג) $\Delta x = \bar{v}\,\Delta t = 3.66\cdot1.5 \approx 5.5\,\text{m}$.
      - kind: result
        text: >-
          (א) $\approx 3.66\,\text{m/s}$. (ב) בקירוב קצובה. (ג) $\approx 5.5\,\text{m}$.
