# Workbook for lesson 0.3: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/toolbox.ts (lineThrough, drawnAngleDeg, powerScale, legs, otherLeg,
# hypotenuse, angleFromLegs, sinDeg, cosDeg, tanDeg).

lesson: '0.3'
practice:
  - id: W-0.3-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    prompt: >-
      עגלה יוצאת מחיישן ברגע $t = 0$ ומתרחקת ממנו בקצב קבוע: אחרי $4\,\text{s}$ היא $6\,\text{m}$ מהחיישן.

      (א) כמה מטרים מהחיישן תהיה העגלה אחרי $10\,\text{s}$?

      (ב) האם המרחק מהחיישן ביחס ישר לזמן? נמקו בעזרת הגרף של המרחק מול הזמן.
    answer: >-
      (א) $15\,\text{m}$.

      (ב) כן: הגרף הוא קו ישר שעובר בראשית.
    solution:
      - kind: given
        text: >-
          ב-$t = 0$ העגלה ליד החיישן ($d = 0$), וב-$t = 4\,\text{s}$ היא ב-$d = 6\,\text{m}$. הקצב קבוע, ולכן הגרף של $d$ מול $t$ הוא קו ישר.
      - kind: reasoning
        text: >-
          הקו עובר בנקודה $(0, 0)$ ובנקודה $(4\,\text{s},\ 6\,\text{m})$. קו ישר שעובר בראשית הוא יחס ישר: זמן פי כמה, מרחק פי אותו מספר.
      - kind: formula
        text: >-
          $\dfrac{d_2}{d_1} = \dfrac{t_2}{t_1}$, ולכן $d_2 = d_1\cdot\dfrac{t_2}{t_1}$.
      - kind: substitution
        text: >-
          $d_2 = 6\,\text{m}\cdot\dfrac{10\,\text{s}}{4\,\text{s}} = 6\,\text{m}\cdot 2.5 = 15\,\text{m}$.
      - kind: result
        text: >-
          (א) $15\,\text{m}$ מהחיישן. (ב) כן, כי העגלה התחילה ליד החיישן, והקו עובר בראשית. אילו העגלה הייתה יוצאת מ-$2\,\text{m}$ לפני החיישן, הקו לא היה עובר בראשית, והמרחק לא היה ביחס ישר לזמן.

  - id: W-0.3-02
    level: basic
    qualitative: false
    objectives: [OBJ-0.3-3]
    prompt: >-
      ילד מעיף עפיפון. החוט מתוח וישר, אורכו $30\,\text{m}$, והוא יוצר זווית של $40^\circ$ עם הקרקע האופקית.
      באיזה גובה מעל היד של הילד נמצא העפיפון, ובאיזה מרחק אופקי ממנה?
    answer: >-
      כ-$19\,\text{m}$ מעל היד, וכ-$23\,\text{m}$ ממנה במאוזן.
    solution:
      - kind: given
        text: >-
          החוט הוא היתר, $L = 30\,\text{m}$. הזווית $\theta = 40^\circ$ נמדדת מהקרקע, ליד היד של הילד.
      - kind: reasoning
        text: >-
          הגובה $h$ הוא הניצב שמול הזווית, והמרחק האופקי $w$ הוא הניצב שלידה.
      - kind: formula
        text: >-
          $h = L\sin\theta$ ו-$w = L\cos\theta$.
      - kind: substitution
        text: >-
          $h = 30\,\text{m}\cdot\sin 40^\circ \approx 30\cdot 0.643 \approx 19.3\,\text{m}$, ו-$w = 30\,\text{m}\cdot\cos 40^\circ \approx 30\cdot 0.766 \approx 23.0\,\text{m}$.
      - kind: result
        text: >-
          העפיפון כ-$19\,\text{m}$ מעל היד וכ-$23\,\text{m}$ ממנה במאוזן. בדיקה: $19.3^2 + 23.0^2 \approx 900 = 30^2$.

  - id: W-0.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-0.3-2]
    prompt: >-
      הגרף של המרחק של רוכבת אופניים מקו הזינוק, מול הזמן, הוא קו ישר שעובר בנקודות $(0\,\text{s},\ 0\,\text{m})$ ו-$(20\,\text{s},\ 100\,\text{m})$.
      מה השיפוע של הקו, עם יחידות? המירו אותו ל-$\text{km/h}$.
    answer: >-
      $5\,\text{m/s}$, שהם $18\,\text{km/h}$.
    solution:
      - kind: given
        text: >-
          שתי נקודות על הקו: $(0\,\text{s},\ 0\,\text{m})$ ו-$(20\,\text{s},\ 100\,\text{m})$.
      - kind: formula
        text: >-
          $m = \dfrac{\Delta d}{\Delta t}$, ו-$1\,\text{m/s} = 3.6\,\text{km/h}$ (שיעור 0.2).
      - kind: substitution
        text: >-
          $m = \dfrac{100\,\text{m} - 0}{20\,\text{s} - 0} = 5\,\text{m/s}$, ו-$5\cdot 3.6 = 18\,\text{km/h}$.
      - kind: result
        text: >-
          השיפוע $5\,\text{m/s}$: בכל שנייה הרוכבת מתקדמת 5 מטרים, כלומר $18\,\text{km/h}$.

  - id: W-0.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-1]
    prompt: >-
      רץ מקיף מסלול של $400\,\text{m}$ בקצב קבוע תוך $80\,\text{s}$.

      (א) כמה זמן ייקח לו הסיבוב אם יגביר את המהירות פי 1.25?

      (ב) כמה זמן ייקח לו הסיבוב אם יאט למהירות שהיא פי 0.8 מהמהירות המקורית?

      (ג) חבר טוען: "מהירות גדולה ב-25% חוסכת 25% מהזמן". קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) $64\,\text{s}$.

      (ב) $100\,\text{s}$.

      (ג) לא: הזמן קטן פי 1.25, כלומר ב-20% בלבד.
    solution:
      - kind: reasoning
        text: >-
          אורך המסלול קבוע, ולכן המכפלה של המהירות בזמן קבועה: הזמן ביחס הפוך למהירות.
      - kind: formula
        text: >-
          $\dfrac{t_2}{t_1} = \dfrac{v_1}{v_2}$.
      - kind: substitution
        text: >-
          (א) $t_2 = 80\,\text{s}/1.25 = 64\,\text{s}$. (ב) $t_2 = 80\,\text{s}/0.8 = 100\,\text{s}$.
      - kind: reasoning
        text: >-
          (ג) בסעיף (א) נחסכו $16\,\text{s}$ מתוך $80\,\text{s}$, כלומר 20%. ביחס הפוך, "פי 1.25" בכיוון אחד הוא "חלקי 1.25" בכיוון השני, ולא "פחות 25%".
      - kind: result
        text: >-
          (א) $64\,\text{s}$. (ב) $100\,\text{s}$. (ג) החבר טועה: הזמן קטן ב-20%, לא ב-25%.

  - id: W-0.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-2]
    prompt: >-
      שני תלמידים שרטטו כל אחד גרף של המרחק של רכבת אחרת מתחנה, מול הזמן, על נייר משבצות.
      בגרף א משבצת אופקית היא $1\,\text{s}$ ומשבצת אנכית היא $10\,\text{m}$, והקו עולה 3 משבצות על כל 2 משבצות ימינה.
      בגרף ב משבצת אופקית היא $2\,\text{s}$ ומשבצת אנכית היא $5\,\text{m}$, והקו עולה 4 משבצות על כל משבצת אחת ימינה.

      (א) באיזה גרף הקו נראה תלול יותר?

      (ב) מצאו את השיפוע של כל קו, עם יחידות. איזו רכבת מתרחקת מהתחנה מהר יותר?
    answer: >-
      (א) בגרף ב.

      (ב) א: $15\,\text{m/s}$, ב: $10\,\text{m/s}$. הרכבת של גרף א מהירה יותר.
    solution:
      - kind: reasoning
        text: >-
          (א) על המשבצות, הקו של ב עולה 4 על 1 והקו של א עולה 3 על 2. הקו של ב נראה תלול הרבה יותר (בערך $76^\circ$ מול $56^\circ$).
      - kind: formula
        text: >-
          $m = \dfrac{\Delta d}{\Delta t}$, כאשר כל מספר משבצות מומר לפי קנה המידה של הציר שלו.
      - kind: substitution
        text: >-
          גרף א: $\Delta d = 3\cdot 10\,\text{m} = 30\,\text{m}$ ו-$\Delta t = 2\cdot 1\,\text{s} = 2\,\text{s}$, ולכן $m = 15\,\text{m/s}$.
          גרף ב: $\Delta d = 4\cdot 5\,\text{m} = 20\,\text{m}$ ו-$\Delta t = 1\cdot 2\,\text{s} = 2\,\text{s}$, ולכן $m = 10\,\text{m/s}$.
      - kind: result
        text: >-
          (א) הקו של ב נראה תלול יותר. (ב) השיפוע של א $15\,\text{m/s}$ ושל ב $10\,\text{m/s}$: הרכבת של א מהירה יותר. התלילות שבציור תלויה בקנה המידה, והשיפוע לא.

  - id: W-0.3-06
    level: mid
    qualitative: false
    objectives: [OBJ-0.3-3]
    prompt: >-
      תמרור בכביש הררי מודיע על "שיפוע 10%": על כל 100 מטרים במאוזן, הכביש עולה 10 מטרים.

      (א) מה זווית הכביש עם האופק?

      (ב) מכונית נוסעת $500\,\text{m}$ לאורך הכביש. לאיזה גובה היא עולה?
    answer: >-
      (א) כ-$5.7^\circ$.

      (ב) כ-$50\,\text{m}$ (ליתר דיוק $49.8\,\text{m}$).
    solution:
      - kind: given
        text: >-
          היחס בין הגובה לאורך האופקי $h/w = 10/100 = 0.1$. הדרך לאורך הכביש $L = 500\,\text{m}$ היא היתר.
      - kind: formula
        text: >-
          $\tan\theta = h/w$, ואחר כך $h = L\sin\theta$.
      - kind: substitution
        text: >-
          (א) $\theta = \tan^{-1}(0.1) \approx 5.71^\circ$. (ב) $h = 500\,\text{m}\cdot\sin 5.71^\circ \approx 500\cdot 0.0995 \approx 49.8\,\text{m}$.
      - kind: reasoning
        text: >-
          "שיפוע 10%" נמדד מול המרחק האופקי, אבל המכונית נוסעת לאורך הכביש. בזווית קטנה כמו זו, ההבדל בין השניים קטן (כחצי אחוז), ולכן $0.1\cdot 500 = 50\,\text{m}$ הוא קירוב טוב.
      - kind: result
        text: >-
          (א) כ-$5.7^\circ$. (ב) המכונית עולה כ-$50\,\text{m}$.

  - id: W-0.3-07
    level: mid
    qualitative: false
    objectives: [OBJ-0.3-2, OBJ-0.3-1]
    prompt: >-
      מעלית עולה בקצב קבוע. חיישן מודד את הגובה $h$ שלה מעל הקרקע:

      $t\ (\text{s})$: 0, 2, 4, 6. $h\ (\text{m})$: 12, 18, 24, 30.

      (א) כתבו את הגובה כפונקציה קווית של הזמן, $h = m\,t + b$, ופרשו את $m$ ואת $b$.

      (ב) מה יהיה הגובה ב-$t = 10\,\text{s}$, אם המעלית תמשיך באותו קצב?

      (ג) האם הגובה ביחס ישר לזמן?
    answer: >-
      (א) $h = 3\,\text{m/s}\cdot t + 12\,\text{m}$.

      (ב) $42\,\text{m}$.

      (ג) לא.
    solution:
      - kind: given
        text: >-
          בכל $2\,\text{s}$ הגובה עולה ב-$6\,\text{m}$: ההפרש קבוע, ולכן הגרף קו ישר.
      - kind: formula
        text: >-
          $m = \dfrac{\Delta h}{\Delta t}$, ו-$b$ הוא הגובה ב-$t = 0$.
      - kind: substitution
        text: >-
          $m = \dfrac{30\,\text{m} - 12\,\text{m}}{6\,\text{s} - 0} = 3\,\text{m/s}$, ו-$b = 12\,\text{m}$ (השורה הראשונה). ב-$t = 10\,\text{s}$: $h = 3\cdot 10 + 12 = 42\,\text{m}$.
      - kind: reasoning
        text: >-
          $m$ הוא הקצב שבו המעלית עולה, ו-$b$ הוא הגובה שממנו התחילה למדוד. בגלל ש-$b \neq 0$, זמן כפול לא נותן גובה כפול: ב-$2\,\text{s}$ $18\,\text{m}$, וב-$4\,\text{s}$ $24\,\text{m}$.
      - kind: result
        text: >-
          (א) $h = 3\,\text{m/s}\cdot t + 12\,\text{m}$: המעלית עולה $3\,\text{m}$ בכל שנייה, והתחילה בגובה $12\,\text{m}$. (ב) $42\,\text{m}$. (ג) לא, הגובה הוא פונקציה קווית של הזמן, לא יחס ישר.

  - id: W-0.3-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.3-3, OBJ-0.3-1]
    prompt: >-
      סולם באורך $5\,\text{m}$ נשען על קיר אנכי, והרגליים שלו על הרצפה, $1.4\,\text{m}$ מהקיר.

      (א) לאיזה גובה על הקיר מגיע הסולם, ומה הזווית שלו עם הרצפה?

      (ב) הרגליים מחליקות והתרחקו מהקיר עוד $1.6\,\text{m}$ (עד $3\,\text{m}$ מהקיר). בכמה ירד הקצה העליון?

      (ג) קבעו ונמקו: האם הירידה של הקצה העליון ביחס ישר להחלקה של הרגליים?
    answer: >-
      (א) $4.8\,\text{m}$, בזווית של כ-$74^\circ$.

      (ב) $0.8\,\text{m}$.

      (ג) לא.
    solution:
      - kind: given
        text: >-
          הסולם הוא היתר, $L = 5\,\text{m}$. הזווית הישרה בין הקיר לרצפה. המרחק של הרגליים מהקיר הוא הניצב $w$: בהתחלה $w_1 = 1.4\,\text{m}$, ואחרי ההחלקה $w_2 = 3\,\text{m}$.
      - kind: formula
        text: >-
          פיתגורס: $h = \sqrt{L^2 - w^2}$. הזווית עם הרצפה: $\cos\theta = w/L$.
      - kind: substitution
        text: >-
          (א) $h_1 = \sqrt{25 - 1.96}\,\text{m} = \sqrt{23.04}\,\text{m} = 4.8\,\text{m}$, ו-$\theta_1 = \cos^{-1}(1.4/5) = \cos^{-1}(0.28) \approx 73.7^\circ$.
      - kind: substitution
        text: >-
          (ב) $h_2 = \sqrt{25 - 9}\,\text{m} = 4\,\text{m}$, ולכן הקצה העליון ירד $4.8 - 4 = 0.8\,\text{m}$. הזווית ירדה ל-$\cos^{-1}(0.6) \approx 53.1^\circ$.
      - kind: reasoning
        text: >-
          (ג) בודקים החלקה נוספת: אם הרגליים מתרחקות עוד $1\,\text{m}$, עד $4\,\text{m}$ מהקיר, הגובה יורד ל-$\sqrt{25 - 16}\,\text{m} = 3\,\text{m}$, כלומר עוד $1\,\text{m}$ של ירידה על $1\,\text{m}$ של החלקה.
          בהחלקה הראשונה, $1.6\,\text{m}$ של החלקה נתנו רק $0.8\,\text{m}$ של ירידה. המנה (ירידה חלקי החלקה) לא קבועה, ולכן אין יחס ישר: הקשר עובר דרך פיתגורס, וככל שהסולם נוטה יותר, אותה החלקה מורידה את הקצה יותר.
      - kind: result
        text: >-
          (א) $4.8\,\text{m}$, בזווית של כ-$74^\circ$. (ב) הקצה העליון ירד $0.8\,\text{m}$. (ג) לא: הירידה אינה ביחס ישר להחלקה.

  - id: W-0.3-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.3-1]
    prompt: >-
      מרחק העצירה של מכונית הוא סכום של שני חלקים. מרחק התגובה, שהמכונית עוברת עד שהנהג לוחץ על הבלם, ביחס ישר למהירות.
      מרחק הבלימה, מהלחיצה ועד העצירה, ביחס ישר לריבוע המהירות. במהירות מסוימת מרחק התגובה $15\,\text{m}$ ומרחק הבלימה $10\,\text{m}$.

      (א) מה יהיו שני החלקים, ומה מרחק העצירה, במהירות כפולה?

      (ב) פי כמה גדל מרחק העצירה? הסבירו למה התשובה לא 2 וגם לא 4.
    answer: >-
      (א) מרחק תגובה $30\,\text{m}$, מרחק בלימה $40\,\text{m}$, ומרחק עצירה $70\,\text{m}$.

      (ב) פי 2.8.
    solution:
      - kind: given
        text: >-
          במהירות $v$: מרחק תגובה $15\,\text{m}$, מרחק בלימה $10\,\text{m}$, ובסך הכול $25\,\text{m}$. המהירות גדלה פי 2.
      - kind: formula
        text: >-
          חלק ביחס ישר גדל פי 2. חלק ביחס ישר לריבוע גדל פי $2^2 = 4$.
      - kind: substitution
        text: >-
          מרחק תגובה $15\cdot 2 = 30\,\text{m}$, מרחק בלימה $10\cdot 4 = 40\,\text{m}$, ובסך הכול $70\,\text{m}$. היחס $70/25 = 2.8$.
      - kind: reasoning
        text: >-
          מרחק העצירה הוא סכום של חלק שגדל פי 2 ושל חלק שגדל פי 4, ולכן הוא גדל פי מספר שביניהם. ככל שהמהירות גבוהה יותר, חלק הבלימה תופס יותר מהסכום, והיחס מתקרב ל-4.
      - kind: result
        text: >-
          (א) $30\,\text{m}$ ו-$40\,\text{m}$, ובסך הכול $70\,\text{m}$. (ב) פי 2.8: בין 2 ל-4, כי רק חלק ממרחק העצירה ביחס ישר לריבוע המהירות.

  - id: W-0.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      במפת טיולים משורטט חתך של שביל ישר: הגובה מעל פני הים מול המרחק האופקי, שניהם במטרים. הקו עובר בנקודות $(200\,\text{m},\ 50\,\text{m})$ ו-$(600\,\text{m},\ 250\,\text{m})$.

      (א) מה השיפוע של הקו? מה היחידות שלו?

      (ב) מה זווית השביל עם האופק?

      (ג) מה האורך של השביל בין שתי הנקודות, כפי שהמטיילים הולכים בו?

      (ד) במפה אחרת שרטטו את אותו חתך, אבל הציר האנכי "נמתח" פי 5, כדי שהגבעות ייראו ברור. מה משתנה בשיפוע, ומה בזווית שבציור?
    answer: >-
      (א) $0.5$, בלי יחידות.

      (ב) כ-$26.6^\circ$.

      (ג) כ-$447\,\text{m}$.

      (ד) השיפוע נשאר $0.5$; הזווית שבציור גדלה לכ-$68^\circ$.
    solution:
      - kind: given
        text: >-
          שתי נקודות על הקו: $(200\,\text{m},\ 50\,\text{m})$ ו-$(600\,\text{m},\ 250\,\text{m})$. שני הצירים במטרים.
      - kind: formula
        text: >-
          $m = \dfrac{\Delta y}{\Delta x}$. כשהצירים באותן יחידות ובאותו קנה מידה, $\tan\theta = m$. אורך השביל לפי פיתגורס: $L = \sqrt{\Delta x^2 + \Delta y^2}$.
      - kind: substitution
        text: >-
          (א) $m = \dfrac{250\,\text{m} - 50\,\text{m}}{600\,\text{m} - 200\,\text{m}} = \dfrac{200\,\text{m}}{400\,\text{m}} = 0.5$. (ב) $\theta = \tan^{-1}(0.5) \approx 26.6^\circ$.
          (ג) $L = \sqrt{400^2 + 200^2}\,\text{m} = \sqrt{200000}\,\text{m} \approx 447\,\text{m}$.
      - kind: reasoning
        text: >-
          (ד) השיפוע מחושב ממספרים: אותם $\Delta y$ ו-$\Delta x$ במטרים, ולכן הוא לא משתנה. אבל בציור כל מטר אנכי ארוך פי 5 ממטר אופקי, ולכן הקו נראה תלול יותר: $\tan^{-1}(5\cdot 0.5) = \tan^{-1}(2.5) \approx 68^\circ$. במפה כזו הזווית שבציור כבר לא הזווית האמיתית של השביל.
      - kind: result
        text: >-
          (א) $0.5$, מטרים חלקי מטרים, כלומר בלי יחידות. (ב) כ-$26.6^\circ$. (ג) כ-$447\,\text{m}$. (ד) השיפוע נשאר $0.5$, והזווית שבציור גדלה לכ-$68^\circ$.

challenge:
  - id: W-0.3-c1
    stars: 1
    objectives: [OBJ-0.3-1]
    prompt: >-
      באמבטיה שלושה ברווזי גומי, אדום, ירוק וכחול. לשלושתם אותה צורה בדיוק והם עשויים מאותו חומר, אבל הם בגדלים שונים.
      האורך של הברווז האדום שווה לסכום האורכים של הכחול ושל הירוק. השטח של בסיס הברווז הירוק גדול פי 4 מהשטח של בסיס הברווז הכחול.
      המסה של הברווז הכחול $3\,\text{g}$.

      (א) מה המסה של הברווז הירוק, ומה המסה של הברווז האדום?

      (ב) פי כמה גדול השטח של בסיס הברווז האדום מהשטח של בסיס הברווז הכחול?

      רמז: בגופים שלהם אותה צורה, כל שטח ביחס ישר לריבוע האורך, וכל נפח, ולכן גם המסה, ביחס ישר לחזקה השלישית של האורך.
    answer: >-
      (א) הירוק $24\,\text{g}$, האדום $81\,\text{g}$.

      (ב) פי 9.
    solution:
      - kind: given
        text: >-
          נסמן ב-$\ell$ את אורך הברווז הכחול. השטח ביחס ישר ל-$\ell^2$, והמסה ביחס ישר ל-$\ell^3$.
      - kind: reasoning
        text: >-
          השטח של הירוק גדול פי 4, כלומר פי $2^2$: האורך שלו גדול פי 2, והוא $2\ell$. האורך של האדום הוא $\ell + 2\ell = 3\ell$, פי 3 מהכחול.
      - kind: formula
        text: >-
          $\dfrac{M_2}{M_1} = \left(\dfrac{\ell_2}{\ell_1}\right)^3$ ו-$\dfrac{A_2}{A_1} = \left(\dfrac{\ell_2}{\ell_1}\right)^2$.
      - kind: substitution
        text: >-
          ירוק: $3\,\text{g}\cdot 2^3 = 24\,\text{g}$. אדום: $3\,\text{g}\cdot 3^3 = 81\,\text{g}$. בסיס האדום: $3^2 = 9$ פעמים בסיס הכחול.
      - kind: result
        text: >-
          (א) הירוק $24\,\text{g}$ והאדום $81\,\text{g}$, ולא $3 + 24 = 27\,\text{g}$: האורכים מתחברים, המסות לא. (ב) הבסיס של האדום גדול פי 9.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2010
      problem: 'Question 22'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2010.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-0.3-c2
    stars: 1
    objectives: [OBJ-0.3-3]
    prompt: >-
      אסטרונאוטית נוחתת על כוכב לכת מכוסה ים, ועומדת על צוק, כך שהעין שלה $100\,\text{m}$ מעל פני הים.
      היא רואה את קו האופק, בכל הכיוונים, בזווית של $0.3^\circ$ מתחת לקו האופקי שעובר בעין שלה.

      (א) מה הרדיוס $R$ של כוכב הלכת?

      (ב) מה המרחק מהעין שלה לקו האופק?

      רמז: קו המבט אל האופק משיק לפני הים, ולכן הוא ניצב לרדיוס שיוצא ממרכז הכוכב אל נקודת האופק. שרטטו את המשולש שקודקודיו מרכז הכוכב, העין ונקודת האופק, והראו שהזווית שלו במרכז הכוכב שווה ל-$0.3^\circ$.
    answer: >-
      (א) $R \approx 7.3\cdot 10^6\,\text{m}$.

      (ב) כ-$38\,\text{km}$.
    solution:
      - kind: given
        text: >-
          הגובה $h = 100\,\text{m}$, וזווית הירידה של קו המבט $\theta = 0.3^\circ$. נסמן במרכז הכוכב O, בעין E ובנקודת האופק H.
      - kind: reasoning
        text: >-
          במשולש OHE הזווית ב-H ישרה, כי קו המבט EH משיק לפני הים. היתר הוא $OE = R + h$, הניצב $OH = R$, והניצב $EH = d$ הוא המרחק לאופק.
          הקו האופקי בעין ניצב ל-OE, וקו המבט ניצב ל-OH. לכן הזווית בין הקו האופקי לקו המבט שווה לזווית שבין OE ל-OH: הזווית במרכז היא $\theta$.
      - kind: formula
        text: >-
          $\cos\theta = \dfrac{R}{R + h}$, ואחר כך $d = R\tan\theta$.
      - kind: manipulation
        text: >-
          כופלים ב-$(R + h)$: $R\cos\theta + h\cos\theta = R$. מעבירים את האיברים עם $R$ לצד אחד: $h\cos\theta = R(1 - \cos\theta)$, ולכן $R = \dfrac{h\cos\theta}{1 - \cos\theta}$.
      - kind: substitution
        text: >-
          $\cos 0.3^\circ \approx 0.9999863$, ולכן $1 - \cos\theta \approx 1.371\cdot 10^{-5}$ ו-$R \approx \dfrac{100\,\text{m}}{1.371\cdot 10^{-5}} \approx 7.3\cdot 10^6\,\text{m}$.
          $d = R\tan 0.3^\circ \approx 7.30\cdot 10^6\,\text{m}\cdot 0.005236 \approx 3.8\cdot 10^4\,\text{m}$.
      - kind: reasoning
        text: >-
          בדיקה בפיתגורס: $d^2 = (R + h)^2 - R^2 = 2Rh + h^2 \approx 2\cdot 7.3\cdot 10^6\cdot 100\,\text{m}^2$, ולכן $d \approx 3.8\cdot 10^4\,\text{m}$. כאן חשוב שהמחשבון יהיה במעלות, ושלא תעגלו את $\cos\theta$ לפני החיסור: $1 - \cos\theta$ מספר זעיר.
      - kind: result
        text: >-
          (א) $R \approx 7.3\cdot 10^6\,\text{m}$. (ב) האופק במרחק של כ-$38\,\text{km}$.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2010
      problem: 'Question 24'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2010.pdf
      verified: '2026-11-05'
      adapted: true
