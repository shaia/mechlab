# Workbook, lesson 0.4 (graphs and linearization). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every table was generated with src/physics/lab.ts (measure, seeded scatter; G from constants.ts) and every slope and
# intercept recomputed with fitLine; the values "read on the line" are the least-squares line at those x values.
# The learner works on paper, so a line drawn by eye whose slope is within about 5% of the fit counts as right.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '0.4'
practice:
  - id: W-0.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-0.4-1]
    prompt: >-
      עגלה נוסעת לאורך מסילה ישרה. הראשית של ציר המקום בתחילת המסילה, והכיוון החיובי הוא לאורך המסילה. בכל שנייה רושמים את המקום $x$ של העגלה:

      $$\begin{array}{c|cccccc} t\ (\text{s}) & 0 & 1 & 2 & 3 & 4 & 5 \\ \hline x\ (\text{m}) & 0.30 & 0.70 & 1.10 & 1.50 & 1.90 & 2.32 \end{array}$$

      א. הגרף משורטט על דף משבצות שרוחבו $10\,\text{cm}$ וגובהו $15\,\text{cm}$. איזה גודל שמים על כל ציר, ואיזה קנה מידה כדאי לבחור לכל ציר?

      ב. שרטטו את הגרף והעבירו קו מגמה. קראו ממנו את המקום של העגלה ב-$t = 2.5\,\text{s}$, ואת הרגע שבו היא הייתה ב-$x = 1.50\,\text{m}$.
    answer: >-
      א. $t$ על הציר האופקי, $1\,\text{cm} = 0.5\,\text{s}$; $x$ על הציר האנכי, $1\,\text{cm} = 0.2\,\text{m}$.

      ב. ב-$t = 2.5\,\text{s}$ העגלה בערך ב-$x = 1.30\,\text{m}$, וב-$x = 1.50\,\text{m}$ היא בערך ב-$t = 3.0\,\text{s}$.
    solution:
      - kind: given
        text: >-
          שש מדידות. את הרגעים קבעו (כל שנייה), ואת המקום מדדו.
      - kind: reasoning
        text: >-
          א. על הציר האופקי $t\ (\text{s})$, מ-$0$ עד $5\,\text{s}$: ב-$1\,\text{cm} = 0.5\,\text{s}$ הוא תופס את כל $10\,\text{cm}$ של הרוחב.
          על הציר האנכי $x\ (\text{m})$, עד $2.32\,\text{m}$: ב-$1\,\text{cm} = 0.2\,\text{m}$ הוא תופס $11.6\,\text{cm}$ מתוך $15$.
          ($1\,\text{cm} = 0.1\,\text{m}$ היה דורש $23\,\text{cm}$, ו-$1\,\text{cm} = 0.5\,\text{m}$ היה דוחס את הנקודות לפחות מחצי הגובה.)
      - kind: reasoning
        text: >-
          ב. הנקודות כמעט על קו ישר. מעבירים קו מגמה. מ-$t = 2.5\,\text{s}$ עולים אנכית עד הקו, ופונים לציר האנכי. ומ-$x = 1.50\,\text{m}$ הולכים אופקית עד הקו, ויורדים לציר האופקי.
      - kind: result
        text: >-
          ב-$t = 2.5\,\text{s}$ העגלה בערך ב-$x = 1.30\,\text{m}$, וב-$x = 1.50\,\text{m}$ היא בערך ב-$t = 3.0\,\text{s}$.
          קוראים מהקו ולא מהטבלה, ולכן התשובה השנייה יוצאת $3.0\,\text{s}$ גם אם המדידה ב-$3\,\text{s}$ הייתה סוטה מעט.

  - id: W-0.4-02
    level: basic
    qualitative: false
    objectives: [OBJ-0.4-2]
    prompt: >-
      עגלה נוסעת בקצב קבוע **לכיוון** חיישן. החיישן מודד את המקום $x$ שלה על ציר שהראשית שלו בחיישן, והכיוון החיובי שלו מתרחק מהחיישן.
      קו המגמה בגרף של $x$ מול $t$ עובר בנקודות $(2.0\,\text{s},\ 1.90\,\text{m})$ ו-$(6.0\,\text{s},\ 0.70\,\text{m})$.
      מצאו את השיפוע ואת נקודת החיתוך עם הציר האנכי, עם יחידות, והסבירו מה כל אחד מהם אומר על העגלה.
    answer: >-
      השיפוע $-0.30\,\text{m/s}$: העגלה מתקרבת לחיישן $0.30\,\text{m}$ בכל שנייה.

      נקודת החיתוך $2.50\,\text{m}$: המקום שלה ברגע $t = 0$.
    solution:
      - kind: given
        text: >-
          שתי נקודות על קו המגמה: $(x_1, y_1) = (2.0\,\text{s},\ 1.90\,\text{m})$ ו-$(x_2, y_2) = (6.0\,\text{s},\ 0.70\,\text{m})$. הציר חיובי בכיוון שמתרחק מהחיישן.
      - kind: formula
        text: >-
          השיפוע $\dfrac{\Delta y}{\Delta x} = \dfrac{y_2 - y_1}{x_2 - x_1}$. את נקודת החיתוך $b$ מוצאים מאחת הנקודות: הולכים לאורך הקו אחורה עד $t = 0$: מ-$y_1$ מחסירים את השיפוע כפול $x_1$.
      - kind: substitution
        text: >-
          $$\frac{\Delta y}{\Delta x} = \frac{0.70\ \text{m} - 1.90\ \text{m}}{6.0\ \text{s} - 2.0\ \text{s}} = \frac{-1.20\ \text{m}}{4.0\ \text{s}} = -0.30\ \text{m/s}$$
          $$b = 1.90\ \text{m} - (-0.30\ \text{m/s})\cdot 2.0\ \text{s} = 1.90\ \text{m} + 0.60\ \text{m} = 2.50\ \text{m}$$
      - kind: reasoning
        text: >-
          השיפוע שלילי, כי $x$ קטן עם הזמן: העגלה נעה נגד כיוון הציר, כלומר לכיוון החיישן, $0.30\,\text{m}$ בכל שנייה. נקודת החיתוך היא הערך של $x$ כאשר $t = 0$.
      - kind: result
        text: >-
          השיפוע $-0.30\,\text{m/s}$ (העגלה מתקרבת לחיישן $0.30\,\text{m}$ בכל שנייה), ונקודת החיתוך $2.50\,\text{m}$ (המקום שלה ברגע $t = 0$).

  - id: W-0.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.4-2]
    prompt: >-
      לכל אחד מהגרפים, כתבו את היחידות של השיפוע, ואמרו במילים מה השיפוע מתאר.

      א. המסה $m$ (ב-$\text{kg}$) של כמה גושים מאותה מתכת, מול הנפח שלהם $V$ (ב-$\text{m}^3$).

      ב. המקום $x$ (ב-$\text{m}$) של עגלה, מול הזמן $t$ (ב-$\text{s}$).

      ג. האורך $L$ (ב-$\text{m}$) של קפיץ, מול המסה $m$ (ב-$\text{kg}$) של המשקולת שתלויה עליו.

      ד. הגובה $d$ (ב-$\text{m}$) שכדור נפל ממנוחה, מול $t^2$ (ב-$\text{s}^2$).
    answer: >-
      א. $\text{kg/m}^3$: כמה קילוגרמים יש בכל מטר מעוקב של המתכת.

      ב. $\text{m/s}$: כמה מטרים העגלה עוברת בכל שנייה.

      ג. $\text{m/kg}$: בכמה מטרים הקפיץ מתארך על כל קילוגרם נוסף.

      ד. $\text{m/s}^2$: יחידות של תאוצה; השיפוע הוא $\tfrac12 g$.
    solution:
      - kind: formula
        text: >-
          היחידות של השיפוע הן היחידות של הציר האנכי חלקי היחידות של הציר האופקי, כי השיפוע הוא $\Delta y/\Delta x$.
      - kind: reasoning
        text: >-
          א. $\text{kg}$ חלקי $\text{m}^3$: כמה קילוגרמים בכל מטר מעוקב. כל הגושים מאותה מתכת, ולכן השיפוע אחד לכולם.

          ב. $\text{m}$ חלקי $\text{s}$: כמה מטרים בכל שנייה (בשיעור 1.3 זו תהיה המהירות).
      - kind: reasoning
        text: >-
          ג. $\text{m}$ חלקי $\text{kg}$: ההתארכות על כל קילוגרם נוסף.

          ד. $\text{m}$ חלקי $\text{s}^2$, כמו תאוצה. לפי $d = \tfrac12 g\,t^2$, השיפוע הוא $\tfrac12 g$.
      - kind: result
        text: >-
          א. $\text{kg/m}^3$. ב. $\text{m/s}$. ג. $\text{m/kg}$. ד. $\text{m/s}^2$.

          בכל המקרים היחידות של השיפוע רומזות איזה גודל פיזיקלי הוא מייצג. שיפוע בלי יחידות אינו תשובה.

  - id: W-0.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-2]
    prompt: >-
      כדור משוחרר ממנוחה בראש מדרון. תלמיד מודד בשעון עצר את הזמן שהכדור עובר $1.00\,\text{m}$ במורד, שש פעמים:

      $$1.38\ \ 1.43\ \ 1.39\ \ 1.44\ \ 1.42\ \ 1.68 \quad (\text{s})$$

      א. קבעו ונמקו: האם אחת המדידות חשודה?

      ב. מה ההערכה הטובה ביותר לזמן, ומה אי-הוודאות שלה בערך?

      ג. הסבירו למה שער אור, שמודד את הזמן אוטומטית, נותן מדידות טובות יותר משעון עצר ביד.
    answer: >-
      א. כן: $1.68\,\text{s}$ רחוקה מהשאר הרבה יותר מהפיזור שלהן.

      ב. הממוצע של חמש המדידות, $1.41\,\text{s}$, עם אי-ודאות של כ-$0.03\,\text{s}$.

      ג. שעון ביד מוסיף את זמן התגובה של התלמיד, שמשתנה מפעם לפעם.
    solution:
      - kind: reasoning
        text: >-
          א. חמש מדידות נמצאות בין $1.38$ ל-$1.44\,\text{s}$: פיזור של $0.06\,\text{s}$. המדידה $1.68\,\text{s}$ רחוקה מהן בכ-$0.25\,\text{s}$, פי 4 מכל הפיזור. כנראה התלמיד עצר את השעון באיחור. אם אפשר, חוזרים עליה; אם לא, משאירים אותה בחוץ וכותבים זאת.
      - kind: substitution
        text: >-
          ב. הממוצע של חמש המדידות:
          $$\bar t = \frac{1.38 + 1.43 + 1.39 + 1.44 + 1.42}{5}\ \text{s} = \frac{7.06}{5}\ \text{s} \approx 1.41\ \text{s}$$
          אי-הוודאות בערך חצי מהפיזור: $\dfrac{1.44 - 1.38}{2} = 0.03\,\text{s}$.
      - kind: reasoning
        text: >-
          מי שמכניס גם את $1.68\,\text{s}$ לממוצע מקבל כ-$1.46\,\text{s}$: מדידה שגויה אחת מזיזה את התוצאה פי 1.5 מאי-הוודאות.
      - kind: reasoning
        text: >-
          ג. ביד, התלמיד לוחץ קצת אחרי שהכדור יוצא וקצת אחרי שהוא מגיע, וזמן התגובה (עשיריות שנייה) משתנה בכל פעם. שער אור מגיב לכדור עצמו, ולכן הפיזור שלו קטן בהרבה.
      - kind: result
        text: >-
          הזמן $1.41\,\text{s}$, עם אי-ודאות של כ-$0.03\,\text{s}$. המדידה $1.68\,\text{s}$ חשודה ומחוץ לחישוב, ושער אור היה מקטין את אי-הוודאות.

  - id: W-0.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-3]
    prompt: >-
      לכל אחד מהחוקים, קבעו מה לשים על הציר האנכי ומה על הציר האופקי, כדי לקבל קו ישר, ומה השיפוע. בכל חוק, הגודל הראשון ברשימה בסוגריים הוא הגודל שקובעים.

      א. עגלה בקצב קבוע: $x = x_0 + v\,t$ (קובעים $t$, מודדים $x$).

      ב. גודל המהירות של כדור אחרי שנפל ממנוחה גובה $h$: $v^2 = 2g\,h$ (קובעים $h$, מודדים $v$).

      ג. זמן הנפילה ממנוחה מגובה $h$: $t = \sqrt{2h/g}$ (קובעים $h$, מודדים $t$).

      ד. משקולת שמתנודדת על קפיץ: $T = 2\pi\sqrt{m/k}$ (קובעים $m$, מודדים $T$).
    answer: >-
      א. $x$ מול $t$, שיפוע $v$ (וחיתוך $x_0$).

      ב. $v^2$ מול $h$, שיפוע $2g$.

      ג. $t^2$ מול $h$, שיפוע $2/g$.

      ד. $T^2$ מול $m$, שיפוע $4\pi^2/k$.
    solution:
      - kind: formula
        text: >-
          הכלל: כותבים את החוק כך שבצד אחד הגודל שמודדים (או פונקציה שלו), ובצד השני קבוע כפול הגודל שקובעים (או פונקציה שלו). את מה שבצד השני שמים על הציר האופקי, והקבוע הוא השיפוע.
      - kind: reasoning
        text: >-
          א. החוק כבר קו ישר מול $t$: השיפוע $v$, ונקודת החיתוך $x_0$. אין צורך לשנות דבר.

          ב. $v^2 = (2g)\cdot h$: קו ישר דרך הראשית בגרף של $v^2$ מול $h$, עם שיפוע $2g$.
      - kind: manipulation
        text: >-
          ג. מעלים בריבוע: $t^2 = \left(\dfrac{2}{g}\right)\cdot h$. קו ישר דרך הראשית בגרף של $t^2$ מול $h$, עם שיפוע $2/g$. (גם $t$ מול $\sqrt h$ הוא קו ישר, עם שיפוע $\sqrt{2/g}$.)

          ד. מעלים בריבוע: $T^2 = \left(\dfrac{4\pi^2}{k}\right)\cdot m$. קו ישר דרך הראשית בגרף של $T^2$ מול $m$.
      - kind: result
        text: >-
          א. $x$ מול $t$ (שיפוע $v$). ב. $v^2$ מול $h$ (שיפוע $2g$). ג. $t^2$ מול $h$ (שיפוע $2/g$). ד. $T^2$ מול $m$ (שיפוע $4\pi^2/k$).

  - id: W-0.4-06
    level: mid
    qualitative: false
    objectives: [OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      מפילים כדור ממנוחה מגבהים שונים $h$, ושער אור מודד את זמן הנפילה $t$:

      $$\begin{array}{c|cccccc} h\ (\text{m}) & 0.20 & 0.40 & 0.60 & 0.80 & 1.00 & 1.20 \\ \hline t\ (\text{s}) & 0.198 & 0.282 & 0.346 & 0.402 & 0.452 & 0.488 \end{array}$$

      לפי המכניקה $h = \tfrac12 g\,t^2$. התלמידים קבעו את $h$, ולכן רוצים אותו על הציר האופקי.

      א. איזה גודל לשים על הציר האנכי, כדי לקבל קו ישר? מה השיפוע של הקו, באותיות?

      ב. שרטטו את הגרף, מצאו את השיפוע עם יחידות, ומצאו ממנו את $g$.

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. $t^2$ מול $h$, עם שיפוע $2/g$.

      ב. השיפוע כ-$0.202\,\text{s}^2/\text{m}$, ולכן $g \approx 9.9\,\text{m/s}^2$.
    solution:
      - kind: manipulation
        text: >-
          א. מבודדים את $t^2$: $t^2 = \left(\dfrac{2}{g}\right)\cdot h$. קו ישר דרך הראשית בגרף של $t^2$ מול $h$, עם שיפוע $2/g$. לכן $g$ הוא 2 חלקי השיפוע.
      - kind: substitution
        text: >-
          ב. מחשבים את $t^2$ (ב-$\text{s}^2$): $0.0392,\ 0.0795,\ 0.1197,\ 0.1616,\ 0.2043,\ 0.2381$. על קו המגמה קוראים $t^2 = 0.0396\,\text{s}^2$ ב-$h = 0.20\,\text{m}$, ו-$t^2 = 0.2412\,\text{s}^2$ ב-$h = 1.20\,\text{m}$:
          $$\frac{\Delta (t^2)}{\Delta h} = \frac{0.2412\ \text{s}^2 - 0.0396\ \text{s}^2}{1.20\ \text{m} - 0.20\ \text{m}} = \frac{0.2016\ \text{s}^2}{1.00\ \text{m}} \approx 0.202\ \text{s}^2/\text{m}$$
      - kind: substitution
        text: >-
          $$g = \frac{2}{0.202\ \text{s}^2/\text{m}} \approx 9.9\ \text{m/s}^2$$
          בדיקת יחידות: $1$ חלקי $\text{s}^2/\text{m}$ הוא $\text{m/s}^2$, יחידות של תאוצה.
      - kind: result
        text: >-
          גרף של $t^2$ מול $h$ הוא קו ישר דרך הראשית, עם שיפוע כ-$0.202\,\text{s}^2/\text{m}$, ולכן $g \approx 9.9\,\text{m/s}^2$. כשהצירים הפוכים מאשר בשיעור, השיפוע הוא ההפכי, ו-$g$ הוא 2 חלקי השיפוע.

  - id: W-0.4-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-1, OBJ-0.4-3]
    prompt: >-
      אלה המדידות של הכדור הנופל מאיור 0.4ב:

      $$\begin{array}{c|cccccc} t\ (\text{s}) & 0.141 & 0.283 & 0.375 & 0.448 & 0.514 & 0.566 \\ \hline d\ (\text{m}) & 0.1 & 0.4 & 0.7 & 1.0 & 1.3 & 1.6 \end{array}$$

      תלמיד העביר קו ישר דרך הנקודות של $d$ מול $t$, וקיבל שיפוע $3.52\,\text{m/s}$ ונקודת חיתוך $-0.51\,\text{m}$. הוא כתב: "הכדור נופל $3.52$ מטרים בכל שנייה".

      א. מצאו שתי סיבות, מתוך הגרף שלו עצמו, לכך שהקו הישר לא מתאר את המדידות.

      ב. בלי לשרטט: חשבו את המנות $d/t$ ו-$d/t^2$ בשורה הראשונה ובשורה האחרונה. מה הן אומרות על הגרף שכדאי לשרטט?
    answer: >-
      א. הקו חותך את הציר ב-$-0.51\,\text{m}$, אף שב-$t = 0$ הכדור עוד לא נפל; והנקודות מתעקמות סביבו (באמצע מתחתיו, בקצוות מעליו).

      ב. $d/t$ גדל מ-$0.71$ ל-$2.83\,\text{m/s}$, ו-$d/t^2$ נשאר כ-$5.0\,\text{m/s}^2$: כדאי לשרטט $d$ מול $t^2$.
    solution:
      - kind: reasoning
        text: >-
          א. סיבה ראשונה: ב-$t = 0$ הכדור במקום ההתחלה, ולכן הקו של החוק חייב לעבור בראשית. קו שחותך ב-$-0.51\,\text{m}$ אומר שבתחילת הנפילה הכדור היה "מעל" נקודת השחרור, וזה בלתי אפשרי.
      - kind: reasoning
        text: >-
          סיבה שנייה: הנקודות לא מתפזרות סביב הקו באקראי. הן מתחתיו באמצע ומעליו בשני הקצוות, כלומר הן יושבות על עקומה. על עקומה אין שיפוע אחד, ולכן גם "$3.52$ מטרים בכל שנייה" אינו נכון: בהתחלה הכדור נופל לאט, ובהמשך מהר יותר.
      - kind: substitution
        text: >-
          ב. בשורה הראשונה $d/t = 0.1/0.141 \approx 0.71\,\text{m/s}$, ובאחרונה $1.6/0.566 \approx 2.83\,\text{m/s}$.
          בשורה הראשונה $d/t^2 = 0.1/0.141^2 \approx 5.0\,\text{m/s}^2$, ובאחרונה $1.6/0.566^2 \approx 5.0\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          מנה קבועה פירושה יחס ישר. $d$ לא ביחס ישר ל-$t$, אבל כן ל-$t^2$. לכן הגרף שכדאי לשרטט הוא $d$ מול $t^2$: קו ישר דרך הראשית, ששיפועו כ-$5.0\,\text{m/s}^2$, כלומר $\tfrac12 g$.
      - kind: result
        text: >-
          הקו הישר מול $t$ חותך את הציר במקום בלתי אפשרי, והנקודות מתעקמות סביבו. המנה $d/t^2$ קבועה, ולכן משרטטים $d$ מול $t^2$, ומהשיפוע (כ-$5.0\,\text{m/s}^2$) מקבלים $g \approx 10\,\text{m/s}^2$.

  - id: W-0.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      כדור מתגלגל על שולחן ועוזב את קצה השולחן כשהוא נע אופקית, בכל הניסויים באותו קצב, $v_0$. משנים את הגובה $H$ של השולחן מעל הרצפה, ומודדים את המרחק האופקי $R$ מקצה השולחן עד המקום שבו הכדור פוגע ברצפה:

      $$\begin{array}{c|ccccc} H\ (\text{m}) & 0.20 & 0.40 & 0.60 & 0.80 & 1.00 \\ \hline R\ (\text{m}) & 0.298 & 0.421 & 0.521 & 0.598 & 0.668 \end{array}$$

      בפרק 2 תראו שבלי התנגדות אוויר $R = v_0\sqrt{\dfrac{2H}{g}}$.

      א. איזה גרף כדאי לשרטט כדי לקבל קו ישר שהכי פשוט למצוא ממנו את $v_0$? מה השיפוע שלו, באותיות?

      ב. שרטטו את הגרף, מצאו את השיפוע עם יחידות, ומצאו ממנו את $v_0$.

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. $R^2$ מול $H$, עם שיפוע $\dfrac{2v_0^2}{g}$.

      ב. השיפוע כ-$0.447\,\text{m}$, ו-$v_0 \approx 1.5\,\text{m/s}$.
    solution:
      - kind: manipulation
        text: >-
          א. מעלים בריבוע: $R^2 = \left(\dfrac{2v_0^2}{g}\right)\cdot H$. זה קו ישר דרך הראשית בגרף של $R^2$ מול $H$, עם שיפוע $\dfrac{2v_0^2}{g}$. (גם $R$ מול $\sqrt H$ הוא קו ישר, אבל אז צריך שורש מכל מדידה.)
      - kind: substitution
        text: >-
          ב. מחשבים את $R^2$ (ב-$\text{m}^2$): $0.0888,\ 0.1772,\ 0.2714,\ 0.3576,\ 0.4462$. קו המגמה עובר כמעט בראשית, וב-$H = 1.00\,\text{m}$ קוראים עליו $R^2 = 0.447\,\text{m}^2$:
          $$\frac{\Delta (R^2)}{\Delta H} = \frac{0.447\ \text{m}^2 - 0}{1.00\ \text{m} - 0} = 0.447\ \text{m}$$
      - kind: reasoning
        text: >-
          בדיקת יחידות: בגרף, $\text{m}^2$ חלקי $\text{m}$ הם $\text{m}$. ובנוסחה, $\dfrac{v_0^2}{g}$ הוא $\dfrac{\text{m}^2/\text{s}^2}{\text{m/s}^2} = \text{m}$. שתי הדרכים נותנות מטרים.
      - kind: manipulation
        text: >-
          השיפוע שווה ל-$\dfrac{2v_0^2}{g}$. מכפילים ב-$g$ ומחלקים ב-2: $v_0^2$ הוא $g$ כפול השיפוע, חלקי 2. ואז מוציאים שורש:
          $$v_0 = \sqrt{\frac{10\ \text{m/s}^2\cdot 0.447\ \text{m}}{2}} = \sqrt{2.24\ \text{m}^2/\text{s}^2} \approx 1.50\ \text{m/s}$$
      - kind: result
        text: >-
          גרף של $R^2$ מול $H$ הוא קו ישר דרך הראשית, עם שיפוע כ-$0.447\,\text{m}$, ולכן $v_0 \approx 1.5\,\text{m/s}$.

  - id: W-0.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-1, OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      כדור מתגלגל במורד מדרון. השעון מתחיל לפעול כשהכדור עובר בסימן A, וכבר נע שם. מודדים את הדרך $d$ שהכדור עבר מ-A במורד, ברגעים שונים $t$:

      $$\begin{array}{c|cccccc} t\ (\text{s}) & 0.5 & 1.0 & 1.5 & 2.0 & 2.5 & 3.0 \\ \hline d\ (\text{m}) & 0.249 & 0.695 & 1.345 & 2.189 & 3.243 & 4.486 \end{array}$$

      בתאוצה קבועה $a$ מתקיים $d = u\,t + \tfrac12 a\,t^2$, כאשר $u$ הוא גודל המהירות של הכדור ב-A (תלמדו את זה בשיעור 1.6).

      א. תלמידה משרטטת $d$ מול $t^2$, ומקבלת קו שכמעט ישר אבל לא עובר בראשית. הסבירו למה זה לא הגרף הנכון.

      ב. חלקו את שני הצדדים של החוק ב-$t$. איזה גרף יהיה עכשיו קו ישר? מה השיפוע ומה נקודת החיתוך שלו, באותיות?

      ג. שרטטו את הגרף מסעיף ב, ומצאו ממנו את $a$ ואת $u$.

      ד. מה ישתנה בגרף מסעיף ב אם משחררים את הכדור ממנוחה בדיוק ב-A?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. בגלל האיבר $u\,t$, החוק אינו קו ישר מול $t^2$.

      ב. $d/t$ מול $t$: שיפוע $\tfrac12 a$, נקודת חיתוך $u$.

      ג. $a \approx 0.80\,\text{m/s}^2$, $u \approx 0.30\,\text{m/s}$.

      ד. הקו יעבור בראשית, עם אותו שיפוע.
    solution:
      - kind: reasoning
        text: >-
          א. מול $t^2$, רק האיבר $\tfrac12 a\,t^2$ הוא קו ישר. האיבר $u\,t$ תלוי ב-$t$ עצמו ולא ב-$t^2$, ולכן הוא מעקם את הגרף. השיפוע של קו ישר בגרף כזה (כ-$0.48\,\text{m/s}^2$) אינו $\tfrac12 a$, ומי שמכפיל אותו ב-2 מקבל תאוצה שגויה.
      - kind: manipulation
        text: >-
          ב. מחלקים ב-$t$:
          $$\frac{d}{t} = u + \left(\tfrac12 a\right)\cdot t$$
          זה קו ישר בגרף של $d/t$ מול $t$: השיפוע $\tfrac12 a$, ונקודת החיתוך $u$.
      - kind: substitution
        text: >-
          ג. מחשבים את $d/t$ (ב-$\text{m/s}$): $0.498,\ 0.695,\ 0.897,\ 1.095,\ 1.297,\ 1.495$. על קו המגמה קוראים $0.497\,\text{m/s}$ ב-$t = 0.5\,\text{s}$, ו-$1.495\,\text{m/s}$ ב-$t = 3.0\,\text{s}$:
          $$\frac{\Delta (d/t)}{\Delta t} = \frac{1.495\ \text{m/s} - 0.497\ \text{m/s}}{3.0\ \text{s} - 0.5\ \text{s}} = \frac{0.998\ \text{m/s}}{2.5\ \text{s}} \approx 0.40\ \text{m/s}^2$$
      - kind: substitution
        text: >-
          השיפוע הוא $\tfrac12 a$, ולכן $a = 2\cdot 0.40\,\text{m/s}^2 = 0.80\,\text{m/s}^2$.
          נקודת החיתוך: ממשיכים את הקו אחורה חצי שנייה, $0.497\,\text{m/s} - 0.40\,\text{m/s}^2\cdot 0.5\,\text{s} \approx 0.30\,\text{m/s}$. זה $u$.
      - kind: reasoning
        text: >-
          ד. משחרור ממנוחה ב-A, $u = 0$, ולכן נקודת החיתוך אפס והקו עובר בראשית. המדרון לא השתנה, ולכן התאוצה והשיפוע אותם: קו מקביל לקודם.
      - kind: result
        text: >-
          גרף של $d/t$ מול $t$ הוא קו ישר. ממנו $a \approx 0.80\,\text{m/s}^2$ ו-$u \approx 0.30\,\text{m/s}$. בשחרור ממנוחה ב-A מתקבל קו מקביל דרך הראשית.

  - id: W-0.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      עגלה משוחררת ממנוחה על מסילה חלקה, מגובה $h$ מעל התחתית של המסילה. שער אור בתחתית מודד את גודל המהירות $v$ של העגלה. חוזרים על הניסוי מגבהים שונים:

      $$\begin{array}{c|cccccc} h\ (\text{m}) & 0.05 & 0.10 & 0.15 & 0.20 & 0.25 & 0.30 \\ \hline v\ (\text{m/s}) & 1.00 & 1.42 & 1.74 & 1.98 & 2.23 & 2.44 \end{array}$$

      כשאין חיכוך, $v^2 = 2g\,h$ (תלמדו את זה בפרק 4).

      א. איזה גרף כדאי לשרטט כדי לקבל קו ישר? שרטטו אותו, ומצאו ממנו את $g$.

      ב. מה ישתנה בגרף, ומה ישתנה בערך של $g$ שמחשבים ממנו, אם יש חיכוך קטן בין העגלה למסילה?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. $v^2$ מול $h$; השיפוע כ-$19.7\,\text{m/s}^2$, ולכן $g \approx 9.9\,\text{m/s}^2$.

      ב. העגלה תגיע לאט יותר, הנקודות יהיו נמוכות יותר והשיפוע קטן יותר, וה-$g$ שמחשבים ייצא קטן מהאמיתי.
    solution:
      - kind: formula
        text: >-
          $v^2 = (2g)\cdot h$: קו ישר דרך הראשית בגרף של $v^2$ מול $h$, עם שיפוע $2g$. לכן $g$ הוא חצי השיפוע.
      - kind: substitution
        text: >-
          א. מחשבים את $v^2$ (ב-$\text{m}^2/\text{s}^2$): $1.000,\ 2.016,\ 3.028,\ 3.920,\ 4.973,\ 5.954$. על קו המגמה קוראים $v^2 = 1.015\,\text{m}^2/\text{s}^2$ ב-$h = 0.05\,\text{m}$, ו-$v^2 = 5.948\,\text{m}^2/\text{s}^2$ ב-$h = 0.30\,\text{m}$:
          $$\frac{\Delta (v^2)}{\Delta h} = \frac{5.948 - 1.015}{0.30 - 0.05}\ \frac{\text{m}^2/\text{s}^2}{\text{m}} = \frac{4.933}{0.25}\ \text{m/s}^2 \approx 19.7\ \text{m/s}^2$$
      - kind: substitution
        text: >-
          $$g = \frac{19.7\ \text{m/s}^2}{2} \approx 9.9\ \text{m/s}^2$$
          בדיקת יחידות: $\text{m}^2/\text{s}^2$ חלקי $\text{m}$ הם $\text{m/s}^2$, כמו $2g$.
      - kind: reasoning
        text: >-
          ב. חיכוך מאט את העגלה, ולכן בכל גובה $v$ (וגם $v^2$) קטן יותר מאשר בלי חיכוך. הנקודות יורדות, והשיפוע של קו המגמה קטן מ-$2g$. מי שמחשב $g$ כחצי השיפוע יקבל ערך קטן מהאמיתי. המודל "בלי חיכוך" הוא שנכשל, לא הגרף.
      - kind: result
        text: >-
          א. $v^2$ מול $h$ הוא קו ישר דרך הראשית, עם שיפוע כ-$19.7\,\text{m/s}^2$, ולכן $g \approx 9.9\,\text{m/s}^2$.

          ב. עם חיכוך השיפוע קטן יותר, וה-$g$ שמחשבים ממנו קטן מהאמיתי.

challenge:
  - id: W-0.4-c1
    stars: 1
    objectives: [OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      שתי תלמידות רוצות למצוא את קבוע הקפיץ $k$ של קפיץ.

      א. עלי תולה על הקפיץ משקולת אחת שמסתה $m = (100 \pm 5)\,\text{g}$, ומודדת שהקפיץ מתארך ב-$s = (5.0 \pm 0.5)\,\text{cm}$. לפי $k = \dfrac{m\,g}{s}$, מה $k$, ומה אי-הוודאות שלו? (מצאו את הערך הגדול ביותר ואת הקטן ביותר האפשריים.)

      ב. למה עדיף לתלות כמה משקולות שונות, לשרטט גרף של $m$ מול $s$, ולמצוא את $k$ מהשיפוע של קו מגמה? האם הקו צריך לעבור בראשית?

      ג. בטריס משתמשת בשיטה אחרת: היא מודדת את זמן המחזור $T$ של משקולת שמתנודדת על הקפיץ, ולפי המכניקה $T = 2\pi\sqrt{m/k}$. אלה המדידות שלה:

      $$\begin{array}{c|cccccc} m\ (\text{kg}) & 0.05 & 0.10 & 0.15 & 0.20 & 0.25 & 0.30 \\ \hline T\ (\text{s}) & 0.314 & 0.449 & 0.539 & 0.631 & 0.698 & 0.771 \end{array}$$

      איך ייראה גרף של $T$ מול $m$? איזה גרף כדאי לשרטט כדי לקבל קו ישר? מצאו ממנו את $k$, והשוו לתוצאה של עלי.

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. $k = (20 \pm 3)\,\text{N/m}$.

      ב. הגרף משקלל מדידות רבות; הקו עובר בראשית, כי בלי משקולת אין התארכות.

      ג. $T$ מול $m$ היא עקומה שמשתטחת. $T^2$ מול $m$ הוא קו ישר עם שיפוע כ-$1.97\,\text{s}^2/\text{kg}$, ולכן $k \approx 20\,\text{N/m}$, בהתאמה לעלי.
    solution:
      - kind: substitution
        text: >-
          א. הערך המרכזי: $k = \dfrac{0.100\ \text{kg}\cdot 10\ \text{m/s}^2}{0.050\ \text{m}} = 20\,\text{N/m}$.
          הגדול ביותר: מסה גדולה והתארכות קטנה, $\dfrac{0.105\cdot 10}{0.045} \approx 23.3\,\text{N/m}$. הקטן ביותר: $\dfrac{0.095\cdot 10}{0.055} \approx 17.3\,\text{N/m}$.
      - kind: reasoning
        text: >-
          הטווח הוא בערך מ-$17$ עד $23\,\text{N/m}$, כלומר $k = (20 \pm 3)\,\text{N/m}$. אי-ודאות של 15%, בעיקר בגלל ההתארכות: חצי סנטימטר מתוך חמישה הם 10%.
      - kind: reasoning
        text: >-
          ב. לפי $m = \left(\dfrac{k}{g}\right)\cdot s$, הגרף של $m$ מול $s$ הוא קו ישר עם שיפוע $k/g$. קו מגמה דרך מדידות רבות משקלל את הסטיות המקריות שלהן, ומגלה מדידה חשודה. ובלי משקולת ($m = 0$) אין התארכות ($s = 0$), ולכן החוק אומר שהקו עובר בראשית, ומותר לדרוש זאת.
      - kind: manipulation
        text: >-
          ג. $T$ גדל כמו השורש של $m$, ולכן $T$ מול $m$ היא עקומה שעולה ומשתטחת. מעלים בריבוע: $T^2 = \left(\dfrac{4\pi^2}{k}\right)\cdot m$, קו ישר דרך הראשית בגרף של $T^2$ מול $m$. לכן $k$ הוא $4\pi^2$ חלקי השיפוע.
      - kind: substitution
        text: >-
          מחשבים את $T^2$ (ב-$\text{s}^2$): $0.0986,\ 0.2016,\ 0.2905,\ 0.3982,\ 0.4872,\ 0.5944$. על קו המגמה קוראים $0.0991\,\text{s}^2$ ב-$m = 0.05\,\text{kg}$, ו-$0.5911\,\text{s}^2$ ב-$m = 0.30\,\text{kg}$:
          $$\frac{\Delta (T^2)}{\Delta m} = \frac{0.5911\ \text{s}^2 - 0.0991\ \text{s}^2}{0.30\ \text{kg} - 0.05\ \text{kg}} = \frac{0.492\ \text{s}^2}{0.25\ \text{kg}} \approx 1.97\ \text{s}^2/\text{kg}$$
          $$k = \frac{4\pi^2}{1.97\ \text{s}^2/\text{kg}} \approx 20.1\ \text{kg/s}^2 = 20.1\ \text{N/m}$$
          (ניוטון הוא $\text{kg}\cdot\text{m/s}^2$, ולכן $\text{N/m}$ הוא $\text{kg/s}^2$. תכירו את זה בפרק 2.)
      - kind: result
        text: >-
          א. $k = (20 \pm 3)\,\text{N/m}$ ממדידה אחת. ג. מהגרף של $T^2$ מול $m$, $k \approx 20\,\text{N/m}$: אותו ערך, בתוך אי-הוודאות של עלי, אבל משש מדידות ולא מאחת.
    source:
      name: Australian Science Olympiad Exam (ASOE), Physics
      year: 2019
      problem: 'Section A, Questions 6, 7, 8 and 9'
      url: https://www.asi.edu.au/wp-content/uploads/2022/12/2019-asoe-physics-exam.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-0.4-c2
    stars: 1
    objectives: [OBJ-0.4-1, OBJ-0.4-3]
    prompt: >-
      מכונית נוסעת במהירות $120\,\text{km/h}$. הנהג רואה עדר פרות על הכביש ובולם, והמכונית נעצרת אחרי דרך $D$ מרגע שהבלמים התחילו לפעול. הניחו שהתאוצה בבלימה לא תלויה במהירות.

      א. בבדיקת בלמים מדדו את דרך הבלימה $d$ בכמה מהירויות:

      $$\begin{array}{c|ccccc} v\ (\text{m/s}) & 10 & 15 & 20 & 25 & 30 \\ \hline d\ (\text{m}) & 6.7 & 15.0 & 26.8 & 41.7 & 60.6 \end{array}$$

      בבלימה בתאוצה קבועה שגודלה $a$ מתקיים $d = \dfrac{v^2}{2a}$. איזה גרף כדאי לשרטט כדי לקבל קו ישר? שרטטו אותו, ומצאו ממנו את $a$.

      ב. בלי הגרף: איזו דרך בלימה תידרש לאותה מכונית במהירות $40\,\text{km/h}$, כחלק מ-$D$?

      ג. השתמשו בקו המגמה כדי להעריך את $D$ ואת דרך הבלימה ב-$40\,\text{km/h}$. האם היחס ביניהן מתאים לתשובה לסעיף ב? ומה צריך לזכור כשמשתמשים בקו מחוץ לתחום המדידות?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. $d$ מול $v^2$; השיפוע כ-$0.0673\,\text{s}^2/\text{m}$, ולכן $a \approx 7.4\,\text{m/s}^2$.

      ב. $D/9$.

      ג. $D \approx 75\,\text{m}$ ו-כ-$8.2\,\text{m}$ ב-$40\,\text{km/h}$: יחס של בערך 9. מחוץ לתחום המדידות מניחים שהחוק ממשיך להתקיים.
    solution:
      - kind: formula
        text: >-
          $d = \left(\dfrac{1}{2a}\right)\cdot v^2$: קו ישר דרך הראשית בגרף של $d$ מול $v^2$, עם שיפוע $\dfrac{1}{2a}$.
      - kind: substitution
        text: >-
          א. מחשבים את $v^2$ (ב-$\text{m}^2/\text{s}^2$): $100,\ 225,\ 400,\ 625,\ 900$. על קו המגמה קוראים $d = 6.6\,\text{m}$ ב-$v^2 = 100\,\text{m}^2/\text{s}^2$, ו-$d = 60.4\,\text{m}$ ב-$v^2 = 900\,\text{m}^2/\text{s}^2$:
          $$\frac{\Delta d}{\Delta (v^2)} = \frac{60.4\ \text{m} - 6.6\ \text{m}}{900\ \text{m}^2/\text{s}^2 - 100\ \text{m}^2/\text{s}^2} = \frac{53.8\ \text{m}}{800\ \text{m}^2/\text{s}^2} \approx 0.0673\ \text{s}^2/\text{m}$$
      - kind: manipulation
        text: >-
          השיפוע שווה ל-$\dfrac{1}{2a}$. מכפילים את שני הצדדים ב-$a$ ומחלקים בשיפוע: $a = \dfrac{1}{2\cdot 0.0673\ \text{s}^2/\text{m}} \approx 7.4\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          ב. דרך הבלימה ביחס ישר ל-$v^2$. המהירות $40\,\text{km/h}$ היא שליש מ-$120\,\text{km/h}$, ולכן $v^2$ קטן פי $3^2 = 9$, וגם דרך הבלימה: $D/9$. (לא $D/3$: זו הטעות של מי שחושב שהדרך ביחס ישר למהירות עצמה.)
      - kind: substitution
        text: >-
          ג. ממירים: $120\,\text{km/h} = 33.3\,\text{m/s}$, ו-$v^2 \approx 1111\,\text{m}^2/\text{s}^2$; $40\,\text{km/h} = 11.1\,\text{m/s}$, ו-$v^2 \approx 123\,\text{m}^2/\text{s}^2$. על הקו: $D \approx 0.0673\cdot 1111 - 0.1 \approx 75\,\text{m}$, וב-$40\,\text{km/h}$ כ-$0.0673\cdot 123 - 0.1 \approx 8.2\,\text{m}$. היחס $75/8.2 \approx 9$.
      - kind: reasoning
        text: >-
          $v^2 = 1111\,\text{m}^2/\text{s}^2$ נמצא מעבר למדידה האחרונה ($900$). שם משתמשים בקו בהנחה שהחוק נשאר אותו חוק, למשל שהבלמים לא מתחממים ושהצמיגים לא מחליקים. זו הנחה, לא מדידה.
      - kind: result
        text: >-
          א. $a \approx 7.4\,\text{m/s}^2$. ב. $D/9$. ג. $D \approx 75\,\text{m}$, ובמהירות $40\,\text{km/h}$ כ-$8.2\,\text{m}$, יחס של בערך 9.
