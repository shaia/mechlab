# Workbook, lesson 0.1 (how to learn in this course). Format and rules: .claude/CLAUDE.md, "Worked examples, workbook".
# Figure numbers come from launch() in src/physics/launch.ts (g = G = 10), recomputed 2026-11-05.
# The method problems need no physics the learner has not met: data are read off figure 0.1.

lesson: '0.1'
practice:
  - id: W-0.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      ששת החלקים הראשונים של שיעור בקורס מופיעים כאן בערבוביה: הסבר, חזו, בדקו את עצמכם, תופעה, דוגמה פתורה, חקרו.
      סדרו אותם לפי הסדר שבו הם מופיעים בשיעור, וכתבו במשפט אחד מה עושים בחלק "חזו" ולמה הוא בא לפני "הסבר".
    answer: >-
      תופעה, חזו, חקרו, הסבר, דוגמה פתורה, בדקו את עצמכם. ב"חזו" מתחייבים לתשובה לפני ההסבר, כדי שאפשר יהיה להשוות
      בכנות בין מה שחשבתם לבין מה שקרה.
    solution:
      - kind: reasoning
        text: >-
          כל שיעור פותח בתופעה, משהו שקורה בעולם, ובשאלה עליה. מיד אחר כך מתחייבים לחיזוי, **לפני** כל הסבר.
      - kind: reasoning
        text: >-
          אחרי החיזוי חוקרים באיור החי, ורק אז מגיע ההסבר. כך ההסבר עונה על שאלה שכבר שאלתם את עצמכם, והחיזוי שלכם
          נבדק מול מה שראיתם.
      - kind: reasoning
        text: >-
          אחרי ההסבר באה דוגמה פתורה, שמנסים לפתור לבד לפני שפותחים את הפתרון, ואחריה שאלות לבדיקה עצמית עם משוב.
      - kind: result
        text: >-
          תופעה, חזו, חקרו, הסבר, דוגמה פתורה, בדקו את עצמכם. החיזוי בא לפני ההסבר כי ניסיון לענות לפני שלומדים,
          גם כשהוא שגוי, עוזר לזכור את התשובה הנכונה ומראה איזה רעיון צריך לתקן.

  - id: W-0.1-02
    level: basic
    objectives: [OBJ-0.1-2]
    prompt: >-
      הדגל באיור 0.1 עומד $30\,\text{m}$ מהמשגר, והמטרה נמשכת $1.2\,\text{m}$ לכל צד שלו. גיל שיגר שלוש פעמים
      במהירות $18\,\text{m/s}$, וקרא מתחת לאיור: בזווית $35^\circ$ הכדור נחת $30.4\,\text{m}$ מהמשגר, בזווית
      $45^\circ$ נחת $32.4\,\text{m}$, ובזווית $55^\circ$ נחת $30.4\,\text{m}$.

      (א) בכמה החטיא כל שיגור את הדגל, ולאיזה כיוון?

      (ב) אילו שיגורים פגעו במטרה?
    answer: >-
      (א) $0.4\,\text{m}$ אחרי הדגל בזוויות $35^\circ$ ו-$55^\circ$, ו-$2.4\,\text{m}$ אחריו בזווית $45^\circ$.
      (ב) השיגורים בזוויות $35^\circ$ ו-$55^\circ$.
    solution:
      - kind: given
        text: >-
          הדגל ב-$30\,\text{m}$; המטרה מ-$28.8\,\text{m}$ עד $31.2\,\text{m}$. מקומות הנחיתה: $30.4\,\text{m}$,
          $32.4\,\text{m}$ ו-$30.4\,\text{m}$. מודדים מהמשגר, לכיוון המטרה.
      - kind: formula
        text: >-
          ההחטאה היא מקום הנחיתה פחות מקום הדגל. הפרש חיובי פירושו נחיתה אחרי הדגל.
      - kind: substitution
        text: >-
          $30.4\ \text{m} - 30\ \text{m} = 0.4\ \text{m}$ (פעמיים), ו-$32.4\ \text{m} - 30\ \text{m} = 2.4\ \text{m}$.
      - kind: reasoning
        text: >-
          החטאה של $0.4\,\text{m}$ קטנה מ-$1.2\,\text{m}$, ולכן הכדור נחת בתוך המטרה. החטאה של $2.4\,\text{m}$
          גדולה מ-$1.2\,\text{m}$, ולכן הכדור נחת אחרי המטרה.
      - kind: result
        text: >-
          (א) $0.4\,\text{m}$, $2.4\,\text{m}$ ו-$0.4\,\text{m}$, כולם אחרי הדגל. (ב) פגעו השיגורים בזוויות
          $35^\circ$ ו-$55^\circ$; השיגור בזווית $45^\circ$ עף רחוק מדי.

  - id: W-0.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-4]
    prompt: >-
      דנה ויוסי ענו על השאלה "עגלה נוסעת על רצפה חלקה מאוד, ומפסיקים לדחוף אותה. מה יקרה לה?", ושניהם ענו את אותה
      תשובה שגויה: "היא תיעצר מיד, כי אף אחד כבר לא דוחף אותה". דנה לחצה "בדיקה · בטוחים", ויוסי לחץ "בדיקה · לא בטוחים".
      למי מהם דחוף יותר לחזור על הנושא, ומה כדאי לכל אחד לעשות? (את הפיזיקה עצמה תלמדו בשיעור 2.3; כאן צריך רק את
      הסימונים.)
    answer: >-
      לדנה. אצלה הטעות בביטחון מרמזת על תפיסה שגויה, שצריך לנסח במילים ולבדוק מול ניסוי. אצל יוסי זה חור בידע שהוא
      כבר יודע עליו: ללמוד את ההסבר ולתרגל בלי להציץ.
    solution:
      - kind: reasoning
        text: >-
          דנה טעתה בביטחון. זה סימן לתפיסה שגויה: רעיון שנשמע לה נכון לגמרי, כנראה "גוף זז רק כשדוחפים אותו". היא לא
          יודעת שהיא טועה, ולכן הטעות לא תתוקן מעצמה.
      - kind: reasoning
        text: >-
          יוסי טעה בלי ביטחון. זה חור בידע, והוא כבר יודע עליו: כשילמד את ההסבר, סביר שימלא אותו.
      - kind: reasoning
        text: >-
          מה כדאי לדנה: לנסח את הרעיון שלה במילים, ולבדוק אותו מול ניסוי ומול ההסבר. מה כדאי ליוסי: ללמוד את ההסבר,
          ואז לפתור שאלה דומה בלי להציץ.
      - kind: result
        text: >-
          דחוף יותר לדנה, כי טעות בביטחון לא מתגלה בלי עזרה. דנה צריכה לזהות ולהפריך רעיון שגוי, ויוסי צריך ללמוד
          ולתרגל.

  - id: W-0.1-04
    level: mid
    objectives: [OBJ-0.1-3]
    prompt: >-
      באיור 0.1, בזווית $45^\circ$ ובמהירות $10\,\text{m/s}$, מתחת לאיור כתוב שהכדור הגיע לגובה מרבי של
      $2.5\,\text{m}$.

      (א) כתבו קודם חיזוי: לאיזה גובה מרבי יגיע הכדור באותה זווית, במהירות $20\,\text{m/s}$?

      (ב) באיור קראו: במהירות $15\,\text{m/s}$ הגובה המרבי $5.63\,\text{m}$, ובמהירות $20\,\text{m/s}$ הוא
      $10\,\text{m}$. פי כמה גדל הגובה כשהמהירות גדלה פי 2? ופי כמה כשהיא גדלה פי $1.5$?

      (ג) לפי הדפוס שמצאתם, חזו את הגובה המרבי במהירות $22\,\text{m/s}$, והשוו לחיזוי שלכם מסעיף (א): מה למדתם
      ממנו?
    answer: >-
      (ב) פי 4 ופי $2.25$, כלומר כמו המהירות בריבוע. (ג) $12.1\,\text{m}$. חיזוי "פי 2" מניח בלי לבדוק שהגובה גדל
      כמו המהירות.
    solution:
      - kind: given
        text: >-
          זווית $45^\circ$. במהירויות $10$, $15$ ו-$20\,\text{m/s}$ הגובה המרבי הוא $2.5\,\text{m}$, $5.63\,\text{m}$
          ו-$10\,\text{m}$.
      - kind: substitution
        text: >-
          $\dfrac{10\ \text{m}}{2.5\ \text{m}} = 4$ ו-$\dfrac{5.63\ \text{m}}{2.5\ \text{m}} \approx 2.25$.
      - kind: reasoning
        text: >-
          $4 = 2\cdot 2$ ו-$2.25 = 1.5\cdot 1.5$: הגובה גדל פי (יחס המהירויות) כפול עצמו. במהירות $22\,\text{m/s}$
          היחס הוא $22/10 = 2.2$.
      - kind: substitution
        text: >-
          $2.2\cdot 2.2\cdot 2.5\ \text{m} = 12.1\ \text{m}$, וזה מה שהאיור מראה.
      - kind: reasoning
        text: >-
          מי שחזה $5\,\text{m}$ ("פי 2") גילה הנחה סמויה: שהגובה גדל כמו המהירות. החיזוי השגוי הצביע על ההנחה שצריך
          לבדוק, ולכן הוא שימושי.
      - kind: result
        text: >-
          גובה פי 4 כשהמהירות פי 2, ופי $2.25$ כשהיא פי $1.5$. במהירות $22\,\text{m/s}$ הגובה המרבי $12.1\,\text{m}$.

  - id: W-0.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-2]
    prompt: >-
      באיור 0.1, כדור ששוגר במהירות $20\,\text{m/s}$ בזווית $45^\circ$ נחת $40\,\text{m}$ מהמשגר. שירה זורקת ביד כדור
      טניס, באותה מהירות ובאותה זווית, מגובה הכתף.
      כתבו שתי הנחות של המודל שבאיור שלא מתקיימות אצל שירה. לגבי כל אחת, קבעו אם היא צפויה להאריך את המרחק שהכדור
      של שירה עובר, או לקצר אותו, ונמקו.
    answer: >-
      הכדור יוצא מגובה הכתף ולא מהקרקע: זה מאריך את המרחק, כי לכדור יש עוד גובה ליפול. יש התנגדות אוויר: היא מאטה את
      הכדור ומקצרת את המרחק. מה התוצאה הכוללת קובע רק ניסוי.
    solution:
      - kind: given
        text: >-
          המודל של האיור: כדור נקודתי, בלי אוויר, יוצא מגובה הקרקע, וקרקע ישרה.
      - kind: reasoning
        text: >-
          הנחה ראשונה: היציאה מגובה הקרקע. כדור של שירה יוצא בערך מגובה של מטר וחצי. כשהוא חוזר לגובה הכתף הוא עוד
          לא נחת, וממשיך ליפול ולהתקדם. לכן המרחק צפוי להתארך.
      - kind: reasoning
        text: >-
          הנחה שנייה: אין אוויר. כדור טניס קל יחסית, והאוויר מאט אותו לאורך כל הדרך. לכן המרחק צפוי להתקצר.
      - kind: reasoning
        text: >-
          שתי ההשפעות פועלות בכיוונים הפוכים, ולכן האיור לא יכול לומר מה יקרה בסך הכול. מה שמכריע הוא ניסוי: לזרוק
          ולמדוד.
      - kind: result
        text: >-
          גובה היציאה מאריך את המרחק, והתנגדות האוויר מקצרת אותו. האיור מראה את המודל בלבד, והתוצאה של שירה נקבעת
          בניסוי.

  - id: W-0.1-06
    level: mid
    objectives: [OBJ-0.1-2]
    prompt: >-
      רונית שיגרה באיור 0.1 וקראה את המרחקים: במהירות $14\,\text{m/s}$, בזוויות $30^\circ$ ו-$60^\circ$, הכדור נחת
      $17.0\,\text{m}$ מהמשגר בשתיהן. במהירות $18\,\text{m/s}$, בזוויות $35^\circ$ ו-$55^\circ$, הוא נחת
      $30.4\,\text{m}$ בשתיהן.

      (א) מצאו בנתונים כלל: אילו זוגות של זוויות נותנים אותו מרחק?

      (ב) לפי הכלל, איזו זווית תנחית כדור באותו מקום כמו זווית $20^\circ$, באותה מהירות? בדקו באיור במהירות
      $20\,\text{m/s}$.

      (ג) האם ארבעת השיגורים של רונית מוכיחים את הכלל?
    answer: >-
      (א) זוויות שסכומן $90^\circ$. (ב) $70^\circ$; במהירות $20\,\text{m/s}$ שתיהן נוחתות ב-$25.7\,\text{m}$.
      (ג) לא. הם מראים מה המודל צופה בכמה מקרים; את הכלל מוכיח פיתוח (שיעור 2.9).
    solution:
      - kind: given
        text: >-
          הזוגות $30^\circ$ ו-$60^\circ$, ו-$35^\circ$ ו-$55^\circ$, נותנים כל אחד מרחק אחד.
      - kind: reasoning
        text: >-
          $30^\circ + 60^\circ = 90^\circ$, וגם $35^\circ + 55^\circ = 90^\circ$. השערה: שתי זוויות שסכומן $90^\circ$
          נותנות אותו מרחק, באותה מהירות.
      - kind: manipulation
        text: >-
          הזווית שמשלימה את $20^\circ$ ל-$90^\circ$: $90^\circ - 20^\circ = 70^\circ$.
      - kind: reasoning
        text: >-
          בדיקה באיור במהירות $20\,\text{m/s}$: בשתי הזוויות הכדור נוחת ב-$25.7\,\text{m}$. ההשערה עברה בדיקה נוספת.
      - kind: reasoning
        text: >-
          אבל כמה בדיקות באיור לא מוכיחות כלל לכל זווית ולכל מהירות, והאיור מחשב לפי מודל. את הכלל במודל מוכיח
          פיתוח, ואם הוא נכון לכדור אמיתי בודק ניסוי.
      - kind: result
        text: >-
          זוויות שסכומן $90^\circ$ נותנות אותו מרחק; $20^\circ$ ו-$70^\circ$ נוחתות שתיהן ב-$25.7\,\text{m}$. השיגורים
          מחזקים את הכלל, אבל לא מוכיחים אותו.

  - id: W-0.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-3]
    prompt: >-
      חבר שלכם אומר: "אני מדלג על החיזוי בכל שיעור. עוד לא למדתי את החומר, אז הניחוש שלי סתם יהיה שגוי ויבזבז לי
      זמן." כתבו לו תשובה עם שתי סיבות לא לדלג.
    answer: >-
      (1) ניסיון לענות לפני שלומדים, גם כשהוא שגוי, עוזר לזכור את התשובה הנכונה כשמקבלים אותה מיד אחר כך. (2) חיזוי
      שגוי מראה בדיוק איזה רעיון שלו לא מתאים למה שקורה, ואין עליו ציון.
    solution:
      - kind: reasoning
        text: >-
          החבר מניח שחיזוי שווה משהו רק אם הוא נכון. אבל החיזוי לא נועד לבדוק ידע; הוא נועד להכין את המוח לתשובה.
      - kind: reasoning
        text: >-
          סיבה ראשונה: בניסויים, מי שניסה לענות לפני שלמד, וקיבל את התשובה הנכונה מיד אחר כך, זכר אותה טוב יותר ממי
          שרק קרא אותה. המאמץ להיזכר או לנחש מחזק את מה שנלמד אחריו.
      - kind: reasoning
        text: >-
          סיבה שנייה: כשהחיזוי לא מתאים למה שרואים באיור, ההבדל מצביע על רעיון מסוים שצריך לתקן. בלי חיזוי, קל לקרוא
          את התשובה ולא לשים לב שציפיתם למשהו אחר.
      - kind: result
        text: >-
          לא לדלג: חיזוי, גם שגוי, משפר את הזיכרון של התשובה הנכונה, ומראה איזה רעיון צריך לתקן. הוא לוקח דקה, ואין עליו
          ציון.

  - id: W-0.1-08
    level: bagrut
    objectives: [OBJ-0.1-4, OBJ-0.1-1]
    prompt: >-
      בבוחן חזרה של 20 שאלות סימן טל בכל שאלה אם הוא בטוח. התוצאות: 8 תשובות נכונות שסימן "בטוח", 3 שגויות שסימן
      "בטוח", 4 נכונות שסימן "לא בטוח" ו-5 שגויות שסימן "לא בטוח".

      (א) מה החלק מהתשובות שטל סימן "בטוח" שהתבררו כשגויות? ומה החלק מהתשובות שסימן "לא בטוח" שהתבררו כשגויות?

      (ב) טל אומר: "רוב הטעויות שלי היו כשלא הייתי בטוח, אז על הטעויות שהייתי בטוח בהן לא כדאי לבזבז זמן." קבעו
      אם הוא צודק ונמקו.

      (ג) לטל יש חצי שעה. באיזה סדר כדאי לו לעבור על השאלות, ואיזה חלק של השיעור יעזור בכל קבוצה?
    answer: >-
      (א) בערך 27% ($3/11$) ובערך 56% ($5/9$). (ב) לא: 3 הטעויות בביטחון הן סימן לתפיסות שגויות, שלא יתגלו בלי
      עזרה. (ג) קודם 3 הטעויות בביטחון (משוב, איור, ניסוי), אחר כך 5 הטעויות בלי ביטחון (הסבר ודוגמה פתורה), ואז 4
      הנכונות בלי ביטחון (שאלה דומה בלי להציץ).
    solution:
      - kind: given
        text: >-
          סימן "בטוח": $8 + 3 = 11$ תשובות, 3 מהן שגויות. סימן "לא בטוח": $4 + 5 = 9$ תשובות, 5 מהן שגויות.
      - kind: substitution
        text: >-
          $\dfrac{3}{11} \approx 0.27$ ו-$\dfrac{5}{9} \approx 0.56$.
      - kind: reasoning
        text: >-
          (ב) טל צודק שרוב הטעויות היו בלי ביטחון, אבל לא במסקנה. טעות בלי ביטחון היא חור בידע שהוא כבר יודע עליו.
          טעות בביטחון היא סימן לתפיסה שגויה: רעיון שנשמע לו נכון, ולכן הוא לא יתקן אותו לבד. שלוש טעויות כאלה הן
          בדיוק המקום שבו חזרה מועילה ביותר.
      - kind: reasoning
        text: >-
          (ג) קודם 3 הטעויות בביטחון: לקרוא את המשוב, לנסח את הרעיון שהוביל לתשובה, ולבדוק אותו באיור או בניסוי. אחר
          כך 5 הטעויות בלי ביטחון: לחזור להסבר ולדוגמה הפתורה, ולנסות לפתור לבד לפני שמציצים. אחר כך 4 התשובות
          הנכונות בלי ביטחון: לפתור שאלה דומה בלי להציץ, כדי לבדוק שזה לא היה ניחוש. 8 הנכונות בביטחון אחרונות, אם
          יישאר זמן.
      - kind: result
        text: >-
          (א) $27\%$ ו-$56\%$. (ב) טל לא צודק: הטעויות בביטחון דחופות יותר. (ג) טעויות בביטחון, אחר כך טעויות בלי
          ביטחון, אחר כך נכונות בלי ביטחון.

  - id: W-0.1-09
    level: bagrut
    objectives: [OBJ-0.1-2]
    prompt: >-
      במשגר של איור 0.1 אפשר לבחור מהירות שיגור בקפיצות של $1\,\text{m/s}$. המטרה בין $28.8\,\text{m}$ ל-$31.2\,\text{m}$
      מהמשגר. מתחת לאיור קראתם: בזווית $45^\circ$, במהירות $16\,\text{m/s}$ הכדור נוחת ב-$25.6\,\text{m}$, ובמהירות
      $17\,\text{m/s}$ ב-$28.9\,\text{m}$. בכל מהירות, הזווית $45^\circ$ נותנת את המרחק הגדול ביותר.

      (א) מהי המהירות הקטנה ביותר שבה אפשר לפגוע במטרה? נמקו.

      (ב) במהירות הזו, למה צריך לכוון בזהירות רבה?

      (ג) האם התשובה שלכם נכונה גם לכדור אמיתי? מה הייתם בודקים?
    answer: >-
      (א) $17\,\text{m/s}$, בזווית $45^\circ$ או קרוב אליה. (ב) המרחק הגדול ביותר, $28.9\,\text{m}$, נכנס רק
      $0.1\,\text{m}$ לתוך המטרה, ולכן רק זוויות קרובות מאוד ל-$45^\circ$ פוגעות. (ג) לא בהכרח: באוויר הכדור עובר
      פחות, ואולי נדרשת מהירות גדולה יותר. בודקים בניסוי.
    solution:
      - kind: given
        text: >-
          בזווית $45^\circ$: $25.6\,\text{m}$ במהירות $16\,\text{m/s}$, ו-$28.9\,\text{m}$ במהירות $17\,\text{m/s}$.
          המטרה מתחילה ב-$28.8\,\text{m}$.
      - kind: reasoning
        text: >-
          במהירות $16\,\text{m/s}$ גם הזווית הטובה ביותר מנחיתה את הכדור ב-$25.6\,\text{m}$, לפני המטרה. כל זווית אחרת
          מנחיתה אותו קרוב עוד יותר, ולכן במהירות הזו, וגם במהירויות הקטנות ממנה, אי אפשר לפגוע.
      - kind: substitution
        text: >-
          במהירות $17\,\text{m/s}$: $28.9\ \text{m} - 28.8\ \text{m} = 0.1\ \text{m}$ בתוך המטרה.
      - kind: reasoning
        text: >-
          המרווח של $0.1\,\text{m}$ קטן מאוד. כשמזיזים את הזווית מעט מ-$45^\circ$, המרחק קטן, ואחרי כמה מעלות הוא כבר
          לפני המטרה. (באיור, רק הזוויות $43^\circ$ עד $47^\circ$ פוגעות.)
      - kind: reasoning
        text: >-
          המספרים נקראו מאיור שמחשב לפי מודל בלי אוויר, עם כדור שיוצא מגובה הקרקע. בכדור אמיתי האוויר מקצר את המרחק,
          ולכן אולי $17\,\text{m/s}$ לא יספיקו. מה שמכריע הוא ניסוי.
      - kind: result
        text: >-
          (א) $17\,\text{m/s}$. (ב) המרחק המרבי בקושי נכנס למטרה, ולכן רק זוויות קרובות מאוד ל-$45^\circ$ פוגעות. (ג)
          במודל בלבד; לכדור אמיתי צריך ניסוי.

  - id: W-0.1-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      באיור 0.1 ראיתם ששיגור בזווית $30^\circ$ ושיגור בזווית $60^\circ$, באותה מהירות, נוחתים באותו מקום. תכננו ניסוי
      אמיתי שבודק אם זה נכון גם לכדור שמשגרים באקדח קפיצי של מעבדה, שיורה את הכדור תמיד באותה מהירות.

      (א) מה תמדדו, וכמה פעמים?

      (ב) למה כדאי לכתוב חיזוי לפני הניסוי, ולא אחריו?

      (ג) איזו תוצאה תראה שהמודל של האיור לא מספיק טוב לכדור הזה? ואיזה הבדל קטן לא יאמר זאת?
    answer: >-
      (א) את מקום הנחיתה בכל זווית, כמה פעמים בכל אחת, ואת הממוצע. (ב) כדי להשוות בכנות, ולא "להתאים" את הציפייה
      לתוצאה. (ג) הבדל עקבי בין הממוצעים, גדול מהפיזור בין שיגורים חוזרים, אומר שהמודל לא מספיק; הבדל קטן מהפיזור לא
      אומר כלום.
    solution:
      - kind: reasoning
        text: >-
          (א) המשגר שומר על מהירות קבועה, ומשנים רק את הזווית. מודדים בסרט מדידה את מרחק הנחיתה מהמשגר, בכל זווית כמה
          פעמים (למשל 5), כי שיגורים חוזרים לא נוחתים בדיוק באותו מקום. משווים את הממוצעים.
      - kind: reasoning
        text: >-
          (ב) חיזוי שנכתב לפני הניסוי לא יכול להשתנות לפי התוצאה. אחרי הניסוי קל להשתכנע ש"ככה ציפיתי", ואז לא לומדים
          כלום מהפער. חיזוי שנכתב מראש מראה מה בדיוק חשבתם, ואיפה טעיתם.
      - kind: reasoning
        text: >-
          (ג) גם אם המודל מושלם, שיגורים חוזרים מתפזרים קצת. לכן הבדל בין הזוויות שקטן מהפיזור הזה לא אומר כלום. אבל
          אם בכל החזרות כדור ה-$60^\circ$ נוחת במרחק אחר מכדור ה-$30^\circ$, בהפרש גדול מהפיזור, המודל לא מתאר
          מספיק טוב את הכדור הזה. סיבה אפשרית: התנגדות האוויר, שהמודל הזניח, משפיעה יותר על הכדור שנמצא באוויר זמן
          רב יותר.
      - kind: result
        text: >-
          מודדים מרחקי נחיתה חוזרים בשתי הזוויות ומשווים ממוצעים; כותבים חיזוי מראש; הבדל עקבי גדול מהפיזור אומר
          שהמודל לא מספיק, והבדל קטן מהפיזור לא אומר כלום.

challenge:
  - id: W-0.1-c1
    stars: 1
    objectives: [OBJ-0.1-3]
    prompt: >-
      רוכבת אופניים לוחצת בבהלה על הבלם, הגלגל האחורי ננעל, והיא מחליקה על דרך ישרה ומישורית עד שהיא עוצרת.
      אילו נסעה פי 2 מהר יותר, באותם תנאים, מה היה אורך ההחלקה?

      קודם כתבו חיזוי וסמנו אם אתם בטוחים. אחר כך נמקו בעזרת עובדה אחת: בזמן החלקה כזו, המהירות קטנה בכל שנייה
      באותו שיעור, בלי קשר למהירות שבה התחילה ההחלקה.
    answer: >-
      פי 4 יותר ארוכה (ולא פי 2, כפי שרבים חוזים).
    solution:
      - kind: reasoning
        text: >-
          החיזוי הנפוץ: "פי 2", כי המהירות גדלה פי 2. בדקו אם עוד משהו משתנה.
      - kind: reasoning
        text: >-
          הזמן: המהירות קטנה בכל שנייה באותו שיעור. כדי לרדת ממהירות כפולה עד עצירה צריך להוריד פי 2 מהירות, ולכן
          ההחלקה נמשכת פי 2 זמן.
      - kind: reasoning
        text: >-
          המהירות הממוצעת: המהירות יורדת בקצב קבוע מהמהירות ההתחלתית עד אפס, ולכן הממוצע שלה הוא חצי מהמהירות
          ההתחלתית. כשהמהירות ההתחלתית כפולה, גם הממוצע כפול.
      - kind: manipulation
        text: >-
          אורך ההחלקה הוא המהירות הממוצעת כפול זמן ההחלקה. שניהם גדלים פי 2, ולכן האורך גדל פי $2\cdot 2 = 4$.
      - kind: reasoning
        text: >-
          זה אותו דפוס כמו באיור 0.1: שיגור פי 2 מהר נותן מרחק פי 4, כי גם הזמן באוויר גדל פי 2. החיזוי "פי 2" מסתיר
          את ההנחה שהזמן לא משתנה.
      - kind: result
        text: >-
          ההחלקה הייתה ארוכה פי 4.
    source:
      name: PhysicsBowl (AAPT)
      year: 2021
      problem: 'Question 24'
      url: https://aapt.org/Programs/PhysicsBowl/upload/2021-PhysicsBowl-Exam-2.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-0.1-c2
    stars: 1
    objectives: [OBJ-0.1-2]
    prompt: >-
      שני כדורים משוגרים באותו רגע מאותה נקודה על קרקע ישרה, בלי התנגדות אוויר. כדור א' משוגר שמאלה, בזווית $60^\circ$
      מעל הקרקע ובמהירות $v$, ונוחת אחרי זמן $T$ במרחק $D$ מנקודת השיגור. כדור ב' משוגר ימינה, בזווית $30^\circ$
      ובמהירות $2v$.

      (א) מה המרחק בין נקודות הנחיתה של שני הכדורים, בטאו באמצעות $D$? פתרו בלי נוסחאות, רק בעזרת שני דברים שגיליתם
      באיור 0.1: זוויות שסכומן $90^\circ$ נוחתות באותו מקום, ושיגור פי 2 מהר באותה זווית נוחת פי 4 רחוק.

      (ב) כמה זמן אחרי השיגור נוחת כדור ב', בטאו באמצעות $T$? כאן מדדו באיור: בחרו $v = 10\,\text{m/s}$.
    answer: >-
      (א) $5D$. (ב) בערך $1.15T$.
    solution:
      - kind: reasoning
        text: >-
          (א) נשווה את כדור ב' לכדור דמיוני ג', שמשוגר במהירות $2v$ אבל בזווית $60^\circ$. הזוויות $30^\circ$ ו-$60^\circ$
          משלימות זו את זו ל-$90^\circ$, ולכן ב' וג' נוחתים באותו מרחק.
      - kind: reasoning
        text: >-
          ג' משוגר באותה זווית כמו א', פי 2 מהר יותר, ולכן הוא נוחת פי 4 רחוק: במרחק $4D$. לכן גם ב' נוחת במרחק $4D$
          מנקודת השיגור.
      - kind: manipulation
        text: >-
          א' נוחת $D$ משמאל לנקודת השיגור, וב' נוחת $4D$ מימינה. המרחק ביניהם: $D + 4D = 5D$.
      - kind: substitution
        text: >-
          (ב) באיור, במהירות $10\,\text{m/s}$ ובזווית $60^\circ$: $D = 8.66\,\text{m}$ ו-$T = 1.73\,\text{s}$. במהירות
          $20\,\text{m/s}$ ובזווית $30^\circ$: $34.6\,\text{m}$ ו-$2.00\,\text{s}$. בדיקה לסעיף (א):
          $8.66\ \text{m} + 34.6\ \text{m} = 43.3\ \text{m} = 5\cdot 8.66\ \text{m}$.
      - kind: substitution
        text: >-
          $\dfrac{2.00\ \text{s}}{1.73\ \text{s}} \approx 1.15$
      - kind: reasoning
        text: >-
          היחס לא תלוי במהירות שבחרנו: כשכל המהירויות גדלות באותו פי, שני הזמנים גדלים באותו פי. (את הפיתוח עצמו תלמדו
          בשיעור 2.9.)
      - kind: result
        text: >-
          (א) $5D$. (ב) $T_B \approx 1.15T$.
    source:
      name: PhysicsBowl (AAPT)
      year: 2021
      problem: 'Q25 and Q26'
      url: https://aapt.org/Programs/PhysicsBowl/upload/2021-PhysicsBowl-Exam-2.pdf
      verified: '2026-11-05'
      adapted: true
